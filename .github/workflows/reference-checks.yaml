name: Workspace save checks
on:
  pull_request:
    paths:
      - 'Code.gs'
      - 'StudyLog.gs'
      - 'Index.html'
      - 'Drafts.html'
      - 'tools/draft-test.mjs'
      - 'tools/save-timing-test.mjs'
      - 'tools/reference-save-test.mjs'
      - 'tools/focus-save-test.mjs'
      - 'tools/focus-storage-test.mjs'
      - 'tools/focus-recovery.mjs'
      - 'tools/import-read-test.mjs'
      - 'tools/confirm-read-test.mjs'
      - 'tools/sync-test.mjs'
      - 'tools/setup-test.mjs'
      - 'tools/initial-read-test.mjs'
      - 'tools/done-read-test.mjs'
      - 'tools/study-read-test.mjs'
      - 'tools/deploy-log-test.py'
      - 'tools/smoke.mjs'
      - '.github/scripts/build_deploy_log.py'
      - '.github/workflows/reference-checks.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check.mjs
      - run: node tools/draft-test.mjs
      - run: node tools/save-timing-test.mjs
      - run: node tools/reference-save-test.mjs
      - run: node tools/focus-save-test.mjs
      - run: node tools/focus-storage-test.mjs
      - run: node tools/import-read-test.mjs
      - run: node tools/confirm-read-test.mjs
      - run: node tools/sync-test.mjs
      - run: node tools/setup-test.mjs
      - run: node tools/initial-read-test.mjs
      - run: node tools/done-read-test.mjs
      - run: node tools/study-read-test.mjs
      - run: python3 tools/deploy-log-test.py
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke.mjs
