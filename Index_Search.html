<script>
  /* =========================================================
     REFERENCE SEARCH
     ========================================================= */
  function filterReference(){
    const q =
      document
        .getElementById(
          'refSearch'
        )
        .value
        .trim()
        .toLowerCase();
    document
      .querySelectorAll(
        '#referenceTree .ref-cell-wrapper'
      )
      .forEach(w => {
        const matches =
          !q ||
          w.innerText
            .toLowerCase()
            .includes(q);
        w.classList.toggle(
          'hidden',
          !matches
        );
        const disclosure =
          w.querySelector(':scope > [data-toggle]');
        if(q && matches){
          /* Search expansion is temporary: reveal deep matches without
             changing the item's saved expanded/collapsed preference. */
          w.classList.remove('ref-collapsed');
          if(disclosure){
            disclosure.textContent = '▾';
          }
        }else if(!q){
          const item = state.reference.find(
            ref => String(ref.id) === String(w.dataset.id)
          );
          const expanded = !item || item.expanded !== false;
          w.classList.toggle(
            'ref-collapsed',
            !expanded
          );
          if(disclosure){
            disclosure.textContent = expanded ? '▾' : '▸';
          }
        }
      });
  }
  document
    .getElementById(
      'refSearch'
    )
    .addEventListener(
      'input',
      filterReference
    );
  /* Reorder by the dedicated handle, without interfering with text selection.
     Nesting (2026-10-26, Julius): hold the dragged cell over another cell's
     title for a moment → that cell opens and lights up blue → drop to put the
     dragged cell inside it (as its last child). Dropping above/below a cell
     puts it next to that cell at the same level, which is also how a cell
     comes back out of a folder. Children always move with their parent. */
  const REF_NEST_HOLD_MS = 550;
  let refDragState=null;
  function refClearDropMarks(){
    document.querySelectorAll('.ref-drop-before,.ref-drop-after,.ref-drop-into,.ref-hold').forEach(n=>n.classList.remove('ref-drop-before','ref-drop-after','ref-drop-into','ref-hold'));
  }
  function refOwnerId(container){
    return container?.classList?.contains('ref-children') ? String(container.parentElement.dataset.id) : '';
  }
  function refExpand(wrap){
    const item=state.reference.find(x=>String(x.id)===String(wrap.dataset.id));
    if(!item||item.expanded!==false)return;
    item.expanded=true;
    wrap.classList.remove('ref-collapsed');
    const arrow=wrap.querySelector(':scope > [data-toggle]');if(arrow)arrow.textContent='▾';
    sendRefItem(item);
  }
  function initReferenceDragHandle(wrap){
    const handle=wrap.querySelector(':scope > .ref-drag');
    handle?.addEventListener('pointerdown',e=>{
      if(e.button!==0 || referenceSortMode!=='original'){
        if(referenceSortMode!=='original')setStatus('Choose Original order to rearrange cells');
        return;
      }
      e.preventDefault();handle.setPointerCapture(e.pointerId);
      refDragState={wrap,handle,target:null,after:false,into:false,hold:null,holdTimer:null,fromX:e.clientX,fromY:e.clientY,moved:false};
      wrap.classList.add('ref-dragging');
    });
    handle?.addEventListener('pointermove',e=>{
      const d=refDragState;if(!d||d.handle!==handle)return;
      if(Math.abs(e.clientY-d.fromY)>4||Math.abs(e.clientX-d.fromX)>4)d.moved=true;
      document.querySelectorAll('.ref-drop-before,.ref-drop-after').forEach(n=>n.classList.remove('ref-drop-before','ref-drop-after'));
      const sc=document.getElementById('referenceScroll'),r=sc.getBoundingClientRect();
      if(e.clientY<r.top+32)sc.scrollTop-=16;else if(e.clientY>r.bottom-32)sc.scrollTop+=16;
      const candidate=document.elementFromPoint(e.clientX,e.clientY)?.closest('#referenceTree .ref-cell-wrapper');
      const valid=candidate&&!wrap.contains(candidate)&&!candidate.classList.contains('hidden');
      // Over a cell's title line? Start (or keep) the hold-to-nest timer.
      let onTitle=false;
      if(valid){
        const cell=candidate.querySelector(':scope > .ref-cell');
        const title=cell?.firstElementChild;
        const tr=(title||cell).getBoundingClientRect();
        onTitle=e.clientY>=tr.top-4&&e.clientY<=tr.bottom+4;
      }
      if(!onTitle||d.hold!==candidate){
        clearTimeout(d.holdTimer);d.holdTimer=null;
        if(d.hold&&d.hold!==candidate){d.hold.classList.remove('ref-hold','ref-drop-into');}
        if(d.into&&d.hold!==candidate)d.into=false;
        d.hold=null;
      }
      if(onTitle&&!d.hold){
        d.hold=candidate;candidate.classList.add('ref-hold');
        d.holdTimer=setTimeout(()=>{
          if(refDragState!==d||d.hold!==candidate)return;
          d.into=true;d.target=candidate;
          candidate.classList.remove('ref-hold');candidate.classList.add('ref-drop-into');
          refExpand(candidate);
          if(navigator.vibrate)try{navigator.vibrate(12);}catch(err){}
        },REF_NEST_HOLD_MS);
      }
      if(d.into&&d.hold===candidate)return; // Stay in "drop inside" while on that title.
      if(!valid){d.target=null;return;}
      d.target=candidate;const cr=candidate.getBoundingClientRect();
      d.after=e.clientY>cr.top+cr.height/2;
      candidate.classList.add(d.after?'ref-drop-after':'ref-drop-before');
    });
    const end=()=>{
      const d=refDragState;if(!d||d.handle!==handle)return;
      refDragState=null;clearTimeout(d.holdTimer);wrap.classList.remove('ref-dragging');
      refClearDropMarks();
      if(!d.moved||!d.target)return;
      const item=state.reference.find(x=>String(x.id)===String(wrap.dataset.id));
      if(d.into){
        d.target.querySelector(':scope > .ref-children').appendChild(wrap);
      }else{
        d.target.parentNode.insertBefore(wrap,d.after?d.target.nextSibling:d.target);
      }
      const newParent=refOwnerId(wrap.parentNode);
      const parentChanged=item&&String(item.parentId||'')!==newParent;
      if(item)item.parentId=newParent;
      // Document order = sort order (siblings keep their relative order).
      const ids=[...document.querySelectorAll('#referenceTree .ref-cell-wrapper')].map(n=>String(n.dataset.id));
      const order=ids.map((id,index)=>({id,sort:(index+1)*1000}));
      order.forEach(entry=>{
        const it=state.reference.find(x=>String(x.id)===entry.id);
        if(it) it.sort=entry.sort; // Pending text saves keep running.
      });
      setStatus(d.into?'Moved inside — saving…':'Saving reference order…');
      const saveOrder=()=>{ fwRefStructureStart(); google.script.run
        .withSuccessHandler(()=>{ fwRefStructureEnd(); setStatus('Saved'); })
        .withFailureHandler(err=>{ fwRefStructureEnd(); setStatus('Order save error: '+err.message); })
        .saveReferenceOrder(order); };
      if(parentChanged){
        sendRefItem(item,saveOrder,err=>setStatus('Move save error: '+err.message));
      }else saveOrder();
    };
    handle?.addEventListener('pointerup',end);
    handle?.addEventListener('pointercancel',()=>{if(refDragState?.handle===handle){clearTimeout(refDragState.holdTimer);refDragState=null;wrap.classList.remove('ref-dragging');refClearDropMarks();}});
  }
  // Pull tab on a tucked column (2026-11-06, Julius): give just that column room back.
  window.tuckRestorePane = name => {
    if(isSplitActive()){
      const slots = [splitOptions.first,splitOptions.second].concat(splitOptions.third !== 'none' ? [splitOptions.third] : []);
      const i = slots.indexOf(name);
      if(isRowLayout()){ mobileSplitRatio = .5; splitColsRatio = .5; }
      else if(slots.length === 2) mobileSplitRatio = .5;
      else if(i >= 0){ const want = 1/3, take = want - split3[i], others = split3.reduce((a,v,k) => k === i ? a : a + v,0) || 1;
        split3 = split3.map((v,k) => k === i ? want : Math.max(.003,v - take * v / others)); }
      try{ localStorage.setItem(MOBILE_SPLIT_SIZE_KEY,String(mobileSplitRatio)); localStorage.setItem(SPLIT_COLS_KEY,String(splitColsRatio)); localStorage.setItem(SPLIT3_KEY,JSON.stringify(split3)); }catch(e){}
      updateWorkspaceLayout(); return;
    }
    const names = visiblePanes.filter(n => n !== name), wide = names.sort((a,b) => (columnWidths[b] || 0) - (columnWidths[a] || 0))[0];
    const cur = columnWidths[name] || TUCK, want = Math.min(360,Math.max(200,Math.round(((columnWidths[wide] || 400) + cur) / 2)));
    if(wide) columnWidths[wide] = Math.max(TUCK,(columnWidths[wide] || 400) - (want - cur));
    columnWidths[name] = want;
    try{ localStorage.setItem(COLUMN_STORAGE_KEY,JSON.stringify(columnWidths)); }catch(e){}
    applyColumnWidths(); requestAnimationFrame(syncDayHeights);
  };
  function resetColumnSizes(){
    // Even columns (Julius, 2026-11-01): equal widths, stretched to fill the window.
    columnWidths={today:420,journal:420,reference:420};
    localStorage.removeItem(COLUMN_STORAGE_KEY);
    applyColumnWidths();
    try{ fitColumnsToWindow(); }catch(e){}
    // Also put every horizontal / phone split back to half and half (Julius, 2026-10-31).
    try{ if(typeof window.resetSplitBars === 'function') window.resetSplitBars(); }catch(e){}
    mobileSplitRatio = .5; splitColsRatio = .5; split3 = [1/3,1/3,1/3];
    try{ localStorage.setItem(MOBILE_SPLIT_SIZE_KEY,'.5'); localStorage.setItem(SPLIT_COLS_KEY,'.5'); localStorage.setItem(SPLIT3_KEY,JSON.stringify(split3)); }catch(e){}
    try{ updateWorkspaceLayout(); }catch(e){}
    setStatus('Column and split sizes reset');
  }
  function fitColumnsToWindow(){
    const names=visiblePanes;
    const available=Math.max(240,document.getElementById('workspace').clientWidth-(names.length-1));
    const sum=names.reduce((n,k)=>n+(Number(columnWidths[k])||420),0);
    const min=120;
    let remaining=available;
    names.forEach((k,i)=>{
      const rest=names.length-i-1;
      const desired=i===names.length-1?remaining:Math.round(available*(Number(columnWidths[k])||420)/sum);
      columnWidths[k]=Math.max(min,Math.min(desired,remaining-rest*min));remaining-=columnWidths[k];
    });
    localStorage.setItem(COLUMN_STORAGE_KEY,JSON.stringify(columnWidths));applyColumnWidths();
  }
  function insertJournalTemplate(){
    const template=state.reference.find(x=>referenceTitle(x).trim().toLowerCase()==='journal template');
    if(!template){setStatus('Create a Reference cell titled Journal Template first');return;}
    const editor=document.querySelector('#journalScroll .journal-editor:focus') || (activeEditor?.matches?.('.journal-editor') && activeEditor.isConnected ? activeEditor : null);
    if(!editor){setStatus('Tap inside a Notes day first, then press + Template');return;}
    const html=storedToHtml(stripReferenceMetadata(template.content||''));
    const temp=document.createElement('div');temp.innerHTML=html;
    temp.firstElementChild?.remove(); // Do not copy the title.
    if(!temp.innerHTML.trim()){setStatus('Journal Template has no body content');return;}
    if(editor.textContent.trim() && !confirm('Append Journal Template to this journal entry?'))return;
    captureBeforeEdit(editor);editor.insertAdjacentHTML('beforeend',temp.innerHTML);
    normalizeEditorTasks(editor);finishEditorEdit(editor);
    // Grow the row now (and again after layout settles) so it never spills.
    syncDayHeightStable(editor.dataset.date);
    saveEditorOwner(editor);
    setStatus('Journal template inserted');
  }
  document.getElementById('journalTemplateButton')?.addEventListener('pointerdown',e=>e.preventDefault());
  document.getElementById('journalTemplateButton')?.addEventListener('click',insertJournalTemplate);
  (function initCenterTabs(){ // Center Up tabs (2026-11-01, Julius); last tab remembered per device
    const pane = document.getElementById('journalPane');
    if(!pane) return;
    const set = t => {
      pane.dataset.ctab = t;
      pane.querySelectorAll('.center-tabs button').forEach(b => b.classList.toggle('on', b.dataset.ctab === t));
      try{ localStorage.setItem('fw.centerTab', t); }catch(e){}
      if(window.renderDayReview) renderDayReview();
      if(window.urgTabSync) urgTabSync();
    };
    let t = 'focus'; try{ t = localStorage.getItem('fw.centerTab') || 'focus'; }catch(e){} // new device opens on ⭐ Keep In Mind (2026-11-16)
    if(t === 'wxdaily') t = 'weather'; // daily tab merged into Weather (2026-11-07)
    if(t === 'new') t = 'fun'; // New things merged into the Fun tab (cleanup 2026-11-09)
    set(t === 'weather' || t === 'focus' || t === 'review' || t === 'fun' || t === 'urgent' ? t : 'notes');
    pane.querySelector('.center-tabs')?.addEventListener('click', e => {
      const b = e.target.closest('button[data-ctab]'); if(b) set(b.dataset.ctab);
    });
  })();
  /* Reference tabs + daily Scratch Pad (2026-11-03, Julius): 📚 Reference cells, 📝 a pad for the day shown
     (follows ▲ ▼). Last tab remembered per device. Pad = Days column E, loaded only when shown; saves like
     the Plan pad (hash check, three-way merge on a conflict, retry, never drop an edit). */
  (function initRefTabs(){
    const pane = document.getElementById('referencePane'), ed = document.getElementById('scratchPad');
    if(!pane || !ed) return;
    let date = '', base = {c:'',h:null}, timer = 0, dirty = false, sending = false, loadSeq = 0;
    const cur = () => window.odDate || (typeof state !== 'undefined' && state && state.today) || '';
    function send(){
      clearTimeout(timer); timer = 0;
      if(!dirty || sending || !date) return;
      const d = date, html = cardCleanHtml(ed);
      dirty = false; sending = true;
      google.script.run
        .withFailureHandler(err => {
          sending = false; dirty = true;
          setStatus('Save error: ' + (err && err.message || err) + ' — retrying');
          timer = setTimeout(send,5000); // never drop an edit
        })
        .withSuccessHandler(res => {
          sending = false;
          if(res && res.conflict){
            const m = fwMerge3(fwBlocks(base.c),fwBlocks(d === date ? cardCleanHtml(ed) : html),fwBlocks(res.html || ''));
            base = {c:res.html || '',h:res.h};
            if(d === date){ ed.innerHTML = m.blocks.join(''); dirty = true; setStatus('Merged with changes from elsewhere'); send(); }
            return;
          }
          if(d === date) base = {c:html,h:res && res.h};
          setStatus('Saved');
          if(dirty && d === date) send();
        })
        .saveScratchPad(d,html,base.h);
    }
    function show(force){
      if(pane.dataset.rtab !== 'scratch') return;
      const d = cur();
      if(!d || (d === date && !force)) return;
      if(dirty || sending){ if(dirty) send(); setTimeout(() => show(force),300); return; }
      const seq = ++loadSeq;
      ed.setAttribute('contenteditable','false');
      if(d !== date) ed.innerHTML = '';
      date = d;
      ed.dataset.placeholder = 'Write anything for ' + formatDate(d) + '…';
      google.script.run
        .withFailureHandler(err => { if(seq === loadSeq) setStatus('Could not load the Scratch Pad: ' + (err && err.message || err)); })
        .withSuccessHandler(res => {
          if(seq !== loadSeq || dirty) return;
          res = res || {};
          ed.innerHTML = res.html || '';
          base = {c:ed.innerHTML,h:res.h};
          normalizeEditorTasks(ed);
          ed.setAttribute('contenteditable','true');
        })
        .getScratchPad(d);
    }
    window.scratchShow = show;
    // A full editor like Blocks: checkboxes, task cells, hold menu, drag (2026-11-04, Julius).
    wireEditor(ed,'scratch');
    pane.querySelector('[data-sp-task]')?.addEventListener('click',() => {
      if(ed.getAttribute('contenteditable') !== 'true') return;
      captureBeforeEdit(ed);
      const n = createCheckboxLine(0);
      ed.appendChild(n);
      ed.focus({preventScroll:true});
      placeCaretInsideCheckbox(n.querySelector('.check-text'));
      ed.dispatchEvent(new Event('input',{bubbles:true}));
    });
    ed.addEventListener('input',() => {
      if(ed.textContent.trim() === '' && !ed.querySelector('img,input')) ed.innerHTML = ''; // keeps the placeholder
      dirty = true; setStatus('Unsaved scratch pad…');
      clearTimeout(timer); timer = setTimeout(send,700);
    });
    ed.addEventListener('blur',() => { if(dirty) send(); });
    document.addEventListener('visibilitychange',() => { if(document.hidden && dirty) send(); });
    fwResume.add('reference', () => { if(!dirty && !sending) show(true); }); // back in view: calm-return queue
    const set = t => {
      pane.dataset.rtab = t;
      pane.querySelectorAll('.ref-tabs button').forEach(b => b.classList.toggle('on', b.dataset.rtab === t));
      try{ localStorage.setItem('fw.refTab', t); }catch(e){}
      show();
    };
    let t = 'reference'; try{ t = localStorage.getItem('fw.refTab') || t; }catch(e){}
    set(t === 'scratch' ? t : 'reference');
    pane.querySelector('.ref-tabs')?.addEventListener('click', e => {
      const b = e.target.closest('button[data-rtab]'); if(b) set(b.dataset.rtab);
    });
  })();
  /* Focus Tracking dashboard (2026-11-01, Julius: phase 1). Categories → project cards, each with an
     editable title + "Why focus" (2 lines). Collapse state saved with the data. Data from getFocus /
     saveFocus (script property focusData), not the Notes cell. Phases 2–5 (tasks with data-tid, drag,
     priority/progress, temporary urgency, expand) come later. */
  (function initFocus(){
    let data = null, base = null, saveT = null, saving = false, pending = false, conflict = null, loadError = false;
    const DRAFT = 'fw.focus.draft.v1', RECOVERY = 'fw.focus.recovery.v1';
    const copy = v => JSON.parse(JSON.stringify(v));
    const valid = v => v && Array.isArray(v.cats);
    const draft = () => { try { return JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch(e){ return null; } };
    const recovery = () => { try { const a = JSON.parse(localStorage.getItem(RECOVERY) || '[]'); return Array.isArray(a) ? a : []; } catch(e){ return []; } };
    function keepDraft(){
      try { localStorage.setItem(DRAFT,JSON.stringify({base,data})); return true; }
      catch(e){ setStatus('Focus draft could not be kept on this device — keep the app open until saved'); return false; }
    }
    function retainConflict(){
      try {
        const old = recovery(); old.push({at:Date.now(),base,data,shared:conflict && conflict.data});
        localStorage.setItem(RECOVERY,JSON.stringify(old.slice(-3))); return true;
      } catch(e){ setStatus('Focus recovery copy could not be kept — keep this list open'); return false; }
    }
    const wired = new WeakSet();
    const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
    const h = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    /* Recently updated (2026-11-09, Julius): each item carries u = when it was last changed, so the server can let the
       newer edit win and the list can show a small "5m" tag on lines changed in the last day. */
    let snap = null;
    const itemKey = t => { const {u, ...rest} = t; return JSON.stringify(rest); };
    function snapshot(){ snap = new Map(); if(data) data.cats.forEach(c => (c.items || []).forEach(t => snap.set(t.id,itemKey(t)))); }
    function stampChanges(){
      if(!data) return;
      if(!snap) { snapshot(); return; }
      const now = Date.now();
      data.cats.forEach(c => (c.items || []).forEach(t => { if(snap.get(t.id) !== itemKey(t) && (t.t || '').trim()) t.u = now; }));
      snapshot();
    }
    const ago = u => { const m = Math.max(0,Math.round((Date.now() - u) / 60000)); return m < 1 ? 'now' : m < 60 ? m + 'm' : Math.round(m / 60) + 'h'; };
    function save(){
      pending = true;
      stampChanges();
      if(base) keepDraft();
      clearTimeout(saveT);
      if(!conflict) saveT = setTimeout(send,700);
    }
    function send(){
      if(saving || !pending || !base || conflict || !(window.google && google.script)) return;
      saving = true; pending = false;
      const sent = copy(data), before = copy(base);
      google.script.run.withSuccessHandler(r => {
        saving = false;
        if(r && r.conflict){
          conflict = r; pending = true;
          const retained = retainConflict(), stored = keepDraft(); render();
          setStatus(retained && stored ? 'Focus changed elsewhere — both versions kept; choose which list to use' : 'Focus conflict — keep this app open; device storage could not retain both versions');
          return;
        }
        const changed = JSON.stringify(data) !== JSON.stringify(sent);
        if(changed){
          // New typing is based on the sent snapshot; the next merge also brings in remote additions.
          base = sent; pending = true; keepDraft(); saveT = setTimeout(send,0);
        } else {
          const remote = valid(r && r.data) && JSON.stringify(r.data) !== JSON.stringify(sent);
          data = valid(r && r.data) ? r.data : sent; base = copy(data); pending = false; snapshot();
          try { localStorage.removeItem(DRAFT); } catch(e){}
          render(); setStatus(remote ? 'Keep In Mind saved — merged in changes from another device' : 'Focus saved');
        }
      }).withFailureHandler(e => {
        saving = false; pending = true; const stored = keepDraft();
        setStatus('Focus not saved: ' + (e && e.message || e) + (stored ? ' — draft kept, retrying' : ' — keep this app open, retrying'));
        saveT = setTimeout(send,5000);
      }).saveFocus(sent,{base:before});
    }
    function find(id){ for(const c of data.cats) if(c.id === id) return {c}; return {}; }
    /* Free list under each category (2026-11-05, Julius: "a category, then just tasks and subtasks, nested how I
       want"). c.items = [{id, t, d, lv, n?}]: lv = nesting depth (0–8), n = a note line without a box. Older data
       (projects with title / why / tasks) converts once on load; the old shape is kept in c.legacy. */
    const itemsOf = c => c.items || (c.items = []);
    function migrate(d){
      let ch = false;
      d.cats.forEach(c => {
        if(Array.isArray(c.items)) return;
        const items = [];
        (c.projects || []).forEach(p => {
          const head = !!(p.title || '').trim(), base = head ? 1 : 0;
          if(head) items.push({id:tid(),t:p.title,d:0,lv:0});
          if((p.why || '').trim()) items.push({id:tid(),t:p.why,d:0,lv:base,n:1});
          (p.tasks || []).forEach(t => items.push({id:t.id || tid(),t:t.t || '',d:t.d ? 1 : 0,lv:base}));
        });
        c.items = items;
        if((c.projects || []).length) c.legacy = c.projects;
        delete c.projects;
        ch = true;
      });
      return ch;
    }
    function findItem(id){
      for(const c of data.cats){ const i = itemsOf(c).findIndex(t => t.id === id); if(i >= 0) return {c,i,t:c.items[i],list:c.items}; }
      return null;
    }
    // The line plus everything nested under it.
    function subtreeEnd(list,i){ let j = i + 1; while(j < list.length && (list[j].lv || 0) > (list[i].lv || 0)) j++; return j; }
    // In / out by one, children along with it; never deeper than one past the line above.
    function shift(list,i,d){
      const t = list[i], lv = t.lv || 0, end = subtreeEnd(list,i);
      if(d > 0){ const prev = list[i - 1]; if(!prev || lv > (prev.lv || 0)) return; }
      if(d < 0 && !lv) return;
      for(let k = i; k < end; k++) list[k].lv = Math.max(0,Math.min(8,(list[k].lv || 0) + d));
    }
    function html(){
      let out = conflict ? '<div class="fx-sub" role="status">This list changed on another device. Your draft is kept here. <button type="button" data-fx="shared">Use shared list</button> <button type="button" data-fx="mine">Replace shared list with mine</button></div>' : '';
      data.cats.forEach(c => {
        const items = itemsOf(c), open = items.filter(t => !t.n && !t.d).length;
        out += '<div class="fx-cat' + (c.col ? ' fx-col' : '') + (c.color ? ' fx-colored' : '') + (!c.name && items.length ? ' fx-ungrouped' : '') + '" data-fid="' + c.id + '" style="--fx-category-color:' + h(c.color || '#70baff') + '"><div class="fx-ch"><button type="button" class="fx-tg" data-fx="tg">' + (c.col ? '▸' : '▾') + '</button>' +
          '<span class="fx-name" contenteditable="true" data-fx="name" data-fph="Category">' + h(c.name) + '</span>' +
          (c.col && items.length ? '<span class="fx-sub">' + open + ' open</span>' : '') + '</div><div class="fx-body">';

        + (done.length ? '<div class="fun-done-head" data-fun-done>' + (doneOpen ? '▾' : '▸') + ' Done ' + done.length + '</div>' + (doneOpen ? done.map(row).join('') : '') : '');
    }
    const byId = id => data.items.find(i => i.id === id);
    function add(){
      const t = inp.value.trim(); if(!t) return;
      const now = Date.now();
      const it = {id:'f' + now.toString(36) + Math.random().toString(36).slice(2,5), t, d:0, c:now, u:now};
      if(catSel.value && catSel.value !== '+') it.g = catSel.value;
      data.items.push(it);
      inp.value = ''; render(); save();
    }
    inp.addEventListener('keydown', e => { e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); add(); } });
    document.getElementById('funAddBtn').addEventListener('click', add);
    catSel.addEventListener('change', () => {
      if(catSel.value === '+'){ const id = newCat(); lastCat = id || lastCat; render(); }
      else lastCat = catSel.value;
      try{ localStorage.setItem('fw.funCat', lastCat); }catch(e){}
      inp.focus();
    });
    /* Hold (2026-11-06, Julius: like every other task): hold the CHECKBOX → Move to menu (categories, + New, Remove);
       hold the TEXT → drag it: drop on a task (above / below, takes its category) or on a category header (top of it). */
    let holdT = null, held = false, hx = 0, hy = 0, drag = null;
    list.addEventListener('pointerdown', e => {
      const row = e.target.closest('.fun-item'); if(!row || e.target.closest('button') || e.button) return;
      const box = e.target.matches('input[type=checkbox]');
      held = false; hx = e.clientX; hy = e.clientY; clearTimeout(holdT);
      holdT = setTimeout(() => { held = true; if(box || row.classList.contains('done')) moveMenu(row.dataset.id, hx, hy); else startDrag(row, hx, hy); }, box ? 450 : 500);
    });
    list.addEventListener('pointermove', e => { if(!drag && (Math.abs(e.clientX - hx) > 9 || Math.abs(e.clientY - hy) > 9)) clearTimeout(holdT); });
    ['pointerup','pointercancel'].forEach(t => list.addEventListener(t, () => clearTimeout(holdT)));
    function startDrag(row, x, y){
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
      try{ getSelection().removeAllRanges(); }catch(e){}
      const r = row.getBoundingClientRect(), ghost = row.cloneNode(true);
      ghost.className = 'fun-item fun-ghost'; ghost.style.cssText = 'width:' + r.width + 'px;left:' + r.left + 'px;top:' + r.top + 'px';
      document.body.appendChild(ghost); row.classList.add('fun-dragging');
      drag = {row, id:row.dataset.id, ghost, dx:x - r.left, dy:y - r.top, at:null};
      navigator.vibrate && navigator.vibrate(15);
    }
    const clearMarks = () => list.querySelectorAll('.fun-drop-b,.fun-drop-a,.fun-drop-in').forEach(n => n.classList.remove('fun-drop-b','fun-drop-a','fun-drop-in'));
    function dragTo(x, y){
      drag.ghost.style.left = (x - drag.dx) + 'px'; drag.ghost.style.top = (y - drag.dy) + 'px';
      clearMarks(); drag.at = null;
      const el = document.elementFromPoint(x, y), t = el && el.closest && el.closest('#funList .fun-item:not(.done):not(.fun-dragging), #funList .fun-cat-h');
      if(!t) return;
      if(t.classList.contains('fun-cat-h')){ t.classList.add('fun-drop-in'); drag.at = {head:t.closest('.fun-cat')}; return; }
      const r = t.getBoundingClientRect(), after = y > r.top + r.height / 2;
      t.classList.add(after ? 'fun-drop-a' : 'fun-drop-b'); drag.at = {row:t, after};
    }
    function drop(){
      const d = drag; drag = null; clearMarks(); d.ghost.remove(); d.row.classList.remove('fun-dragging');
      const it = byId(d.id); if(!it || !d.at) return;
      const now = Date.now(), groupOf = el => el ? (el.dataset.cat || '') : '';
      let g, ids;
      if(d.at.head){ g = groupOf(d.at.head); ids = [...d.at.head.querySelectorAll('.fun-item')].map(n => n.dataset.id).filter(x => x !== d.id); ids.unshift(d.id); }
      else {
        const sec = d.at.row.closest('.fun-cat'); g = groupOf(sec);
        ids = [...d.at.row.parentElement.querySelectorAll(':scope > .fun-item:not(.done)')].map(n => n.dataset.id).filter(x => x !== d.id);
        ids.splice(ids.indexOf(d.at.row.dataset.id) + (d.at.after ? 1 : 0), 0, d.id);
      }
      if(g) it.g = g; else delete it.g;
      ids.forEach((id, k) => { const x = byId(id); if(x && (x.o !== k || x === it)){ x.o = k; x.u = now; } });
      render(); save();
    }
    document.addEventListener('pointermove', e => { if(drag){ e.preventDefault(); dragTo(e.clientX, e.clientY); } }, {passive:false});
    document.addEventListener('touchmove', e => { if(drag) e.preventDefault(); }, {passive:false});
    document.addEventListener('pointerup', () => { if(drag) drop(); });
    document.addEventListener('pointercancel', () => { if(drag){ drag.at = null; drop(); } });
    function moveMenu(id,x,y){
      const it = byId(id); if(!it) return;
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
      document.querySelectorAll('.fun-menu').forEach(m => m.remove());
      const m = document.createElement('div'); m.className = 'fun-menu';
      m.innerHTML = '<div class="fun-menu-h">Move to</div>' + liveCats().map(c => '<button type="button" data-g="' + h(c.id) + '"' + (it.g === c.id ? ' class="on"' : '') + '>' + h(c.name) + '</button>').join('') +
        '<button type="button" data-g=""' + (!it.g ? ' class="on"' : '') + '>No category</button><button type="button" data-g="+">+ New category…</button><button type="button" data-g="x">🗑 Remove</button>';
      document.body.appendChild(m);
      m.style.left = Math.max(8, Math.min(x, innerWidth - m.offsetWidth - 8)) + 'px';
      m.style.top = Math.max(8, Math.min(y, innerHeight - m.offsetHeight - 8)) + 'px';
      m.addEventListener('click', e => {
        const b = e.target.closest('[data-g]'); if(!b) return;
        let g = b.dataset.g;
        if(g === 'x'){ it.x = 1; it.u = Date.now(); m.remove(); render(); save(); return; }
        if(g === '+'){ g = newCat(); if(!g){ m.remove(); return; } }
        if(g) it.g = g; else delete it.g;
        it.u = Date.now(); m.remove(); render(); save();
      });
      setTimeout(() => { const off = e => { if(!m.contains(e.target)){ m.remove(); document.removeEventListener('pointerdown', off, true); } }; document.addEventListener('pointerdown', off, true); }, 0);
    }
    list.addEventListener('click', e => {
      if(held){ held = false; e.preventDefault(); return; }
      if(e.target.closest('[data-fun-done]')){ doneOpen = !doneOpen; render(); return; }
      if(e.target.closest('.fun-newcat')){ const id = newCat(); if(id){ lastCat = id; try{ localStorage.setItem('fw.funCat', id); }catch(err){} } render(); return; }
      const ch = e.target.closest('.fun-cat[data-cat]');
      if(ch && e.target.closest('.fun-cat-add')){ lastCat = ch.dataset.cat; try{ localStorage.setItem('fw.funCat', lastCat); }catch(err){} fillSel(); inp.focus(); return; }
      if(ch && e.target.closest('.fun-cat-x')){
        const c = (data.cats || []).find(x => x.id === ch.dataset.cat); if(!c) return;
        if(!confirm('Delete the category "' + c.name + '"? Its items stay, under No category.')) return;
        c.x = 1; c.u = Date.now(); render(); save(); return;
      }
      const row = e.target.closest('.fun-item'); if(!row) return;
      const it = byId(row.dataset.id); if(!it) return;
      if(e.target.matches('input[type=checkbox]')){ it.d = e.target.checked ? 1 : 0; it.u = Date.now(); render(); save(); }
      else if(e.target.closest('.fun-x')){ it.x = 1; it.u = Date.now(); render(); save(); }
    });
    list.addEventListener('keydown', e => { if(e.target.closest('.fun-t')){ e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } } });
    list.addEventListener('keydown', e => { if(e.target.closest('.fun-cat-n')){ e.stopPropagation(); if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); } } });
    list.addEventListener('focusout', e => {
      const cn = e.target.closest('.fun-cat-n');
      if(cn){ const c = (data.cats || []).find(x => x.id === cn.closest('[data-cat]').dataset.cat), v = cn.textContent.trim().slice(0,40);
        if(c && v && v !== c.name){ c.name = v; c.u = Date.now(); save(); render(); } else if(c && !v) cn.textContent = c.name; return; }
      const t = e.target.closest('.fun-t'); if(!t) return;
      const it = byId(t.closest('.fun-item').dataset.id); if(!it) return;
      const v = t.textContent.trim();
      if(!v){ it.x = 1; it.u = Date.now(); save(); render(); }
      else if(v !== it.t){ it.t = v; it.u = Date.now(); save(); }
    });
    render();
    const pull = () => { if(window.google && google.script) google.script.run.withSuccessHandler(d => { merge(d); keep(); if(!drag && !list.contains(document.activeElement)) render(); }).getFun(); };
    pull();
    fwResume.add('fun', pull); // back in view: calm-return queue
    window.fwFun = {get data(){ return data; }, render};
  })();
  /* Hourly weather (2026-11-01, Julius): ☁️ tab. Open-Meteo (free, no key), Vallejo/Benicia area,
     next 24 hours. Daily tab (2026-11-04, Julius): next 7 days from the same fetch. Loads when either
     tab is shown; refreshes if older than 30 min. */
  (function initWeather(){
    const box = document.getElementById('weatherScroll'), pane = document.getElementById('journalPane');
    if(!box || !pane) return;
    const LAT = 38.08, LON = -122.19, PLACE = 'Vallejo';
    let at = 0, busy = false, data = null;
    const isWx = () => pane.dataset.ctab === 'weather' || pane.dataset.ctab === 'wxdaily';
    const icon = (c,day) => c === 0 ? (day ? '☀️' : '🌙') : c <= 2 ? (day ? '🌤️' : '☁️') : c === 3 ? '☁️' : c <= 48 ? '🌫️' :
      c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '❄️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';
    const hr = h => (h % 12 || 12) + (h < 12 ? ' am' : ' pm');
    function load(force){
      if(busy || (!force && Date.now() - at < 30 * 60 * 1000)) return;
      busy = true;
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
        '&hourly=temperature_2m,precipitation_probability,weather_code,is_day' +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&temperature_unit=fahrenheit&timezone=America%2FLos_Angeles&forecast_days=7')
        .then(r => r.json()).then(d => { at = Date.now(); data = d; chip(); if(isWx()) draw(); })
        .catch(() => { box.innerHTML = '<div class="center-placeholder">☁️ Weather didn\'t load. <button type="button" class="btn" data-wx-retry>Retry</button></div>'; })
        .finally(() => { busy = false; });
    }
    // One tab (2026-11-07, Julius): next 24 hours on top, the 7 days under it.
    // Mode (2026-11-07, Julius): Hourly | Daily | Both, remembered per device (fw.wxMode).
    let mode = 'both'; try{ mode = localStorage.getItem('fw.wxMode') || 'both'; }catch(e){}
    const draw = () => { if(!data || !isWx()) return;
      box.innerHTML = head() + (mode !== 'daily' ? hourlyHtml(data, mode === 'both' ? 12 : 24) : '') +
        (mode !== 'hourly' ? '<div class="wx-day' + (mode === 'both' ? ' wx-sec' : '') + '">7 days</div>' + dailyHtml(data) : ''); };
    const mb = (m,l) => '<button type="button" data-wx-mode="' + m + '" aria-pressed="' + (mode === m) + '">' + l + '</button>';
    const head = () => '<div class="wx-head"><span>' + PLACE + '</span><span class="wx-modes">' + mb('hourly','Hourly') + mb('daily','Daily') + mb('both','Both') + '</span><button type="button" data-wx-retry title="Refresh">↻</button></div>';
    function dailyHtml(d){
      const w = d.daily;
      return w.time.map((t,k) => {
        const [y,m,dd] = t.split('-').map(Number), day = new Date(y,m - 1,dd), p = w.precipitation_probability_max[k];
        return '<div class="wx-row wx-d' + (k ? '' : ' wx-now') + '"><span class="wx-t">' + (k ? day.toLocaleDateString('en-US',{weekday:'short'}) + '<span class="wx-date"> ' + m + '/' + dd + '</span>' : 'Tod<span class="wx-date">ay</span>') + '</span><span>' + icon(w.weather_code[k],1) +
          '</span><span>' + Math.round(w.temperature_2m_max[k]) + '° <span class="wx-lo">' + Math.round(w.temperature_2m_min[k]) + '°</span></span><span class="wx-p">' + (p >= 10 ? '<span class="wx-drop">💧</span>' + p + '%' : '') + '</span></div>';
      }).join('');
    }
    function hourlyHtml(d, hours){
      const h = d.hourly, now = new Date(), key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + 'T' + String(now.getHours()).padStart(2,'0');
      let i = h.time.findIndex(t => t.slice(0,13) === key); if(i < 0) i = 0;
      let html = '', lastDay = h.time[i].slice(0,10);
      for(let k = i; k < Math.min(i + hours, h.time.length); k++){
        const d = h.time[k].slice(0,10), H = +h.time[k].slice(11,13);
        if(d !== lastDay){ html += '<div class="wx-day">Tomorrow</div>'; lastDay = d; }
        const p = h.precipitation_probability[k];
        html += '<div class="wx-row' + (k === i ? ' wx-now' : '') + '"><span class="wx-t">' + (k === i ? 'Now' : hr(H)) + '</span><span>' + icon(h.weather_code[k], h.is_day[k]) +
          '</span><span>' + Math.round(h.temperature_2m[k]) + '°</span><span class="wx-p">' + (p >= 10 ? '💧' + p + '%' : '') + '</span></div>';
      }
      return html;
    }
    box.addEventListener('click', e => {
      const m = e.target.closest('[data-wx-mode]');
      if(m){ mode = m.dataset.wxMode; try{ localStorage.setItem('fw.wxMode', mode); }catch(err){} draw(); return; }
      if(e.target.closest('[data-wx-retry]')) load(true);
    });
    // Weather chip (cleanup 2026-11-09): the ☁️ tab button shows the current icon + temperature (e.g. "☀️ 64°");
    // tap it for the full view. Fetched once at start-up and at most every 30 min.
    function chip(){
      const b = pane.querySelector('.center-tabs button[data-ctab="weather"]'), h = data && data.hourly;
      if(!b || !h || !h.time) return;
      const now = new Date(), key = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + 'T' + String(now.getHours()).padStart(2,'0');
      let i = h.time.findIndex(t => t.slice(0,13) === key); if(i < 0) i = 0;
      const t = Math.round(h.temperature_2m[i]);
      if(!isFinite(t)) return;
      b.textContent = icon(h.weather_code[i], h.is_day[i]) + ' ' + t + '°';
      b.classList.add('wx-chip'); b.title = 'Weather in ' + PLACE + ' now: ' + t + '° · tap for the next 24 h + 7 days';
    }
    setTimeout(() => load(false), 4000);
    setInterval(() => { if(!document.hidden){ load(false); chip(); } }, 10 * 60 * 1000);
    const check = () => { if(isWx()){ draw(); load(false); } else chip(); };
    new MutationObserver(check).observe(pane, {attributes:true, attributeFilter:['data-ctab']});
    fwResume.add('weather', check); // back in view: calm-return queue (load() itself waits 30 min between fetches)
    check();
  })();
  /* =========================================================
     TOP-BAR BUTTONS (none of these need the keyboard)
     ========================================================= */
  /* Today/Tasks header text jumps to today (replaced the top-bar Today button, 2026-10-29). */
  document.querySelector('[data-jump-today]')?.addEventListener('click',()=>jumpToday());
  document.querySelector('[data-jump-today]')?.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); jumpToday(); } });
  function runLayoutAction(action){
    if(action === 'today') jumpToday();
    else if(action === 'scale') toggleTypeSettings();
    else if(action === 'fit'){ fitColumnsToWindow(); setStatus('Columns fitted to window'); }
    else if(action === 'reset-columns') resetColumnSizes();
    else if(action === 'reference') toggleReferenceCollapse();
    else if(action === 'focus') setFocusMode(true);
    else if(action === 'show-toolbar') setFocusMode(false);
  }
  function initLayoutButtons(){
    document.querySelectorAll('[data-layout]').forEach(btn => btn.addEventListener('click',() => {
      releaseEditor();
      runLayoutAction(btn.dataset.layout);
    }));
  }
  /* =========================================================
     ON-SCREEN KEYBOARD
     ========================================================= */
  /* When the phone keyboard is closed with its own button, the cell keeps focus
     and Chrome can need extra taps. Watching the visible area grow back lets the
     app release the cell, so one tap closes the keyboard. */
  /* Voice typing fix (2026-11-13, Julius: "I tap the mic and it disappears, inconsistently"): pressing the mic swaps
     the keyboard for the shorter voice panel, so the visible area grew by >120px and the old rule blurred the cell —
     killing voice input. Now the cell is released only when the area is back to (nearly) its full, keyboard-free
     height, i.e. the keyboard is really gone. Full height = the tallest seen at this width (resets on rotate). */
  let lastViewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  let fullViewport = {w:window.innerWidth,h:lastViewportHeight};
  function onViewportChange(){
    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    const zoomed = vv && vv.scale > 1.02;
    if(Math.abs(window.innerWidth - fullViewport.w) > 40) fullViewport = {w:window.innerWidth,h:h};
    else if(!zoomed && h > fullViewport.h) fullViewport.h = h;
    if(!zoomed && h - lastViewportHeight > 120 && h >= fullViewport.h - 90 && (navigator.maxTouchPoints || 0) > 0 && editableFocused()){
      document.activeElement.blur();
    }
    lastViewportHeight = h;
    positionTypeSettings();
    positionContextMenu();
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',onViewportChange);
  }
  window.addEventListener('resize',onViewportChange);
  /* =========================================================
     START
     ========================================================= */
  initTypographyControls();
  initReferenceSort();
  initMobileScale();
  initPadScale();
  initAppDisplay();
  initLayoutButtons();

</script>
