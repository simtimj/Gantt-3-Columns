<!-- 📅 Calendar panel (2026-11-08, Julius): FullCalendar slide-out from the right. Phase 1 read-only view; phase 2 adds
     create / edit / delete on the main calendar (repeating events stay read-only); phase 3a adds the daily plan
     (Big Three / Stretch / Next Up / Backlog) above the timeline, stored in the Sheet's Plan tab.
     Google Calendar stays the source of truth; server side is getCalendarRange() (Code.gs, never writes).
     FullCalendar + luxon load from jsDelivr on the first open only, so app start-up is unchanged.
     Later phases (editing, daily planning, timer, review): docs/NOTES.md → "Calendar panel (FullCalendar)". -->
<!-- style moved to Index_LateCss.html (2026-11-24: first paint = final look) -->
<div id="calPanelBackdrop" aria-hidden="true"></div>
<aside id="calPanel" role="dialog" aria-modal="true" aria-label="Calendar" aria-hidden="true">
  <div class="cp-resize" data-cal-resize title="Drag to resize the calendar (double-click: default size)" aria-hidden="true"></div>
  <div class="cp-head">
    <strong aria-label="Calendar">📅</strong>
    <button type="button" class="cp-refresh" data-cal-refresh title="Reload events from Google Calendar" aria-label="Reload events">↻</button>
    <button type="button" class="cp-close" data-cal-close title="Close (Esc) and go back to the Gantt" aria-label="Close calendar">✕</button>
  </div>
  <div class="cp-state" data-cal-state hidden></div>
  <div class="cp-body">
    <section class="cp-cals folded" data-cal-cals aria-label="Calendars">
      <button type="button" class="cp-cfold" data-cals-fold><span class="cp-parr">▸</span> Calendars <span class="cp-ccnt" data-cals-count></span></button><span class="cp-zrow"><button type="button" class="cp-zb" data-cal-zoom="-1" title="Zoom out (or pinch)" aria-label="Zoom out">−</button><button type="button" class="cp-zb" data-cal-zoom="1" title="Zoom in (or pinch)" aria-label="Zoom in">+</button><button type="button" class="cp-blbtn" data-bl-toggle title="Backlog: show / hide past unfinished tasks">BL <span data-bl-n></span></button></span>
      <div class="cp-cbody" data-cals-body></div>
    </section>
    <section class="cp-plan" data-cal-plan aria-label="Daily plan">
      <div class="cp-ph"><button type="button" class="cp-pfold" data-plan-act="fold" title="Fold / open the plan"><span class="cp-parr">▾</span> <span class="cp-pword">Plan · </span><span data-plan-day></span></button><span class="cp-pcnt" data-plan-count></span><button type="button" class="cp-padd" data-plan-act="add">+ Add</button></div>
      <div class="cp-pbody" data-plan-body></div>
    </section>
    <div id="calMount"></div>
    <section class="cp-bl" data-cal-bl aria-label="Calendar backlog" hidden>
      <div class="cp-blh"><b>Backlog</b> <span class="cp-blc" data-bl-count></span><span class="cp-blhint">hold + drag onto a day</span></div>
      <div class="cp-blb" data-bl-body></div>
    </section>
    <div class="cp-detail" data-cal-detail hidden></div>
    <div class="cp-fnav"><button type="button" data-fnav="today" title="Today" aria-label="Today">◉</button><button type="button" data-fnav="out" title="Zoom out (or pinch)" aria-label="Zoom out">−</button><button type="button" data-fnav="in" title="Zoom in (or pinch)" aria-label="Zoom in">+</button></div>
  </div>
  <div class="cp-fbtns"><button type="button" data-cal-refresh title="Reload events from Google Calendar" aria-label="Reload events">↻</button><button type="button" data-cal-close title="Close (Esc) and go back to the Gantt" aria-label="Close calendar">✕</button></div>
</aside>
<script>
(function calInit(){
  const TZ = 'America/Los_Angeles';
  const LIBS = ['https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js',
    'https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js',
    'https://cdn.jsdelivr.net/npm/@fullcalendar/luxon3@6.1.15/index.global.min.js'];
  const panel = document.getElementById('calPanel'), backdrop = document.getElementById('calPanelBackdrop');
  // Rare start-up race (smoke pwa-cal, ~1 in 7, 2026-11-23): the panel not in the DOM yet → start once the page is ready.
  if(!panel){ if(!calInit.waited){ calInit.waited = 1; document.addEventListener('DOMContentLoaded', calInit, {once: true}); window.addEventListener('load', () => { if(!calInit.ran && document.getElementById('calPanel')) calInit(); }, {once: true}); } return; }
  calInit.ran = 1;
  /* 3 / 4-day views (2026-11-21, Julius; NOTES "3/4-day views"): big calendar only (pop-out + full screen; docked stays Day).
     One button cycles Day → 3D → 4D → Wk (its label = where a tap goes); hold it / right-click = a picker. 3D / 4D start on
     the day being looked at, and ‹ › / a sideways swipe move one day. Remembered per screen like Day / Week. */
  const CP_VIEWS = ['timeGridDay', 'timeGrid3', 'timeGridWeek']; // 4D removed 2026-11-24 (Julius: Day, 3D, Week is enough)
  const CP_VLBL = {timeGridDay: 'Day', timeGrid3: '3D', timeGridWeek: 'Wk'};
  const cpvFix = v => v === 'timeGrid4' ? 'timeGrid3' : v; // a remembered 4D opens as 3D
  const cpvNext = v => CP_VIEWS[(Math.max(0, CP_VIEWS.indexOf(v)) + 1) % CP_VIEWS.length];
  let cpvSkip = 0; // a hold just opened the picker: the click that follows is not a tap
  function cpvPick(btn){
    document.querySelectorAll('.cp-vpick').forEach(m => m.remove());
    if(!cal) return;
    const m = document.createElement('div'); m.className = 'cp-vpick'; m.setAttribute('role', 'menu');
    m.innerHTML = CP_VIEWS.map(v => '<button type="button" role="menuitem" data-cpv="' + v + '"' + (cal.view.type === v ? ' class="on"' : '') + '>' + ({timeGridDay: 'Day', timeGrid3: '3 days', timeGridWeek: 'Week'})[v] + '</button>').join('');
    panel.appendChild(m); // inside the panel so it gets the calendar's light / dark colors
    const r = btn.getBoundingClientRect(), w = m.offsetWidth;
    m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px'; m.style.top = (r.bottom + 4) + 'px';
    const off = e => { if(!m.contains(e.target)){ m.remove(); document.removeEventListener('pointerdown', off, true); } };
    setTimeout(() => document.addEventListener('pointerdown', off, true), 0);
    m.addEventListener('click', e => { const b = e.target.closest('[data-cpv]'); if(!b) return; e.stopPropagation(); m.remove(); document.removeEventListener('pointerdown', off, true); if(b.dataset.cpv !== cal.view.type) cal.changeView(b.dataset.cpv); });
  }
  (() => {
    let h = null;
    const btnOf = e => e.target.closest && e.target.closest('#calPanel .fc-cpView-button');
    document.addEventListener('pointerdown', e => { const b = btnOf(e); if(!b || (e.pointerType === 'mouse' && e.button !== 0)) return;
      const me = h = {x: e.clientX, y: e.clientY}; me.t = setTimeout(() => { if(h !== me) return; h = null; cpvSkip = Date.now() + 700; cpvPick(b); }, window.fwHoldMs ? window.fwHoldMs() : 500); }, true);
    const stop = () => { if(h){ clearTimeout(h.t); h = null; } };
    document.addEventListener('pointermove', e => { if(h && Math.hypot(e.clientX - h.x, e.clientY - h.y) > 10) stop(); }, true);
    ['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, stop, true));
    document.addEventListener('contextmenu', e => { const b = btnOf(e); if(!b) return; e.preventDefault(); stop(); cpvSkip = Date.now() + 700; cpvPick(b); }, true);
  })();
  const mount = document.getElementById('calMount'), stateEl = panel.querySelector('[data-cal-state]'), detail = panel.querySelector('[data-cal-detail]');
  // Resizable width: drag the left edge (mouse or touch); saved per device. Double-click = default size.
  (function(){
    const grip = panel.querySelector('[data-cal-resize]'), KEY = 'fw.calWidth';
    const maxW = () => window.innerWidth - (window.innerWidth <= 720 ? 28 : 0); // phone: keep the left peek strip
    const clamp = w => Math.max(Math.min(280, maxW()), Math.min(maxW(), Math.round(w)));
    const apply = w => { panel.style.width = w ? clamp(w) + 'px' : ''; };
    const fit = () => { try { const c = window.fwCalendar && window.fwCalendar.api(); if(c) c.updateSize(); } catch (e) {} };
    let saved = 0; try { saved = Number(localStorage.getItem(KEY)) || 0; } catch (e) {}
    if(saved) apply(saved);
    window.addEventListener('resize', () => { if(saved) apply(saved); });
    if(!grip) return;
    grip.addEventListener('pointerdown', e => {
      e.preventDefault(); grip.setPointerCapture(e.pointerId); panel.classList.add('cp-resizing');
      const move = ev => { apply(window.innerWidth - ev.clientX); fit(); };
      const up = () => {
        grip.removeEventListener('pointermove', move); grip.removeEventListener('pointerup', up); grip.removeEventListener('pointercancel', up);
        panel.classList.remove('cp-resizing');
        saved = panel.getBoundingClientRect().width; try { localStorage.setItem(KEY, String(Math.round(saved))); } catch (e) {}
        fit();
      };
      grip.addEventListener('pointermove', move); grip.addEventListener('pointerup', up); grip.addEventListener('pointercancel', up);
    });
    grip.addEventListener('dblclick', () => { saved = 0; try { localStorage.removeItem(KEY); } catch (e) {} apply(0); setTimeout(fit, 50); });
  })();
  let cal = null, libsPromise = null, lastFocus = null, loadSeq = 0, partial = 0, loadErr = false, busy = false;
  let docked = false; // 2026-11-13: this same calendar sits in the right column (day view) whenever the pop-out is closed
  let sheetEv = null, pending = false, flashUntil = 0, viewStart = '', viewEnd = '';
  // Empty / partial note for the dates on screen (also after Day ↔ Week switches served from FullCalendar's cache).
  function refreshState(){
    if(!cal || busy || loadErr || Date.now() < flashUntil) return;
    const v = cal.view, a = v.activeStart.valueOf(), b = v.activeEnd.valueOf();
    const n = cal.getEvents().filter(e => e.start && e.start.valueOf() < b && (e.end ? e.end.valueOf() : e.start.valueOf() + 1) > a).length;
    if(partial) setState('error', partial + ' calendar(s) could not be read — some events may be missing.');
    else if(!n) setState('empty', 'No events on these dates.');
    else setState(null);
  }
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const isOpen = () => document.body.classList.contains('cal-open');

  function setState(kind, msg){
    if(!kind){ stateEl.hidden = true; stateEl.className = 'cp-state'; stateEl.innerHTML = ''; return; }
    stateEl.hidden = false; stateEl.className = 'cp-state' + (kind === 'error' ? ' err' : kind === 'ok' ? ' ok' : '');
    stateEl.innerHTML = '<span>' + esc(msg) + '</span>' + (kind === 'error' ? '<button type="button" data-cal-retry>Retry</button>' : '');
  }
  function loadScript(src){
    return new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = src; s.async = false;
      s.onload = res; s.onerror = () => { s.remove(); rej(new Error('Could not load ' + src.split('/npm/')[1])); };
      document.head.appendChild(s);
    });
  }
  function loadLibs(){
    // Google Calendar's font (2026-11-10, Julius): Google Sans Flex from Google Fonts, fetched the first time the panel opens.
    if(!document.getElementById('cpFont')){ const l = document.createElement('link'); l.id = 'cpFont'; l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..700&display=swap'; document.head.appendChild(l); }
    if(window.FullCalendar && window.FullCalendar.Calendar && window.FullCalendar.Luxon3) return Promise.resolve();
    if(!libsPromise) libsPromise = LIBS.reduce((p, src) => p.then(() => loadScript(src)), Promise.resolve())
      .catch(e => { libsPromise = null; throw e; });
    return libsPromise;
  }
  // ---- Event cache (2026-11-08, Julius: "have this week already cached"). Days already read show at once; Google
  // is asked for the week before / this / after in one call and re-read quietly in the background when the copy is
  // over a minute old (redrawn only if something changed). After any save, refetchFresh() reads Google again before
  // drawing, so edits are never drawn from guesses. A copy around today is kept on the device, so even the first open
  // after a reload shows the last known events immediately, and the app warms it up a few seconds after start-up.
  // Days stay cached for 15 min before a quiet re-check (2026-11-08, Julius: "cache them, don't re-read every day").
  // ↻ always re-reads; a save re-reads only the dates on screen.
  const CACHE_KEY = 'fw.calCache.v2', FRESH_MS = 15 * 60000;
  const evById = new Map(), dayAt = new Map(); // id → server event; 'yyyy-MM-dd' → when that day was read from Google
  let cacheFailed = 0, forceNext = false, bgBusy = false, gen = 0, saveTimer = 0;
  const addDays = (d, n) => { const t = new Date(d + 'T12:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
  const weekOf = d => addDays(d, -new Date(d + 'T12:00:00Z').getUTCDay());
  const daysIn = (s, e) => { const out = []; for(let d = s; d < e && out.length < 400; d = addDays(d, 1)) out.push(d); return out; };
  const todayLA = () => { try { return new Intl.DateTimeFormat('en-CA', {timeZone: TZ}).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } };
  // Week before through week after the dates asked for (≤ 21 days for Day / Week views; server cap is 62).
  const windowFor = (s, e) => [addDays(weekOf(s), -7), addDays(weekOf(addDays(e, -1)), 14)];
  // An event's days as [first, end) in LA dates (server sends LA wall time; a timed end at midnight ends the day before).
  function evSpan(x){
    const a = String(x.start || '').slice(0, 10);
    if(x.allDay) return [a, String(x.end || '').slice(0, 10) || addDays(a, 1)];
    const end = String(x.end || x.start || ''), d = end.slice(0, 10);
    return [a, /T00:00(:00)?/.test(end) && d > a ? d : addDays(d, 1)];
  }
  const overlaps = (x, s, e) => { const [a, b] = evSpan(x); return a < e && b > s; };
  const covered = (s, e) => daysIn(s, e).every(d => dayAt.has(d));
  const fresh = (s, e) => { const t = Date.now() - FRESH_MS; return daysIn(s, e).every(d => (dayAt.get(d) || 0) >= t); };
  function cacheApply(r, s, e, at){
    if(!r || !Array.isArray(r.events)) return false;
    for(const [id, x] of evById) if(overlaps(x, s, e)) evById.delete(id);
    r.events.forEach(x => { if(x && x.id) evById.set(x.id, x); });
    daysIn(s, e).forEach(d => dayAt.set(d, at || Date.now()));
    cacheFailed = (r.failed || []).length;
    clearTimeout(saveTimer); saveTimer = setTimeout(cacheSave, 400);
    lkSoon();
    if(typeof prevSoon === 'function') prevSoon(); // Prev tab count / list (2026-11-26)
    return true;
  }
  const cacheGet = (s, e) => [...evById.values()].filter(x => overlaps(x, s, e));
  const sig = list => list.map(x => JSON.stringify(x)).sort().join('\n');
  function cacheSave(){
    const t = todayLA(), s = addDays(t, -14), e = addDays(t, 35), days = {};
    daysIn(s, e).forEach(d => { if(dayAt.has(d)) days[d] = dayAt.get(d); });
    lsSet(CACHE_KEY, JSON.stringify({ v: 1, days, events: cacheGet(s, e) }));
  }
  (function cacheLoad(){
    try {
      const c = JSON.parse(lsGet(CACHE_KEY) || 'null'), old = Date.now() - 7 * 864e5;
      if(!c || c.v !== 1 || !c.days || !Array.isArray(c.events)) return;
      Object.keys(c.days).forEach(d => { if(c.days[d] > old) dayAt.set(d, c.days[d]); });
      c.events.forEach(x => { if(x && x.id && dayAt.has(String(x.start || '').slice(0, 10))) evById.set(x.id, x); });
    } catch (e) {}
  })();
  // Google Calendar colors (2026-11-10, Julius): open events use Google's exact event colors (Tomato, Tangerine,
  // Banana, Blueberry… from Code.gs CAL_PANEL_COLORS_); done Graphite is mixed a lot with white, like Google's dimmed past events), then picks dark or white text
  // from how light the result is, so yellow / pale fills get dark text and stay readable.
  const softColor = (hex, done) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '')); if(!m) return { bg: hex, fg: '#fff' };
    const dark = document.documentElement.getAttribute('data-theme') === 'dark', k = 0; // colors come exactly as Google shows them (Code.gs CAL_PANEL_COLORS_, 2026-11-10 c); only text color is picked here
    const n = parseInt(m[1], 16), mix = c => Math.round(dark ? c * (1 - k) + 0x16 * k : c + (255 - c) * k);
    const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
    const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return { bg: '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1), fg: lum > 0.62 ? '#1f1f1f' : '#fff' };
  };
  const urgRank = x => ({1: 1, 2: 2, 3: 3})[x.urg] || 4; // checkbox order (2026-11-11): Urgent → Next → Later → not set
  /* Ordered group (2026-11-22, Julius: "split all-day into Unordered and Ordered — Ordered = ones I arrange myself and
     run through in that order"). The sign of `ord` (private tag fwOrd) is the group: ord < 0 = Ordered (numbered 1, 2, 3…,
     in ord order); ord ≥ 0 = Unordered (by urgency, then oldest first, so new = bottom of its urgency). `ordKey` = ord for
     Ordered, 0 otherwise, so eventOrder / adCmp put Ordered first. Drag into / out of the Ordered group → adPlace. */
  const ordKeyOf = o => { o = Number(o) || 0; return o < 0 ? o : 0; };
  /* Events group (2026-11-23, Julius: "red on my calendar = birthdays, separate from the rest"): all-day events on
     his red "Events" calendar (server flag `life`) sit in their own "Events" group on top of the all-day area, with no
     checkbox / urgency, never in Ordered / Unordered and never reordered. Timed ones on the grid are unchanged. */
  const isLife = x => !!x && !!x.allDay && !x.schCopy && (!!x.life || x.cal === 'Events');
  const isOrd = x => !!x && !x.done && !x.schCopy && !isLife(x) && Number(x.ordKey) < 0;
  // 1-based place of an Ordered event in its (start) day's Ordered group; 0 = not found yet (cpGroups fills it in).
  function ordNum(ev){ try { const d = (ev.startStr || '').slice(0, 10); return adDayList(d).filter(e => isOrd(e.extendedProps)).findIndex(e => e.id === ev.id) + 1; } catch (e) { return 0; } }
  const toFc = x => { const c = softColor(x.color, x.done); x.urgRank = urgRank(x); x.cpSch = 0; x.ordKey = ordKeyOf(x.ord); x.lifeK = isLife(x) ? 0 : 1; return { id: x.id, title: x.title, start: x.start, end: x.end, allDay: !!x.allDay,
    backgroundColor: c.bg, borderColor: c.bg, textColor: c.fg,
    classNames: x.done ? ['cp-done'] : [], editable: !!x.editable && !x.done, extendedProps: x }; };
  /* Scheduled (2026-11-15, Julius: "drag an all-day task into my calendar but keep it in the all-day section… when
     it's scheduled, make it its own category below"): a timed event that came from an all-day task (`sched`, a private
     tag set by calPanelMoveEvent) also gets an all-day stand-in copy (`schCopy`, id 'sch|<id>') in the all-day row /
     the full-screen All day box, grouped "Scheduled" (after the open tasks, before Done). Dragging the copy onto a
     time reschedules the real event; onto the all-day row / box = back to all-day (unscheduled). */
  /* All-day order (2026-11-15, Julius: "rearrange the all day area… keep their positioning; from the backlog or
     added = very bottom"). Each all-day event carries `ord` (private tag fwOrd, ms-time-like number): unordered (0)
     first by urgency, then by ord, so anything new (ord = now) lands last. Done stays last. Dragging a row
     within the all-day area (full box: fadDrag; half calendar: dragStopped) → adPlace → calPanelSetOrder. */
  // A stand-in goes as soon as the real event (same title, same day) has come back from the re-read (5 s at most).
  function dropWhenReal(tmp, title, day){
    if(!tmp) return; const t0 = Date.now();
    const tick = () => { const real = cal && cal.getEvents().some(e => e !== tmp && !String(e.id).match(/^(bltmp|fqtmp|sch\|)/) && e.title === title && (e.startStr || '').slice(0, 10) === day);
      if(real || Date.now() - t0 > 5000){ try { tmp.remove(); } catch (e) {} } else setTimeout(tick, 120); };
    tick();
  }
  function adCmp(a, b){ const x = a.extendedProps || {}, y = b.extendedProps || {};
    return (isLife(x) ? 0 : 1) - (isLife(y) ? 0 : 1) || (x.done ? 1 : 0) - (y.done ? 1 : 0) || (Number(x.ordKey) || 0) - (Number(y.ordKey) || 0) || urgRank(x) - urgRank(y) || (Number(x.ord) || 0) - (Number(y.ord) || 0) || String(a.title).localeCompare(String(b.title)); }
  function adDayList(day){ return cal ? cal.getEvents().filter(e => { const x = e.extendedProps || {}; if(!e.allDay || x.schCopy || x.done || x.blTmp || x.fqTmp || isLife(x)) return false;
    const s0 = (e.startStr || '').slice(0, 10), e0 = (e.endStr || '').slice(0, 10) || s0; return s0 <= day && (e0 > day || (e0 === s0 && s0 === day)); }).sort(adCmp) : []; }
  // toOrd: put `ev` before `target` (null = bottom) in `day`'s Ordered group; else move it back to Unordered.
  // Drawn at once, then saved.
  function adPlace(ev, target, after, day, toOrd){
    // EventApi objects are fresh wrappers on every getEvents(), so match by id.
    const all = adDayList(day), me = all.find(e => e.id === ev.id) || ev, mx = me.extendedProps || {}; if(mx.recurring) return;
    const changes = [];
    const set = (e, v) => { const x = e.extendedProps || {}; if(x.recurring || Number(x.ord) === v) return;
      try { e.setExtendedProp('ord', v); e.setExtendedProp('ordKey', ordKeyOf(v)); } catch (err) {} changes.push({eventId: x.eventId, startMs: x.startMs, calId: x.calId, ord: v});
      const raw = evById.get(e.id); if(raw) raw.ord = v; };
    if(toOrd){
      const list = all.filter(e => e.id !== me.id && isOrd(e.extendedProps));
      let i = target ? list.findIndex(e => e.id === target.id) : list.length; if(i < 0) i = list.length; if(target && after) i++;
      list.splice(i, 0, me);
      // Renumber the whole group (small lists): negative, 1 s apart, in order.
      list.forEach((e, k) => set(e, -1e13 + k * 1000));
    } else if(isOrd(mx)) set(me, Date.now()); // back to Unordered: bottom of its urgency
    if(!changes.length) return;
    gen++; clearTimeout(saveTimer); saveTimer = setTimeout(cacheSave, 400); // the local copy keeps the new order too
    if(typeof fadSoon === 'function') fadSoon(); cpGroupsSoon();
    window.__fwAdOrder = (window.__fwAdOrder || 0) + 1;
    google.script.run.withSuccessHandler(r => { if(r && r.failed && r.failed.length){ moveFail('Couldn’t save the order of ' + r.failed.length + '.'); refetchFresh(); } })
      .withFailureHandler(err => { moveFail('Couldn’t save the order — ' + errText(err)); refetchFresh(); })
      .calPanelSetOrder(changes);
  }
  function addSch(list){
    const out = list.slice();
    list.forEach(f => { const x = f.extendedProps || {}; if(f.allDay || !x.sched) return;

    else if(ref.indexOf('card:') === 0) el = window.fwCardInfo(ref.slice(5)).el;
    if(!el){ say('Not loaded on this screen'); return; }
    el.scrollIntoView({block: 'center', behavior: 'smooth'});
    el.classList.add('b3-flash'); setTimeout(() => el.classList.remove('b3-flash'), 1400);
  });
  // Keep ticks in step: any checkbox change re-reads done states (cheap; no server call).
  let t = 0;
  document.addEventListener('change', e => { if(e.target && e.target.type === 'checkbox' && !strip.contains(e.target)){ clearTimeout(t); t = setTimeout(render, 200); } }, true);
  // Back in view: calm-return queue; keeps its own 5-min wait (the strip is a slow-changing suggestion list).
  window.fwResume && fwResume.add('blocks', () => { if(Date.now() - loadedAt > 5 * 60000) load(); }, () => loadedAt);
  setTimeout(load, 1800);
})();
</script>
