<!-- 📅 Calendar panel (2026-11-08, Julius): FullCalendar slide-out from the right. Phase 1 read-only view; phase 2 adds
     create / edit / delete on the main calendar (repeating events stay read-only); phase 3a adds the daily plan
     (Big Three / Stretch / Next Up / Backlog) above the timeline, stored in the Sheet's Plan tab.
     Google Calendar stays the source of truth; server side is getCalendarRange() (Code.gs, never writes).
     FullCalendar + luxon load from jsDelivr on the first open only, so app start-up is unchanged.
     Later phases (editing, daily planning, timer, review): docs/NOTES.md → "Calendar panel (FullCalendar)". -->
<style>
  #calPanelBackdrop{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .2s;}
  #calPanel{--cp-bg:#fff;--cp-text:#202124;--cp-muted:#5f6368;--cp-line:#dadce0;--cp-soft:#f1f3f4;
    position:fixed;top:0;right:0;bottom:0;z-index:4001;width:min(880px,72vw);max-width:100vw;display:flex;flex-direction:column;
    background:var(--cp-bg);color:var(--cp-text);border-left:1px solid var(--cp-line);box-shadow:-8px 0 28px rgba(0,0,0,.18);
    transform:translateX(105%);visibility:hidden;transition:transform .24s ease,visibility 0s linear .24s;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);font-size:14px;}

  body.cal-open #calPanel{transform:none;visibility:visible;transition:transform .24s ease,visibility 0s;}
  body.cal-open #calPanelBackdrop{opacity:1;pointer-events:auto;}
  /* Phone peek (2026-11-10, Julius): leave a ~28px strip of the page showing on the left (tap it to close). */
  @media (max-width:720px){ #calPanel{width:calc(100vw - 28px);max-width:calc(100vw - 28px);border-left:0;box-shadow:-4px 0 16px rgba(0,0,0,.22);} }
  /* Resizable width (2026-11-08, Julius): drag the left edge; saved per device (fw.calWidth), phone too (default full width minus a 28px left peek). */
  #calPanel .cp-resize{position:absolute;left:-5px;top:0;bottom:0;width:10px;cursor:ew-resize;z-index:20;touch-action:none;}
  #calPanel .cp-resize::after{content:"";position:absolute;left:3px;top:50%;width:4px;height:18px;margin-top:-9px;background:radial-gradient(circle,var(--cp-muted,#888) 1.5px,transparent 1.9px) center/4px 6px repeat-y;}
  #calPanel .cp-resize:hover::after,#calPanel.cp-resizing .cp-resize::after{background:radial-gradient(circle,var(--cp-blue,#1a73e8) 1.6px,transparent 2px) center/4px 6px repeat-y;}
  #calPanel.cp-resizing{transition:none;user-select:none;}
  @media (max-width:720px){ #calPanel .cp-resize{left:0;width:16px;} #calPanel .cp-resize::after{left:4px;} }

  #calPanel .cp-head strong{font-size:16px;flex:1;}
  #calPanel .cp-head button{font:inherit;color:inherit;background:var(--cp-soft);border:1px solid var(--cp-line);border-radius:8px;min-height:36px;min-width:40px;padding:0 10px;cursor:pointer;}
  #calPanel .cp-close{font-size:15px;font-weight:600;}

  #calPanel .cp-state button{font:inherit;padding:4px 12px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer;}
  #calPanel .cp-body{flex:1 1 auto;min-height:0;position:relative;padding:6px 8px 8px;display:flex;flex-direction:column;}
  #calPanel #calMount{flex:1 1 auto;min-height:0;}
  /* Calendar backlog (2026-11-11, Julius): phone = bottom half under the calendar; wider = list on the left. */
  :is(#calPanel,#blCol,#calBlLeft) .cp-bl{flex:0 0 45%;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--cp-line);margin-top:6px;background:var(--cp-bg);}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bl[hidden]{display:none;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blh{display:flex;align-items:baseline;gap:6px;padding:6px 8px 4px;font-size:13px;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blc{color:var(--cp-muted);}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blhint{margin-left:auto;font-size:11px;color:var(--cp-muted);}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blb{flex:1 1 auto;min-height:0;overflow:auto;padding:0 6px 8px;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blg{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--cp-muted);margin:8px 2px 3px;text-transform:uppercase;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli{display:flex;align-items:center;gap:6px;padding:6px 8px;margin:2px 0;border-radius:6px;font-size:13px;line-height:1.25;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:grab;touch-action:pan-y;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-bld{flex:0 0 auto;font-size:11px;opacity:.8;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blx{flex:0 0 auto;border:0;background:transparent;color:inherit;opacity:.7;font-size:14px;padding:0 2px;cursor:pointer;}
  /* No wasted columns (2026-11-14, Julius): the full name wraps across the whole row; the date and ✕ sit small in the
     top-right corner and the text flows under them, instead of each keeping its own column down the row. */
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli{display:block;padding:5px 6px 5px 8px;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli::after{content:"";display:block;clear:both;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blx{float:right;line-height:1.1;margin:0 -2px 0 2px;padding:0 2px;font-size:12px;}
  /* 2026-11-21 (Julius: "pressing X in the backlog doesn't get rid of them"): the ✕ was ~10 px wide, so finger taps
     landed on the row. Invisible bigger touch area (about 32 × 32) around it; looks the same. */
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blx{position:relative;font-size:14px;opacity:.85;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blx::after{content:'';position:absolute;inset:-9px -10px -9px -8px;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-bld{float:right;font-size:10px;line-height:1.6;margin-left:4px;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-bli .cp-blt{white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blh{flex-wrap:wrap;row-gap:0;} /* the drag hint drops under the title when narrow */
  :is(#calPanel,#blCol,#calBlLeft) .cp-blhint{white-space:nowrap;}
  :is(#calPanel,#blCol,#calBlLeft) .cp-blmsg{padding:10px 4px;font-size:13px;color:var(--cp-muted);}

     📅 pop-out, stretched to the whole screen, with the backlog beside it and its task names shown in full. */
  #calPanel.cp-full{width:100vw!important;max-width:100vw!important;left:0;border-left:0;box-shadow:none;}
  body.cal-full #calPanelBackdrop{display:none;}
  #calPanel.cp-full .cp-resize{display:none;}
  #calPanel.cp-full{--blw:var(--fl-w,50%);} /* half / half by default, drag the line between (2026-11-14, Julius) */
  #calPanel.cp-full .cp-body.bl-open{padding-left:var(--blw)!important;}
  #calPanel.cp-full .cp-body.bl-open .cp-bl{position:absolute;left:6px;top:6px;bottom:8px;width:calc(var(--blw) - 12px);margin:0;border:1px solid var(--cp-line);border-radius:10px;display:flex;flex-direction:column;}
  #calPanel.cp-full .cp-blside,#calPanel.cp-full .cp-blclose{display:none;}
  /* Full screen left column (2026-11-14, Julius): all-day tasks on top (Week = grouped by day), backlog below, with a
     draggable line between them; the calendar grid keeps no all-day strip. --fad-r = the all-day share (fw.calFullAdR). */
  #calPanel .cp-fad,#calPanel .cp-fadgrip,#calPanel .cp-flgrip{display:none;}
  #calPanel.cp-full.cp-fullwk .cp-body,#calPanel.cp-full.cp-fullwk .cp-body.bl-open{padding-left:0!important;}
  #calPanel.cp-full.cp-fullwk :is(.cp-fad,.cp-fadgrip,.cp-flgrip,.cp-bl){display:none!important;}

  #calPanel.cp-full .cp-flgrip::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;background:var(--cp-axis-line);border-radius:1px;}
  #calPanel.cp-full .cp-flgrip::before{content:"";position:absolute;top:50%;margin-top:-18px;height:36px;left:4px;width:6px;border-radius:3px;background:var(--cp-axis-line);}
  #calPanel.cp-flresizing .cp-flgrip::after,#calPanel.cp-flresizing .cp-flgrip::before{background:var(--cp-blue,#1a73e8);}
  #calPanel.cp-full .cp-body{padding-left:var(--blw)!important;}
  /* Full screen ↻ ✕ top right (2026-11-14, Julius): pinned to the corner instead of wrapping onto a 3rd toolbar row. */

  #calPanel .cp-fnav{display:none;}

  #calPanel .cp-fnav button:focus{outline:0;}
  #calPanel.cp-full .fc .fc-prev-button,#calPanel.cp-full .fc .fc-next-button,#calPanel.cp-full .fc .fc-today-button,
  #calPanel.cp-full .fc .fc-cpZoomOut-button,#calPanel.cp-full .fc .fc-cpZoomIn-button,
  #calPanel.cp-full .fc .fc-button-group:has(.fc-timeGridDay-button){display:none!important;}
  #calPanel.cp-full .fc .fc-cpView-button{display:inline-flex!important;align-items:center;border:1px solid var(--cp-line);border-radius:999px!important;padding:0 8px!important;}
  #calPanel.cp-full .fc .fc-toolbar.fc-header-toolbar,#calPanel.cp-full .fc .fc-toolbar-chunk{flex-wrap:nowrap!important;}
  #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar > .fc-toolbar-chunk:first-child{margin-right:0!important;}
  #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar{padding-right:64px!important;}
  @media (max-width:699px){ #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar{padding-right:56px!important;} }
  #calPanel.cp-full .fc .fc-toolbar-chunk:first-child{min-width:0;flex:1 1 auto;}
  #calPanel.cp-full .fc .fc-toolbar-title{overflow:hidden;text-overflow:ellipsis;}
  #calPanel.cp-full .fc .fc-toolbar.fc-header-toolbar{margin-bottom:0!important;padding-bottom:4px;border-bottom:2px solid var(--cp-sep);}
  @media (max-width:699px){ #calPanel.cp-full .cp-fbtns{right:2px;gap:0;} #calPanel.cp-full .cp-fbtns button{width:27px;height:26px;border-radius:13px;font-size:15px;} #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar > .fc-toolbar-chunk:first-child{margin-right:56px;} #calPanel.cp-full .cp-plan .cp-ph{padding-right:6px;flex-wrap:wrap;row-gap:0;}
    /* Plan header in the narrow column (2026-11-14, Julius: option A): title on its own line beside ↻ ✕, count + Add under it. */

  #calPanel.cp-full .cp-plan .cp-pfold,#calPanel.cp-full .cp-plan .cp-pcnt,#calPanel.cp-full .cp-plan .cp-padd{white-space:nowrap;}
  #calPanel.cp-full.cp-blmin .cp-blh{cursor:pointer;}
  #calPanel .cp-fbtns button{font:inherit;width:32px;height:32px;padding:0;border:0;border-radius:50%;background:var(--cp-bg);color:var(--cp-muted);font-size:17px;cursor:pointer;}
  #calPanel .cp-fbtns button:hover,#calPanel .cp-fbtns button:active{background:var(--cp-hover);}
  #calPanel.cp-full .fc-cpRefresh-button,#calPanel.cp-full .fc-cpClose-button{display:none!important;}
  @media (min-width:700px){ #calPanel.cp-full .cp-plan .cp-ph{padding-right:70px;} }

  @media (min-width:700px){ #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar{padding-right:70px;}
    #calPanel.cp-full .cp-plan.folded ~ #calMount .fc-header-toolbar > .fc-toolbar-chunk:first-child{margin-right:0;} }
  /* Full screen (2026-11-14 evening, Julius): no BL button — the backlog always sits in the left column (▾ minimizes it);
     Week fits on the second row, so only two rows of buttons above the calendar. */
  #calPanel.cp-full .fc-cpBacklog-button,#calPanel.cp-full .cp-blbtn{display:none!important;}
  /* Minimize the backlog (2026-11-14, Julius): ▾ on its header folds it to a bar at the bottom, all-day gets the room. */
  #calPanel .cp-blmin-btn{display:none;}
  #calPanel.cp-full .cp-blmin-btn{display:inline-block;font:inherit;background:transparent;border:0;color:var(--cp-muted);padding:0 4px;cursor:pointer;font-size:12px;}
  #calPanel.cp-full.cp-blmin .cp-blmin-btn{transform:rotate(-90deg);}
  #calPanel.cp-full.cp-blmin .cp-body.bl-open .cp-bl{top:auto!important;bottom:8px;}
  #calPanel.cp-full.cp-blmin .cp-blb,#calPanel.cp-full.cp-blmin .cp-blbar,#calPanel.cp-full.cp-blmin .cp-blhint,#calPanel.cp-full.cp-blmin .cp-body.bl-open .cp-fadgrip{display:none;}
  #calPanel.cp-full.cp-blmin .cp-body.bl-open .cp-fad{height:calc(100% - 54px);}
  #calPanel.cp-full{--fad-r:.45;--fad-h:calc((100% - 26px) * var(--fad-r));}
  #calPanel.cp-full .cp-fad{display:flex;flex-direction:column;position:absolute;left:6px;top:6px;width:calc(var(--blw) - 12px);height:var(--fad-h);
    border:1px solid var(--cp-line);border-radius:10px;background:var(--cp-bg);overflow:hidden;z-index:2;}
  #calPanel.cp-full .cp-body:not(.bl-open) .cp-fad{height:auto;bottom:8px;}

  #calPanel .cp-fag{cursor:default;}
  #calPanel .cp-fagh{font-weight:400;text-transform:none;letter-spacing:0;opacity:.8;margin-left:2px;}
  #calPanel .cp-ordn{display:inline-block;min-width:15px;padding:0 3px;margin-right:4px;border-radius:8px;background:rgba(0,0,0,.28);color:#fff;

  #calPanel .cp-scht{font-weight:400;opacity:.85;white-space:nowrap;}

  #calPanel.cp-full .cp-fai.cp-fasch{border:1px dashed currentColor;}
  #calPanel.cp-full .cp-fasg{cursor:default;}
  #calPanel.cp-full .cp-fad.cp-fad-over{outline:3px dashed #1a73e8;outline-offset:-3px;background:rgba(26,115,232,.12);}

  #calPanel.cp-full .cp-fadgrip::after{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:var(--cp-axis-line);border-radius:1px;}

  #calPanel.cp-full .cp-fadgrip::after{top:5.5px;height:3px;background:var(--cp-sep);}

  #calPanel.cp-full{--blw:50%!important;}
  #calPanel.cp-full .cp-flgrip{pointer-events:none;cursor:default;}

  #calPanel{--sun-a:.13;}
  /* 2026-11-21 (Julius: "too much going on"): the timeline itself has no tint any more; the day's sky (night navy →

  /* 2026-11-21 later (Julius: "a bit much, more subtle"): the sky is a thin 3 px stripe on the strip's right edge, not a fill. */
  /* 2026-11-21 7:43 am (Julius: "too bright, more subtle, cuts into the 4am text"): 3 px stripe at 55% strength, and

  #calPanel:is(.cp-full,.cp-docked) .fc .fc-timegrid-slot-label{background-image:var(--sky,none);background-size:5px 100%;background-position:right top;background-repeat:no-repeat;}

  /* ===== Google Calendar look (2026-11-08, Julius: "as close as Google Calendar, style and feel"). Overrides only;

<!-- Big Three strip (2026-11-08, Julius: "Big Three / Biggest Return"). A thin standing list at the top of Today:

     Adding: hold a task's checkbox → ★ Big Three / ⏳ Waiting list; ★ on a Reference card adds the card as a project.

<style>
