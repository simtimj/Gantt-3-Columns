<!-- 4-panel layout (2026-11-11, Julius): Cal Events = full right column (#calPane); Next Steps + Reference
     (#referencePane) = right-side drawer, opened by the edge tab (◀). #calPane copies the old Reference column's
     grid slot, width and Cols / split visibility, so the existing column machinery keeps working unchanged. -->
<!-- style moved to Index_LateCss.html (2026-11-24: first paint = final look) -->
<script>
(function initRefDrawer(){
  const ref = document.getElementById('referencePane'), cal = document.getElementById('calPane');
  if(!ref || !cal) return;
  ref.classList.add('rd-drawer');
  ref.setAttribute('aria-label', 'Next Steps and Reference');
  const bd = document.createElement('div'); bd.id = 'rdBackdrop';
  ref.parentNode.insertBefore(bd, ref); // same stacking context as the drawer, or it draws over it
  const tab = document.createElement('button');
  tab.type = 'button'; tab.id = 'rdTab'; tab.textContent = '◀';
  tab.title = 'Next Steps + Reference'; tab.setAttribute('aria-expanded', 'false');
  tab.setAttribute('aria-label', 'Open Next Steps and Reference');
  document.body.append(tab);
  const isOpen = () => document.body.classList.contains('rd-open');
  function set(on){
    document.body.classList.toggle('rd-open', on);
    tab.textContent = on ? '▶' : '◀';
    tab.setAttribute('aria-expanded', String(on));
    tab.setAttribute('aria-label', (on ? 'Close' : 'Open') + ' Next Steps and Reference');
    if(!on && ref.contains(document.activeElement)) document.activeElement.blur();
  }
  window.fwRefDrawer = {open:() => set(true), close:() => set(false), toggle:() => set(!isOpen()), isOpen};
  // Toolbar Ref button (2026-11-11, Julius): next to Cols, toggles the drawer.
  document.addEventListener('click', e => { if(e.target.closest && e.target.closest('[data-rd-open]')) set(!isOpen()); });
  // Tab: tap or drag opens / closes (sizing by drag removed 2026-11-21: the drawer is always half the screen).
  let size = null, skipClick = false;
  tab.addEventListener('pointerdown', e => {
    if(e.button > 0) return;
    size = {x:e.clientX, moved:false, id:e.pointerId};
    try { tab.setPointerCapture(e.pointerId); } catch(_){}
  });
  // 2026-11-21 (Julius): locked at half — dragging the tab no longer sizes it; a drag still opens / closes it.
  tab.addEventListener('pointermove', e => {
    if(!size || size.moved || Math.abs(e.clientX - size.x) < 6) return;
    size.moved = true; e.preventDefault();
    set(e.clientX < size.x);
  });
  function endSize(){
    if(!size) return;
    const moved = size.moved; size = null;
    document.body.classList.remove('rd-sizing');
    if(!moved) return;
    skipClick = true; setTimeout(() => { skipClick = false; }, 400);
  }
  tab.addEventListener('pointerup', endSize);
  tab.addEventListener('pointercancel', endSize);
  tab.addEventListener('click', () => { if(skipClick){ skipClick = false; return; } set(!isOpen()); });
  bd.addEventListener('click', () => set(false));
  // Esc closes the drawer, unless it is closing something on top first (zoom, menu, picker, 📅 panel).
  window.addEventListener('keydown', e => {
    if(e.key !== 'Escape' || !isOpen() || document.body.classList.contains('cal-open')) return;
    if(document.querySelector('.fw-focus-target,.fw-focus-spacer,.urg-create-menu,.ctx-menu:not([hidden]),.modal:not([hidden])')) return;
    set(false);
  }, true);
  // Edge swipe (phone, 2026-11-11): drag left from the right edge to pull the drawer in; drag it (or the dimmed
  // page) right to push it out. The drawer follows the finger; release past 60px or with a quick flick.
  // A touch that holds before moving (card drag, hold menus) never counts.
  const EDGE = 24, PASS = 60, HOLD_MS = 350;
  let sw = null;
  const drawerW = () => ref.getBoundingClientRect().width || Math.min(340, window.innerWidth - 32);
  function follow(px){ ref.style.transition = 'none'; ref.style.visibility = 'visible'; ref.style.transform = 'translateX(' + px + 'px)'; }
  function unfollow(){ ref.style.transition = ref.style.visibility = ref.style.transform = ''; }
  window.addEventListener('touchstart', e => {
    sw = null;
    if(e.touches.length !== 1 || document.body.classList.contains('cal-open')) return;
    const t = e.touches[0], open = isOpen();
    const fromEdge = !open && t.clientX >= window.innerWidth - EDGE;
    if(e.target === tab || (!fromEdge && !(open && (ref.contains(e.target) || e.target === bd)))) return;
    sw = {x:t.clientX, y:t.clientY, t:Date.now(), open, lock:null, dx:0, w:drawerW()};
    if(fromEdge) e.stopPropagation(); // the edge strip belongs to the drawer, not the column swipe
  }, {capture:true, passive:true});
  window.addEventListener('touchmove', e => {
    if(!sw || e.touches.length !== 1) return;
    const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
    if(!sw.lock){
      if(Math.abs(dx) + Math.abs(dy) < 10) return;
      const h = Math.abs(dx) > Math.abs(dy) * 1.5 && (sw.open ? dx > 0 : dx < 0);
      if(!h || Date.now() - sw.t > HOLD_MS){ sw = null; return; }
      sw.lock = 'h';
    }
    e.preventDefault();
    sw.dx = dx;
    follow(sw.open ? Math.max(0, dx) : Math.max(0, sw.w + dx));
  }, {capture:true, passive:false});
  function endSwipe(){
    if(!sw) return;
    const s = sw; sw = null;
    if(!s.lock) return;
    const dist = s.open ? s.dx : -s.dx, fast = dist / Math.max(1, Date.now() - s.t) > .5;
    unfollow();
    set((dist > PASS || (fast && dist > 20)) ? !s.open : s.open);
  }
  window.addEventListener('touchend', endSwipe, true);
  window.addEventListener('touchcancel', () => { if(sw && sw.lock){ unfollow(); set(sw.open); } sw = null; }, true);
  // Mouse drag on the drawer header must not pan the workspace behind it.
  ref.addEventListener('pointerdown', e => {
    if(e.target.closest('.pane-header') && !e.target.closest('button,input,select,a')) e.stopPropagation();
  });
  // The Cal Events column takes over the old Reference column's slot: copy its view classes + grid placement.
  function mirror(){
    ['view-hidden','peek-pane'].forEach(c => cal.classList.toggle(c, ref.classList.contains(c)));
    ['gridColumn','gridRow','width','minWidth','minHeight'].forEach(k => { cal.style[k] = ref.style[k]; });
  }
  mirror();
  new MutationObserver(mirror).observe(ref, {attributes:true, attributeFilter:['class','style']});
})();
/* Hide the top button row (2026-11-21, Julius; NOTES "A. Hide the top button row"): hold an empty spot of the toolbar
   (not a button) → the whole row hides; a thin strip stays at the top — tap or hold it to bring the row back.
   Remembered per device (fw.tbHidden). */
(function initToolbarHide(){
  const bar = document.getElementById('toolbar');
  if(!bar) return;
  const KEY = 'fw.tbHidden';
  const strip = document.createElement('button');
  strip.type = 'button'; strip.id = 'tbStrip'; strip.title = 'Show the top buttons'; strip.setAttribute('aria-label', 'Show the top buttons');
  document.body.appendChild(strip);
  const hidden = () => document.body.classList.contains('tb-hidden');
  function set(on, save){
    document.body.classList.toggle('tb-hidden', !!on);
    if(save) try{ localStorage.setItem(KEY, on ? '1' : '0'); }catch(e){}
    requestAnimationFrame(() => { try{ updateWorkspaceLayout(); }catch(e){} try{ syncDayHeights(); }catch(e){} window.dispatchEvent(new Event('resize')); });
  }
  window.fwToolbarHide = {set:on => set(on, true), hidden};
  try{ if(localStorage.getItem(KEY) === '1') set(true, false); }catch(e){}
  const holdMs = () => (window.fwHoldMs ? window.fwHoldMs() : 500);
  let h = null;
  bar.addEventListener('pointerdown', e => {
    if(e.button > 0 || e.target.closest('button,a,input,select,label,.view-menu-popup,.od-nav')) return;
    h = {x:e.clientX, y:e.clientY, t:setTimeout(() => { h = null; set(true, true); if(navigator.vibrate) try{ navigator.vibrate(12); }catch(_){} }, holdMs())};
  });
  const cancel = e => { if(!h) return; if(e && e.type === 'pointermove' && Math.abs(e.clientX - h.x) + Math.abs(e.clientY - h.y) < 8) return; clearTimeout(h.t); h = null; };
  bar.addEventListener('pointermove', cancel); bar.addEventListener('pointerup', cancel); bar.addEventListener('pointercancel', cancel); bar.addEventListener('pointerleave', cancel);
  bar.addEventListener('contextmenu', e => { if(!e.target.closest('button,a,input,select')) e.preventDefault(); });
  strip.addEventListener('click', () => set(false, true));
  strip.addEventListener('contextmenu', e => { e.preventDefault(); set(false, true); });
})();
/* Reference → Keep In Mind (2026-11-21, Julius; NOTES "E. Reference → Keep In Mind drag"): hold a card's title, then
   drag. The drawer slides away, a ghost follows the finger, and dropping on Keep In Mind (or on its ⭐ tab) puts a COPY
   there: the card title as a title line, its lines under it (tasks stay tasks), cards inside it as nested titles.
   Reference is not changed. Mouse: hold the title still for the hold time, then drag. */
(function initRefToKim(){
  const tree = document.getElementById('referenceTree');
  if(!tree) return;
  const holdMs = () => (window.fwHoldMs ? window.fwHoldMs() : 500);
  const kimEd = () => document.querySelector('#kimScroll .kim-editor');
  const kimShown = () => { const sc = document.getElementById('kimScroll'); if(!sc) return false; const r = sc.getBoundingClientRect(); return r.width > 40 && r.height > 40 && getComputedStyle(sc).display !== 'none'; };
  const lvSet = (el, lv) => { lv = Math.max(0, Math.min(6, lv)); el.dataset.level = String(lv); el.style.marginLeft = lv ? (24 * lv) + 'px' : ''; return el; };
  const blank = n => !(n.textContent || '').replace(/[\s​ ]/g, '') && !(n.querySelector && n.querySelector('input,img'));
  function cardLines(wrap, base){
    const cell = wrap.querySelector(':scope > .ref-cell'), out = [];
    const tmp = document.createElement('div');
    tmp.innerHTML = cell ? (typeof cardCleanHtml === 'function' ? cardCleanHtml(cell) : cell.innerHTML) : '';
    const kids = [...tmp.childNodes];
    let titleDone = false;
    const push = (el, lv) => { if(!blank(el)) out.push(lvSet(el, lv)); };
    const lineFrom = (html, lv) => { const d = document.createElement('div'); d.innerHTML = html; push(d, lv); };
    kids.forEach(n => {
      if(n.nodeType === 3){ if(n.data.trim()) lineFrom(n.data.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]), base + 1); return; }
      if(n.nodeType !== 1) return;
      if(!titleDone && n.tagName === 'H2'){
        titleDone = true;
        const t = document.createElement('div'); t.dataset.tl = '1';
        t.innerHTML = '<b>' + (n.textContent.trim() ? n.innerHTML.replace(/<\/?b>/gi, '') : 'Reference') + '</b>';
        out.push(lvSet(t, base)); return;
      }
      titleDone = true;
      if(n.matches('.check-line')){ const c = n.cloneNode(true); c.removeAttribute('data-tl'); c.querySelectorAll('input').forEach(i => i.removeAttribute('data-wired')); push(c, (Number(n.dataset.level) || 0) + base + 1); return; }
      if(n.matches('ul,ol')){ n.querySelectorAll(':scope > li').forEach(li => lineFrom(li.innerHTML, base + 1)); return; }
      if(n.matches('pre')){ (n.textContent || '').split('\n').forEach(t => { if(t.trim()){ const d = document.createElement('div'); d.textContent = t; push(d, base + 1); } }); return; }
      if(n.matches('hr,br')) return;
      lineFrom(n.innerHTML, (Number(n.dataset.level) || 0) + base + 1);
    });
    if(!out.length || out[0].dataset.tl !== '1'){ const t = document.createElement('div'); t.dataset.tl = '1'; t.innerHTML = '<b>Reference</b>'; out.unshift(lvSet(t, base)); }
    wrap.querySelectorAll(':scope > .ref-children > .ref-cell-wrapper').forEach(w => out.push(...cardLines(w, base + 1)));
    return out;
  }
  // Insert the copy into Keep In Mind: before / after a top-level line (or at the end), blank lines around it.
  function dropInto(wrap, at){
    const ed = kimEd(); if(!ed) return false;
    const lines = cardLines(wrap, 0);
    if(typeof captureBeforeEdit === 'function') captureBeforeEdit(ed);
    const frag = document.createDocumentFragment();
    const gap = () => { const d = document.createElement('div'); d.innerHTML = '<br>'; return d; };
    const ref = at && at.line && at.line.parentNode === ed ? (at.after ? at.line.nextSibling : at.line) : null;
    const prev = ref ? ref.previousElementSibling : ed.lastElementChild;
    if(prev && !blank(prev)) frag.appendChild(gap());
    lines.forEach(l => frag.appendChild(l));
    if(!ref || !blank(ref)) frag.appendChild(gap());
    ed.insertBefore(frag, ref);
    ed.querySelectorAll('input[type="checkbox"]').forEach(cb => { if(typeof wireCheckbox === 'function') wireCheckbox(cb); });
    if(typeof refreshCards === 'function') try{ refreshCards(ed); }catch(e){}
    if(typeof refreshTitleLines === 'function') try{ refreshTitleLines(ed); }catch(e){}
    if(typeof finishEditorEdit === 'function') finishEditorEdit(ed);
    if(typeof saveEditorOwner === 'function') saveEditorOwner(ed);
    try{ lines[0].scrollIntoView({block:'nearest'}); }catch(e){}
    return true;
  }
  window.fwRefToKim = dropInto; // (wrap, {line, after}) — smoke + other callers
  let g = null; // {wrap, x, y, timer, armed, drag, ghost, target, touch}
  const clearMarks = () => document.querySelectorAll('.rk-drop-before,.rk-drop-after,.rk-drop-tab').forEach(n => n.classList.remove('rk-drop-before','rk-drop-after','rk-drop-tab'));
  function arm(){
    if(!g) return;
    g.armed = true;
    g.wrap.classList.add('rk-armed');
    if(typeof cancelLongPress === 'function') cancelLongPress();
    if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
  }
  function startDrag(){
    g.drag = true;
    try{ window.getSelection().removeAllRanges(); }catch(e){}
    if(document.activeElement && g.wrap.contains(document.activeElement)) document.activeElement.blur();
    if(typeof hideContextMenu === 'function') hideContextMenu();
    const h2 = g.wrap.querySelector(':scope > .ref-cell > h2');
    const n = g.wrap.querySelectorAll('.ref-cell-wrapper').length;
    g.ghost = document.createElement('div'); g.ghost.className = 'rk-ghost';
    g.ghost.textContent = '⭐ ' + ((h2 && h2.textContent.trim()) || 'Reference card') + (n ? '  +' + n : '');
    document.body.appendChild(g.ghost);
    document.body.classList.add('rk-dragging');
    if(window.fwRefDrawer && window.fwRefDrawer.isOpen()){ g.reopen = true; window.fwRefDrawer.close(); }
  }
  function move(x, y){
    g.ghost.style.left = (x + 12) + 'px'; g.ghost.style.top = (y - 18) + 'px';
    clearMarks(); g.target = null;
    const el = document.elementFromPoint(x, y);
    if(!el) return;
    const tab = el.closest('#journalPane button[data-ctab="focus"]');
    if(tab){ tab.classList.add('rk-drop-tab'); g.target = {tab:true}; return; }
    const ed = kimEd();
    if(ed && kimShown() && el.closest('#kimScroll')){
      const kids = [...ed.children].filter(c => c.getBoundingClientRect().height > 0);
      let line = kids.find(c => c.getBoundingClientRect().bottom > y) || kids[kids.length - 1] || null;
      let after = !line || y > line.getBoundingClientRect().top + line.getBoundingClientRect().height / 2;
      if(!kids.find(c => c.getBoundingClientRect().bottom > y)) after = true;
      if(line) line.classList.add(after ? 'rk-drop-after' : 'rk-drop-before');
      g.target = {line, after};
    }
  }
  function finish(drop){
    if(!g) return;
    const d = g; g = null;
    clearTimeout(d.timer);
    d.wrap.classList.remove('rk-armed');
    if(!d.drag) return;
    clearMarks();
    d.ghost && d.ghost.remove();
    document.body.classList.remove('rk-dragging');
    let ok = false;
    if(drop && d.target){
      if(d.target.tab){
        const b = document.querySelector('#journalPane button[data-ctab="focus"]'); if(b) b.click();
        ok = dropInto(d.wrap, null);
      } else ok = dropInto(d.wrap, d.target);
    }
    if(ok){ if(typeof setStatus === 'function') setStatus('Copied to Keep In Mind'); }
    else if(d.reopen && window.fwRefDrawer) window.fwRefDrawer.open();
  }
  const titleOf = t => { const el = t instanceof Element ? t : t && t.parentElement; const h = el && el.closest && el.closest('#referenceTree .ref-cell > h2'); return h && h.parentElement.firstElementChild === h ? h : null; };
  // Touch
  tree.addEventListener('touchstart', e => {
    if(e.touches.length !== 1){ finish(false); return; }
    const h = titleOf(e.target); if(!h) return;
    const t = e.touches[0];
    g = {wrap:h.closest('.ref-cell-wrapper'), x:t.clientX, y:t.clientY, touch:true};
    g.timer = setTimeout(arm, holdMs());
  }, {passive:true});
  window.addEventListener('touchmove', e => {
    if(!g || !g.touch) return;
    const t = e.touches[0];
    if(!g.armed){ if(Math.abs(t.clientX - g.x) + Math.abs(t.clientY - g.y) > 8) finish(false); return; }
    e.preventDefault(); e.stopPropagation();
    if(!g.drag) startDrag();
    move(t.clientX, t.clientY);
  }, {capture:true, passive:false});
  window.addEventListener('touchend', () => { if(g && g.touch) finish(true); }, true);
  window.addEventListener('touchcancel', () => { if(g && g.touch) finish(false); }, true);
  // Mouse / pen
  tree.addEventListener('pointerdown', e => {
    if(e.pointerType === 'touch' || e.button !== 0) return;
    const h = titleOf(e.target); if(!h) return;
    g = {wrap:h.closest('.ref-cell-wrapper'), x:e.clientX, y:e.clientY, touch:false};
    g.timer = setTimeout(arm, holdMs());
  });
  window.addEventListener('pointermove', e => {
    if(!g || g.touch || e.pointerType === 'touch') return;
    if(!g.armed){ if(Math.abs(e.clientX - g.x) + Math.abs(e.clientY - g.y) > 6) finish(false); return; }
    e.preventDefault();
    if(!g.drag) startDrag();
    move(e.clientX, e.clientY);
  }, true);
  window.addEventListener('pointerup', e => { if(g && !g.touch && e.pointerType !== 'touch') finish(true); }, true);
  window.addEventListener('keydown', e => { if(e.key === 'Escape' && g) finish(false); }, true);
  // While armed / dragging, the hold menu and text selection stay out of the way.
  document.addEventListener('contextmenu', e => { if(g && g.armed){ e.preventDefault(); e.stopImmediatePropagation(); } }, true);
  document.addEventListener('selectstart', e => { if(g && g.armed) e.preventDefault(); }, true);
})();
</script>

<script>
/* Workspace frame box (2026-11-21): CSS vars so the fixed Next Steps / Reference drawer lines up with the frame. */
(function initWsFrame(){
  const ws = document.getElementById('workspace'); if(!ws) return;
  const root = document.documentElement;
  const set = () => {
    const r = ws.getBoundingClientRect(), vw = root.clientWidth || innerWidth, vh = root.clientHeight || innerHeight;
    root.style.setProperty('--ws-t', Math.round(r.top) + 'px');
    root.style.setProperty('--ws-b', Math.max(0, Math.round(vh - r.bottom)) + 'px');
    root.style.setProperty('--ws-l', Math.round(r.left) + 'px');
    root.style.setProperty('--ws-r', Math.max(0, Math.round(vw - r.right)) + 'px');
    root.style.setProperty('--ws-w', Math.round(r.width) + 'px');
  };
  set();
  try{ new ResizeObserver(set).observe(ws); }catch(e){}
  addEventListener('resize', set);
})();
</script>
