<script>
  /* =========================================================
     URGENCY (2026-10-26, Julius — like TickTick)
     Hold a checkbox (or right-click it) to set urgency 1 red / 2 yellow /
     3 blue. Stored on the task line as data-urg="1|2|3", so it saves with
     the day. The Urgent panel at the top of Reference lists every open
     urgent task from every day, with the subtasks under it.
     ========================================================= */
  const URG_NAMES = {1:'Urgent',2:'Soon',3:'Can be later'};
  const urgentSource = new Map();   // date (Today) or date+'|j' (Notes) -> html that has urgency
  // Urgency set on a task in Notes counts too (Julius, 2026-10-27: it showed, then vanished on save).
  function urgKey(date,pane){ return pane === 'journal' ? date + '|j' : pane === 'plan' ? date + '|p' : pane === 'backlog' ? 'backlog|b' : date; }
  function urgKeyParts(key){ const i = key.indexOf('|'); if(i < 0) return {date:key,pane:'today'}; const t = key.slice(i + 1); return {date:key.slice(0,i),pane:t === 'b' ? 'backlog' : t === 'p' ? 'plan' : 'journal'}; }
  /* Backlog (2026-10-28, Julius): a Reference cell titled "Backlog" holds urgent tasks that
     aren't for any day yet. They show in Urgent like the rest (pane 'backlog', date 'backlog'). */
  // Renamed "Undated Tasks" (Julius, 2026-11-01); the old "Backlog" title still works.
  const BACKLOG_NAME = 'Undated Tasks';
  function isBacklogItem(item){ return !!item && /^(backlog|undated tasks)$/i.test(referenceTitle(item)); }
  function backlogItem(){ return (state.reference || []).find(isBacklogItem) || null; }
  function backlogCell(){
    const it = backlogItem();
    return it ? document.querySelector(`#referenceTree .ref-cell-wrapper[data-id="${CSS.escape(String(it.id))}"] > .ref-cell`) : null;
  }
  function isBacklogCell(el){ return !!el && el === backlogCell(); }
  function urgWhere(date){ return date === 'backlog' ? BACKLOG_NAME : shortDate(date); }
  // Where a cell's tasks live, for the Urgent list: {date,pane} or null.
  function ownerKey(owner){
    if(!owner) return null;
    if(owner.classList && (owner.classList.contains('thought-editor') || owner.classList.contains('kim-editor'))) return null; // not in Next Steps
    if(owner.dataset && owner.dataset.date) return {date:owner.dataset.date,pane:owner.classList.contains('journal-editor') ? 'journal' : owner.classList.contains('plan-editor') ? 'plan' : 'today'};
    if(isBacklogCell(owner)) return {date:'backlog',pane:'backlog'};
    return null;
  }
  // Finds or makes the Backlog cell, then calls back with it.
  function withBacklog(cb,fail){
    const cell = backlogCell();
    if(cell){ cb(cell); return; }
    setStatus('Making the ' + BACKLOG_NAME + ' cell…');
    google.script.run.withSuccessHandler(id => {
      const item = {id,parentId:'',type:'item',title:BACKLOG_NAME,content:'<h2>' + BACKLOG_NAME + '</h2>',expanded:true,sort:Date.now()};
      item._b = {c:item.content,h:null}; // base = what the server holds; without it the first save was dropped and the cell reverted (2026-10-31)
      refBase(item);
      state.reference.push(item);
      document.querySelector('#referenceTree > .empty')?.remove();
      createReferenceCell(item);
      const c = backlogCell();
      if(c) cb(c); else { setStatus('Couldn’t find the ' + BACKLOG_NAME + ' cell'); if(fail) fail(); }
    }).withFailureHandler(e => { setStatus(BACKLOG_NAME + ' error: ' + e.message); if(fail) fail(); }).addReferenceItem('',BACKLOG_NAME,'<h2>' + BACKLOG_NAME + '</h2>');
  }
  function urgEditor(date,pane){
    if(pane === 'backlog') return backlogCell();
    if(pane === 'plan') return document.querySelector(`#todayScroll .plan-editor[data-date="${CSS.escape(date)}"]`);
    return pane === 'journal'
      ? document.querySelector(`#journalScroll .journal-editor[data-date="${CSS.escape(date)}"]`)
      : document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(date)}"]`);
  }
  let urgentOpen = true;
  try{ urgentOpen = localStorage.getItem('fw.urgentOpen') !== '0'; }catch(e){}
  function urgencyCheckbox(t){
    const box = t && t.closest ? t.closest('#urgentPanel .urg-box, .due-notes .di-box, #inboxPanel .inbox-box, #centerCalendarList .ce-check, #calPanel .cp-chk') : null;
    if(box) return box;
    // Hold anywhere on a Cal Events row opens its menu (2026-11-04, Julius): the box alone is a small target. Not while typing a title.
    const ceRow = t && t.closest ? t.closest('#centerCalendarList .ce-event') : null;
    if(ceRow) return ceRow.matches('[data-ce-editing]') || ceRow.querySelector('[data-ce-editing]') ? null : ceRow.querySelector('.ce-check');
    const cb = t && t.closest ? t.closest('input[type=checkbox]') : null;
    if(!cb) return null;
    const line = cb.closest('.check-line');
    if(!line || !line.closest('.editor,.ref-cell')) return null;
    return cb;
  }
  function initUrgentSource(list){
    urgentSource.clear();
    (Array.isArray(list) ? list : []).forEach(d => { noteUrgentDay(d.date,d.tasks,false); noteUrgentDay(d.date,d.journal,false,'journal'); if(d.plan) noteUrgentDay(d.date,d.plan,false,'plan'); });
    (state.days || []).forEach(d => { noteUrgentDay(d.date,d.tasks,false); noteUrgentDay(d.date,d.journal,false,'journal'); noteUrgentDay(d.date,d.plan || '',false,'plan'); });
    const bl = backlogItem();
    if(bl) noteUrgentDay('backlog',storedToHtml(stripReferenceMetadata(bl.content || '')),false,'backlog');
    renderUrgent();
  }
  function noteUrgentDay(date,html,render=true,pane='today'){
    if(!date) return;
    const key = urgKey(date,pane);
    if(html && /data-(urg|due|arch)=/.test(html)) urgentSource.set(key,String(html));
    else urgentSource.delete(key);
    if(render) renderUrgent();
  }
  // Open urgent tasks with their subtasks (lines below with a deeper level).
  function collectUrgent(){
    const out = [];
    [...urgentSource.keys()].sort().forEach(key => {
      const {date,pane} = urgKeyParts(key);
      const tpl = document.createElement('template');
      tpl.innerHTML = urgentSource.get(key);
      const lines = [...tpl.content.querySelectorAll('.check-line')];
      // Subtasks already shown under a listed parent aren't listed again on
      // their own, even with the parent's urgency (2026-10-27, Julius).
      let nestedUntil = -1;
      lines.forEach((line,i) => {
        if(i <= nestedUntil) return;
        const urg = /^[123]$/.test(line.dataset.urg || '') ? line.dataset.urg : '0';
        const hasDue = /^\d{4}-\d{2}-\d{2}$/.test(line.dataset.due || '');
        const cb = line.querySelector('input[type=checkbox]');
        const done = !!(cb && cb.hasAttribute('checked')); // Stays listed until urgency is cleared.
        // Archived (2026-10-27, Julius): out of the levels, into the Archive log under them.
        const arch = /^\d{4}-\d{2}-\d{2}$/.test(line.dataset.arch || '') ? line.dataset.arch : '';
        // Due date but no urgency → the "Due" group at the bottom, while open (2026-10-26, Julius).
        if(!arch && urg === '0' && (!hasDue || done)) return;
        const level = Number(line.dataset.level) || 0;
        const subs = [];
        for(let j = i + 1; j < lines.length; j++){
          const l2 = Number(lines[j].dataset.level) || 0;
          if(l2 <= level) break;
          subs.push({text:lineText(lines[j]),html:lineHtml(lines[j]),level:l2 - level,index:j,due:/^\d{4}-\d{2}-\d{2}$/.test(lines[j].dataset.due || '') ? lines[j].dataset.due : '',urg:/^[123]$/.test(lines[j].dataset.urg || '') ? Number(lines[j].dataset.urg) : 0,dur:durMin(lines[j].dataset.dur),done:!!(lines[j].classList.contains('done') || lines[j].querySelector('input[checked]'))});
          nestedUntil = j;
        }
        const due = /^\d{4}-\d{2}-\d{2}$/.test(line.dataset.due || '') ? line.dataset.due : '';
        // Sort by the soonest open date of the task or any of its subtasks (2026-10-28, Julius:
        // subtasks are sometimes due before the task).
        const soon = [due].concat(subs.filter(x => !x.done).map(x => x.due)).filter(Boolean).sort()[0] || '';
        out.push({date,pane,arch,urg:Number(urg),index:i,text:lineText(line),html:lineHtml(line),subs,done,due,soon,dur:durMin(line.dataset.dur),cat:urgItemCat(line,subs)});
      });
    });
    return out;
  }
  // Subject of an Urgent task (2026-10-30, Julius: batches): the one set from the hold
  // menu, else the same guess the cards use (" · Music" tag at the end wins). '' = Other.
  function urgItemCat(line,subs){
    try{
      const d = line.dataset.cat || '';
      if(d === 'none' || d === 'life') return '';
      let known = false; try{ known = !!CARD_CAT_BY_KEY[d]; }catch(e){} // not declared yet during early startup
      if(known) return d;
      if(!cardsAuto) return '';
      return guessCardCat(lineText(line),'',false,(subs || []).map(x => x.text).join(' ')) || '';
    }catch(e){ return ''; }
  }
  function lineHtml(line){
    const t = line.querySelector('.check-text');
    return t ? t.innerHTML : '';
  }
  function lineText(line){
    const t = line.querySelector('.check-text');
    return ((t ? t.textContent : line.textContent) || '').replace(/\s+/g,' ').trim() || '(empty task)';
  }
  // Due dates (2026-10-26): "Wed, Oct 29".
  function dueLabel(s){
    return dateObj(s).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
  }
  // Stacked label for task lines (2026-10-27): two short lines, shown by CSS white-space:pre.
  function dueLabelStack(s){
    const d = dateObj(s);
    return '📅 ' + d.toLocaleDateString(undefined,{weekday:'short'}) + '\n' + d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  // Duration (2026-10-28, Julius: auto-reshuffle step 1): optional minutes on a task line,
  // saved as data-dur in the Sheet. Shown with the due date in the same corner label.
  // Up to 100h for big projects (Julius 2026-10-28: 10h, 15h, 20h+).
  const DUR_MAX = 6000;
  function durMin(v){ const n = Math.round(Number(v)); return n >= 1 && n <= DUR_MAX ? n : 0; }
  // Typed length → minutes: "90", "1h 30m", "1.5h", "15h", "2h15". 0 = none / unreadable.
  function parseDur(v){
    const s = String(v == null ? '' : v).trim().toLowerCase().replace(/\s+/g,'');
    if(!s) return 0;
    if(/^\d+(\.\d+)?$/.test(s)) return durMin(s);
    const m = /^(?:(\d+(?:\.\d+)?)h(?:ours?|rs?)?)?(?:(\d+)m?(?:in(?:utes?|s)?)?)?$/.exec(s);
    if(!m || (!m[1] && !m[2])) return 0;
    return durMin((Number(m[1]) || 0) * 60 + (Number(m[2]) || 0));
  }
  function durLabel(m){
    m = durMin(m); if(!m) return '';
    const h = Math.floor(m / 60), r = m % 60;
    return h ? h + 'h' + (r ? ' ' + r + 'm' : '') : r + 'm';
  }
  // Corner label = due (stacked) + duration; '' when neither is set.
  function lineMetaLabel(due,dur){
    const parts = [];
    if(/^\d{4}-\d{2}-\d{2}$/.test(due || '')) parts.push(dueLabelStack(due));
    if(durMin(dur)) parts.push('⏱ ' + durLabel(dur));
    return parts.join('\n');
  }
  function syncMetaLabel(line){
    const v = lineMetaLabel(line.dataset.due,line.dataset.dur);
    if(v){ if(line.dataset.dueLabel !== v) line.dataset.dueLabel = v; }
    else if(line.hasAttribute('data-due-label')) delete line.dataset.dueLabel;
  }
  function setDue(line,iso){
    if(iso) line.dataset.due = iso; else delete line.dataset.due;
    syncMetaLabel(line);
  }
  function setDur(line,min){
    const m = durMin(min);
    if(m) line.dataset.dur = String(m); else delete line.dataset.dur;
    syncMetaLabel(line);
  }
  // Task fields that must travel when a line is rebuilt somewhere else (Notes → day /
  // Reference, 2026-10-28): urgency, subject, due, duration.
  function lineMeta(n){
    const d = (n && n.dataset) || {};
    return {
      urg: /^[123]$/.test(d.urg || '') ? d.urg : '',
      cat: /^[a-z]{2,12}$/.test(d.cat || '') ? d.cat : '',
      due: /^\d{4}-\d{2}-\d{2}$/.test(d.due || '') ? d.due : '',
      dur: durMin(d.dur) || ''
    };
  }
  function applyLineMeta(c,m){
    if(!m) return;
    if(m.urg) c.dataset.urg = m.urg;
    if(m.cat) c.dataset.cat = m.cat;
    if(m.due) c.dataset.due = m.due;
    if(durMin(m.dur)) c.dataset.dur = String(durMin(m.dur));
    syncMetaLabel(c);
  }
  function localToday(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function shortDate(s){
    const d = dateObj(s);
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
  // Top half of Reference (2026-10-31): panels live here, cells stay in #referenceScroll.
  function refTopHost(tree){
    return document.getElementById('refTopScroll') || tree.parentNode;
  }
  // Keep the Reference header numbers on one line: step the size down until they fit (2026-11-03, Julius).
  function fitUrgCounts(){
    const c = document.querySelector('#referencePane .ref-pane-header .urg-counts');
    if(!c) return;
    c.style.fontSize = '';
    let size = parseFloat(getComputedStyle(c).fontSize) || 13;
    while(c.scrollWidth > c.clientWidth && size > 8){ size -= .5; c.style.fontSize = size + 'px'; }
    if(!fitUrgCounts.watch && window.ResizeObserver){
      fitUrgCounts.watch = new ResizeObserver(() => fitUrgCounts());
      fitUrgCounts.watch.observe(c.closest('.ref-pane-header'));
    }
  }
  // Urgent tab (2026-11-15, Julius): while the middle column's 🔴 tab is open, #urgentPanel lives in #urgTabScroll
  // (a placeholder marks its home in Reference); leaving the tab puts it back. Always unfolded there.
  const urgInTab = () => { const p = document.getElementById('journalPane'); return !!(p && p.dataset.ctab === 'urgent'); };
  let urgHome = null;
  window.urgTabSync = function(){
    const panel = document.getElementById('urgentPanel'), host = document.getElementById('urgTabScroll');
    if(!panel || !host) return;
    if(urgInTab()){
      if(panel.parentNode !== host){ if(!urgHome){ urgHome = document.createComment('urgentPanel home'); } panel.parentNode && panel.parentNode.insertBefore(urgHome, panel); host.appendChild(panel); }
    } else if(panel.parentNode === host){
      if(urgHome && urgHome.parentNode){ urgHome.parentNode.insertBefore(panel, urgHome); urgHome.remove(); }
      else { const tree = document.getElementById('referenceTree'); if(tree) refTopHost(tree).appendChild(panel); }
    }
    renderUrgent();
  };
  function renderUrgent(){
    try{ renderDueBlocks(); }catch(e){}
    const tree = document.getElementById('referenceTree');
    if(!tree) return;
    let panel = document.getElementById('urgentPanel');
    if(!panel){
      panel = document.createElement('div');
      panel.id = 'urgentPanel';
      // calPanel may already live elsewhere (docked) when data arrives late (instant screen): only use it as the anchor if it's here.
      const top = refTopHost(tree), cp = document.getElementById('calPanel');
      top.insertBefore(panel,cp && cp.parentNode === top ? cp : null);
    }
    { const host = document.getElementById('urgTabScroll'); // opened on the 🔴 tab → lives there (2026-11-15)
      if(host && urgInTab() && panel.parentNode !== host){ urgHome = urgHome || document.createComment('urgentPanel home'); panel.parentNode.insertBefore(urgHome, panel); host.appendChild(panel); } }
    // Editing a task's text right in the panel: don't rebuild under the cursor;
    // it redraws when you leave the line (2026-10-27, Julius).
    const editing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#urgentPanel .urg-text[contenteditable="true"]');
    if(editing){ urgRedrawLater = true; return; }
    urgRedrawLater = false;
    const all = collectUrgent();
    const items = all.filter(x => !x.arch), archived = all.filter(x => x.arch);
    // Keep a half-typed task and the keyboard in an inline add line across re-renders.
    const act = document.activeElement;
    const actAdd = act && act.closest ? act.closest('#urgentPanel .urg-adder') : null;
    let focusAdd = urgAddWant || (actAdd ? Number(actAdd.dataset.urg) : 0);
    const caret = actAdd && !urgAddWant ? act.selectionStart : null;
    urgAddWant = 0;
    panel.innerHTML = '';
    panel.hidden = false; // Always shown, so you can add a task even when it's empty.
    panel.classList.toggle('wrap', urgWrap());
    const headRow = document.createElement('div');
    headRow.className = 'urg-head-row';
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'urg-head';
    // Per-level counts in each level's color (Julius, 2026-10-27): red · yellow · blue (+ grey Due).
    // Tasks counted, not subtasks; subtask progress shown as (done/total) after the number.
    // A subtask with its own different color counts as an item in that color (Julius, 2026-10-27).
    const tally = {0:{n:0,d:0,t:0},1:{n:0,d:0,t:0},2:{n:0,d:0,t:0},3:{n:0,d:0,t:0}};
    items.forEach(x => {
      const u = x.urg || 0; tally[u].n++;
      (x.subs || []).forEach(s => {
        if(s.urg && s.urg !== u){ if(!s.done) tally[s.urg].n++; return; }
        tally[u].t++; if(s.done) tally[u].d++;
      });
    });
    const cnt = u => tally[u].n;
    const counts = document.createElement('span'); counts.className = 'urg-counts';
    [[1,'Urgent'],[2,'Soon'],[3,'Can be later']].concat(cnt(0) ? [[0,'Due']] : []).forEach(([u,name]) => {
      const t = tally[u], n = document.createElement('span'); n.className = 'urg-count'; n.dataset.urg = u;
      n.textContent = t.n;
      if(t.t){ const sp = document.createElement('small'); sp.className = 'urg-sub'; sp.textContent = '(' + t.d + '/' + t.t + ')'; n.append(sp); }
      n.title = name + ': ' + t.n + (t.t ? ' · subtasks ' + t.d + '/' + t.t + ' done' : '');
      counts.append(n);
    });
    const label = document.createElement('span'); label.className = 'next-steps-label'; label.textContent = 'Next Steps';
    head.append(label, counts); // section name plus existing colored counts; tap still folds
    head.setAttribute('aria-label','Next Steps');
    head.title = 'Tap to collapse/expand · hold to zoom';
    head.addEventListener('click',() => {
      if(urgCreateSuppress){ urgCreateSuppress = false; return; }
      urgentOpen = !urgentOpen;
      try{ localStorage.setItem('fw.urgentOpen',urgentOpen ? '1' : '0'); }catch(e){}
      renderUrgent();
    });
    // Create menu moved off the numbers onto a + button (2026-11-06, Julius): holding the numbers now only zooms Urgent.
    const addBtn = document.createElement('button');
    addBtn.type = 'button'; addBtn.className = 'urg-add-btn'; addBtn.textContent = '+';
    addBtn.title = 'Create a Next Steps task: Urgent / Soon / Can be later'; addBtn.setAttribute('aria-label','Create a Next Steps task');
    addBtn.addEventListener('click',() => openCreateMenu(addBtn,null));
    headRow.append(head, addBtn);
    // Put Urgent and its live counts directly below the Reference heading.
    const refHeader = document.querySelector('#referencePane .ref-pane-header');
    const previousHead = refHeader && refHeader.querySelector('.urg-head-row');
    if(previousHead) previousHead.remove();
    if(refHeader) refHeader.appendChild(headRow);
    else panel.appendChild(headRow);
    fitUrgCounts();
    if(!urgentOpen && !urgInTab()) return;
    window.__urgAddOpen = window.__urgAddOpen || new Set(); const urgAddOpen = window.__urgAddOpen;
    [1,2,3,0].forEach(u => {
      const group = items.filter(x => x.urg === u)
        .sort((a,b) => (a.soon ? 0 : 1) - (b.soon ? 0 : 1) || (a.soon || '').localeCompare(b.soon || ''));
      // Urgent / Soon / Can be later always show (with their add line), even when empty (Julius, 2026-10-27).
      if(!group.length && !u) return;
      const wrap = document.createElement('div');
      wrap.className = 'urg-group';
      wrap.dataset.urg = u;
      panel.appendChild(wrap);
      const sub = document.createElement('div');
      sub.className = 'urg-sub';
      if(u){
        sub.textContent = (u - 1) + ' · ' + URG_NAMES[u];
        sub.title = 'Hold (or right-click) to make a ' + URG_NAMES[u] + ' task';
        holdForCreate(sub,u);
      } else {
        sub.textContent = 'Due';
        sub.title = 'Tasks with a due date but no urgency, soonest first';
      }
      wrap.appendChild(sub);
      // Cleanup (2026-11-09): the empty "Add … task" line shows only on hover / when the box has focus, or after a tap
      // on its heading (phones). Remembered for this session.
      if(urgAddOpen.has(u)) wrap.classList.add('show-add');
      sub.addEventListener('click', e => {
        if(e.target.closest('button,input,a')) return;
        const on = !wrap.classList.contains('show-add');
        wrap.classList.toggle('show-add', on);
        if(on){ urgAddOpen.add(u); const inp = wrap.querySelector('.urg-adder textarea'); if(inp) setTimeout(() => { try { inp.focus({preventScroll: true}); } catch (err) {} }, 0); }
        else urgAddOpen.delete(u);
      });
      const addItem = item => {
        wrap.appendChild(urgItemRow(item,u,item.index,item.html,item.text,0,item.done,true));
        // Subtasks: real checkbox rows like their task, indented under it
        // (2026-10-27, Julius). Same hold-for-urgency box, editable text.
        // Folded tasks (− / +, 2026-10-28, Julius) hide their subtasks here only.
        if(!urgFolded(item)) item.subs.forEach(st => wrap.appendChild(urgItemRow(item,u,st.index,st.html,st.text,st.level,st.done,false)));
      };
      // Batches (2026-10-30, Julius): inside each level, tasks are grouped by subject
      // (Music, Productivity, Career / IT, …) so he can work one batch at a time.
      // Batch order = its soonest task; Other (no subject) last. Fold per batch.
      const batches = urgBatches(group);
      if(!urgBatchOn() || (batches.length === 1 && !batches[0].cat)) group.forEach(addItem);
      else batches.forEach(b => {
        const folded = urgBatchFolded(u,b.cat);
        wrap.appendChild(urgBatchHead(u,b,folded));
        if(!folded) b.items.forEach(addItem);
      });
      if(u) wrap.appendChild(urgAdderRow(u));
    });
    if(archived.length) panel.appendChild(urgArchiveGroup(archived));
    // Open a line just added from the panel for typing (2026-10-28, Julius).
    if(urgFocusWant){
      const w = urgFocusWant; urgFocusWant = null;
      const el = panel.querySelector(`.urg-text[data-date="${CSS.escape(w.date)}"][data-pane="${w.pane}"][data-index="${w.index}"]`);
      if(el && el.isContentEditable){
        try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
        try{ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }catch(e){}
        el.scrollIntoView({block:'nearest'});
        focusAdd = 0;
      }
    }
    if(focusAdd){
      const inp = panel.querySelector(`.urg-adder[data-urg="${focusAdd}"] textarea`);
      if(inp){
        const grp = inp.closest('.urg-group'); if(grp) grp.classList.add('show-add'); // stays visible while you keep typing
        try{ inp.focus({preventScroll:true}); }catch(e){ inp.focus(); }
        const n = caret == null ? inp.value.length : Math.min(caret,inp.value.length);
        try{ inp.setSelectionRange(n,n); }catch(e){}
      }
    }
  }
  // Urgent batches by subject (2026-10-30, Julius). Option "Group by subject"
  // (localStorage fw.urgBatch, default on); folded batches in fw.urgBatchFold ("u|cat").

  // Archive log (2026-10-27, Julius): finished work kept as a dated log under

  // Delete a task and its subtasks. Undo: tap the status message within 30 s

  /* Urgent tick = log + archive (2026-11-05, Julius). Ticking an urgent task in the Urgent panel:
     1) ticks the real task, 2) puts a done copy in today's History (current time section) unless the task already

     Unticking it from the Archive reverses all three. The copy is tied to the task by data-ulog / data-ulogof. */
  function urgDoneLogArchive(item,index){
    const ed = urgEditor(item.date,item.pane);
    const line = ed ? ed.querySelectorAll('.check-line')[index] : null;
    const cb = line ? line.querySelector('input[type=checkbox]') : null;
    if(!cb){ setStatus('That day isn’t loaded — scroll to ' + urgWhere(item.date)); return; }
    const today = localToday();
    const tEd = document.querySelector('#todayScroll .day-editor[data-date="' + CSS.escape(today) + '"]');
    const wasDone = cb.checked;

    if(!wasDone){
      toggleDueTask(item.date,index,item.pane);

        if(!line.dataset.ulog) line.dataset.ulog = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
        if(!tEd.querySelector('[data-ulogof="' + CSS.escape(line.dataset.ulog) + '"]')){

          const src = line.querySelector('.check-text');

          n.classList.add('done');

      if(copy){ captureBeforeEdit(tEd); copy.remove(); saveEditorOwner(tEd); }

  /* ---------------------------------------------------------
     SEND CARRY-OVERS (2026-10-26, Julius): tasks in Claude's note blocks
     (check-line[data-send]) show a small → button on the right. Tap it → Today,
     Tomorrow or a picked date; the task moves to that day's Today cell.
     --------------------------------------------------------- */
  function maybeOpenSendMenu(e, ed){
    const line = e.target.closest?.('table[data-cnote] .check-line[data-send]');
    if(!line || !ed.contains(line)) return;
    const r = line.getBoundingClientRect();
    // Only the small → button at the top-right of the line (Julius, 2026-10-27: was "→ Day").
    if(e.clientX < r.right - 34 || e.clientY > r.top + 26) return;
    e.preventDefault(); e.stopPropagation();
    openSendMenu(line, ed, e.clientX, e.clientY);
  }
  function closeSendMenu(){ document.querySelector('.send-menu')?.remove(); }
  // Short date under Today / Tomorrow so it's clear which day (Julius, 2026-10-26): "10/27 Tue".
  function shortDayLabel(s){
    const d = new Date(s + 'T00:00:00');
    return `${d.getMonth()+1}/${d.getDate()} ${d.toLocaleDateString(undefined,{weekday:'short'})}`;
  }
  // Reference cells in tree order, for the "→ Reference" picker.
  function referenceTargets(){
    return Array.from(document.querySelectorAll('#referenceTree .ref-cell-wrapper')).map(w => {
      let depth = 0;
      for(let p = w.parentElement?.closest('.ref-cell-wrapper'); p; p = p.parentElement?.closest('.ref-cell-wrapper')) depth++;
      const cell = w.querySelector(':scope > .ref-cell');
      const title = (cell?.querySelector(':scope > h2')?.textContent || cell?.textContent || '').trim().slice(0,40) || 'Untitled';
      return { id:w.dataset.id, title, depth, cell };
    });
  }
  // Preselect the cell whose title shares the most words with the task (e.g. "CDCR IT application" → IT Associate);
  // otherwise the last cell picked.
  function guessReferenceTarget(text, targets){
    const words = new Set(String(text).toLowerCase().match(/[a-z0-9+]{2,}/g) || []);
    let best = null, bestScore = 0;
    targets.forEach(t => {
      const score = (t.title.toLowerCase().match(/[a-z0-9+]{2,}/g) || []).filter(w => words.has(w)).length;
      if(score > bestScore){ best = t.id; bestScore = score; }
    });
    if(best) return best;
    try{ const last = localStorage.getItem('fw.sendRef'); if(targets.some(t => t.id === last)) return last; }catch(e){}
    return targets[0]?.id || '';
  }
  function openSendMenu(line, ed, x, y){
    closeSendMenu();
    const today = localToday(), tomorrow = addDays(today,1);
    const targets = referenceTargets();
    const m = document.createElement('div');
    m.className = 'send-menu';
    m.innerHTML =
      '<div class="send-row">' +
        `<button data-d="0">Today<small>${shortDayLabel(today)}</small></button>` +
        `<button data-d="1">Tomorrow<small>${shortDayLabel(tomorrow)}</small></button>` +
        '<input type="date"><button data-go>Send</button><button data-x>✕</button>' +
      '</div>' +
      (targets.length ? '<div class="send-row"><span class="send-lbl">Reference</span><select></select><button data-ref>Add</button></div>' : '');
    const pick = m.querySelector('input'); pick.value = addDays(today,2);
    const sel = m.querySelector('select');
    if(sel){
      targets.forEach(t => {
        const o = document.createElement('option');
        o.value = t.id; o.textContent = '  '.repeat(t.depth) + t.title;
        sel.appendChild(o);
      });
      sel.value = guessReferenceTarget(line.textContent, targets);
    }
    m.addEventListener('pointerdown', ev => ev.stopPropagation());
    m.addEventListener('click', ev => {
      const b = ev.target.closest('button'); if(!b) return;
      if(b.hasAttribute('data-x')) return closeSendMenu();
      if(b.hasAttribute('data-ref')){
        const t = targets.find(t => t.id === sel.value);
        closeSendMenu();
        if(t) sendNoteToReference(line, ed, t);
        return;
      }
      const date = b.hasAttribute('data-go') ? pick.value : addDays(today, Number(b.dataset.d));
      if(!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
      closeSendMenu();
      sendNoteTask(line, ed, date);
    });
    document.body.appendChild(m);
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.max(16, Math.min(x - w + 20, innerWidth - w - 16)) + 'px';
    m.style.top = Math.max(8, Math.min(y + 12, innerHeight - h - 8)) + 'px';
    setTimeout(() => document.addEventListener('pointerdown', closeSendMenu, {once:true}), 0);
  }
  // → Reference (Julius, 2026-10-26): the task (and its subtasks) goes to the end of the picked
  // Reference cell as open check-lines, and leaves the note — same as sending to a day.
  function sendNoteToReference(line, ed, target){
    const cell = target.cell;
    if(!cell || !document.contains(cell)){ setStatus('That Reference cell isn’t loaded'); return; }
    const tree = noteTaskTree(line);
    captureBeforeEdit(cell);
    tree.forEach(t => {
      const c = document.createElement('div');
      c.className = 'check-line';
      c.dataset.level = String(t.level);
      if(t.level) c.style.marginLeft = `${t.level * 24}px`;
      c.innerHTML = '<input type="checkbox"><span class="check-text"></span>';
      c.querySelector('.check-text').innerHTML = t.html;
      applyLineMeta(c,t.meta);
      cell.appendChild(c);
      wireCheckbox(c.querySelector('input'));
    });
    finishEditorEdit(cell);
    saveEditorOwner(cell);
    captureBeforeEdit(ed); tree.forEach(t => t.node.remove()); finishEditorEdit(ed); saveEditorOwner(ed);
    try{ localStorage.setItem('fw.sendRef', target.id); }catch(e){}
    setStatus(`Sent ${tree.length > 1 ? tree.length + ' tasks' : 'task'} to ${target.title}`);
  }
  // A carry-over task plus the subtasks nested under it (Julius, 2026-10-26): sending a
  // parent takes all its subtasks; sending a subtask takes only it and what's below it.
  function noteTaskTree(line){
    const lvl = n => Number(n.dataset.level) || 0;
    const base = lvl(line), out = [line];
    for(let n = line.nextElementSibling; n; n = n.nextElementSibling){
      if(!n.classList.contains('check-line') || lvl(n) <= base) break;
      out.push(n);
    }
    return out.map(n => ({ node:n, level: lvl(n) - base, html: n.querySelector('.check-text')?.innerHTML || '', meta: lineMeta(n) }));
  }
  function addTasksToDay(date, items){
    const ed = document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(date)}"]`);
    if(!ed){ setStatus('That day isn’t loaded'); return false; }
    captureBeforeEdit(ed);
    const blank = !ed.textContent.trim() && !ed.querySelector('input,img,hr');
    if(blank) ed.replaceChildren();
    items.forEach(it => {
      const c = document.createElement('div');
      c.className = 'check-line';
      c.dataset.level = String(it.level);
      if(it.level) c.style.marginLeft = `${it.level * 24}px`;
      c.innerHTML = '<input type="checkbox"><span class="check-text"></span>';
      c.querySelector('.check-text').innerHTML = it.html;
      applyLineMeta(c,it.meta);
      ed.appendChild(c);
      wireCheckbox(c.querySelector('input'));
    });
    finishEditorEdit(ed);
    saveEditorOwner(ed);
    noteUrgentDay(date,ed.innerHTML);
    return true;
  }
  function sendNoteTask(line, ed, date){
    const tree = noteTaskTree(line);
    const items = tree.map(t => ({ level:t.level, html:t.html, meta:t.meta }));
    const label = formatDate(date);
    const what = items.length > 1 ? `${items.length} tasks` : 'task';
    const removeLines = () => {
      captureBeforeEdit(ed); tree.forEach(t => t.node.remove()); finishEditorEdit(ed); saveEditorOwner(ed);
    };
    const loaded = document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(date)}"]`);
    if(loaded){
      if(addTasksToDay(date, items)){ removeLines(); setStatus(`Sent ${what} to ${label}`); }
      return;
    }
    setStatus('Sending…');
    google.script.run
      .withSuccessHandler(() => { removeLines(); setStatus(`Sent ${what} to ${label}`); })
      .withFailureHandler(err => setStatus('Send error: ' + (err.message || err)))
      .appendTasksToDay(date, items);
  }
</script>
