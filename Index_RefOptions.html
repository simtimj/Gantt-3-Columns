<script>
  // Reference options panel (2026-10-26): Urgent panel + Inbox settings live
  // next to Sort, separate from the main Options.
  function initRefOptions(){
    const btn = document.getElementById('refOptionsBtn');
    const box = document.getElementById('refOptions');
    if(!btn || !box) return;
    const close = () => { if(box.hidden) return; box.hidden = true; btn.setAttribute('aria-expanded','false'); btn.classList.remove('on'); };
    // Placed under the button, kept on screen.
    const place = () => {
      const r = btn.getBoundingClientRect();
      const w = box.offsetWidth, h = box.offsetHeight;
      box.style.left = Math.max(16, Math.min(r.right - w, innerWidth - w - 16)) + 'px';
      box.style.top = (r.bottom + 6 + h > innerHeight - 8 ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
    };
    btn.addEventListener('click',() => {
      if(!box.hidden) return close();
      box.hidden = false; place();
      btn.setAttribute('aria-expanded','true');
      btn.classList.add('on');
    });
    document.addEventListener('pointerdown',e => {
      if(!box.hidden && !box.contains(e.target) && !btn.contains(e.target)) close();
    },true);
    ['referenceScroll','refTopScroll'].forEach(id => document.getElementById(id)?.addEventListener('scroll',close,{passive:true}));
    window.addEventListener('resize',() => { if(!box.hidden) place(); });
    const wrapCb = document.getElementById('optUrgWrap');
    if(wrapCb){ wrapCb.checked = urgWrap(); wrapCb.addEventListener('change',() => setUrgOpt('fw.urgWrap',wrapCb.checked ? '1' : '0')); }
    const batchCb = document.getElementById('optUrgBatch');
    if(batchCb){ batchCb.checked = urgBatchOn(); batchCb.addEventListener('change',() => setUrgOpt('fw.urgBatch',batchCb.checked ? '1' : '0')); }
  }
  function urgWrap(){ return urgOpt('fw.urgWrap','1') !== '0'; }

  // Options for the Urgent panel (2026-10-26, Julius: keep it concise).
  function urgOpt(key,def){ try{ const v = localStorage.getItem(key); return v == null ? def : v; }catch(e){ return def; } }
  function setUrgOpt(key,v){ try{ localStorage.setItem(key,v); }catch(e){} renderUrgent(); }
  // Day made removed from Urgent (Julius, 2026-10-27): hold the box → Go to task replaces it.
  function showMadeDate(){ return false; }
  function dueStyle(){
    const v = urgOpt('fw.dueStyle',urgOpt('fw.dueCountdown','1') === '0' ? 'date' : 'days');
    return ['date','days','left','month','long','wkmonth','wklong'].includes(v) ? v : 'days';
  }
  function initDueOptions(){
    const made = document.getElementById('optShowMade');
    if(made){ made.checked = showMadeDate(); made.addEventListener('change',() => setUrgOpt('fw.showMade',made.checked ? '1' : '0')); }
    const style = document.getElementById('optDueStyle');
    if(style){ style.value = dueStyle(); style.addEventListener('change',() => setUrgOpt('fw.dueStyle',style.value)); }
  }
  const md = s => (dateObj(s).getMonth() + 1) + '/' + dateObj(s).getDate();
  // Julius's day abbreviations (2026-10-26): Tues and Thurs, the rest 3 letters.
  const WD_SHORT = ['Sun','Mon','Tues','Wed','Thurs','Fri','Sat'];
  const wd = s => WD_SHORT[dateObj(s).getDay()];
  // "Tue 10/27", "Tue 10/27 · 3d", or "3d"; today → "Today", tomorrow → "Tmrw".
  function dueText(due,today){
    const left = Math.round((dateObj(due) - dateObj(today)) / 86400000);
    if(left === 0) return 'Today';
    const rel = left === 1 ? 'Tmrw' : left > 0 ? left + 'd' : (-left) + 'd late';
    const style = dueStyle();
    if(style === 'left') return rel;
    // Month-name styles (2026-10-26, Julius): "Oct 27 · 3d", "October 27th · 3d".
    // With the weekday too: "Tue, Oct 27 · 3d", "Tuesday, October 27th · 3d".
    if(['month','long','wkmonth','wklong'].includes(style)){
      const d = dateObj(due);
      const long = style === 'long' || style === 'wklong';
      const mon = d.toLocaleDateString('en-US',{month:long ? 'long' : 'short'});
      const day = d.getDate();
      const ord = long ? (day % 100 >= 11 && day % 100 <= 13 ? 'th' : ({1:'st',2:'nd',3:'rd'}[day % 10] || 'th')) : '';
      const wk = style.startsWith('wk') ? (long ? d.toLocaleDateString('en-US',{weekday:'long'}) : WD_SHORT[d.getDay()]) + ', ' : '';
      return wk + mon + ' ' + day + ord + ' · ' + rel;
    }
    return wd(due) + ' ' + md(due) + (style === 'days' ? ' · ' + rel : '');
  }
  // Every task with a due date, from every day we know about.
  function collectDue(){
    const out = [];
    [...urgentSource.keys()].sort().forEach(key => {
      const {date,pane} = urgKeyParts(key);
      const tpl = document.createElement('template');
      tpl.innerHTML = urgentSource.get(key);
      const lines = [...tpl.content.querySelectorAll('.check-line')];
      let nestedUntil = -1, nestedDue = '';
      const isDone = l => !!(l.classList.contains('done') || l.querySelector('input[type=checkbox][checked]'));
      const html = l => { const t = l.querySelector('.check-text'); return t ? t.innerHTML : lineText(l); };
      lines.forEach((line,i) => {
        // A subtask with its own, different due date is listed on that day too (2026-10-28, Julius).
        if(i <= nestedUntil && !(line.dataset.due && line.dataset.due !== nestedDue)) return;
        const due = line.dataset.due || '';
        if(line.dataset.arch) return; // archived tasks leave the Due group too
        if(!/^\d{4}-\d{2}-\d{2}$/.test(due) || due === date) return;
        // The whole task: its subtasks come along (Julius, 2026-10-27).
        const level = Number(line.dataset.level) || 0, subs = [];
        for(let j = i + 1; j < lines.length; j++){
          const l2 = Number(lines[j].dataset.level) || 0;
          if(l2 <= level) break;
          subs.push({index:j,level:l2 - level,urg:lines[j].dataset.urg || '',html:html(lines[j]),done:isDone(lines[j])});
          if(j > nestedUntil){ nestedUntil = j; nestedDue = due; }
        }
        out.push({date,pane,index:i,due,urg:line.dataset.urg || '',text:lineText(line),html:html(line),subs,done:isDone(line)});
      });
    });
    return out;
  }
  // Tasks due on a day show in that day's NOTES cell (Julius, 2026-10-27:
  // Today was filling up), as their own boxed, collapsible group right under
  // Claude's Suggested day (or at the top). Render-only: the group is
  // contenteditable=false, marked data-render-due, and stripped on save
  // (cardCleanHtml). Edit a task's text right in the group (it edits the
  // real task); tap the box = done; hold / right-click the box = urgency
  // picker with "Go to task". Events are delegated (initDueNotes), so a
  // group restored by undo still works.
  function dueNotesOpen(date){
    try{ const m = JSON.parse(localStorage.getItem('fw.dueNotesOpen') || '{}'); if(date in m) return !!m[date]; }catch(e){}
    return date === localToday();
  }
  function setDueNotesOpen(date,open){
    try{
      const m = JSON.parse(localStorage.getItem('fw.dueNotesOpen') || '{}');
      m[date] = open ? 1 : 0;
      const keys = Object.keys(m).sort(); while(keys.length > 60) delete m[keys.shift()];
      localStorage.setItem('fw.dueNotesOpen',JSON.stringify(m));
    }catch(e){}
  }
  function renderDueBlocks(){
    // The old Today-cell copies are gone.
    document.querySelectorAll('#todayScroll .day-row > .due-block').forEach(b => { const d = b.closest('.day-row').dataset.date; b.remove(); syncDayHeightStable(d); });
    const byDay = new Map();
    collectDue().forEach(it => { if(!byDay.has(it.due)) byDay.set(it.due,[]); byDay.get(it.due).push(it); });
    document.querySelectorAll('#journalScroll .journal-editor[data-date]').forEach(ed => {
      const date = ed.dataset.date;
      const list = byDay.get(date) || [];
      const all = [...ed.querySelectorAll('.due-notes')];
      all.slice(1).forEach(x => x.remove());
      let block = all[0] || null;
      if(block && document.activeElement && document.activeElement.closest && document.activeElement.closest('.di-text') && block.contains(document.activeElement)) return; // don't redraw while typing in it
      const open = dueNotesOpen(date);
      const sig = JSON.stringify([open,list]);
      if(block && block.dataset.sig === sig && block.dataset.listened === '1' && block.isConnected){ placeDueNotes(ed,block); return; }
      if(!list.length){ if(block){ block.remove(); syncDayHeightStable(date); } return; }
      if(!block){
        block = document.createElement('div');
        block.className = 'due-notes';
        block.setAttribute('contenteditable','false');
        block.dataset.renderDue = '1';
      }
      block.dataset.sig = sig;
      block.dataset.listened = '1';
      block.dataset.date = date;
      block.innerHTML = '';
      const count = list.length + list.reduce((n,it) => n + (it.subs || []).length,0);
      const done = list.reduce((n,it) => n + (it.done ? 1 : 0) + (it.subs || []).filter(s => s.done).length,0);
      const head = document.createElement('div');
      head.className = 'dn-head';
      head.append(pmBox(open));
      const ht = document.createElement('span');
      ht.textContent = 'Due today · ' + list.length + (open ? '' : '  (' + count + ' hidden · ' + done + ' done)');
      head.append(ht);
      // Urgency dots so a collapsed group still shows how hot it is.
      const dots = document.createElement('span'); dots.className = 'dn-dots';
      list.forEach(it => { const d = document.createElement('i'); d.dataset.urg = it.urg || '0'; dots.append(d); });
      head.append(dots);
      block.appendChild(head);
      if(open){
        list.forEach(it => {
          const card = document.createElement('div');
          card.className = 'due-item' + (it.done ? ' done' : '');
          if(it.urg) card.dataset.urg = it.urg;
          const live = !!urgEditor(it.date,it.pane);
          const from = it.date === 'backlog' ? 'from ' + BACKLOG_NAME : 'from ' + dateObj(it.date).toLocaleDateString(undefined,{weekday:'short'}) + ' ' + (dateObj(it.date).getMonth() + 1) + '/' + dateObj(it.date).getDate();
          const mk = (t,level,isMain) => {
            const r = document.createElement('div');
            r.className = 'di-line' + (t.done ? ' done' : '');
            if(t.urg) r.dataset.urg = t.urg;
            if(level) r.style.paddingLeft = (level * 1.4) + 'em';
            const box = document.createElement('button'); box.type = 'button'; box.className = 'di-box';
            box.dataset.date = it.date; box.dataset.index = String(t.index); box.dataset.pane = it.pane;
            box.setAttribute('aria-label', t.done ? 'Mark not done' : 'Mark done');
            box.title = 'Tap: done · hold or right-click: urgency, due date, go to task';
            const tx = document.createElement('span'); tx.className = 'di-text'; tx.innerHTML = t.html;
            tx.dataset.date = it.date; tx.dataset.index = String(t.index); tx.dataset.pane = it.pane;
            tx.setAttribute('contenteditable', live ? 'true' : 'false');
            tx.spellcheck = false;
            if(!live) tx.title = 'Scroll to ' + urgWhere(it.date) + ' in its column to edit here';
            r.append(box,tx);
            if(isMain){ const f = document.createElement('span'); f.className = 'di-from'; f.setAttribute('contenteditable','false'); f.title = from; const sp = from.indexOf(' ',5); [from.slice(0,sp),from.slice(sp + 1)].forEach(t => { const x = document.createElement('span'); x.textContent = t; f.append(x); }); r.append(f); }
            return r;
          };
          card.appendChild(mk(it,0,true));
          (it.subs || []).forEach(st => card.appendChild(mk(st,st.level,false)));
          block.appendChild(card);
        });
      }
      placeDueNotes(ed,block);
      syncDayHeightStable(date);
    });
  }
  // Right under Claude's Suggested day box if there is one, else at the top.
  function placeDueNotes(ed,block){
    const plan = ed.querySelector(':scope > table[data-cnote][data-ckind="sched"]') || ed.querySelector(':scope > table[data-cnote][data-ckind="plan"]');
    if(plan){ if(plan.nextSibling !== block) plan.after(block); }
    else if(ed.firstChild !== block) ed.prepend(block);
  }
  // Edit a due task's text in the Notes group → writes to the real task.
  let dueEditTimer = 0;
  function dueSource(el){
    const ed = urgEditor(el.dataset.date || '',el.dataset.pane);
    const line = ed ? ed.querySelectorAll('.check-line')[Number(el.dataset.index)] : null;
    return line ? {ed,line,text:line.querySelector('.check-text')} : null;
  }
  function initDueNotes(){
    const inGroup = t => t && t.closest ? t.closest('.due-notes') : null;
    document.addEventListener('click',e => {
      const g = inGroup(e.target); if(!g) return;
      const head = e.target.closest('.dn-head');
      if(head){ e.preventDefault(); setDueNotesOpen(g.dataset.date,!dueNotesOpen(g.dataset.date)); g.dataset.sig = ''; renderDueBlocks(); return; }
      const box = e.target.closest('.di-box');
      if(box){ e.preventDefault(); e.stopPropagation(); toggleDueTask(box.dataset.date,Number(box.dataset.index),box.dataset.pane); }
    });
    // Typing inside the group must not count as editing the Notes cell itself.
    ['beforeinput','input','keydown','keyup','paste'].forEach(type => document.addEventListener(type,e => {
      const tx = e.target && e.target.closest ? e.target.closest('.due-notes .di-text, #urgentPanel .urg-text[contenteditable="true"]') : null;
      if(!tx) return;
      e.stopPropagation();
      if(type === 'keydown' && e.key === 'Enter'){
        e.preventDefault();
        // Urgent panel (2026-10-28, Julius): Enter on a task with text = new task at the
        // same level right below it (same parent), open for typing. Empty line → just finish.
        if(tx.matches('#urgentPanel .urg-text') && !e.shiftKey){
          const src = dueSource(tx);
          if(src && src.text && src.text.textContent.trim()){
            if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; }
            tx.blur();
            urgAddLine(src.line,src.ed,'task',true);
            return;
          }
        }
        tx.blur(); return;
      }
      // Tab / Shift+Tab in an Urgent row = indent / outdent with its subtasks (2026-11-05, Julius).
      if(type === 'keydown' && e.key === 'Tab' && tx.matches('#urgentPanel .urg-text')){
        e.preventDefault();
        const src = dueSource(tx);
        if(!src || !src.line || !src.line.isConnected) return;
        if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; }
        const ok = ownerKey(src.ed);
        if(ok) urgFocusWant = {date:ok.date,pane:ok.pane,index:[...src.ed.querySelectorAll('.check-line')].indexOf(src.line)};
        urgTextKeepEmpty = true; tx.blur(); urgTextKeepEmpty = false;
        urgIndent(src.line,src.ed,e.shiftKey ? -1 : 1);
        return;
      }
      // Backspace at the start of an empty Urgent row deletes that task / subtask (Julius, 2026-10-28),
      // like the cells; the caret moves to the end of the row above.
      if(type === 'keydown' && e.key === 'Backspace' && tx.matches('#urgentPanel .urg-text') && !tx.textContent.replace(/[\s\u200b\u00a0]/g,'')){
        const sel = window.getSelection();
        if(sel && sel.rangeCount && !sel.getRangeAt(0).collapsed) return;
        e.preventDefault();
        const src = dueSource(tx);
        if(!src || !src.line || !src.line.isConnected) return;
        const tree = urgSubtree(src.line), at = [...src.ed.querySelectorAll('.check-line')].indexOf(src.line);
        const rows = [...document.querySelectorAll('#urgentPanel .urg-text[data-index]')];
        const prev = rows[rows.indexOf(tx) - 1];
        urgFocusWant = null;
        if(prev){
          let pi = Number(prev.dataset.index);
          const same = prev.dataset.date === tx.dataset.date && prev.dataset.pane === tx.dataset.pane;
          if(same && pi > at) pi -= tree.length;
          if(!(same && pi >= at && pi < at + tree.length)) urgFocusWant = {date:prev.dataset.date,pane:prev.dataset.pane,index:pi};
        }
        if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; }
        if(tree.length === 1){ urgTextKeepEmpty = false; tx.blur(); return; } // focusout removes the empty line
        urgTextKeepEmpty = true; tx.blur();
        deleteTaskLine(src.line,src.ed); // asks first: it has subtasks
        return;
      }
      if(type === 'paste'){ e.preventDefault(); document.execCommand('insertText',false,(e.clipboardData || window.clipboardData).getData('text/plain')); return; }
      if(type !== 'input') return;
      const src = dueSource(tx);
      if(!src || !src.text){ setStatus('That task isn’t loaded — scroll to ' + shortDate(tx.dataset.date)); return; }
      src.text.innerHTML = tx.innerHTML;
      clearTimeout(dueEditTimer);
      dueEditTimer = setTimeout(() => urgChanged(src.ed),600);
    },true));
    document.addEventListener('focusout',e => {
      if(e.target && e.target.closest && e.target.closest('#urgentPanel .urg-text')){
        const src = dueSource(e.target);
        // A new line left empty is removed again (2026-10-28), unless it has subtasks.
        const keep = urgTextKeepEmpty; urgTextKeepEmpty = false;
        if(!keep && src && src.text && !src.text.textContent.trim() && urgSubtree(src.line).length === 1 && src.line.isConnected){
          if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; }
          captureBeforeEdit(src.ed); src.line.remove(); finishEditorEdit(src.ed); urgChanged(src.ed);
          return;
        }
        if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; if(src) urgChanged(src.ed); }
        setTimeout(() => { try{ renderUrgent(); }catch(err){} },0);
        return;
      }
      if(!(e.target && e.target.closest && e.target.closest('.due-notes .di-text'))) return;
      const src = dueSource(e.target);
      if(dueEditTimer){ clearTimeout(dueEditTimer); dueEditTimer = 0; if(src) urgChanged(src.ed); }
      setTimeout(() => { try{ renderDueBlocks(); }catch(err){} },0);
    });
  }
  // Tick a task where it lives, from its Due copy (needs that day loaded).
  function toggleDueTask(date,index,pane){
    const ed = urgEditor(date,pane);
    const line = ed ? ed.querySelectorAll('.check-line')[index] : null;
    const cb = line ? line.querySelector('input[type=checkbox]') : null;
    if(!cb){ setStatus('That day isn’t loaded — scroll to ' + urgWhere(date)); return; }
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change',{bubbles:true}));
    urgChanged(ed);
  }
  function goToTask(date,index,pane){
    const ed = urgEditor(date,pane);
    if(!ed){ setStatus('That day isn’t loaded — scroll to ' + urgWhere(date)); return; }
    const line = ed.querySelectorAll('.check-line')[index] || ed;
    line.scrollIntoView({block:'center',behavior:'smooth'});
    line.classList.add('urg-flash');
    setTimeout(() => line.classList.remove('urg-flash'),1300);
  }
  // Picker
  let urgPicker = null, urgPress = null, urgSuppressClick = false;
  // What a picker press acts on: a real checkbox in an editor, or a box in
  // the Urgent panel (2026-10-26, Julius) — that one edits the task back in
  // its Today day, which has to be loaded.
  function urgTarget(el){
    if(el.classList && (el.classList.contains('urg-box') || el.classList.contains('di-box'))){
      const ed = urgEditor(el.dataset.date || '',el.dataset.pane);
      const line = ed ? ed.querySelectorAll('.check-line')[Number(el.dataset.index)] : null;
      return line ? {line,owner:ed} : null;
    }
    const line = el.closest('.check-line');
    return line ? {line,owner:el.closest('.editor,.ref-cell')} : null;
  }
  function urgChanged(owner){
    saveEditorOwner(owner);
    const k = ownerKey(owner);
    if(k) noteUrgentDay(k.date,owner.innerHTML,true,k.pane);
    else renderUrgent();
  }
  // A task line plus the subtasks nested under it (following lines with a deeper level).
  function urgSubtree(line){
    const lvl = n => Number(n.dataset.level) || 0;
    const base = lvl(line), out = [line];
    for(let n = line.nextElementSibling; n && n.classList.contains('check-line') && lvl(n) > base; n = n.nextElementSibling) out.push(n);
    return out;
  }
  // Add a task line after `line`'s subtree (2026-10-28, Julius): 'task' = same level,
  // 'subtask' = one deeper, at the end of its subtasks. Keeps the urgency so it stays
  // under the same card in Urgent. fromPanel → the new row opens for typing in Urgent.
  function urgAddLine(line,owner,mode,fromPanel){
    if(!line || !owner) return null;
    const lvl = Number(line.dataset.level) || 0;
    captureBeforeEdit(owner);
    const n = createCheckboxLine(mode === 'subtask' ? Math.min(6,lvl + 1) : lvl);
    if(line.dataset.urg) n.dataset.urg = line.dataset.urg;
    urgSubtree(line).slice(-1)[0].insertAdjacentElement('afterend',n);
    finishEditorEdit(owner);
    const ok = ownerKey(owner);
    if(fromPanel && ok){
      urgFocusWant = {date:ok.date,pane:ok.pane,index:[...owner.querySelectorAll('.check-line')].indexOf(n)};
      urgChanged(owner);
    } else {
      urgChanged(owner);
      owner.focus({preventScroll:true});
      placeCaretInsideCheckbox(n.querySelector('.check-text'));
      n.scrollIntoView({block:'nearest'});
    }
    return n;
  }
  // Move a task with its subtasks to the end of another cell, head at the left (2026-10-28).
  function moveTaskTree(line,from,to,msg){
    if(!line || !from || !to || from === to || !line.isConnected) return;
    const tree = urgSubtree(line), base = Number(line.dataset.level) || 0;
    captureBeforeEdit(from); captureBeforeEdit(to);
    const blank = !to.textContent.trim() && !to.querySelector('input,img,hr');
    if(blank && !to.classList.contains('ref-cell')) to.replaceChildren();
    tree.forEach(n => {
      const lv = Math.max(0,(Number(n.dataset.level) || 0) - base);
      n.dataset.level = String(lv);
      n.style.marginLeft = lv ? (lv * 24) + 'px' : '';
      n.removeAttribute('data-tlhid');
      to.appendChild(n);
    });
    if(!from.children.length) from.innerHTML = '<p><br></p>';
    [from,to].forEach(ed => { if(typeof refreshCards === 'function') try{ refreshCards(ed); }catch(err){} finishEditorEdit(ed); urgChanged(ed); });
    if(typeof renderDueBlocks === 'function') try{ renderDueBlocks(); }catch(err){}
    line.classList.add('urg-flash');
    setTimeout(() => line.classList.remove('urg-flash'),1400);
    setStatus(msg);
  }
  // Indent / outdent a task with its subtasks (2026-10-28, Julius).
  function urgIndent(line,owner,delta){
    if(!line || !owner) return;
    const tree = urgSubtree(line);
    if(delta < 0 && !(Number(line.dataset.level) > 0)){ setStatus('Already at the left'); return; }
    captureBeforeEdit(owner);
    tree.forEach(l => changeIndent(l,delta));
    finishEditorEdit(owner);
    urgChanged(owner);
  }
  function showUrgencyPicker(cb,x,y){
    hideUrgencyPicker();
    if(typeof hideContextMenu === 'function') hideContextMenu();
    // Calendar events (2026-11-03, Julius): same menu, minus what only fits a task saved in a cell.
    // 📅 Calendar panel checkboxes (2026-11-11, Julius) use it too: `.cp-chk` inside a `.cp-ev` card with the same data-ce-* fields.
    const isCal = !!(cb.classList && (cb.classList.contains('ce-check') || cb.classList.contains('cp-chk')));
    const t = isCal ? {line:cb.closest('.ce-event, .cp-ev'),owner:null} : urgTarget(cb);
    if(!t){ setStatus('Scroll Today to that day first, then change it'); return; }
    const {line,owner} = t;
    const metaChanged = () => { if(isCal) saveCalMeta(line); else urgChanged(owner); };
    const p = document.createElement('div');
    p.className = 'urg-picker';
    if(owner && owner.matches('.journal-editor') && dailySectionLines(owner).includes(line)){
      if(hydrationLine(line)){
        const row = document.createElement('div'); row.className = 'urg-hydration';
        const entry = document.createElement('input'); entry.type = 'text'; entry.placeholder = '8W or 8C';
        entry.setAttribute('aria-label','Drink amount in ounces and type');

    const endPress = () => {
      if(!document.body.classList.contains('urg-pressing')) return;
      clearPressSelection();
      setTimeout(() => { document.body.classList.remove('urg-pressing'); clearPressSelection(); },350);
    };
    ['pointerup','pointercancel','touchend','touchcancel'].forEach(t => document.addEventListener(t,endPress,true));
    document.addEventListener('selectstart',e => { if(document.body.classList.contains('urg-pressing') || urgPress) e.preventDefault(); },true);
    const cancel = e => {
      if(!urgPress) return;
      if(e.type === 'pointermove' && Math.abs(e.clientX - urgPress.x) < 10 && Math.abs(e.clientY - urgPress.y) < 10) return;
      clearTimeout(urgPress.timer); urgPress = null;
    };
    ['pointerup','pointercancel','pointermove'].forEach(t => document.addEventListener(t,cancel,true));
    // A long press must not also tick the box.
    document.addEventListener('click',e => {
      if(!urgSuppressClick) return;
      urgSuppressClick = false;
      if(urgencyCheckbox(e.target)){ e.preventDefault(); e.stopPropagation(); }
    },true);
    // Right-click a checkbox = the same picker.
    document.addEventListener('contextmenu',e => {
      const cb = urgencyCheckbox(e.target);
      if(!cb) return;
      e.preventDefault();
      if(urgPicker) return;
      if(urgPress){ clearTimeout(urgPress.timer); urgPress = null; urgSuppressClick = true; }
      showUrgencyPicker(cb,e.clientX,e.clientY);
    },true);
    document.addEventListener('keydown',e => { if(e.key === 'Escape') hideUrgencyPicker(); },true);
  }
  initContextMenu();
  initUrgency();
  initDueNotes();
  initDueOptions();
  initRefOptions();
  /* Every open menu/panel closes when you press anywhere outside it (or press Escape).
     Runs in the capture phase so nothing else can swallow the press first. */
  function closeAllMenus(exceptTarget){
    const t = exceptTarget instanceof Element ? exceptTarget : null;
    document.querySelectorAll('[data-view-menu]').forEach(menu=>{
      if(t && menu.contains(t)) return;
      const popup = menu.querySelector('.view-menu-popup');
      if(popup && !popup.hidden){
        popup.hidden = true;
        menu.querySelector('.view-menu-trigger')?.setAttribute('aria-expanded','false');
      }
    });
    const settings = document.getElementById('typeSettings');
    if(settings && !settings.classList.contains('hidden')){
      const insidePanel = t && settings.contains(t);
      const onToggle = t && t.closest('[data-layout="scale"]');
      if(!insidePanel && !onToggle) settings.classList.add('hidden');
    }
    if(!(t && ctxMenu.contains(t))) hideContextMenu();
  }
  function initOutsideClickClose(){
    document.addEventListener('pointerdown',e=>closeAllMenus(e.target),true);
    document.addEventListener('keydown',e=>{ if(e.key === 'Escape') closeAllMenus(null); },true);
  }
  /* Scroll guards: only real user scrolling counts as "scrolling", and the
     overflow:hidden containers around the day lists can never be scrolled by
     the browser (it does that to reveal the caret, which made the whole
     view slide while typing). */
  function initScrollGuards(){
    const mark = () => { lastUserScrollAt = Date.now(); };
    ['wheel','touchstart','touchmove'].forEach(type=>document.addEventListener(type,mark,{capture:true,passive:true}));
    document.addEventListener('keydown',e=>{
      if(['PageUp','PageDown','Home','End'].includes(e.key)) mark();
    },true);
    ['app','workspace','todayPane','journalPane','referencePane'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('scroll',()=>{ if(el.scrollTop) el.scrollTop = 0; },{passive:true});
    });
    window.addEventListener('scroll',()=>{ if(window.scrollY || window.scrollX) window.scrollTo(0,0); },{passive:true});
  }
  initOutsideClickClose();
  initScrollGuards();
  initWorkspaceView();
  initMobileEditing();
  function initWorkspaceHorizontalSwipe(){
    const workspace=document.getElementById('workspace');
    // Rely on native touch panning: forced preventDefault caused sticky diagonal swipes.
    // The workspace itself owns horizontal overflow; each pane owns vertical overflow.
    /* Drag empty pane headers to pan horizontally with a mouse. */
    let drag=null;
    workspace.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch' || e.button!==0 || !e.target.closest('.pane-header') ||
         e.target.closest('button,input,select,a,[data-jump-today]') || workspace.scrollWidth<=workspace.clientWidth+2 ||
         isSplitActive())return;
      drag={x:e.clientX,left:workspace.scrollLeft,end:wsAtEnd()};
      workspace.setPointerCapture(e.pointerId);
    });
    workspace.addEventListener('pointermove',e=>{
      if(!drag)return;
      const dx=e.clientX-drag.x;
      if(Math.abs(dx)>2)workspace.scrollLeft=drag.left-dx;
    });
    workspace.addEventListener('pointerup',e=>{ if(drag && drag.end && drag.x-e.clientX>80) tryFull(); drag=null; });
    ['pointercancel','lostpointercapture'].forEach(type=>workspace.addEventListener(type,()=>{drag=null;}));
    /* Full-screen calendar (2026-11-14, Julius): with the half-screen calendar showing (app slid all the way left),
       one more slide left opens the big calendar full screen. Only a slide that STARTS at the end counts, so a
       slide that just arrived there doesn't overshoot into it. */
    function wsAtEnd(){ return workspace.scrollLeft>=workspace.scrollWidth-workspace.clientWidth-2; }
    function tryFull(){ return !!(window.fwCalendar && window.fwCalendar.canFull && window.fwCalendar.canFull() && window.fwCalendar.openFull()); }
    let ts=null;
    workspace.addEventListener('touchstart',e=>{ ts=e.touches.length===1 && wsAtEnd() && !(e.target.closest && e.target.closest('#calMount')) ? {x:e.touches[0].clientX,y:e.touches[0].clientY,at:Date.now()} : null; },{passive:true});
    workspace.addEventListener('touchend',e=>{ const p=ts; ts=null; if(!p || !wsAtEnd()) return; const t=e.changedTouches[0], dx=t.clientX-p.x, dy=t.clientY-p.y;
      if(dx<-70 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-p.at<900) tryFull(); },{passive:true});
    /* Nested day/reference containers have overflow-x:hidden and consume
       macOS two-finger sideways gestures before they can reach #workspace.
       Capture from anywhere in the app and send just the horizontal motion
       to the shared workspace scroller. Vertical wheel movement remains native. */
    document.addEventListener('wheel',e=>{
      if(!document.getElementById('app').contains(e.target) ||
         isSplitActive() ||
         workspace.scrollWidth<=workspace.clientWidth+2 ||
         e.ctrlKey || e.metaKey)return;  // preserve trackpad pinch/browser zoom
      // On most trackpads a sideways swipe is deltaX. Shift+wheel is a
      // convenient alternative for ordinary mice and external keyboards.
      const shiftPan=e.shiftKey && Math.abs(e.deltaY)>Math.abs(e.deltaX);
      const amount=shiftPan ? e.deltaY : e.deltaX;
      if(Math.abs(amount)<.01)return;
      e.preventDefault();
      // Over the docked calendar: a sideways swipe changes the day instead (2026-11-13, Julius).
      // …unless this scroll started as an app slide (the calendar slid in under the pointer mid-gesture): keep sliding
      // until the wheel has been still for 250 ms (2026-11-14).
      const panning=Date.now()<(workspace.__panUntil||0);
      if(!panning && e.target.closest && e.target.closest('#calPanel.cp-docked #calMount') && window.fwCalSwipeDay){
        const now=Date.now(); if(now-(window.__cdAt||0)>250) window.__cdAcc=0; window.__cdAt=now; window.__cdAcc=(window.__cdAcc||0)+amount;
        if(Math.abs(window.__cdAcc)>60){ window.fwCalSwipeDay(window.__cdAcc>0?1:-1); window.__cdAcc=0; }
        return;
      }
      /* 2026-11-14 (Julius: "calendar does not appear on computer when I scroll right"): each wheel step set
         scrollLeft and the proximity snap pulled it straight back to the left. Snapping is off while the wheel moves
         and comes back ~160 ms after it stops (then it only pulls in when you stopped close to a half). */
      if(!panning){ workspace.__startEnd=wsAtEnd(); workspace.__endAcc=0; }
      if(amount>0 && workspace.__startEnd && wsAtEnd()){
        workspace.__endAcc=(workspace.__endAcc||0)+amount;
        if(workspace.__endAcc>150){ workspace.__endAcc=0; workspace.__startEnd=false; if(tryFull()) return; }
      }
      workspace.__panUntil=Date.now()+250;
      workspace.style.scrollSnapType='none';
      clearTimeout(workspace.__snapT);
      workspace.__snapT=setTimeout(()=>{ workspace.style.scrollSnapType=''; },160);
      workspace.scrollLeft+=amount;
    },{capture:true,passive:false});
  }
  /* Single-column swipe (Julius, 2026-10-27): with one column showing, swipe
     sideways to the neighbor in order — Today/Tasks ↔ Notes ↔ Reference, no
     wrap-around. The neighbor slides in under the finger. Hold still with the
     dividing line near the middle → quick prompt to split those two. */
  function initSingleSwipe(){
    const ws=document.getElementById('workspace');
    const active=()=>!isSplitActive() && visiblePanes.length===1;
    const neighbor=dir=>VIEW_PANES[VIEW_PANES.indexOf(visiblePanes[0])+dir]||null;
    const MID_LO=.3, MID_HI=.7, HOLD_MS=450;
    let s=null;
    const seamX=()=>s.dir>0 ? s.w+s.dx : s.dx;           // divider position in px
    const isMid=()=>{const f=seamX()/s.w; return f>=MID_LO && f<=MID_HI;};
    function begin(dir){
      const next=neighbor(dir);
      if(!next)return false;
      s.dir=dir; s.next=next;
      s.cur=colPaneEl(visiblePanes[0]);
      s.nextPane=colPaneEl(next);
      s.w=ws.clientWidth;
      s.nextPane.classList.remove('view-hidden');
      s.nextPane.classList.add('swipe-next');
      s.nextPane.style.width=s.w+'px';
      s.nextPane.style.left=(dir>0 ? s.w : -s.w)+'px';
      s.cur.classList.add('swipe-cur');
      s.seam=document.createElement('div'); s.seam.id='swipeSeam';
      ws.appendChild(s.seam);
      return true;
    }
    function paint(){
      const t='translateX('+s.dx+'px)';
      s.cur.style.transform=t; s.nextPane.style.transform=t;
      s.seam.style.transform='translateX('+seamX()+'px)';
      s.seam.classList.toggle('mid',isMid());
    }
    function cleanup(){
      if(!s)return;
      clearTimeout(s.hold);
      ws.classList.remove('swipe-anim');
      if(s.cur){s.cur.classList.remove('swipe-cur');s.cur.style.transform='';}
      if(s.nextPane){
        s.nextPane.classList.remove('swipe-next');
        s.nextPane.style.transform='';s.nextPane.style.left='';s.nextPane.style.width='';
        if(!visiblePanes.includes(s.next))s.nextPane.classList.add('view-hidden');
      }
      s.seam?.remove();
      document.getElementById('swipeSplitMenu')?.remove();
      s=null;
    }
    function settle(go){
      if(!s || !s.cur){cleanup();return;}
      ws.classList.add('swipe-anim');
      s.dx=go ? -s.dir*s.w : 0;
      paint();
      const next=s.next;
      setTimeout(()=>{cleanup(); if(go)applyWorkspaceView([next]);},190);
    }
    function armHold(){
      clearTimeout(s.hold);
      s.hold=setTimeout(()=>{ if(s && s.cur && !s.menu && isMid())openMenu(); },HOLD_MS);
    }
    function openMenu(){
      s.menu=true;
      try{navigator.vibrate && navigator.vibrate(15);}catch(e){}
      const [a,b]=s.dir>0 ? [visiblePanes[0],s.next] : [s.next,visiblePanes[0]];
      const ratio=Math.max(.2,Math.min(.8,seamX()/s.w));
      const short=n=>n==='today' ? 'Today' : PANE_LABELS[n];
      const m=document.createElement('div'); m.id='swipeSplitMenu';
      const item=(label,fn)=>{const btn=document.createElement('button');btn.type='button';btn.textContent=label;
        btn.addEventListener('click',e=>{e.stopPropagation();fn();});m.appendChild(btn);};
      const h=document.createElement('div');h.className='ssm-h';h.textContent='Split view?';m.appendChild(h);
      item('Split '+short(a)+' | '+short(b),()=>split(a,b,'horizontal',ratio));
      item('Split stacked '+short(a)+' / '+short(b),()=>split(a,b,'vertical',.5));
      item('Go to '+short(s.next),()=>settle(true));
      item('Cancel',()=>settle(false));
      document.body.appendChild(m);
      const r=ws.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
      m.style.left=Math.max(8,Math.min(window.innerWidth-mw-8,r.left+seamX()-mw/2))+'px';
      m.style.top=Math.max(8,r.top+(r.height-mh)/2)+'px';
    }
    function split(a,b,orientation,ratio){
      splitOptions.first=a; splitOptions.second=b; splitOptions.third='none'; splitOptions.orientation=orientation;
      try{localStorage.setItem(MOBILE_SPLIT_OPTIONS_KEY,JSON.stringify(splitOptions));}catch(e){}
      if(orientation==='horizontal'){
        mobileSplitRatio=ratio;
        try{localStorage.setItem(MOBILE_SPLIT_SIZE_KEY,String(ratio));}catch(e){}
      }
      cleanup();
      setSplit(true);
    }
    const skip=t=>!t || !document.getElementById('app').contains(t) ||
      t.closest('input,select,textarea,button,a,.view-menu-popup,#typeSettings,#swipeSplitMenu,.column-resizer');
    document.addEventListener('touchstart',e=>{
      if(s && s.menu)return;                     // waiting on the prompt
      cleanup();
      if(!active() || e.touches.length!==1 || skip(e.target))return;
      const p=e.touches[0];
      s={x:p.clientX,y:p.clientY,dx:0,lock:null,lastX:p.clientX};
    },{capture:true,passive:true});
    document.addEventListener('touchmove',e=>{
      if(!s || s.menu || e.touches.length!==1)return;
      const p=e.touches[0], dx=p.clientX-s.x, dy=p.clientY-s.y;
      if(!s.lock){
        if(Math.abs(dx)<10 && Math.abs(dy)<10)return;
        if(Math.abs(dx)<Math.abs(dy)*1.5 || (window.getSelection && String(window.getSelection()).length)){s=null;return;}
        if(!begin(dx<0 ? 1 : -1)){s=null;return;}   // nothing that way (e.g. left of Today)
        s.lock='h';
      }
      e.preventDefault();
      // Stay on the side we started toward; resist past the edges.
      s.dx=s.dir>0 ? Math.max(-s.w,Math.min(0,dx)) : Math.min(s.w,Math.max(0,dx));
      paint();
      if(Math.abs(p.clientX-s.lastX)>12){s.lastX=p.clientX;armHold();}
      else if(!s.hold)armHold();
    },{capture:true,passive:false});
    const end=()=>{
      if(!s || s.menu)return;
      if(!s.cur){s=null;return;}
      settle(Math.abs(s.dx)>s.w*.3);
    };
    document.addEventListener('touchend',end,{capture:true,passive:true});
    document.addEventListener('touchcancel',()=>{ if(s && !s.menu)settle(false); },{capture:true,passive:true});
    // Tap outside the prompt = cancel.
    document.addEventListener('pointerdown',e=>{
      if(s && s.menu && !e.target.closest('#swipeSplitMenu')){e.stopPropagation();settle(false);}
    },true);
    // Trackpad: a sideways two-finger swipe moves one column (no drag preview).
    let push=0,pushAt=0,lockUntil=0;
    document.addEventListener('wheel',e=>{
      if(!active() || e.ctrlKey || e.metaKey || Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
      const now=Date.now();
      if(now<lockUntil)return;
      if(now-pushAt>300)push=0;
      pushAt=now; push+=e.deltaX;
      if(Math.abs(push)>160){
        const next=neighbor(push>0 ? 1 : -1);
        push=0; lockUntil=now+700;
        if(next)applyWorkspaceView([next]);
      }
    },{capture:true,passive:true});
  }
  initColumnResizers();
  initWorkspaceHorizontalSwipe();
  initPeekSwipe();
  initSingleSwipe();
  initFocusMode();
  loadWorkspace();
</script>
