  /* =========================================================

  const esc = s =>
    String(s ?? '').replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
  function formatDate(s,yy){
    // "Sunday November 1, 2026" — no comma after the weekday (Julius, 2026-10-29). yy: "…, 26" (History, 2026-11-07).
    const d = new Date(s + 'T00:00:00');
    const wk = d.toLocaleDateString('en-US',{weekday:'long'});
    const mon = d.toLocaleDateString('en-US',{month:'long'});
    return wk + ' ' + mon + ' ' + d.getDate() + ', ' + (yy ? String(d.getFullYear()).slice(-2) : d.getFullYear());
  }
  // Narrow panes use "Sat Oct 31, 2026" so the date stays on one line (Julius, 2026-10-31).
  function formatDateShort(s,yy){
    const d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString('en-US',{weekday:'short'}) + ' ' + d.toLocaleDateString('en-US',{month:'short'}) + ' ' + d.getDate() + ', ' + (yy ? String(d.getFullYear()).slice(-2) : d.getFullYear());
  }
  // Weekday icon right of the date in Today headers (Julius, 2026-10-31): Sun=sun, Mon=moon,
  // Tue=fire, Wed=water, Thu=wood, Fri=gold, Sat=earth. The PNG (WeekdayIcons.html) is used as a
  // mask filled with the day's own color (--note-line-adj: Saturday = dirt brown), text height.
  const WD_RATIO = [187/187,186/195,169/202,157/207,174/234,225/126,245/152]; // width / height per PNG
  function wdIconHtml(s){
    const d = new Date(s + 'T00:00:00').getDay(), src = (window.WD_ICON_URL || [])[d];
    if(!src) return '';
    const m = 'url(' + src + ')';
    return '<span class="wd-icon" aria-hidden="true" style="width:' + (0.9 * WD_RATIO[d]).toFixed(3) + 'em;-webkit-mask-image:' + m + ';mask-image:' + m + '"></span>';
  }
  function setStatus(s){
    const status=document.getElementById('status');
    const focusStatus=document.getElementById('focusStatus');
    if(status){ status.textContent=s; status.classList.toggle('st-tap', /tap here/i.test(s)); } // pill is click-through unless it offers a tap (UI batch 2026-11-21)
    if(focusStatus) focusStatus.textContent=s;
    // Fades out (2026-11-22, Julius: "whatever happened last just stays there"): done messages go after 2.5 s, an undo
    // offer after 8 s; in-progress (Saving…) and problems (not saved, retrying, conflict) stay until replaced.
    clearTimeout(setStatus.t);
    if(status) status.classList.remove('st-gone');
    const msg = String(s || '');
    const sticky = !msg || /…|\.\.\.|not saved|didn.t|couldn.t|could not|can.t|retry|conflict|error|fail|offline|database off|keep this/i.test(msg);
    if(!sticky) setStatus.t = setTimeout(() => {
      if(status) status.classList.add('st-gone');
      setTimeout(() => { if(status && status.classList.contains('st-gone') && status.textContent === msg){ status.textContent = ''; status.classList.remove('st-gone','st-tap'); } }, 400);
      if(focusStatus && focusStatus.textContent === msg) focusStatus.textContent = '';

  }
  function storedToHtml(v){
    if(!v){
      return '';
    }
    if(/<([a-z][\s\S]*?)>/i.test(v)){
      return v;
    }
    return esc(v).replace(/\n/g,'<br>');

  function dateObj(s){
    return new Date(s + 'T00:00:00');
  }
  function addDays(s,n){
    const d = dateObj(s);
    d.setDate(
      d.getDate() + n
    );
    return d.toISOString().slice(0,10);
  }
  function mergeDays(newDays){
    const map = new Map(
      state.days.map(d => [d.date,d])
    );
    newDays.forEach(
      d => { map.set(d.date,d); fwSetDayBase(d, false); noteUrgentDay(d.date,d.tasks,false); noteUrgentDay(d.date,d.journal,false,'journal'); }
    );
    renderUrgent();
    state.days = [
      ...map.values()
    ].sort(
      (a,b) => a.date.localeCompare(b.date)
    );
  }
  function editableFocused(){
    const el = document.activeElement;
    return !!(el && el.isContentEditable);
  }
  /* Take focus off the cell being edited, so a button that does not need

  function releaseEditor(){

  /* =========================================================
     LOAD
     ========================================================= */
  function applyWorkspaceData(data){
    state = data;

    (state.reference || []).forEach(refBase);
    refPins = new Set((data.refPins || []).map(String));

      state.days=state.days.filter(d=>d.date>=from && d.date<=to);

    { const placeAi = () => typeof tsecPlaceAi === 'function' ? tsecPlaceAi() : setTimeout(placeAi,100); setTimeout(placeAi,0); } // lives in a later <script>

  // Speed timing (2026-11-04): sent after drawing, so it can't slow the load. See logSpeed in Code.gs.
  let fwSaveSamples=[],fwSaveSampleSeq=0,fwSpeedReportSeq=0;
  const fwSaveSampleSession=window.crypto?.randomUUID?.() || Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
  function fwObserveSave(kind,started,reply,error){
    const status=error?'error':reply?.deleted?'deleted':reply?.conflict||reply?.conflictT||reply?.conflictJ||reply?.metaConflicts?.length?'conflict':reply&&typeof reply==='object'?'ok':'unknown';
    fwSaveSamples.push({sampleId:fwSaveSampleSession+'-'+(++fwSaveSampleSeq),kind,rpcMs:Math.max(0,Math.round(performance.now()-started)),status,

    if(fwSaveSamples.length>50)fwSaveSamples.splice(0,fwSaveSamples.length-50);

  function fwSendSpeed(kind,timing,client){
    const batch=fwSaveSamples.slice(),sent=new Set(batch.map(s=>s.sampleId));
    // Created once per submitted measurement; transport retries carry the same ID.
    const reportId=fwSaveSampleSession+'-report-'+(++fwSpeedReportSeq);
    google.script.run.withSuccessHandler(()=>{fwSaveSamples=fwSaveSamples.filter(s=>!sent.has(s.sampleId));})
      .withFailureHandler(()=>{}).logSpeed(kind,timing,{...client,reportId,saveTimings:batch});
  }
  function fwSpeedContext(extra){
    return Object.assign({pageBuild:window.__FW_BUILD__ || '',pageRelease:window.__FW_RELEASE__ || '',
      w:window.innerWidth,visibility:document.visibilityState},extra || {});
  }
  /* Reload diagnosis (2026-11-21, Julius: "I put it away 5 min, come back, the whole thing refreshes"). Remember when
     the page was last hidden and how often it came back WITHOUT reloading; each load's Speed Log row then says how it
     started: start = 'returned' (a reload within 2 h of being put away → the phone discarded the page) or 'fresh'. */
  const fwStartInfo = (() => { let hid = 0, res = 0;
    try { hid = Number(localStorage.getItem('fw.hiddenAt')) || 0; res = Number(localStorage.getItem('fw.resumes')) || 0; localStorage.setItem('fw.resumes', '0'); } catch (e) {}
    const away = hid ? Math.round((Date.now() - hid) / 1000) : null;
    return { start: away != null && away < 7200 ? 'returned' : 'fresh', awaySec: away, discarded: !!document.wasDiscarded, resumesBefore: res };
  })();
  document.addEventListener('visibilitychange', () => { try {
    if(document.visibilityState === 'hidden') localStorage.setItem('fw.hiddenAt', String(Date.now()));
    else { localStorage.setItem('fw.resumes', String((Number(localStorage.getItem('fw.resumes')) || 0) + 1)); localStorage.removeItem('fw.hiddenAt'); }
  } catch (e) {} });
  window.addEventListener('pagehide', () => { try { localStorage.setItem('fw.hiddenAt', String(Date.now())); } catch (e) {} });
  /* ONE CALM RETURN (2026-11-21, speed item M). Coming back to the page used to fire ~12 refreshers at the same moment.
     Each module now registers fwResume.add(name, run, last) and this one queue runs them in ORDER, one every GAP ms,
     skipping any refreshed < 60 s ago (last() = the module's own last-refresh time; without it, or while it is 0, when
     the queue last ran it, starting at page load). Stops when the page is hidden again. Saves on hide stay in each module (never queued).
     Speed Log kind 'resume' (only when something ran): ran, skipped, awaySec, stopped, ms. Details: docs/NOTES.md → "One calm return". */
  window.fwResume = (() => {
    const ORDER = ['sync','calendar','timer','blocks','nextSteps','kim','reference','newThings','fun','weather'];
    const GAP = 350, FRESH = 60000, jobs = {};
    let timer = 0, running = false, hiddenAt = 0, finish = null;
    const pos = n => { const i = ORDER.indexOf(n); return i < 0 ? ORDER.length : i; };
    function add(name, run, last){ jobs[name] = {run, last, ranAt: Date.now()}; }
    function stop(){ clearTimeout(timer); if(running && finish) finish(true); running = false; }
    function start(){
      if(running) return;
      running = true;
      const list = Object.keys(jobs).sort((a,b) => pos(a) - pos(b)), ran = [], skipped = [], t0 = performance.now();
      const awaySec = hiddenAt ? Math.round((Date.now() - hiddenAt) / 1000) : null;
      const done = finish = stopped => {
        running = false; finish = null;
        const r = {ran, skipped, awaySec, stopped, ms: Math.round(performance.now() - t0), at: Date.now()};
        window.__FW_RESUME_LAST = r;
        if(ran.length && typeof fwSendSpeed === 'function' && window.google && google.script) try{ fwSendSpeed('resume', {total: r.ms, steps: {}}, fwSpeedContext(r)); }catch(e){}
      };
      const step = i => {
        if(document.visibilityState !== 'visible') return done(true);
        if(i >= list.length) return done(false);
        const n = list[i], j = jobs[n];
        let at = j.ranAt; if(j.last) try{ at = Number(j.last()) || j.ranAt; }catch(e){} // 0 = never loaded → queue time
        if(Date.now() - at < FRESH){ skipped.push(n); return step(i + 1); }
        j.ranAt = Date.now(); ran.push(n);
        try{ j.run(); }catch(e){ try{ console.error('fwResume ' + n, e); }catch(_){} }
        timer = setTimeout(() => step(i + 1), GAP);
      };
      step(0);
    }
    document.addEventListener('visibilitychange', () => {
      if(document.visibilityState === 'visible') setTimeout(start, 0); else { hiddenAt = Date.now(); stop(); }
    });
    return {add, start, stop, ORDER, GAP, FRESH, get jobs(){ return Object.keys(jobs); }};
  })();
  /* Instant screen numbers for the Speed Log (2026-11-21), all ms since the page started opening:
     screen = when something useful was on screen (the saved picture, else the live draw); snap = shown / none /
     old / width / late / nostore / embedded; snapMs, reqMs (data asked), dataMs (data arrived), liveMs, snapAgeSec, snapKb. */
  function fwSnapInfo(liveMs){
    const S = window.__FW_SNAP || {};
    return { snap: S.state || 'none', snapMs: S.snapAt != null ? S.snapAt : null, reqMs: S.reqAt != null ? S.reqAt : null,
      dataMs: S.dataAt != null ? S.dataAt : null, liveMs: liveMs, screen: S.snapAt != null ? Math.min(S.snapAt, liveMs) : liveMs,
      snapAgeSec: S.ageSec != null ? S.ageSec : null, snapKb: S.kb != null ? S.kb : null };
  }
  function fwSpeedLog(kind,timing,t0){
    if(!timing) return;
    const render = Math.round(performance.now() - t0);
    setTimeout(() => {
      const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};
      const client = fwSpeedContext({ render: render, drawEnd:Math.round(t0 + render), frameFirstByte: Math.round(nav.responseStart || 0), frameDone: Math.round(nav.responseEnd || 0),
        dom: Math.round(nav.domContentLoadedEventEnd || 0), ready: Math.round(performance.now()),
        navType: nav.type || '', ...(kind === 'load' ? fwStartInfo : {}), ...(kind === 'load' ? fwSnapInfo(Math.round(t0 + render)) : {}) });
      setStatus('Ready · screen ' + (client.screen != null ? (client.screen / 1000).toFixed(1) + 's · ' : '') + 'server ' + (timing.total / 1000).toFixed(1) + 's · draw ' + (render / 1000).toFixed(1) + 's');
      fwSendSpeed(kind,timing,client);
    },1500);
  }
  function loadWorkspace(){
    const initial = window.__FW_INITIAL__;
    window.__FW_INITIAL__ = null;
    if(initial && Array.isArray(initial.days) && initial.today){
      const t0 = performance.now();
      applyWorkspaceData(initial);
      fwSpeedLog('load',initial.timing,t0);
      return;
    }
    // Instant screen (2026-11-21): the early script already asked for the data; use its answer.
    const S = window.__FW_SNAP || {};
    const useLive = d => {
      if(!(d && Array.isArray(d.days) && d.today)) return false;
      const t0 = performance.now();
      applyWorkspaceData(d);
      fwSpeedLog('load',d.timing,t0);
      return true;
    };
    const fallback = () => google.script.run
      .withSuccessHandler(d => { if(!useLive(d)){ setStatus('Load error: no data'); if(window.fwSnapFail) fwSnapFail('no data'); } })
      .withFailureHandler(e => {
        setStatus(
          'Load error: ' +
          e.message
        );
        if(window.fwSnapFail) fwSnapFail(e && e.message);
      })
      .getWorkspaceData({fast:true,page:true});
    const fromEarly = () => { S.cb = null; const d = S.data; S.data = null; if(!useLive(d)) fallback(); }; // one retry
    if(S.reqAt){ if(S.got) fromEarly(); else S.cb = fromEarly; return; }
    fallback();
  }
  /* =========================================================
     DAYS
     ========================================================= */

    const left =
      document.getElementById('todayScroll');
    const right =

      (a,b) =>
        a.date.localeCompare(b.date)
    );
    state.days.forEach(day => {
      appendDayRow(
        day,
        left,

      );
      appendDayRow(
        day,
        right,

      );

      syncDayHeights();
      syncDailyScroll();
      updateVisibleDate();
      if(window.odApply) odApply();
      if(window.applyDayLines) applyDayLines();
    });
  }
  // Starter lines for a new day's Make sure you do (Julius, 2026-11-01). Edit here to change the defaults.
  const MUST_DEFAULTS = ['Hydration 64 oz: T: 0/64 |','On waking · Drink a glass of water','10K steps','Morning · Stretch','Hygiene','Medicine','Supplements','Before bed · Stretch','Read 10+ pages: T: 0/10 |','Meditate'];
  // Drink tokens are the editable source of truth; the displayed total is derived.
  function hydrationDrink(value){
    const m = String(value || '').trim().match(/^(\d+(?:\.\d+)?)\s*(?:oz\s*|ounces?\s*(?:of\s*)?)?(water|coffee|tea|milk|other|w|c|m|o)?$/i);
    if(!m || !Number.isFinite(Number(m[1])) || Number(m[1]) <= 0 || Number(m[1]) > 256) return null;
    const names = {water:'W',coffee:'C',tea:'Tea',milk:'M',other:'O',w:'W',c:'C',m:'M',o:'O'};
    return {oz:Number(m[1]),kind:names[(m[2] || 'water').toLowerCase()] || 'Tea'};
  }
  function hydrationText(text,reset){
    const value = String(text || '').trim();
    const m = value.match(/^(?:Hydration\s+|Drink\s+)(\d+(?:\.\d+)?)\s*(?:oz|ounces)(?:\s+(?:of\s+)?water)?\s*:/i) || value.match(/^Drink\s+(\d+(?:\.\d+)?)\s*oz\s+water\s*$/i);

  /* =========================================================

  function rememberSelection(ed){

  function captureBeforeEdit(el){

  function redoEditor(el){

  // Canonical task markup is shared by loaded content, copy/cut and paste.
  // Browser clipboards can omit a row wrapper or introduce nested block tags.
  function normalizeEditorTasks(root, wire = true){
    root.querySelectorAll('input[type=checkbox]').forEach(cb => {
      if(cb.closest('pre')) return;
      if(cb.closest('.check-line')) return;
      let container = cb.parentElement;
      if(container === root || container.tagName === 'SPAN' && !container.classList.contains('check-text')){
        const row = root.ownerDocument.createElement('div');
        cb.before(row); row.appendChild(cb);
        const sibling = row.nextSibling;
        if(sibling?.nodeType === 1 && sibling.classList.contains('check-text')) row.appendChild(sibling);
        else while(row.nextSibling && (row.nextSibling.nodeType === 3 || row.nextSibling.nodeType === 1 && /^(SPAN|B|STRONG|I|EM|U|S|DEL|CODE)$/.test(row.nextSibling.tagName))) row.appendChild(row.nextSibling);
        container = row;
      }
      if(container.tagName !== 'DIV'){
        const row = root.ownerDocument.createElement('div');
        while(container.firstChild) row.appendChild(container.firstChild);
        container.replaceWith(row); container = row;
      }
      container.classList.remove('check-text');
      container.classList.add('check-line');
    });
    // Undo old pastes that nested a task inside another task's text.
    [...root.querySelectorAll('.check-text .check-line')].reverse().forEach(line => {
      const parent = line.parentElement.closest('.check-line');
      if(parent) parent.after(line);
    });
    root.querySelectorAll('.check-line').forEach(line => {
      line.classList.remove('check-text');
      const cb = line.querySelector('input[type=checkbox]');
      if(!cb){ line.classList.remove('check-line','done','task-struck'); return; }
      let text = [...line.children].find(n => n.classList.contains('check-text'));
      if(!text){ text = root.ownerDocument.createElement('span'); text.className = 'check-text'; }
      // Keep all selected text and inline formatting in a single flex item.
      const nodes = [...line.childNodes];
      for(const node of nodes){
        if(node === cb || node === text) continue;
        if(node.nodeType === 1 && node.classList.contains('check-text')){
          while(node.firstChild) text.appendChild(node.firstChild); node.remove();
        }else text.appendChild(node);
      }
      line.prepend(cb); line.appendChild(text);
      const level = Math.min(6,Math.max(0,Math.floor(Number(line.dataset.level) || 0)));
      line.dataset.level = String(level);
      // Clipboard presentation must not override the editor's task geometry.
      for(const node of [line,text,cb]){
        for(const name of ['display','width','height','max-width','padding','padding-left','text-indent','white-space','vertical-align','margin-left']) node.style.removeProperty(name);
      }
      line.style.marginLeft = level ? `${level * 24}px` : '';
      cb.toggleAttribute('checked',cb.checked);
      line.classList.toggle('done',cb.checked);
      if(!text.firstChild) text.appendChild(root.ownerDocument.createElement('br'));
      if(wire) wireCheckbox(cb);
    });
    syncCompletionAppearance(root);
  }

  function syncCompletionAppearance(root){
    root.querySelectorAll('.done').forEach(node => {
      const cb = node.classList.contains('check-line') ? node.querySelector('input[type=checkbox]') : null;
      node.classList.toggle('done',!!cb?.checked);
    });
    root.querySelectorAll('[style],.check-text').forEach(node => {
      // Strip only the app's generated completion paint; bold, underline,
      // highlights and independent strike formatting remain intact.
      const color = node.style.color.replace(/\s/g,'').toLowerCase();
      if(['#666','#666666','rgb(102,102,102)','var(--done)'].includes(color)) node.style.removeProperty('color');
      if(node.style.opacity === '0.82' || node.style.opacity === '.82') node.style.removeProperty('opacity');
      if(node.classList.contains('check-text') && !node.closest('.check-line')) node.classList.remove('check-text');
    });
  }

  function toggleTaskStrike(el){
    const sel = window.getSelection();
    if(!sel?.rangeCount || !el.contains(sel.anchorNode) || !el.contains(sel.focusNode)) return;
    const range = sel.getRangeAt(0);
    const tasks = [...el.querySelectorAll('.check-line')].filter(line => {
      if(sel.isCollapsed) return line.contains(sel.anchorNode);
      return range.intersectsNode(line);
    });
    captureBeforeEdit(el);
    if(tasks.length){
      const strike = !tasks.every(line => line.classList.contains('task-struck'));

      document.execCommand('strikeThrough');

  function currentCodeBlock(el){
    const node = window.getSelection()?.anchorNode;
    const element = node?.nodeType === 3 ? node.parentElement : node;

  function insertCodeText(el,text){

  function handleCodeEnter(el){

      prefix.setEnd(range.startContainer,range.startOffset);

    const block = document.createElement('pre'); block.className = 'code-block';
    if(fence[1]) block.dataset.language = fence[1];

    const caret = document.createRange(); caret.setStart(block,0); caret.collapse(true);
    sel.removeAllRanges(); sel.addRange(caret);

  function handleCodeKey(e,el){
    if(e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return false;

      const paragraph=document.createElement('p'); paragraph.innerHTML='<br>';
      pre.replaceWith(paragraph); placeEnd(paragraph);
      finishEditorEdit(el); saveEditorOwner(el);

    if(e.key === 'Enter' && handleCodeEnter(el)){e.preventDefault();return true;}
    if(e.key === 'Tab' && currentCodeBlock(el)){
      e.preventDefault();

  function escapeHtml(text){

  function structuredClipboardTextFromRange(range){
    const fragment = range.cloneContents();
    const wrapper = document.createElement('div');
    wrapper.appendChild(fragment);
    const codeTokens = new Map();
    wrapper.querySelectorAll('pre').forEach((pre,index) => {
      const token = '\uE000FWCODE' + index + '\uE001';
      codeTokens.set(token,'```' + (pre.dataset.language || '') + '\n' + pre.textContent + '\n```');
      const row = document.createElement('div'); row.textContent = token; pre.replaceWith(row);
    });

    /* Convert visual checkbox rows into portable text before reading textContent.
       Native <input type=checkbox> elements contribute no [ ]/[x] text by themselves. */
    wrapper.querySelectorAll('.check-line').forEach(line => {
      const level = Math.max(0, Math.min(6, Number(line.dataset.level || 0)));
      const checkbox = line.querySelector('input[type=checkbox]');
      const text = line.querySelector('.check-text');
      const prefix = '    '.repeat(level) + (checkbox?.checked ? '[x] ' : '[ ] ');
      /* Keep the replacement as a block-level row so copied tasks keep their own lines. */
      const replacement = document.createElement('div');
      replacement.textContent = prefix + (text?.textContent || '');

    wrapper.querySelectorAll('br').forEach(br => br.replaceWith('\n'));

    });

    let result = (wrapper.textContent || '')
      .replace(/\r\n?/g, '\n')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/\n{2,}/g, '\n')
      .replace(/^\n+|\n+$/g, '');

  function copyStructuredText(e, el, cutting = false){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !el.contains(sel.anchorNode) || !el.contains(sel.focusNode) || sel.isCollapsed){

    const range = sel.getRangeAt(0);

    // checkbox was selected, so it cannot become a separate pasted line.
    if(task && wrapper.querySelector('input[type=checkbox]') && !wrapper.querySelector('.check-line')){
      const row = task.cloneNode(false);
      while(wrapper.firstChild) row.appendChild(wrapper.firstChild);
      wrapper.appendChild(row);

      const decorations = new Set();

      cb.toggleAttribute('checked', cb.checked);

      captureBeforeEdit(el);
      range.deleteContents();
      range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
      normalizeEditorTasks(el);
      finishEditorEdit(el);
      rememberSelection(el);
      saveEditorOwner(el);
    }
  }

  function removeClipboardCellBackgrounds(wrapper){
    [wrapper,...wrapper.querySelectorAll('*')].forEach(node => {
      const color = node.style.backgroundColor.replace(/\s/g,'').toLowerCase();
      const block = /^(DIV|P|H[1-6]|BLOCKQUOTE|UL|OL|LI|TABLE|TR|TD|TH)$/.test(node.tagName);

        node.style.removeProperty('background');
        node.style.removeProperty('background-color');

  function sanitizeClipboardHtml(html){
    // Parse in an inert document; retain text formatting, never scripts or handlers.
    const doc = new DOMParser().parseFromString(String(html), 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta,base,svg,math,template').forEach(n => n.remove());
    const tags = new Set('span div p br b strong i em u s strike del sub sup mark small big font h1 h2 h3 h4 h5 h6 ul ol li blockquote pre code a hr table thead tbody tfoot tr th td caption colgroup col img input'.split(' '));
    const styles = new Set('font-family font-size font-weight font-style font-variant color background-color text-decoration text-decoration-line text-decoration-color text-decoration-style text-align text-indent line-height letter-spacing word-spacing white-space vertical-align margin-left padding-left list-style-type border-collapse border border-color border-style border-width padding width height max-width'.split(' '));
    const safeUrl = (value, image=false) => {
      try{
        const url = new URL(value); // Do not resolve relative URLs against the app.
        return image ? ['https:','http:'].includes(url.protocol) || /^data:image\/(png|jpeg|gif|webp);base64,/i.test(value)
          : ['https:','http:','mailto:','tel:'].includes(url.protocol);
      }catch(_){ return false; }
    };
    Array.from(doc.body.querySelectorAll('*')).forEach(node => {
      const tag = node.localName;
      if(!tags.has(tag)){
        node.replaceWith(...node.childNodes);
        return;
      }
      if(tag === 'input' && node.getAttribute('type')?.toLowerCase() !== 'checkbox'){
        node.remove(); return;
      }
      const keep = {};
      const cleanStyle = document.createElement('span').style;
      for(const name of Array.from(node.style)){
        const value = node.style.getPropertyValue(name);
        if(styles.has(name) && !/url\s*\(|expression\s*\(|@import|[<>]/i.test(value)) cleanStyle.setProperty(name, value);
      }
      if(cleanStyle.cssText) keep.style = cleanStyle.cssText;
      const classes = ['check-line','check-text','done','task-struck','code-block'].filter(c => node.classList.contains(c));
      if(classes.length) keep.class = classes.join(' ');
      if(node.classList.contains('check-line')){
        const level = Math.max(0, Math.min(6, Math.floor(Number(node.dataset.level) || 0)));
        keep['data-level'] = String(level);
        if(/^[123]$/.test(node.dataset.urg || '')) keep['data-urg'] = node.dataset.urg;
        if(/^[a-z]{2,12}$/.test(node.dataset.cat || '')) keep['data-cat'] = node.dataset.cat;
        if(/^\d{4}-\d{2}-\d{2}$/.test(node.dataset.due || '')) keep['data-due'] = node.dataset.due;
        if(durMin(node.dataset.dur)) keep['data-dur'] = String(durMin(node.dataset.dur));
        {
          const ml = lineMetaLabel(keep['data-due'],keep['data-dur']);
          if(ml) keep['data-due-label'] = ml;
        }
        cleanStyle.marginLeft = level ? `${level * 24}px` : '';
        keep.style = cleanStyle.cssText;
      }
      if(tag === 'pre'){
        keep.class = 'code-block';
        if(/^[\w+-]{1,30}$/.test(node.dataset.language || '')) keep['data-language'] = node.dataset.language;
      }
      if(tag === 'input'){
        keep.type = 'checkbox';
        if(node.hasAttribute('checked')) keep.checked = '';
      }
      if(tag === 'a' && safeUrl(node.getAttribute('href') || '')){
        keep.href = node.getAttribute('href'); keep.target = '_blank'; keep.rel = 'noopener noreferrer';
      }
      if(tag === 'img'){

      for(const attr of Array.from(node.attributes)) node.removeAttribute(attr.name);
      for(const [name,value] of Object.entries(keep)) node.setAttribute(name,value);

    normalizeEditorTasks(doc.body, false);
    return doc.body.innerHTML;
  }

  function pasteRichClipboard(e, el){
    const clipboard = e.clipboardData || window.clipboardData;
    if(!clipboard) return; // Allow native paste if clipboard access is unavailable.
    let html = '', text = '';
    try{ html = clipboard.getData('text/html'); }catch(_){}
    try{ text = clipboard.getData('text/plain'); }catch(_){}
    if(!text) try{ text = clipboard.getData('Text'); }catch(_){}
    if(!html && !text) return;
    activeEditor = el;
    if(currentCodeBlock(el)){
      e.preventDefault();
      insertCodeText(el,text || new DOMParser().parseFromString(html,'text/html').body.textContent || '');
      return;
    }
    if(!html && /(?:^|\n)\s*```/.test(text)){
      e.preventDefault(); pasteStructuredText(el,text); return;
    }
    if(html){
      const clean = sanitizeClipboardHtml(html);
      if(clean && insertClipboardHtml(el, clean)){
        e.preventDefault();
        return;
      }
    }
    if(text){
      e.preventDefault();
      pasteStructuredText(el, text);
    }
  }

  function insertClipboardHtml(el, html){
    const selection = window.getSelection();
    let range = selection?.rangeCount ? selection.getRangeAt(0) : null;
    const inside = r => r && el.contains(r.startContainer) && el.contains(r.endContainer);
    if(!inside(range)) range = inside(savedRange) ? savedRange.cloneRange() : null;
    if(!range) return false;
    captureBeforeEdit(el);
    el.focus({preventScroll:true});
    const fragment = range.createContextualFragment(html);
    const hasBlocks = !!fragment.querySelector('div,p,h1,h2,h3,ul,ol,pre,blockquote,.check-line');
    range.deleteContents();
    const anchor = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
    // Block tasks must be siblings of the destination task, never children of
    // its flex text span. Split the surrounding line and preserve both halves.
    let block = anchor.closest?.('.check-line,p,h1,h2,h3,blockquote,li');
    if(!block){
      let candidate = anchor;
      while(candidate && candidate.parentElement !== el) candidate = candidate.parentElement;
      if(candidate && candidate !== el && candidate.tagName === 'DIV') block = candidate;
    }
    if(hasBlocks && block && block !== el && el.contains(block)){
      const tailRange = document.createRange();
      tailRange.selectNodeContents(block);
      tailRange.setStart(range.startContainer,range.startOffset);
      const tail = block.cloneNode(false);
      tail.removeAttribute('data-tid'); // a split-off line is a new task, not a mirror (2026-11-01)
      tail.appendChild(tailRange.extractContents());
      const task = block.classList.contains('check-line');
      const originalCheckbox = block.querySelector('input[type=checkbox]') || tail.querySelector('input[type=checkbox]');
      if(task && originalCheckbox){
        const text = tail.querySelector('.check-text') || document.createElement('span');
        text.className = 'check-text';
        if(!tail.contains(text)) tail.appendChild(text);
        if(!tail.querySelector('input[type=checkbox]')) tail.prepend(originalCheckbox.cloneNode(true));
      }
      const meaningful = node => !!node.textContent.trim() || !!node.querySelector('img,pre');
      let insertion = block;
      const keepHead = meaningful(block);
      const keepTail = meaningful(tail);
      if(keepTail) block.after(tail);

      insertion.after(fragment);
      if(!keepHead) block.remove();
      if(lastNode){ range.setStartAfter(lastNode); range.collapse(true); }
    }else{
      const lastNode = fragment.lastChild;
      if(!lastNode) return false;
      range.insertNode(fragment);
      range.setStartAfter(lastNode); range.collapse(true);

    selection.removeAllRanges(); selection.addRange(range);
    normalizeEditorTasks(el);
    finishEditorEdit(el);
    rememberSelection(el);
    saveEditorOwner(el);
    return true;
  }

  function pasteStructuredText(el, text){
    const normalized = String(text || '').replace(/\r\n?/g,'\n');
    if(!/^[ \t]*(?:\[\]|\[ \]|\[[xX]\]|```)(?:\s|$|[\w+-])/m.test(normalized)){
      document.execCommand('insertText',false,normalized);
      return;

    const lines = normalized.split('\n');
    let html = '', code = null, language = '';
    const flushCode = () => {
      html += '<pre class="code-block"' + (language ? ' data-language="' + escapeHtml(language) + '"' : '') + '>' + escapeHtml(code.join('\n')) + '</pre>';
      code = null;
    };
    for(const line of lines){
      if(code !== null){
        if(/^\s*```\s*$/.test(line)) flushCode(); else code.push(line);
        continue;
      }
      const fence = line.match(/^\s*```([\w+-]*)\s*$/);
      if(fence){ code = []; language = fence[1]; continue; }
      const match = line.match(/^([ \t]*)(\[\]|\[ \]|\[[xX]\])(?:[ \t]+)?(.*)$/);
      if(match){
        const columns = [...match[1]].reduce((n,ch) => n + (ch === '\t' ? 4 : 1),0);
        const level = Math.min(6,Math.floor(columns / 4));
        const checked = /^\[[xX]\]$/.test(match[2]);
        html += `<div class="check-line${checked ? ' done' : ''}" data-level="${level}" style="margin-left:${level * 24}px"><input type="checkbox"${checked ? ' checked' : ''}><span class="check-text">${escapeHtml(match[3])}</span></div>`;
      }else html += '<div>' + (line ? escapeHtml(line) : '<br>') + '</div>';
    }
    if(code !== null) flushCode();
    insertClipboardHtml(el,html);
  }
  function handleEditorKey(
    e,
    el,
    type
  ){
    const key=e.key.toLowerCase();
    if((e.metaKey || e.ctrlKey) && e.shiftKey && key === 'x'){
      e.preventDefault(); toggleTaskStrike(el); return;
    }
    if(handleCodeKey(e,el)) return;
    if((e.metaKey || e.ctrlKey) && key === 'z'){
      e.preventDefault();
      if(e.shiftKey) redoEditor(el); else undoEditor(el);
      return;
    }
    if(e.ctrlKey && !e.metaKey && key === 'y'){
      e.preventDefault();
      redoEditor(el);
      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      key === 'b'
    ){
      e.preventDefault();
      document.execCommand(
        'bold'
      );
      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      key === 'u'

      e.preventDefault();
      document.execCommand(
        'underline'
      );
      return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      rememberSelection(el);
      const line =
        getCurrentLine(el);
      if(line){
        changeIndent(
          line,
          e.shiftKey ? -1 : 1

      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      e.key === 'Enter' &&
      type === 'reference'

      e.preventDefault();
      addReferenceCell(
        activeRefId

      return;
    }

     * Enter on a checkbox creates another checkbox.
     *
     * Normal Enter:
     *   same indentation level.
     *
     * Shift+Enter:
     *   one level deeper, acting like a subtask.
     */
    if(e.key === 'Enter'){
      const currentLine = getCurrentLine(el);
      if(type === 'reference' && !e.shiftKey && currentLine && currentLine.tagName === 'H2'){
        e.preventDefault();
        captureBeforeEdit(el);
        const paragraph = document.createElement('p');
        paragraph.innerHTML = '<br>';
        currentLine.insertAdjacentElement('afterend', paragraph);
        placeEnd(paragraph);
        finishEditorEdit(el);
        saveEditorOwner(el);
        return;
      }
      const line =
        getCurrentLine(el);
      if(
        line &&
        line.classList.contains('check-line')

        e.preventDefault();

          line.querySelector(
            '.check-text'

         * Google-Docs-style list exit:

         * the checkbox and leaves a normal blank line.

         * Shift+Enter still creates an indented checkbox,
         * even if the current checkbox is empty.

        if(
          !e.shiftKey &&
          !(checkText?.textContent || '').trim()

            line

          return;

          Number(
            line.dataset.level || 0

          line.insertAdjacentElement('beforebegin',previous);
          placeCaretInsideCheckbox(previous.querySelector('.check-text'));
          finishEditorEdit(el);

  function getCurrentLine(root){
    const sel =
      window.getSelection();

      sel?.anchorNode;

      !n ||
      !root.contains(n)

    }
    if(n.nodeType === 3){
      n = n.parentElement;

    prefix.selectNodeContents(text);
    prefix.setEnd(selection.anchorNode,selection.anchorOffset);

  function changeIndent(

  /* Save whichever cell an edit happened in, and (for day cells) grow or shrink

  function saveEditorOwner(el){

    }
    if(el.id === 'scratchPad'){ el.dispatchEvent(new Event('input',{bubbles:true})); return; }
    if(el.classList && el.classList.contains('plan-editor')){ if(window.odPadSave) odPadSave(el.dataset.date); return; }
    if(el.classList && el.classList.contains('thought-editor')){ if(window.odThoughtSave) odThoughtSave(el.dataset.date); return; }
    if(el.classList && el.classList.contains('kim-editor')){ if(window.kimSave) kimSave(); return; }
    if(
      el.closest('.day-row')

      const date = el.dataset.date;
      scheduleDaySave(date);
      requestAnimationFrame(() => syncDayHeightStable(date));
    }else{
      const id =
        el.closest(
          '.ref-cell-wrapper'
        )?.dataset.id;
      if(id){
        saveRefFromDom(
          id
        );
      }
    }
  }
  /* =========================================================
     AUTO FORMATTING
     ========================================================= */
  function autoFormat(el){
    if(currentCodeBlock(el)) return;
    const sel =
      window.getSelection();
    if(
      !sel ||
      !sel.rangeCount ||
      !el.contains(sel.anchorNode)
    ){
      return;
    }
    let node =
      sel.anchorNode;
    let line =
      node.nodeType === 3
        ? node.parentElement
        : node;
    line =
      line?.closest(
        'p,div,li,h1,h2,h3,blockquote'
      );
    if(
      !line ||
      !el.contains(line) ||
      line.closest('.check-line,pre')
    ){
      return;
    }
    const text =
      line.textContent || '';
    /*
     * Checkbox. Accept both the compact form `[] task` and the
     * spaced clipboard form `[ ] task`, plus completed `[x] task`.
     */
    const checkboxMatch = text.match(/^([ \t]*)(\[\]|\[ \]|\[[xX]\])(?:[ \t]+)?(.*)$/);
    if(checkboxMatch){
      const indent = checkboxMatch[1] || '';
      let columns = 0;
      for(const ch of indent){
        columns += ch === '\t' ? 4 : 1;
      }
      const level = Math.max(0, Math.min(6, Math.floor(columns / 4)));
      const checked = /^\[[xX]\]$/.test(checkboxMatch[2]);
      const caretWas = checkCharOffset(line, sel.anchorNode, sel.anchorOffset);
      const caretAt = Math.max(0, (caretWas == null ? text.length : caretWas) - (text.length - (checkboxMatch[3] || '').length));
      const c = document.createElement('div');
      c.className = 'check-line' + (checked ? ' done' : '');
      c.dataset.level = String(level);
      c.style.marginLeft = level ? `${level * 24}px` : '';
      c.innerHTML =
        `<input type="checkbox"${checked ? ' checked' : ''}>` +
        '<span class="check-text"></span>';
      c.querySelector('.check-text').textContent = checkboxMatch[3] || '';
      if(line === el) el.replaceChildren(c); else line.replaceWith(c);
      wireCheckbox(c.querySelector('input'));
      // Empty task: a <br> gives the phone's cursor a spot inside the text, not before the box (2026-11-01, Julius).
      const taskText = c.querySelector('.check-text');
      if(!taskText.textContent) taskText.innerHTML = '<br>';
      placeCaretInsideCheckbox(taskText, caretAt);
      saveEditorOwner(el);
      return;
    }
    /*
     * Headings
     */
    if(
      /^#{1,3}\s/.test(text) &&
      !line.querySelector('input')
    ){
      if(el.classList.contains('ref-cell')){
        const paragraph = document.createElement('p');
        paragraph.textContent = text.replace(/^#{1,3}\s/,'');
        line.replaceWith(paragraph);
        placeEnd(paragraph);
        saveEditorOwner(el);
        return;
      }
      const n =
        (
          text.match(/^#+/)[0]
        ).length;
      const h =
        document.createElement(
          'h' + n
        );
      h.textContent =
        text.replace(
          /^#{1,3}\s/,
          ''
        );
      line.replaceWith(h);
      placeEnd(h);
      saveEditorOwner(el);
      return;
    }
    /*
     * Bullet
     */
    if(
      /^(?:[-*])\s/.test(text) &&
      !line.querySelector('input')
    ){
      const ul =
        document.createElement('ul');
      const li =
        document.createElement('li');
      li.textContent =
        text.replace(
          /^[-*]\s/,
          ''
        );
      ul.appendChild(li);
      line.replaceWith(ul);
      placeEnd(li);
      saveEditorOwner(el);
      return;
    }
    /*
     * Blockquote
     */
    if(
      /^>\s/.test(text) &&
      !line.querySelector('input')
    ){
      const q =
        document.createElement(
          'blockquote'
        );
      q.textContent =
        text.replace(
          /^>\s/,
          ''
        );
      line.replaceWith(q);
      placeEnd(q);
      saveEditorOwner(el);
    }
  }
  function createCheckboxLine(level = 0){
    const c =
      document.createElement('div');
    c.className =
      'check-line';
    c.dataset.level =
      String(

          0,
          Math.min(
            6,
            Number(level) || 0

        ? `${Number(c.dataset.level) * 24}px`
        : '';
    c.innerHTML =
      '<input type="checkbox">' +
      '<span class="check-text"></span>';
    wireCheckbox(
      c.querySelector('input')
    );
    return c;
  }
  function exitEmptyCheckbox(line){

  /* Checkbox cursor (2026-11-21, Julius; NOTES "F. Checkbox cursor"): an empty inline .check-text has no box, so the

  function buildSplitMirror(source,slot){
    const mirror=source.cloneNode(true);
    mirror.id='splitMirrorPane'+slot;
    mirror.dataset.splitMirror=String(slot);
    const sanitize=element=>{
      element.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
      element.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable','false'));
      element.querySelectorAll('input,button,select,textarea').forEach(el=>{el.disabled=true;el.removeAttribute('onclick');});
    };
    sanitize(mirror);
    mirror.setAttribute('aria-label','Read-only duplicate of '+source.id);
    document.getElementById('workspace').appendChild(mirror);
    // Start the duplicate at the same scroll position as the original.
    requestAnimationFrame(()=>{
      const from=[...source.querySelectorAll('.scroll')];
      [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ if(from[i]) el.scrollTop=from[i].scrollTop; });
    });
    let queued=false;
    const observer=new MutationObserver(()=>{
      if(queued || !mirror.isConnected)return;
      queued=true;
      requestAnimationFrame(()=>{
        queued=false;
        if(!mirror.isConnected)return;
        // Rebuilding the copy would otherwise reset its scroll to the first
        // (oldest) day on every keystroke made in the original.
        const keep=[...mirror.querySelectorAll('.scroll')].map(el=>el.scrollTop);
        const replacement=source.cloneNode(true);
        sanitize(replacement);
        mirror.replaceChildren(...Array.from(replacement.childNodes));
        [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ el.scrollTop=keep[i]||0; });
      });
    });
    observer.observe(source,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','checked','style']});
    splitMirrorObservers.push(observer);
    return mirror;

  function showUrgCal(anchor,value,onPick){

    let view = dateObj(value || today); view.setDate(1);
    const cal = document.createElement('div');
    cal.className = 'urg-cal';
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const btn = (text,cls,fn) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = cls; b.textContent = text;
      b.addEventListener('pointerdown',e => e.preventDefault());
      b.addEventListener('click',e => { e.stopPropagation(); fn(); });
      return b;
    };

      cal.innerHTML = '';
      const head = document.createElement('div'); head.className = 'uc-head';
      const label = document.createElement('span');
      label.textContent = view.toLocaleDateString(undefined,{month:'short',year:'numeric'});
      head.append(btn('‹','uc-nav',() => { view.setMonth(view.getMonth() - 1); draw(); }),label,
        btn('›','uc-nav',() => { view.setMonth(view.getMonth() + 1); draw(); }));
      const grid = document.createElement('div'); grid.className = 'uc-grid';
      ['S','M','T','W','T','F','S'].forEach(w => { const h = document.createElement('span'); h.className = 'uc-wd'; h.textContent = w; grid.appendChild(h); });
      for(let i = 0; i < view.getDay(); i++) grid.appendChild(document.createElement('span'));
      const d = new Date(view);
      while(d.getMonth() === view.getMonth()){
        const k = iso(d);
        grid.appendChild(btn(String(d.getDate()),'uc-day' + (k === today ? ' today' : '') + (k === value ? ' sel' : '') + (k < today ? ' past' : ''),() => { hideUrgCal(); onPick(k); }));
        d.setDate(d.getDate() + 1);

    else if(a.left - 6 - c.width >= 6) left = a.left - 6 - c.width;

    document.addEventListener('keydown',e=>{ if(e.key === 'Escape') closeAllMenus(null); },true);
  }
  /* Scroll guards: only real user scrolling counts as "scrolling", and the
     overflow:hidden containers around the day lists can never be scrolled by
     the browser (it does that to reveal the caret, which made the whole
     view slide while typing). */
  function initScrollGuards(){
    const mark = () => { lastUserScrollAt = Date.now(); };
    ['wheel','touchstart','touchmove'].forEach(type=>document.addEventListener(type,mark,{capture:true,passive:true}));
    document.addEventListener('keydown',e=>{
      if(['PageUp','PageDown','Home','End'].includes(e.key)) mark();
    },true);
    ['app','workspace','todayPane','journalPane','referencePane'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('scroll',()=>{ if(el.scrollTop) el.scrollTop = 0; },{passive:true});
    });
    window.addEventListener('scroll',()=>{ if(window.scrollY || window.scrollX) window.scrollTo(0,0); },{passive:true});
  }
  initOutsideClickClose();
  initScrollGuards();
  initWorkspaceView();
  initMobileEditing();
  function initWorkspaceHorizontalSwipe(){
    const workspace=document.getElementById('workspace');
    // Rely on native touch panning: forced preventDefault caused sticky diagonal swipes.
    // The workspace itself owns horizontal overflow; each pane owns vertical overflow.
    /* Drag empty pane headers to pan horizontally with a mouse. */
    let drag=null;
    workspace.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch' || e.button!==0 || !e.target.closest('.pane-header') ||
         e.target.closest('button,input,select,a,[data-jump-today]') || workspace.scrollWidth<=workspace.clientWidth+2 ||
         isSplitActive())return;
      drag={x:e.clientX,left:workspace.scrollLeft,end:wsAtEnd()};
      workspace.setPointerCapture(e.pointerId);
    });
    workspace.addEventListener('pointermove',e=>{
      if(!drag)return;
      const dx=e.clientX-drag.x;
      if(Math.abs(dx)>2)workspace.scrollLeft=drag.left-dx;
    });
    workspace.addEventListener('pointerup',e=>{ if(drag && drag.end && drag.x-e.clientX>80) tryFull(); drag=null; });
    ['pointercancel','lostpointercapture'].forEach(type=>workspace.addEventListener(type,()=>{drag=null;}));
    /* Full-screen calendar (2026-11-14, Julius): with the half-screen calendar showing (app slid all the way left),
       one more slide left opens the big calendar full screen. Only a slide that STARTS at the end counts, so a
       slide that just arrived there doesn't overshoot into it. */
    function wsAtEnd(){ return workspace.scrollLeft>=workspace.scrollWidth-workspace.clientWidth-2; }
    function tryFull(){ return !!(window.fwCalendar && window.fwCalendar.canFull && window.fwCalendar.canFull() && window.fwCalendar.openFull()); }
    let ts=null;
    workspace.addEventListener('touchstart',e=>{ ts=e.touches.length===1 && wsAtEnd() && !(e.target.closest && e.target.closest('#calMount')) ? {x:e.touches[0].clientX,y:e.touches[0].clientY,at:Date.now()} : null; },{passive:true});
    workspace.addEventListener('touchend',e=>{ const p=ts; ts=null; if(!p || !wsAtEnd()) return; const t=e.changedTouches[0], dx=t.clientX-p.x, dy=t.clientY-p.y;
      if(dx<-70 && Math.abs(dx)>Math.abs(dy)*1.5 && Date.now()-p.at<900) tryFull(); },{passive:true});
    /* Nested day/reference containers have overflow-x:hidden and consume
       macOS two-finger sideways gestures before they can reach #workspace.
       Capture from anywhere in the app and send just the horizontal motion
       to the shared workspace scroller. Vertical wheel movement remains native. */
    document.addEventListener('wheel',e=>{
      if(!document.getElementById('app').contains(e.target) ||
         isSplitActive() ||
         workspace.scrollWidth<=workspace.clientWidth+2 ||
         e.ctrlKey || e.metaKey)return;  // preserve trackpad pinch/browser zoom
      // On most trackpads a sideways swipe is deltaX. Shift+wheel is a
      // convenient alternative for ordinary mice and external keyboards.
      const shiftPan=e.shiftKey && Math.abs(e.deltaY)>Math.abs(e.deltaX);
      const amount=shiftPan ? e.deltaY : e.deltaX;
      if(Math.abs(amount)<.01)return;
      e.preventDefault();
      // Over the docked calendar: a sideways swipe changes the day instead (2026-11-13, Julius).
      // …unless this scroll started as an app slide (the calendar slid in under the pointer mid-gesture): keep sliding
      // until the wheel has been still for 250 ms (2026-11-14).
      const panning=Date.now()<(workspace.__panUntil||0);
      if(!panning && e.target.closest && e.target.closest('#calPanel.cp-docked #calMount') && window.fwCalSwipeDay){
        const now=Date.now(); if(now-(window.__cdAt||0)>250) window.__cdAcc=0; window.__cdAt=now; window.__cdAcc=(window.__cdAcc||0)+amount;
        if(Math.abs(window.__cdAcc)>60){ window.fwCalSwipeDay(window.__cdAcc>0?1:-1); window.__cdAcc=0; }
        return;
      }
      /* 2026-11-14 (Julius: "calendar does not appear on computer when I scroll right"): each wheel step set
         scrollLeft and the proximity snap pulled it straight back to the left. Snapping is off while the wheel moves
         and comes back ~160 ms after it stops (then it only pulls in when you stopped close to a half). */
      if(!panning){ workspace.__startEnd=wsAtEnd(); workspace.__endAcc=0; }
      if(amount>0 && workspace.__startEnd && wsAtEnd()){
        workspace.__endAcc=(workspace.__endAcc||0)+amount;
        if(workspace.__endAcc>150){ workspace.__endAcc=0; workspace.__startEnd=false; if(tryFull()) return; }
      }
      workspace.__panUntil=Date.now()+250;
      workspace.style.scrollSnapType='none';
      clearTimeout(workspace.__snapT);
      workspace.__snapT=setTimeout(()=>{ workspace.style.scrollSnapType=''; },160);
      workspace.scrollLeft+=amount;
    },{capture:true,passive:false});
  }
  /* Single-column swipe (Julius, 2026-10-27): with one column showing, swipe
     sideways to the neighbor in order — Today/Tasks ↔ Notes ↔ Reference, no
     wrap-around. The neighbor slides in under the finger. Hold still with the
     dividing line near the middle → quick prompt to split those two. */
  function initSingleSwipe(){
    const ws=document.getElementById('workspace');
    const active=()=>!isSplitActive() && visiblePanes.length===1;
    const neighbor=dir=>VIEW_PANES[VIEW_PANES.indexOf(visiblePanes[0])+dir]||null;
    const MID_LO=.3, MID_HI=.7, HOLD_MS=450;
    let s=null;
    const seamX=()=>s.dir>0 ? s.w+s.dx : s.dx;           // divider position in px
    const isMid=()=>{const f=seamX()/s.w; return f>=MID_LO && f<=MID_HI;};
    function begin(dir){
      const next=neighbor(dir);
      if(!next)return false;
      s.dir=dir; s.next=next;
      s.cur=colPaneEl(visiblePanes[0]);
      s.nextPane=colPaneEl(next);
      s.w=ws.clientWidth;
      s.nextPane.classList.remove('view-hidden');
      s.nextPane.classList.add('swipe-next');
      s.nextPane.style.width=s.w+'px';
      s.nextPane.style.left=(dir>0 ? s.w : -s.w)+'px';
      s.cur.classList.add('swipe-cur');
      s.seam=document.createElement('div'); s.seam.id='swipeSeam';
      ws.appendChild(s.seam);
      return true;
    }
    function paint(){
      const t='translateX('+s.dx+'px)';
      s.cur.style.transform=t; s.nextPane.style.transform=t;
      s.seam.style.transform='translateX('+seamX()+'px)';
      s.seam.classList.toggle('mid',isMid());
    }
    function cleanup(){
      if(!s)return;
      clearTimeout(s.hold);
      ws.classList.remove('swipe-anim');
      if(s.cur){s.cur.classList.remove('swipe-cur');s.cur.style.transform='';}
      if(s.nextPane){
        s.nextPane.classList.remove('swipe-next');
        s.nextPane.style.transform='';s.nextPane.style.left='';s.nextPane.style.width='';
        if(!visiblePanes.includes(s.next))s.nextPane.classList.add('view-hidden');
      }
      s.seam?.remove();
      document.getElementById('swipeSplitMenu')?.remove();
      s=null;
    }
    function settle(go){
      if(!s || !s.cur){cleanup();return;}
      ws.classList.add('swipe-anim');
      s.dx=go ? -s.dir*s.w : 0;
      paint();
      const next=s.next;
      setTimeout(()=>{cleanup(); if(go)applyWorkspaceView([next]);},190);
    }
    function armHold(){
      clearTimeout(s.hold);
      s.hold=setTimeout(()=>{ if(s && s.cur && !s.menu && isMid())openMenu(); },HOLD_MS);
    }
    function openMenu(){
      s.menu=true;
      try{navigator.vibrate && navigator.vibrate(15);}catch(e){}
      const [a,b]=s.dir>0 ? [visiblePanes[0],s.next] : [s.next,visiblePanes[0]];
      const ratio=Math.max(.2,Math.min(.8,seamX()/s.w));
      const short=n=>n==='today' ? 'Today' : PANE_LABELS[n];
      const m=document.createElement('div'); m.id='swipeSplitMenu';
      const item=(label,fn)=>{const btn=document.createElement('button');btn.type='button';btn.textContent=label;
        btn.addEventListener('click',e=>{e.stopPropagation();fn();});m.appendChild(btn);};
      const h=document.createElement('div');h.className='ssm-h';h.textContent='Split view?';m.appendChild(h);
      item('Split '+short(a)+' | '+short(b),()=>split(a,b,'horizontal',ratio));
      item('Split stacked '+short(a)+' / '+short(b),()=>split(a,b,'vertical',.5));
      item('Go to '+short(s.next),()=>settle(true));
      item('Cancel',()=>settle(false));
      document.body.appendChild(m);
      const r=ws.getBoundingClientRect(), mw=m.offsetWidth, mh=m.offsetHeight;
      m.style.left=Math.max(8,Math.min(window.innerWidth-mw-8,r.left+seamX()-mw/2))+'px';
      m.style.top=Math.max(8,r.top+(r.height-mh)/2)+'px';
    }
    function split(a,b,orientation,ratio){
      splitOptions.first=a; splitOptions.second=b; splitOptions.third='none'; splitOptions.orientation=orientation;
      try{localStorage.setItem(MOBILE_SPLIT_OPTIONS_KEY,JSON.stringify(splitOptions));}catch(e){}
      if(orientation==='horizontal'){
        mobileSplitRatio=ratio;
        try{localStorage.setItem(MOBILE_SPLIT_SIZE_KEY,String(ratio));}catch(e){}
      }
      cleanup();
      setSplit(true);
    }
    const skip=t=>!t || !document.getElementById('app').contains(t) ||
      t.closest('input,select,textarea,button,a,.view-menu-popup,#typeSettings,#swipeSplitMenu,.column-resizer');
    document.addEventListener('touchstart',e=>{
      if(s && s.menu)return;                     // waiting on the prompt
      cleanup();
      if(!active() || e.touches.length!==1 || skip(e.target))return;
      const p=e.touches[0];
      s={x:p.clientX,y:p.clientY,dx:0,lock:null,lastX:p.clientX};
    },{capture:true,passive:true});
    document.addEventListener('touchmove',e=>{
      if(!s || s.menu || e.touches.length!==1)return;
      const p=e.touches[0], dx=p.clientX-s.x, dy=p.clientY-s.y;
      if(!s.lock){
        if(Math.abs(dx)<10 && Math.abs(dy)<10)return;
        if(Math.abs(dx)<Math.abs(dy)*1.5 || (window.getSelection && String(window.getSelection()).length)){s=null;return;}
        if(!begin(dx<0 ? 1 : -1)){s=null;return;}   // nothing that way (e.g. left of Today)
        s.lock='h';
      }
      e.preventDefault();
      // Stay on the side we started toward; resist past the edges.
      s.dx=s.dir>0 ? Math.max(-s.w,Math.min(0,dx)) : Math.min(s.w,Math.max(0,dx));
      paint();
      if(Math.abs(p.clientX-s.lastX)>12){s.lastX=p.clientX;armHold();}
      else if(!s.hold)armHold();
    },{capture:true,passive:false});
    const end=()=>{
      if(!s || s.menu)return;
      if(!s.cur){s=null;return;}
      settle(Math.abs(s.dx)>s.w*.3);
    };
    document.addEventListener('touchend',end,{capture:true,passive:true});
    document.addEventListener('touchcancel',()=>{ if(s && !s.menu)settle(false); },{capture:true,passive:true});
    // Tap outside the prompt = cancel.
    document.addEventListener('pointerdown',e=>{
      if(s && s.menu && !e.target.closest('#swipeSplitMenu')){e.stopPropagation();settle(false);}
    },true);
    // Trackpad: a sideways two-finger swipe moves one column (no drag preview).
    let push=0,pushAt=0,lockUntil=0;
    document.addEventListener('wheel',e=>{
      if(!active() || e.ctrlKey || e.metaKey || Math.abs(e.deltaX)<=Math.abs(e.deltaY))return;
      const now=Date.now();
      if(now<lockUntil)return;
      if(now-pushAt>300)push=0;
      pushAt=now; push+=e.deltaX;
      if(Math.abs(push)>160){
        const next=neighbor(push>0 ? 1 : -1);
        push=0; lockUntil=now+700;
        if(next)applyWorkspaceView([next]);
      }
    },{capture:true,passive:true});
  }
  initColumnResizers();
  initWorkspaceHorizontalSwipe();
  initPeekSwipe();
  initSingleSwipe();
  initFocusMode();
  loadWorkspace();
</script>
