name: Deploy Cloud Functions

# NOTES I (2026-11-24): calendar edits on Firebase Cloud Functions (functions/). Deploys when functions/ changes, or by
# hand (Run workflow). Does nothing until the FIREBASE_SA_KEY secret (service account JSON key) is added.
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.firebaserc', '.github/workflows/functions.yaml', 'tools/functions-test.mjs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Waiting for setup
        if: env.SA_KEY == ''
        run: echo "FIREBASE_SA_KEY secret not set yet (docs/NOTES.md → I) — nothing to deploy"

      - uses: actions/setup-node@v4
        if: env.SA_KEY != ''
        with:
          node-version: 22

      - name: Tests
        if: env.SA_KEY != ''
        run: node tools/functions-test.mjs

      - name: Install
        if: env.SA_KEY != ''
        working-directory: functions
        run: npm install --omit=dev --no-audit --no-fund

      - name: Deploy
        if: env.SA_KEY != ''
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # The Firebase CLI checks the billing plan through the Cloud Billing API, which it doesn't switch on itself.
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud services enable cloudbilling.googleapis.com --project gantt-2ee94 --quiet
          sleep 30
          npx -y firebase-tools@13 deploy --only functions --project gantt-2ee94 --non-interactive --force
          # Old build images deleted after a day (otherwise they slowly cost storage).
          npx -y firebase-tools@13 functions:artifacts:setpolicy --location us-west1 --days 1 --project gantt-2ee94 --force --non-interactive || echo "cleanup policy not set"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Health check
        if: env.SA_KEY != ''
        run: |
          U=https://us-west1-gantt-2ee94.cloudfunctions.net/cal
          echo "warm: $(curl -s -m 60 "$U?warm=1")"
          echo "no sign-in: $(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"fn":"x"}' "$U") (expect 401)"
          C=$(curl -s -m 60 "$U?check=2"); echo "access: $C"
          echo "$C" | grep -q '"main":true' || echo "::warning::Main calendar not reachable: is it shared with the gantt-functions service account?"
