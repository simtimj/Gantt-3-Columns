name: Deploy Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the Gantt API router ids back once (tools/pwa-api/project.json)
    outputs:
      api_url: ${{ steps.api.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stops the deploy if any pushed script has a syntax error (2026-11-04).
      - name: Syntax check
        run: node tools/check.mjs

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Restore clasp login
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Prepare automatic code-change history
        run: python3 .github/scripts/build_deploy_log.py

      - name: Push code to Apps Script
        run: clasp push --force

      # Julius uses the /dev test link (always the latest pushed code), so no
      # versioned deployment update here (it hit the 200-version cap, 2026-10-27).

      # PWA (2026-11-21, docs/NOTES.md H): the "Gantt API" router project the hosted app calls.
      # Redeploys only when tools/pwa-api/ changes; a failure here never blocks the Apps Script push above.
      - name: Gantt API router
        id: api
        continue-on-error: true
        run: bash tools/pwa-api/deploy.sh

  # PWA front end → GitHub Pages (https://simtimj.github.io/Gantt-3-Columns/).
  pages:
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build PWA
        run: node tools/build-pwa.mjs dist
        env:
          PWA_API_URL: ${{ needs.deploy.outputs.api_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: pages
        uses: actions/deploy-pages@v4
