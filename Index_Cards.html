<script>
  // Side space slider (Julius, 2026-10-28): fw.sideSpace, 20–150 %, default 70.
  (function(){
    const DEF = 70, el = document.getElementById('sideSpace'), out = document.getElementById('sideSpaceValue');
    function apply(v,save){
      v = Math.max(20,Math.min(150,Number(v))); if(!isFinite(v)) v = DEF;
      document.documentElement.style.setProperty('--side',String(v / 100));
      if(el) el.value = v; if(out) out.textContent = v + '%';
      if(save) try{ localStorage.setItem('fw.sideSpace',String(v)); }catch(e){}
      if(typeof paintDaySecs === 'function') document.querySelectorAll('.editor.sec-painted').forEach(ed => { try{ paintDaySecs(ed); }catch(e){} });
    }
    let saved = DEF;
    try{ const x = localStorage.getItem('fw.sideSpace'); if(x !== null && x !== '') saved = Number(x); }catch(e){}
    apply(saved,false);
    if(el) el.addEventListener('input',() => apply(el.value,true));
    const r = document.getElementById('resetSideSpace');
    if(r) r.addEventListener('click',() => { apply(DEF,false); try{ localStorage.removeItem('fw.sideSpace'); }catch(e){} });
  })();
  // Dark mode cell background slider (Julius, 2026-10-27): Today / Notes / Reference cells,
  // black (0) → gray (30). Default 11 (was #121212 ≈ 7). Saved on this device as you drag.
  (function(){
    const DEF = 11, el = document.getElementById('dmCell'), out = document.getElementById('dmCellValue');
    function apply(v,save){
      v = Math.max(0,Math.min(30,Number(v)));
      if(!isFinite(v)) v = DEF;
      document.documentElement.style.setProperty('--dm-cell-l',String(v));
      if(el) el.value = v;
      if(out) out.textContent = v + '%';
      if(save) try{ localStorage.setItem('fw.dmCell',String(v)); }catch(e){}
    }
    let saved = DEF;
    try{ const x = localStorage.getItem('fw.dmCell'); if(x !== null && x !== '') saved = Number(x); }catch(e){}
    apply(saved,false);
    if(el) el.addEventListener('input',() => apply(el.value,true));
    // Tint color (Julius, 2026-10-27): the slider goes from black toward this color, e.g. purple →
    // a touch of purple, still dark. White = plain gray (the old look). Saved on this device.
    const tint = document.getElementById('dmTint'), TDEF = '#ffffff';
    function applyTint(c,save){
      if(!/^#[0-9a-f]{6}$/i.test(c || '')) c = TDEF;
      document.documentElement.style.setProperty('--dm-tint',c);
      if(tint) tint.value = c;
      if(save) try{ localStorage.setItem('fw.dmTint',c); }catch(e){}
    }
    let st = TDEF; try{ st = localStorage.getItem('fw.dmTint') || TDEF; }catch(e){}
    applyTint(st,false);
    if(tint) tint.addEventListener('input',() => applyTint(tint.value,true));
    // Day-colored dark cells (Julius, 2026-10-27): on by default; per-day colors, Default restores.
    // Dark day colors are what you see (Julius, 2026-10-27): no inversion; defaults = the light day colors, tweak from there.
    const DDEF = {1:'#eeeeee',2:'#fff0df',3:'#e6f1fb',4:'#ead8c2',5:'#fff0bd',6:'#d9b98c',0:'#fff4a8'}, dm = document.getElementById('dmDayMatch');
    // Old saved values (fw.dmDayColors) were LIGHT colors that got inverted, so they're dropped once.
    try{ localStorage.removeItem('fw.dmDayColors'); localStorage.removeItem('fw.dmDayColors2'); }catch(e){}
    let dcols = {}; try{ dcols = JSON.parse(localStorage.getItem('fw.dmDayColors3') || '{}') || {}; }catch(e){ dcols = {}; }
    function applyDays(){
      document.querySelectorAll('#dmDayCols input[data-dow]').forEach(inp => {
        const d = inp.dataset.dow, c = /^#[0-9a-f]{6}$/i.test(dcols[d] || '') ? dcols[d] : DDEF[d];
        inp.value = c;
        document.documentElement.style.setProperty('--dmd-c-' + d,c);
      });
    }
    applyDays();
    document.querySelectorAll('#dmDayCols input[data-dow]').forEach(inp => inp.addEventListener('input',() => {
      dcols[inp.dataset.dow] = inp.value; try{ localStorage.setItem('fw.dmDayColors3',JSON.stringify(dcols)); }catch(e){} applyDays();
    }));
    const dd = document.getElementById('dmDayDefault');
    if(dd) dd.addEventListener('click',() => { dcols = {}; try{ localStorage.removeItem('fw.dmDayColors3'); }catch(e){} applyDays(); });
    let match = true; try{ match = localStorage.getItem('fw.dmDayMatch') !== '0'; }catch(e){}
    document.body.classList.toggle('dm-daymatch',match);
    if(dm){ dm.checked = match; dm.addEventListener('change',() => { document.body.classList.toggle('dm-daymatch',dm.checked); try{ localStorage.setItem('fw.dmDayMatch',dm.checked ? '1' : '0'); }catch(e){} }); }
    const r = document.getElementById('resetDmCell');
    if(r) r.addEventListener('click',() => { apply(DEF,false); applyTint(TDEF,false); try{ localStorage.removeItem('fw.dmCell'); localStorage.removeItem('fw.dmTint'); }catch(e){} });
  })();
  // Dark mode text brightness slider (Julius, 2026-10-27): gray level of all text, black → white.
  (function(){
    const DEF = 52, el = document.getElementById('dmText'), out = document.getElementById('dmTextValue');
    function apply(v){
      v = Math.max(20,Math.min(100,Number(v) || DEF));
      document.documentElement.style.setProperty('--dm-l',String(v)); // text, muted and done text all scale from this
      if(el) el.value = v;
      if(out) out.textContent = v + '%';
      try{ localStorage.setItem('fw.dmText',String(v)); }catch(e){}
    }
    let saved = DEF;
    try{ saved = localStorage.getItem('fw.dmText') || DEF; }catch(e){}
    apply(saved);
    if(el) el.addEventListener('input',() => apply(el.value));
    const r = document.getElementById('resetDmText');
    if(r) r.addEventListener('click',() => apply(DEF));
  })();

  // Day color brightness slider (Julius, 2026-10-27): lightens/darkens every day color
  // (Tue orange, Wed blue…: backgrounds, note boxes, today outline, day names).
  (function(){
    const el = document.getElementById('dayColorAdj'), out = document.getElementById('dayColorAdjValue');
    function apply(v){
      v = Math.max(-60,Math.min(60,Math.round(Number(v) || 0)));
      const root = document.documentElement.style;
      root.setProperty('--dc-w',(v > 0 ? v : 0) + '%');
      root.setProperty('--dc-k',(v < 0 ? -v : 0) + '%');
      if(el) el.value = v;
      if(out) out.textContent = (v > 0 ? '+' : '') + v;
      try{ localStorage.setItem('fw.dayColorAdj',String(v)); }catch(e){}
    }
    let saved = 0;
    try{ saved = localStorage.getItem('fw.dayColorAdj') || 0; }catch(e){}
    apply(saved);
    if(el) el.addEventListener('input',() => apply(el.value));
    const r = document.getElementById('resetDayColorAdj');
    if(r) r.addEventListener('click',() => apply(0));
  })();

  // Dark inline text colors (e.g. pasted black text) ignored the dark mode text slider.
  // Mark them data-dkc; the dark mode CSS then paints them with --dm-text (Julius, 2026-10-27).
  (function(){
    const probe = document.createElement('span');
    function lum(c){
      probe.style.color = ''; probe.style.color = c;
      if(!probe.style.color) return 1;
      document.body.appendChild(probe);
      const m = getComputedStyle(probe).color.match(/[\d.]+/g);
      probe.remove();
      if(!m) return 1;
      const [r,g,b] = m.map(Number), a = m.length > 3 ? m[3] : 1;
      if(a < .1) return 1;
      return (0.2126*r + 0.7152*g + 0.0722*b) / 255;
    }
    function check(node){
      if(!node || node.nodeType !== 1) return;
      const c = (node.style && node.style.color) || (node.tagName === 'FONT' && node.getAttribute('color')) || '';
      const dark = c && lum(c) < .35;
      if(dark && !node.hasAttribute('data-dkc')) node.setAttribute('data-dkc','');
      else if(!dark && node.hasAttribute('data-dkc')) node.removeAttribute('data-dkc');
    }
    function scan(root){
      if(!root || root.nodeType !== 1) return;
      if(root.matches('[style*="color"],font[color]')) check(root);
      root.querySelectorAll('[style*="color"],font[color],[data-dkc]').forEach(check);
    }
    let pending = new Set(), raf = 0;
    function flush(){ raf = 0; const list = [...pending]; pending.clear(); list.forEach(scan); }
    const app = document.getElementById('app') || document.body;
    new MutationObserver(muts => {
      muts.forEach(m => {
        if(m.type === 'attributes') pending.add(m.target);
        else m.addedNodes.forEach(n => { if(n.nodeType === 1) pending.add(n); });
      });
      if(!raf) raf = requestAnimationFrame(flush);
    }).observe(app,{subtree:true,childList:true,attributes:true,attributeFilter:['style','color']});
    scan(app);
  })();

  // Reference-only padding (Julius, 2026-10-27): multiplies the main padding sliders, Reference only.
  (function(){
    const keys = {x:'fw.refPadX', y:'fw.refPadY'};
    function set(axis,v,save){
      v = Math.max(0,Math.min(300,Math.round((Number(v) || (v === 0 || v === '0' ? 0 : 100)) / 10) * 10));
      document.documentElement.style.setProperty('--ref-pad-' + axis,String(v / 100));
      const up = axis.toUpperCase(), el = document.getElementById('refPad' + up), out = document.getElementById('refPad' + up + 'Value');
      if(el) el.value = v;
      if(out) out.textContent = v + '%';
      if(save !== false){ try{ localStorage.setItem(keys[axis],String(v)); }catch(e){} }
    }
    ['x','y'].forEach(axis => {
      let saved = 100;
      try{ const v = localStorage.getItem(keys[axis]); if(v !== null) saved = v; }catch(e){}
      set(axis,saved,false);
      const el = document.getElementById('refPad' + axis.toUpperCase());
      if(el) el.addEventListener('input',() => set(axis,el.value));
    });
    const r = document.getElementById('resetRefPad');
    if(r) r.addEventListener('click',() => { set('x',100); set('y',100); });
  })();
</script>
<style>
  /* ===== Task cards (Julius, 2026-10-27) =====
     A card = one task (checkbox + text) with its subtasks underneath. Drawn with
     render-only data-tc* attributes (stripped on save by cardCleanHtml). */
  :root{--tc-base:color-mix(in srgb,#fff calc(var(--tc-fl,0) * 1%),transparent);--tc-bd:rgba(0,0,0,.14);--tc-mix:24%;}
  .check-line[data-tc]{
    position:relative;box-sizing:border-box;
    /* Card outline stays one rounded box (2026-11-15 11:43, Julius); subtasks indent inside it with padding. */
    margin-left:calc(var(--tch,0) * 24px)!important;
    padding:2px calc(8px * var(--side-k,1)) 2px calc(8px * var(--side-k,1) + var(--tcr,0) * 22px);
    background:linear-gradient(var(--tc-tint,transparent),var(--tc-tint,transparent)),var(--tc-base);
    border-left:1px solid var(--tc-bd);border-right:1px solid var(--tc-bd);
  }
  /* A tapped / typed-in subtask gets its own indented cell ring (starts at its checkbox), not the full card width. */
  .check-line[data-tc][data-tcrel][data-tcfocus]:not([data-tlon]){box-shadow:none;}
  .check-line[data-tc][data-tcrel][data-tcfocus]:not([data-tlon])::before{content:"";position:absolute;top:0;bottom:0;right:0;
    left:calc(8px * var(--side-k,1) + var(--tcr,0) * 22px - 5px);border:1px solid var(--urg,#8a8f98);border-radius:5px;pointer-events:none;}
  .check-line[data-tc^="f"]{border-top:1px solid var(--tc-bd);border-top-left-radius:8px;border-top-right-radius:8px;margin-top:5px;padding-top:4px;}
  .check-line[data-tc$="l"]{border-bottom:1px solid var(--tc-bd);border-bottom-left-radius:8px;border-bottom-right-radius:8px;margin-bottom:5px;padding-bottom:4px;}
  .check-line[data-tccat]{--tc-tint:color-mix(in srgb,var(--tc-cat) var(--tc-mix),transparent);}
  .check-line[data-tcdrag]{opacity:.3;}
  /* Side space (Julius, 2026-10-28): one multiplier for the left/right room in cells, section boxes and
     cards — Options → Side space (fw.sideSpace, default 70%); narrow panes (<420px) take 60% of that. */
  :root{--side-k:var(--side,.7);}
  #workspace > .pane.pane-narrow{--side-k:calc(var(--side,.7) * .6);}
  /* Quiet cards (Julius, 2026-10-28): no card outline at rest — the borders stay transparent so
     nothing shifts. The line you're typing in gets a thin ring in its urgency color (gray if none),
     like editing a task in Urgent. data-tcfocus is render-only (stripped on save). */
  .check-line[data-tc]{border-color:transparent!important;}
  .check-line[data-tcfocus]{box-shadow:0 0 0 1px var(--urg,#8a8f98);border-radius:5px;}
  /* Drag grip on the focused card line (Julius, 2026-10-28) — overlay, never part of the cell. */
  #tcGrip{position:fixed;z-index:2900;width:26px;height:14px;display:grid;place-items:center;border-radius:7px;
    font-size:11px;line-height:1;letter-spacing:-1px;color:#555;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.18);
    box-shadow:0 1px 3px rgba(0,0,0,.15);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;}
  #tcGrip[hidden]{display:none;}
  @media (prefers-color-scheme: dark){#tcGrip{color:#ccc;background:rgba(30,30,30,.92);border-color:rgba(255,255,255,.2);}}
  .check-line[data-tc][data-tcfocus]:not([data-tcrel]){border-radius:5px!important;}
  /* Day sections (Julius, 2026-10-27): Morning / Afternoon / Evening separators in the Today cell. */
  .editor > [data-sec]{margin:10px 0 4px;padding:0 0 2px;border-bottom:2px solid var(--note-line-adj,var(--border));font-size:.82em;letter-spacing:.06em;text-transform:uppercase;color:var(--note-line-adj,var(--muted));}
  .editor > [data-sec]:first-child{margin-top:0;}
  /* Day section boxes (Julius, 2026-10-27): each section is its own rounded box like the Suggested Day —
     bright outline + soft fill along the sun (morning midday-sun yellow, afternoon bright orange — 2026-10-27 retune; afternoon orange, evening sunset purple).
     Drawn render-only behind the editor by paintDaySecs (.sec-boxes is never saved). */
  :root{--sec-m-bd:#e3bd43;--sec-m:transparent;--sec-a-bd:#df8b3a;--sec-a:transparent;--sec-e-bd:#9c74c9;--sec-e:transparent;}
  @media (prefers-color-scheme: dark){:root{--sec-m-bd:#e3bd43;--sec-m:transparent;--sec-a-bd:#df8b3a;--sec-a:transparent;--sec-e-bd:#9c74c9;--sec-e:transparent;}}
  .sec-host,.day-row:has(> .sec-host){position:relative;}
  .sec-host > .editor.sec-painted{position:relative;z-index:1;padding-left:calc(15px * var(--side-k,1))!important;padding-right:calc(15px * var(--side-k,1))!important;padding-bottom:8px!important;}
  .sec-boxes{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .editor > [data-sec]{margin-top:16px;}
  .editor > [data-sec="morning"]{border-bottom-color:var(--sec-m-bd);color:var(--sec-m-bd);}
  .editor > [data-sec="afternoon"]{border-bottom-color:var(--sec-a-bd);color:var(--sec-a-bd);}
  .editor > [data-sec="evening"]{border-bottom-color:var(--sec-e-bd);color:var(--sec-e-bd);}
  /* Time frames on the section lines (Julius, 2026-10-27; display only, not saved): his day runs ~8:30 am – 9:30 pm with a nap after 2. */
  .editor > [data-sec] > b:first-child::after{font-weight:500;opacity:.8;letter-spacing:.02em;}
  .editor > [data-sec="morning"] > b:first-child::after{content:" · 8 am – 2 pm";}
  .editor > [data-sec="afternoon"] > b:first-child::after{content:" · 2 – 7 pm";}
  .editor > [data-sec="evening"] > b:first-child::after{content:" · 7 – 10 pm";}
  .editor > [data-sec]:first-child{margin-top:6px;}
  /* Same short look for the older Morning / Afternoon / Evening title lines (Julius, 2026-11-01). Display only — the saved word stays. */
  .editor > [data-sec="morning"] > b:first-child,.editor > [data-sec="afternoon"] > b:first-child,.editor > [data-sec="evening"] > b:first-child{white-space:nowrap;font-size:0!important;letter-spacing:0;}
  .editor > [data-sec="morning"] > b:first-child::before,.editor > [data-sec="afternoon"] > b:first-child::before,.editor > [data-sec="evening"] > b:first-child::before{content:"";display:inline-block;width:calc(var(--paragraph-size,14px) * 1.05);height:calc(var(--paragraph-size,14px) * 1.05);vertical-align:-.2em;margin-right:.35em;-webkit-mask:var(--ts-ic) center/contain no-repeat;mask:var(--ts-ic) center/contain no-repeat;background:var(--ts-c);font-size:calc(var(--paragraph-size,14px) * .75);}
  .editor > [data-sec="morning"] > b:first-child::after,.editor > [data-sec="afternoon"] > b:first-child::after,.editor > [data-sec="evening"] > b:first-child::after{font-size:calc(var(--paragraph-size,14px) * .75);font-weight:600;letter-spacing:.02em;opacity:1;text-transform:none;}

<script>
  /* ===== Task cards + subject colors (Julius, 2026-10-27) =====
     - Every task is a card: checkbox + text, subtasks inside the same card.
     - Drag a task's checkbox (or hold it, then drag) to move the card with its
       subtasks; a subtask moves with only what's nested under it. Works within
       a cell and across days, Notes and Reference cells. Drag right/left while
       moving to nest it under the task above / take it back out.
     - Card background = subject (Code, Career, …): set it from the checkbox hold
       menu, or let the app guess from the words (and the header it sits under). */
  // Subjects are editable in Options (Julius, 2026-10-27): name, color, keywords.
  // Saved to the account (user properties, all devices) with a local copy for a fast start.
  const CARD_CATS_DEFAULT = [
    {key:'code',   name:'Code',   color:'#22c55e', words:'gantt, exercise tracker, userscript, userscripts, script, scripts, apps script, clasp, github, repo, code, coding, bug, bugs, feature, features, readme, deploy, tampermonkey, violentmonkey, react, typescript, next.js, nextjs, tailwind, javascript, api, css, html, app, apps, ui, playnite, endpoint, dashboard, planner hub'},
    {key:'career', name:'Career / IT', color:'#86efac', words:'resume, resumes, résumé, job, jobs, job search, application, applications, apply, interview, interviews, linkedin, career, cover letter, recruiter, recruiters, ats, cdcr, calcareers, it associate, hiring, portfolio, networking, soq, help desk, helpdesk, it support, tech support, it job, it jobs, it role, certification, cert, security, cloud security, devsecops, it lab, home lab, homelab, lab, labs'},
    // Music + Productivity added for Urgent batches (2026-10-30, Julius); server upgrades saved lists once (getCardCats_).
    {key:'music',  name:'Music',  color:'#a855f7', words:'music, guitar, sing, singing, song, songs, setlist, set list, the show, show prep, music show, gig, gigs, rehearsal, rehearse, band, vocals, pedal, pedals, amp, open mic, soundcheck'},
    {key:'productivity', name:'Productivity', color:'#c0c4cc', words:'productivity, efficiency, efficient, workflow, workflows, automation, automate, organize, organizing, clean up, cleanup, consolidate, chatgpt, gemini, handoff, master instructions, docs cleanup, migrate, migration, learn'},
    {key:'study',  name:'Study',  color:'#a78bfa', words:'a+, comptia, study, studying, course, class, quiz, exam, practice test, flashcard, flashcards, lesson, lessons'},
    {key:'work',   name:'Work',   color:'#94a3b8', words:'dog walk, dog walks, dog walking, walk, walks, client, clients, rover, invoice, invoices'},
    {key:'health', name:'P health', color:'#ec4899', words:'exercise, exercises, workout, gym, stretch, stretching, pt, physical therapy, sleep, doctor, dentist, skincare, running, lift, lifting, rehab, hydration, water'},
    {key:'mhealth', name:'M health', color:'#a78bfa', words:'meditation, meditate, mindfulness'},
    {key:'fun',    name:'Fun',    color:'#f97316', words:'game, games, gaming, movie, movies, youtube, fun, spanish, japanese, language'},
  ];
  let CARD_CATS = [], CARD_CAT_BY_KEY = {};
  // Declared before the first setCardCats() call: it refreshes cards, which reads these.
  let cardsOn = true, cardsAuto = true;
  const DAY_SECS = [['morning','Morning'],['afternoon','Afternoon'],['evening','Evening']];
  // Day sections removed (Julius, 2026-10-29); kept off so the old code paths stay inert.
  let daySecsOn = false;
  try{ cardsOn = localStorage.getItem('fw.cards') !== '0'; cardsAuto = localStorage.getItem('fw.cardsAuto') !== '0'; }catch(e){}
  const cardHeadOf = new WeakMap(); // line -> its card's head line
  function cardCatRegex(words){
    const list = String(words || '').split(',').map(w => w.trim()).filter(Boolean)
      .sort((x,y) => y.length - x.length).map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+'));
    return list.length ? new RegExp('(^|[^\\w])(' + list.join('|') + ')(?=$|[^\\w])','i') : null;
  }
  function cleanCardCats(list){
    if(!Array.isArray(list)) return null;
    const seen = new Set(), out = [];
    list.forEach(c => {
      if(!c || !/^[a-z]{2,12}$/.test(c.key || '') || c.key === 'none' || c.key === 'life' || String(c.name).toLowerCase() === 'life' || seen.has(c.key)) return;
      seen.add(c.key);
      out.push({key:c.key, name:String(c.name || c.key).slice(0,24), color:/^#[0-9a-f]{6}$/i.test(c.color || '') ? c.color : '#9ca3af', words:String(c.words || '').slice(0,2000)});
    });
    return out;
  }
  function setCardCats(list,save,noRefresh){
    // An empty or unreadable list (e.g. an old cached copy) falls back to the starting subjects.
    const got = cleanCardCats(list);
    const clean = (got && got.length) ? got : CARD_CATS_DEFAULT.map(c => ({...c}));
    CARD_CATS = clean.map(c => { const re = cardCatRegex(c.words); return {...c, re, reG: re ? new RegExp(re.source,'gi') : null}; });
    CARD_CAT_BY_KEY = Object.fromEntries(CARD_CATS.map(c => [c.key,c]));
    const plain = CARD_CATS.map(({re,reG,...c}) => c);
    try{ localStorage.setItem('fw.cardCats',JSON.stringify(plain)); }catch(e){}
    let css = '';
    CARD_CATS.forEach(c => { css += `[data-tccat="${c.key}"]{--tc-cat:${c.color};}`; });
    let st = document.getElementById('cardCatCss');
    if(!st){ st = document.createElement('style'); st.id = 'cardCatCss'; document.head.appendChild(st); }
    st.textContent = css;
    if(save){
      clearTimeout(setCardCats.t);
      setCardCats.t = setTimeout(() => { try{ google.script.run.withFailureHandler(e => setStatus('Subjects not saved: ' + e.message)).saveCardCats(plain); }catch(e){} },600);
    }
    if(!noRefresh){ refreshAllCards(); try{ renderUrgent(); }catch(e){} } // Urgent batches use the subject names
  }
  (function(){
    let local = null;
    try{ local = JSON.parse(localStorage.getItem('fw.cardCats') || 'null'); }catch(e){}
    setCardCats(local,false,true); // first load: the card code below isn't set up yet; it refreshes itself
  })();

  (function(){
    let css = '';
    for(let i = 1; i <= 6; i++) css += `.check-line[data-tchead="${i}"]{--tch:${i};}.check-line[data-tcrel="${i}"]{--tcr:${i};}`;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
  })();

  const tcLvl = n => Math.max(0,Math.min(6,Math.floor(Number(n.dataset.level) || 0)));
  const tcText = n => { let t = n.textContent || ''; const sb = n.querySelector && n.querySelector(':scope > .tl-sum'); if(sb) t = t.replace(sb.textContent,''); return t.replace(/\s+/g,' ').trim().replace(/^\*/,''); };
  // Subject guessing (Julius, 2026-10-27: "stretch" in a Gantt line turned it Health).
  // 1. Explicit tag at the end of the task: "… · Gantt" / "… · Code" (middle dot) wins.
  // 2. A Claude project header (data-cgrp, e.g. "Gantt") decides for every line under it.
  // 3. Otherwise words are weighed, not first-match: the longest phrase claims its words
  //    ("exercise tracker" beats "exercise"), then the task text counts x2, a nearby
  //    header x3, subtasks x1; most points wins (tie → whichever shows up first in the task).
  function cardCatHits(text){
    const hits = [];
    if(!text) return hits;
    CARD_CATS.forEach((c,ci) => {
      if(!c.reG) return;
      c.reG.lastIndex = 0;

      on = v;
      try{ localStorage.setItem('fw.oneDay', v ? '1' : '0'); }catch(e){}
      document.body.classList.toggle('one-day', v);
      if(v) odGo(window.odDate || state.today);
      else {
        document.querySelectorAll('.day-row.od-on').forEach(r => r.classList.remove('od-on'));
        requestAnimationFrame(() => { syncDayHeights(); jumpToday(false); });
      }
    }
    const box = document.getElementById('oneDayOn');
    if(box){ box.checked = on; box.addEventListener('change', () => setOn(box.checked)); }

    /* ---- Plan pad saving ---- */
    const padBase = new Map();   // date -> {t, h}
    const padSt = new Map();     // date -> {timer, inFlight, pending}
    // Version the pad started from: from the loaded day until the first save/merge.
    function base(d){
      if(!padBase.has(d)){
        const day = (state.days || []).find(y => y.date === d);
        if(day && day.ph !== undefined) padBase.set(d,{t:day.plan || '', h:day.ph});
      }
      return padBase.get(d) || {t:'', h:null};
    }
    const st = d => { if(!padSt.has(d)) padSt.set(d,{timer:0,inFlight:false,pending:false}); return padSt.get(d); };
    const padEl = d => document.querySelector(`.plan-pad[data-date="${CSS.escape(d)}"]`); // may be docked in #blocksScroll (2026-11-12)
    const clean = html => /^(\s|<br\s*\/?>|<div><br\s*\/?><\/div>)*$/i.test(html || '') ? '' : String(html);
    function schedule(d){
      const x = st(d); x.pending = true; clearTimeout(x.timer);
      setStatus('Unsaved…');
      x.timer = setTimeout(() => save(d), 900);
    }
    function save(d){
      const x = st(d); clearTimeout(x.timer); x.timer = 0;
      if(dictatingPads.has(d)){ x.pending = true; return; }
      if(x.inFlight){ x.pending = true; return; }
      const pad = padEl(d); if(!pad){ x.pending = false; return; }
      pad.querySelectorAll('input[data-wired]').forEach(cb => cb.removeAttribute('data-wired'));
      const html = clean(cardCleanHtml(pad));
      noteUrgentDay(d,html,true,'plan');
      const b = base(d);
      if(html === b.t){ x.pending = false; return; }
      x.inFlight = true; x.pending = false;
      setStatus('Saving…');
      google.script.run
        .withSuccessHandler(res => {
          x.inFlight = false;
          if(res && res.build && typeof fwCheckBuild === 'function') fwCheckBuild(res.build);
          if(res && res.conflict){ merge(d, res.plan, res.ph); }
          else if(res){
            padBase.set(d,{t:html, h:res.ph});
            const day = state.days.find(y => y.date === d); if(day){ day.plan = html; day.ph = res.ph; }
            if(!x.pending) setStatus('Saved');
          }
          if(x.pending) save(d);
        })
        .withFailureHandler(e => {
          x.inFlight = false; x.pending = true;
          setStatus('Plan save failed — retrying');
          x.timer = setTimeout(() => save(d), 5000);
        })
        .savePlanPad(d, html, b.h);
    }
    // Android speech-to-text uses IME composition. Never replace the active
    // contenteditable DOM during composition: doing so destroys the caret.
    const dictatingPads = new Set();
    const deferredPadMerges = new Map();
    document.addEventListener('compositionstart', e => {
      const pad = e.target.closest?.('.plan-pad');
      if(pad) dictatingPads.add(pad.dataset.date);
    }, true);
    document.addEventListener('compositionend', e => {
      const pad = e.target.closest?.('.plan-pad');
      if(!pad) return;
      const d = pad.dataset.date;
      dictatingPads.delete(d);
      schedule(d);
      const deferred = deferredPadMerges.get(d);
      if(deferred){
        deferredPadMerges.delete(d);
        // Wait for the IME's final input event before touching the editor.
        setTimeout(() => merge(d, deferred.plan, deferred.h), 100);
      }
    }, true);
    // Server copy changed elsewhere: merge it with what's on screen (same 3-way merge as the cells).
    function merge(d, theirs, h){
      if(dictatingPads.has(d)){
        deferredPadMerges.set(d,{plan:theirs,h});
        return;
      }
      const b = base(d);
      padBase.set(d,{t:theirs || '', h});
      const pad = padEl(d); if(!pad) return;
      const mine = fwBlocks(clean(cardCleanHtml(pad))), their = fwBlocks(theirs || '');
      const m = fwMerge3(fwBlocks(b.t), mine, their);
      if(!fwSame(m.blocks, mine)){
        replaceEditorHtml(pad, m.blocks.join(''));
        noteUrgentDay(d, cardCleanHtml(pad), true, 'plan');
      }
      if(!fwSame(m.blocks, their)) schedule(d);
      setStatus(m.conflict ? 'Plan merged with changes from elsewhere' : 'Synced changes from elsewhere');
    }
    // Delegated (the first screen is drawn before this script runs).
    window.odPadSave = d => { if(d) schedule(d); };
    document.addEventListener('focusout', e => { const p = e.target.closest && e.target.closest('.plan-pad'); if(p && st(p.dataset.date).pending) save(p.dataset.date); });
    window.odPadHash = d => { const b = base(d); return b && b.h ? b.h : undefined; };
    window.odPadTheirs = (d, plan, h) => { const x = st(d); if(x.inFlight || x.pending) return; merge(d, plan, h); };
    window.odPadUnsaved = () => [...padSt.values()].some(x => x.inFlight || x.pending);
    window.odPadFlush = () => { for(const [d,x] of padSt) if(x.pending && !x.inFlight) save(d); };
  })();
  // Thoughts pad (2026-11-12, Julius): freeform writing, no rules — same conflict-safe autosave as the
  // Plan pad (Days column E, saveThoughtPad), but no urgency scanning, no card machinery.
  (function initThoughtPad(){
    const tBase = new Map(), tSt = new Map();
    function base(d){
      if(!tBase.has(d)){
        const day = (state.days || []).find(y => y.date === d);
        if(day && day.hh !== undefined) tBase.set(d,{t:day.tho || '', h:day.hh});
      }
      return tBase.get(d) || {t:'', h:null};
    }
    const st = d => { if(!tSt.has(d)) tSt.set(d,{timer:0,inFlight:false,pending:false}); return tSt.get(d); };
    const el = d => document.querySelector(`.thought-pad[data-date="${CSS.escape(d)}"]`);
    const clean = html => /^(\s|<br\s*\/?>|<div><br\s*\/?><\/div>)*$/i.test(html || '') ? '' : String(html);
    function schedule(d){
      const x = st(d); x.pending = true; clearTimeout(x.timer);
      setStatus('Unsaved…');
      x.timer = setTimeout(() => save(d), 900);
    }
    function save(d){
      const x = st(d); clearTimeout(x.timer); x.timer = 0;
      if(dictating.has(d)){ x.pending = true; return; }
      if(x.inFlight){ x.pending = true; return; }
      const pad = el(d); if(!pad){ x.pending = false; return; }
      const html = clean(typeof cardCleanHtml === 'function' ? cardCleanHtml(pad) : pad.innerHTML);
      const b = base(d);
      if(html === b.t){ x.pending = false; return; }
      x.inFlight = true; x.pending = false;
      setStatus('Saving…');
      google.script.run
        .withSuccessHandler(res => {
          x.inFlight = false;
          if(res && res.build && typeof fwCheckBuild === 'function') fwCheckBuild(res.build);
          if(res && res.conflict){ merge(d, res.tho, res.hh); }
          else if(res){
            tBase.set(d,{t:html, h:res.hh});
            const day = state.days.find(y => y.date === d); if(day){ day.tho = html; day.hh = res.hh; }
            if(!x.pending) setStatus('Saved');
          }
          if(x.pending) save(d);
        })
        .withFailureHandler(e => {
          x.inFlight = false; x.pending = true;
          setStatus('Thoughts save failed — retrying');
          x.timer = setTimeout(() => save(d), 5000);
        })
        .saveThoughtPad(d, html, b.h);
    }
    // Android dictation (IME composition): never touch the DOM mid-composition.
    const dictating = new Set(), deferred = new Map();
    document.addEventListener('compositionstart', e => {
      const p = e.target.closest?.('.thought-pad');
      if(p) dictating.add(p.dataset.date);
    }, true);
    document.addEventListener('compositionend', e => {
      const p = e.target.closest?.('.thought-pad');
      if(!p) return;
      const d = p.dataset.date;
      dictating.delete(d);
      schedule(d);
      const def = deferred.get(d);
      if(def){ deferred.delete(d); setTimeout(() => merge(d, def.tho, def.h), 100); }
    }, true);
    function merge(d, theirs, h){
      if(dictating.has(d)){ deferred.set(d,{tho:theirs,h}); return; }
      const b = base(d);
      tBase.set(d,{t:theirs || '', h});
      const pad = el(d); if(!pad) return;
      const mine = fwBlocks(clean(typeof cardCleanHtml === 'function' ? cardCleanHtml(pad) : pad.innerHTML)), their = fwBlocks(theirs || '');
      const m = fwMerge3(fwBlocks(b.t), mine, their);
      if(!fwSame(m.blocks, mine)){ replaceEditorHtml(pad, m.blocks.join('')); pad.querySelectorAll('input[type=checkbox]').forEach(wireCheckbox); }
      if(!fwSame(m.blocks, their)) schedule(d);
      setStatus(m.conflict ? 'Thoughts merged with changes from elsewhere' : 'Synced changes from elsewhere');
    }
    document.addEventListener('input', e => { const p = e.target.closest && e.target.closest('.thought-pad'); if(p) schedule(p.dataset.date); }, true);
    document.addEventListener('focusout', e => { const p = e.target.closest && e.target.closest('.thought-pad'); if(p && st(p.dataset.date).pending) save(p.dataset.date); });
    window.odThoughtSave = d => schedule(d); // card / checkbox / menu edits (saveEditorOwner)
    window.odThoughtHash = d => { const b = base(d); return b && b.h ? b.h : undefined; };
    window.odThoughtTheirs = (d, tho, h) => { const x = st(d); if(x.inFlight || x.pending) return; merge(d, tho, h); };
    window.odThoughtUnsaved = () => [...tSt.values()].some(x => x.inFlight || x.pending);
    window.odThoughtFlush = () => { for(const [d,x] of tSt) if(x.pending && !x.inFlight) save(d); };
  })();
  /* Keep In Mind — one shared list (2026-11-13, Julius): the same on every day, never copied per day. A full editor
     (header lines, tasks, subtasks, cards, checkboxes) saved once to the `Keep In Mind` tab (getKim / saveKim, safe
     save + 3-way merge like the pads). First run builds it from the latest day's Keep In Mind lines (font colors
     stripped) plus the old category items as plain lines at the bottom. */
  (function initKim(){
    const ed = document.querySelector('#kimScroll .kim-editor');
    if(!ed || !(window.google && google.script)) { if(ed) wireEditor(ed,'kim'); return; }
    let base = null, timer = 0, inFlight = false, pending = false, loaded = false, dictating = false, deferred = null;
    const clean = html => /^(\s|<br\s*\/?>|<div><br\s*\/?><\/div>)*$/i.test(html || '') ? '' : String(html);
    const now = () => clean(typeof cardCleanHtml === 'function' ? cardCleanHtml(ed) : ed.innerHTML);
    const wireBoxes = () => ed.querySelectorAll('input[type=checkbox]').forEach(cb => { cb.removeAttribute('data-wired'); wireCheckbox(cb); });
    wireEditor(ed,'kim');
    function schedule(){ if(!loaded) return; pending = true; clearTimeout(timer); setStatus('Unsaved…'); timer = setTimeout(save,900); }
    function save(){
      clearTimeout(timer); timer = 0;
      if(!loaded || dictating || inFlight){ pending = loaded; return; }
      const html = now();
      if(html === base.t){ pending = false; return; }
      inFlight = true; pending = false; setStatus('Saving…');
      google.script.run.withSuccessHandler(r => {
        inFlight = false;
        if(r && r.conflict) merge(r.html, r.h);
        else if(r){ base = {t:html, h:r.h}; if(!pending) setStatus('Keep In Mind saved'); }
        if(pending) save();
      }).withFailureHandler(e => {
        inFlight = false; pending = true; setStatus('Keep In Mind not saved — retrying');
        timer = setTimeout(save,5000);
      }).saveKim(html, base.h);
    }
    function merge(theirs, h){
      if(dictating){ deferred = {html:theirs, h}; return; }
      const b = base; base = {t:theirs || '', h};
      const mine = fwBlocks(now()), their = fwBlocks(theirs || '');
      const m = fwMerge3(fwBlocks(b.t), mine, their);
      if(!fwSame(m.blocks, mine)){ replaceEditorHtml(ed, m.blocks.join('')); wireBoxes(); }
      if(!fwSame(m.blocks, their)) schedule();
    }
    // First copy: the latest day whose Keep In Mind section has words, cleaned, + old category items as plain lines.
    function lastDayLines(){
      const days = (state.days || []).slice().filter(d => d.journal);
      const seed = state.notesSeeds && state.notesSeeds.focus; if(seed && seed.journal) days.push(seed);
      days.sort((a,b) => b.date.localeCompare(a.date));
      for(const d of days){
        const holder = document.createElement('div'); holder.innerHTML = storedToHtml(d.journal || '');
        const head = holder.querySelector(':scope > [data-nsec="focus"]'); if(!head) continue;
        const out = document.createElement('div');
        for(let n = head.nextSibling; n; n = n.nextSibling){
          if(n.nodeType === 1 && n.matches('[data-nsec],table')) break;
          if(n.nodeType === 1 && n.matches('[data-render-due],.fx')) continue;
          out.appendChild(n.cloneNode(true));
        }
        // No color / font changes: unwrap styled spans, drop inline styles (indent comes from data-level).
        out.querySelectorAll('span[style],font').forEach(sp => { if(!sp.closest('.check-text') || sp.matches('font,span[style]')) sp.replaceWith(...sp.childNodes); });
        out.querySelectorAll('[style]').forEach(el => el.removeAttribute('style'));
        out.querySelectorAll('div').forEach(el => { if(!el.classList.contains('check-line') && !el.childNodes.length) el.remove(); });
        if(out.textContent.trim()) return out.innerHTML;
      }
      return '';
    }
    const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function catLines(data){
      if(!data || !Array.isArray(data.cats)) return '';
      let h = '';
      data.cats.forEach(c => {
        let items = Array.isArray(c.items) ? c.items : [];
        if(!items.length && Array.isArray(c.projects)) c.projects.forEach(p => {
          if(p.title) items.push({id:p.id || '', t:p.title, lv:0});
          if(p.why) items.push({t:p.why, lv:1, n:1});
          (p.tasks || []).forEach(t => items.push({id:t.id, t:t.t || t.text || '', d:t.d || t.done, lv:p.title ? 1 : 0}));
        });
        items = items.filter(t => String(t.t || '').trim());
        if(!items.length) return;
        h += '<div><br></div><div>' + esc(c.name || 'Keep In Mind') + '</div>';
        items.forEach(t => {
          const lv = Math.max(0, Math.min(8, Number(t.lv) || 0));
          if(t.n){ h += '<div>' + esc(t.t) + '</div>'; return; }
          h += '<div class="check-line' + (t.d ? ' done' : '') + '" data-level="' + lv + '"' + (t.id ? ' data-tid="' + esc(t.id) + '"' : '') + '><input type="checkbox"' + (t.d ? ' checked' : '') + '><span class="check-text">' + esc(t.t) + '</span></div>';
        });
      });
      return h;
    }
    function migrate(){
      const first = lastDayLines();
      google.script.run.withSuccessHandler(data => finish(first + catLines(data))).withFailureHandler(() => finish(first)).getFocus();
      function finish(html){
        html = clean(html);
        ed.innerHTML = html ? storedToHtml(html) : '';
        if(typeof normalizeEditorTasks === 'function') normalizeEditorTasks(ed);
        wireBoxes(); squeezeBlanks();
        loaded = true; pending = true; save(); repaint();
      }
    }
    function load(first){
      if(inFlight || pending || dictating) return;
      google.script.run.withSuccessHandler(r => {
        if(!r) return;
        if(first){
          if(r.dbOff) setStatus('Database off, using the Sheet: ' + r.dbOff);
          base = {t:r.html || '', h:r.h};
          if(r.fresh){ migrate(); return; }
          ed.innerHTML = storedToHtml(r.html || ''); if(typeof normalizeEditorTasks === 'function') normalizeEditorTasks(ed); wireBoxes(); loaded = true;
          if(squeezeBlanks()) schedule();
          repaint(); return;
        }
        if(!loaded || r.h === base.h || inFlight || pending) return;
        merge(r.html || '', r.h);
      }).withFailureHandler(e => setStatus('Keep In Mind didn’t load: ' + (e && e.message || e))).getKim();
    }
    document.addEventListener('compositionstart', e => { if(ed.contains(e.target) || e.target === ed) dictating = true; }, true);
    document.addEventListener('compositionend', e => {
      if(!(ed.contains(e.target) || e.target === ed)) return;
      dictating = false; schedule();
      if(deferred){ const d = deferred; deferred = null; setTimeout(() => merge(d.html, d.h), 100); }
    }, true);
    ed.addEventListener('input', schedule);
    ed.addEventListener('focusout', () => { if(pending) save(); });
    window.fwResume && fwResume.add('kim', () => load(false)); // back in view: calm-return queue
    window.fwKimReload = () => load(false); // PWA database step (2026-11-22, NOTES H3): another device saved
    setInterval(() => { if(document.visibilityState === 'visible' && document.activeElement !== ed && !ed.contains(document.activeElement)) load(false); }, 60000);
    // Group borders: one box per run of non-empty top-level lines (a header + its tasks, down to the empty line).
    const scroller = document.getElementById('kimScroll');
    let kgRaf = 0;
    function paintGroups(){
      kgRaf = 0;
      if(!scroller || scroller.offsetParent === null) return;
      scroller.querySelectorAll(':scope > :is(.kg-box,.kg-pin)').forEach(b => b.remove());
      const blank = n => !n.classList.contains('check-line') && !n.textContent.trim() && !n.querySelector('input,img');
      const groups = []; let cur = null;
      [...ed.children].forEach(n => {
        if(blank(n) || getComputedStyle(n).display === 'none'){ cur = null; return; }
        if(!cur){ cur = [n,n]; groups.push(cur); } else cur[1] = n;
      });
      const sr = scroller.getBoundingClientRect(), er = ed.getBoundingClientRect();
      // Pins (2026-11-22, Julius): a small 📌 left of each pinned item; tap = unpin (it drops just below the pinned ones).
      [...ed.children].forEach(n => {
        if(!n.hasAttribute('data-kpin') || getComputedStyle(n).display === 'none') return;
        const r = n.getBoundingClientRect(), lh = Math.min(r.height, parseFloat(getComputedStyle(n).lineHeight) || 20);
        const pin = document.createElement('button'); pin.type = 'button'; pin.className = 'kg-pin'; pin.textContent = '📌';
        pin.title = 'Unpin'; pin.setAttribute('aria-label', 'Unpin'); pin.tabIndex = -1;
        pin.style.left = (r.left - sr.left + scroller.scrollLeft + 1) + 'px';
        pin.style.top = (r.top - sr.top + scroller.scrollTop + Math.max(0, (lh - 16) / 2) + (parseFloat(getComputedStyle(n).paddingTop) || 0)) + 'px';
        pin.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); });
        pin.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); if(window.kimUnpinHead) window.kimUnpinHead(n); });
        scroller.appendChild(pin);
      });
      groups.forEach(([a,b]) => {
        // One border per section (2026-11-22, Julius: "looks doubled"): a section headed by a boxed title already has
        // the title cell's box, so no second group box on top of it.
        if(window.tboxTitle && window.tboxTitle(a)) return;
        const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
        const box = document.createElement('div'); box.className = 'kg-box';
        const tbc = a.getAttribute('data-tbc'); // title border color (2026-11-21)
        if(/^#[0-9a-f]{6}$/i.test(tbc || '')){ box.style.borderColor = tbc; box.style.borderWidth = '1.5px'; }
        box.style.left = (er.left - sr.left + scroller.scrollLeft) + 'px';
        box.style.width = er.width + 'px';
        box.style.top = (ra.top - sr.top + scroller.scrollTop - 2) + 'px';
        box.style.height = (rb.bottom - ra.top + 4) + 'px';
        scroller.appendChild(box);
      });
    }
    const repaint = () => { if(!kgRaf) kgRaf = requestAnimationFrame(paintGroups); };
    window.kimRepaintGroups = repaint;
    new MutationObserver(repaint).observe(ed,{childList:true,subtree:true,characterData:true});
    window.addEventListener('resize', repaint);
    new MutationObserver(repaint).observe(document.getElementById('journalPane'),{attributes:true,attributeFilter:['data-ctab']});
    if(window.ResizeObserver) new ResizeObserver(repaint).observe(ed);
    // Runs of empty lines shrink to one (old per-day copies had stacks of them — wasted space).
    function squeezeBlanks(){
      let prevBlank = true, changed = false;
      [...ed.children].forEach(n => {
        const b = !n.classList.contains('check-line') && !n.textContent.trim() && !n.querySelector('input,img');
        if(b && prevBlank){ n.remove(); changed = true; return; }
        prevBlank = b;
      });
      const last = ed.lastElementChild;
      if(last && !last.classList.contains('check-line') && !last.textContent.trim() && last.previousElementSibling && document.activeElement !== ed){ last.remove(); changed = true; }
      return changed;
    }
    window.kimSave = schedule;
    window.kimUnsaved = () => inFlight || pending;
    window.kimFlush = () => { if(pending && !inFlight) save(); };
    // Wait until the days are in (the first copy reads the latest day's lines).
    const start = () => { if(state.days && state.days.length) load(true); else setTimeout(start, 400); };
    start();
  })();
