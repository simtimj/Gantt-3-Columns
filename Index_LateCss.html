     They now load at the very top of <body>, in their old order: still after every <head> style (and after styles

<style>
  /* ===== Task cards (Julius, 2026-10-27) =====
     A card = one task (checkbox + text) with its subtasks underneath. Drawn with
     render-only data-tc* attributes (stripped on save by cardCleanHtml). */

    margin-left:calc(var(--tch,0) * 24px)!important;
    padding:2px calc(8px * var(--side-k,1)) 2px calc(8px * var(--side-k,1) + var(--tcr,0) * 22px);
    background:linear-gradient(var(--tc-tint,transparent),var(--tc-tint,transparent)),var(--tc-base);
    border-left:1px solid var(--tc-bd);border-right:1px solid var(--tc-bd);

  /* ===== Google Calendar look (2026-11-08, Julius: "as close as Google Calendar, style and feel"). Overrides only;
     behaviour unchanged. Light + dark tokens follow Google's current palette. ===== */
  /* Font (2026-11-10, Julius): Google Sans like Google Calendar; Roboto / system font until it loads or if blocked. */
  #calPanel,#calPanel button,#calPanel input,#calPanel select,#calPanel .fc{font-family:'Google Sans Flex','Google Sans',Roboto,system-ui,Arial,sans-serif;}
  #calPanel{--cp-bg:#fff;--cp-text:#1f1f1f;--cp-muted:#70757a;--cp-line:#dde3ea;--cp-soft:#f0f4f9;--cp-hover:rgba(68,71,70,.08);
    --cp-blue:#0b57d0;--cp-blue-soft:#d3e3fd;--cp-blue-text:#041e49;--cp-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);
    font-family:'Google Sans',Roboto,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;}
  html[data-theme=dark] #calPanel{--cp-bg:#1f1f1f;--cp-text:#e3e3e3;--cp-muted:#9aa0a6;--cp-line:#444746;--cp-soft:#282a2c;--cp-hover:rgba(227,227,227,.08);
    --cp-blue:#a8c7fa;--cp-blue-soft:#004a77;--cp-blue-text:#062e6f;--cp-shadow:0 1px 3px rgba(0,0,0,.5),0 4px 8px 3px rgba(0,0,0,.3);}
  #calPanel button{-webkit-tap-highlight-color:transparent;}
  #calPanel .cp-head button:focus{outline:0;}
  #calPanel .cp-head button:focus-visible{outline:0;background:var(--cp-hover);}
  /* Header: title + flat round icon buttons; "+ New" is a Create-style pill. */
  #calPanel .cp-head{border-bottom:0;padding:8px 8px 4px 16px;gap:6px;}
  #calPanel .cp-head strong{font-size:20px;font-weight:400;letter-spacing:0;}
  #calPanel .cp-head button{background:transparent;border:0;border-radius:999px;min-width:40px;min-height:40px;font-size:15px;color:var(--cp-muted);transition:background .15s;}
  #calPanel .cp-head button:hover,#calPanel .cp-head button:active{background:var(--cp-hover);}
  #calPanel .cp-head .cp-close{font-size:20px;font-weight:400;width:40px;padding:0;}
  #calPanel .cp-head .cp-refresh{font-size:18px;width:40px;padding:0;}
  /* Status: a soft rounded strip instead of a full-width banner. */
  #calPanel .cp-state{border:0;margin:0 12px 4px;border-radius:8px;padding:6px 12px;background:var(--cp-soft);}
  #calPanel .cp-state.err{background:rgba(217,48,37,.1);}
  #calPanel .cp-state button{border-radius:999px;}
  #calPanel .cp-body{padding:0 8px 8px 4px;}
  /* Toolbar: [Today] ‹ › Month … [Day|Week]. */
  #calPanel .fc{font-size:12px;--fc-border-color:var(--cp-line);--fc-today-bg-color:transparent;--fc-now-indicator-color:#ea4335;--fc-page-bg-color:var(--cp-bg);--fc-neutral-bg-color:var(--cp-bg);}
  #calPanel .fc .fc-toolbar.fc-header-toolbar{margin:2px 4px 8px 8px;gap:4px;flex-wrap:nowrap;}
  #calPanel .fc .fc-toolbar-chunk{display:flex;align-items:center;gap:2px;min-width:0;}
  #calPanel .fc .fc-toolbar-chunk:first-child{flex:1 1 auto;}
  #calPanel .fc .fc-toolbar-title{font-size:20px;font-weight:400;margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #calPanel .fc .fc-button{background:transparent;border:0;color:var(--cp-text);box-shadow:none!important;font-size:14px;font-weight:500;text-transform:none;min-height:36px;transition:background .15s;}
  #calPanel .fc .fc-button:hover{background:var(--cp-hover);color:var(--cp-text);}
  #calPanel .fc .fc-button:focus-visible{outline:2px solid var(--cp-blue);outline-offset:1px;}
  #calPanel .fc .fc-today-button{border:1px solid var(--cp-line);border-radius:999px;padding:0 16px;margin-right:6px;opacity:1;}

  #calPanel .fc .fc-prev-button,#calPanel .fc .fc-next-button{width:36px;height:36px;padding:0;border-radius:50%!important;color:var(--cp-muted);}

  #calPanel .fc .fc-toolbar-chunk:last-child .fc-button-group{border:1px solid var(--cp-line);border-radius:999px;overflow:hidden;}
  #calPanel .fc .fc-timeGridDay-button,#calPanel .fc .fc-timeGridWeek-button{border-radius:0!important;padding:0 14px;font-size:13px;}

  #calPanel .fc .fc-timegrid-axis{border:0;}
  #calPanel .fc .fc-timegrid-axis-cushion{font-size:10px;color:var(--cp-muted);}
  #calPanel .fc .fc-timegrid-col{border-left:1px solid var(--cp-line);}
  /* Clearer line between the hour numbers and the day (2026-11-14, Julius: "they look way too close"): a 2px line
     a bit darker than the grid, with a few px of air after the numbers. */
  /* Dividing lines stand out (2026-11-14, Julius: "make all those lines white"): white in dark mode, near-black in
     light mode — the hour-numbers line and the all-day / timeline line. */
  #calPanel{--cp-axis-line:rgba(32,33,36,.7);}

  #calPanel .fc .fc-timegrid-slot-label,#calPanel .fc .fc-timegrid-axis{border-right:2px solid var(--cp-axis-line)!important;}
  #calPanel .fc .fc-timegrid-divider{display:table-cell;padding:0!important;height:2px;line-height:0;font-size:0;border:0!important;background:var(--cp-axis-line)!important;}
  /* All-day cap (2026-11-10, Julius): a long all-day list stops at half the calendar height (saved ratio, fw.calAllDayMax)
     and scrolls; drag the small bar under it to change the cap, double-click / double-tap it = back to half. */
  #calPanel .fc .fc-scrollgrid-section-body:has(.fc-daygrid-body) .fc-scroller{max-height:var(--cp-ad-max,none);overflow-x:hidden !important;overflow-y:auto !important;}
  /* 2026-11-21 7:45 am (Julius: "make the dividing line draggable so I can resize at will"): once dragged, the line sets
     the all-day area's real height (bigger or smaller, even with only one task); double-tap goes back to auto. */
  #calPanel.cp-adset .fc .fc-scrollgrid-section-body:has(.fc-daygrid-body) .fc-scroller{height:var(--cp-ad-max)!important;}
  #calPanel.cp-adset .fc .fc-scrollgrid-section-body:has(.fc-daygrid-body) .fc-daygrid-body,
  #calPanel.cp-adset .fc .fc-scrollgrid-section-body:has(.fc-daygrid-body) .fc-scrollgrid-sync-table{min-height:100%;}
