name: Deploy Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Stops the deploy if any pushed script has a syntax error (2026-11-04).
      - name: Syntax check
        run: node tools/check.mjs

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Restore clasp login
        run: printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

      - name: Prepare automatic code-change history
        run: python3 .github/scripts/build_deploy_log.py

      - name: Push code to Apps Script
        run: clasp push --force

      # Julius uses the /dev test link (always the latest pushed code), so no
      # versioned deployment update here (it hit the 200-version cap, 2026-10-27).

