  <style>
    :root{
      --border:#d9d9d9;
      --divider:#1f2937; /* big section lines (2026-10-31, Julius): high contrast, set in Options */
      --muted:#777;
      --bg:#f6f7f8;
      --panel:#fff;
      --accent:#1a73e8;
      --done:#666;
      --paragraph-size:14px;
      --subtitle-size:18px;
      --title-size:28px;
      --paragraph-font:Arial,Helvetica,sans-serif;
      --subtitle-font:Arial,Helvetica,sans-serif;
      --title-font:Arial,Helvetica,sans-serif;
      --col-today:420px;
      --col-journal:420px;
      --col-reference:399px;
      --pad-x:1;
      --pad-y:1;
    }
    *{
      box-sizing:border-box;
    }
    html,
    body{
      margin:0;
      height:100%;
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
      color:#222;
      background:var(--bg);
    }
    button,
    input,
    select{
      font:inherit;
    }
    #app{
      height:100%;
      display:flex;
      flex-direction:column;
    }
    #toolbar{
      min-height:36px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:5px;
      padding:2px 6px;
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    #title{
      font-weight:700;
      margin-right:8px;
      white-space:nowrap;
    }
    .btn{
      border:1px solid #c9c9c9;
      background:#fff;
      border-radius:6px;
      padding:4px 8px;
      cursor:pointer;
    }
    .btn:hover{
      background:#f0f0f0;
    }
    .btn:disabled{
      opacity:.45;
      cursor:default;
    }
    #dateLabel{
      color:#666;
      font-size:12px;
    }
    .status{
      margin-left:auto;
      color:var(--muted);
      font-size:12px;
    }
    #workspace{
      flex:1;
      min-height:0;
      display:grid;
      /* Keep all three columns at usable widths. On narrow screens,
         the whole workspace pans horizontally instead of compressing
         or stacking the columns. */
      grid-template-columns:var(--col-today) 1px var(--col-journal) 1px var(--col-reference);
      overflow-x:auto;
      overflow-y:hidden;
      width:100%;
      min-width:0;
      overscroll-behavior-x:contain;
      scrollbar-width:none;
      overflow-anchor:none;
      touch-action:pan-x pan-y;
      -webkit-overflow-scrolling:touch;
    }
    /* Single-pane focus views. Hidden panes are removed from the grid and
       the selected pane fills the visible workspace width. */
    #workspace.view-single{
      grid-template-columns:minmax(0,1fr);
      overflow-x:hidden;
    }
    #workspace .pane.view-hidden{
      display:none!important;
    }
    /* 2-column view: the third column sits just off-screen (swipe to it). */
    #workspace .pane.peek-pane{border-left:1px solid var(--border);}
    #workspace .pane.peek-pane.peek-left{border-left:0;border-right:1px solid var(--border);}
    #workspace.view-single .pane:not(.view-hidden){
      width:100%;
      min-width:0;
      border-right:0;
    }

    .column-resizer{
      width:1px;
      min-width:1px;
      position:relative;
      cursor:col-resize;
      background:var(--divider-on,var(--divider));
      box-shadow:1px 0 0 var(--divider-on,var(--divider)); /* 2px look, grid track stays 1px */
      touch-action:none;
      z-index:20;
    }
    /* Keep a comfortable invisible grab target without creating a visible gap. */
    .column-resizer::before{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:-4px;
      right:-4px;
      cursor:col-resize;
    }
    /* Square grip in the middle of each column line, same as the half-split grips (2026-10-31, Julius). */
    .column-resizer::after{content:"";position:absolute;top:50%;left:-1px;width:3px;height:22px;margin-top:-11px;border-radius:0;background:var(--divider-on,var(--divider));pointer-events:none;}
    .column-resizer:hover,.column-resizer.dragging{background:#9dbcf0;}
    #workspace.view-single .column-resizer{display:none;}
    #focusControls{
      display:none;position:fixed;top:3px;right:8px;z-index:2000;
      align-items:center;gap:5px;
    }
    #focusControls .btn,#focusControls .top-select{
      padding:4px 7px;font-size:11px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.10);
    }
    #focusStatus{
      display:none;
      margin-left:auto;
      color:var(--muted);
      font-size:11px;
      font-weight:400;
      white-space:nowrap;
    }
    body.focus-mode #focusStatus{display:inline-flex;}
    .view-menu{position:relative;}
    .view-menu-popup{
      position:absolute;
      top:calc(100% + 4px);
      left:0;
      z-index:2100;
      min-width:220px;
      padding:5px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:6px;
      box-shadow:0 4px 14px rgba(0,0,0,.16);
    }
    #focusControls .view-menu-popup{left:auto;right:0;}
    .view-menu-row{display:flex;align-items:center;gap:8px;padding:4px 5px;}
    .view-menu-row label{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer;}
    .view-menu-row input{margin:0;}
    .view-menu-row .btn{padding:3px 7px;font-size:11px;}
    .view-menu-popup[hidden]{display:none;}
    /* Cleanup (2026-11-09): Fit / Reset sizes moved into the Cols menu, Light / dark into Options. */
    :is(#toolbar,#focusControls) > :is([data-layout="fit"],[data-layout="reset-columns"],.theme-toggle){display:none!important;}
    body.focus-mode #toolbar{display:none;}
    body.focus-mode #focusControls{display:flex;}
    #todayScroll{scrollbar-width:none!important;}
    #todayScroll::-webkit-scrollbar{width:0!important;height:0!important;}
    .pane{
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      background:var(--panel);
      border-right:1px solid var(--border);
    }
    .pane:last-child{
      border-right:0;
    }
    .pane-header{
      flex:0 0 34px;
      display:flex;
      align-items:center;
      padding:0 12px;
      font-size:14px;
      font-weight:700;
      background:#fafafa;
      border-bottom:1px solid var(--border);
    }
    #todayPane .pane-header{gap:8px;}
    .today-jump{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
    .scroll{
      flex:1 1 0;
      height:0;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      overflow-anchor:none;
      scrollbar-width:none;
    }
    /* =========================================================
       DAY ROWS
       ========================================================= */
    .day-row{
      /* Day separator (Julius, 2026-10-29): thicker + darker so the line between days is easy to see. */
      border-bottom:3px solid color-mix(in srgb, var(--day-sep,#8a8a8a) var(--line-k,100%), transparent);
      padding:calc(5px * var(--pad-y,1)) calc(8px * var(--pad-x,1) * var(--side-k,1)) calc(6px * var(--pad-y,1));
      position:relative;
      display:flex;
      flex-direction:column;
      overflow:visible;
      min-height:0;
    }
    .day-row.dow-1{
      --day-bg:#eeeeee;
    }
    .day-row.dow-2{
      --day-bg:#fff0df;
    }
    .day-row.dow-3{
      --day-bg:#e6f1fb;
    }
    .day-row.dow-4{
      --day-bg:#ead8c2;
    }
    .day-row.dow-5{
      --day-bg:#fff0bd;
    }
    .day-row.dow-6{
      --day-bg:#d9b98c;
    }
    .day-row.dow-0{
      --day-bg:#fff4a8;
    }
    /* Day color brightness slider (Julius, 2026-10-27): every day-colored thing
       goes through --dc-w (mix with white) / --dc-k (mix with black). */
    .day-row[class*="dow-"]{background:color-mix(in srgb, color-mix(in srgb, var(--day-bg), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
    /* Match off in light mode too (Julius, 2026-10-27): plain white cells. Dark mode has its own rule. */
    body:not(.dm-daymatch) .day-row[class*="dow-"]{background:var(--panel,#fff);}
    .day-row{
      --note-line-adj:color-mix(in srgb, color-mix(in srgb, var(--note-line, var(--border)), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));
      --today-border-adj:color-mix(in srgb, color-mix(in srgb, var(--today-border, transparent), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));
    }
    /*
     * Current-day border.
     *
     * Both Today and Journal keep their visible outer borders.
     * The shared middle edge is drawn ONLY by the Today cell,
     * so the divider between the two cells is one line instead
     * of two overlapping borders.
     */
    .day-row.today{
      z-index:2;
    }
    .day-row.today.day-pane-row{
      box-shadow:
        inset 0 2px 0 var(--today-border-adj),
        inset 0 -2px 0 var(--today-border-adj),
        inset 2px 0 0 var(--today-border-adj),
        inset -1px 0 0 var(--today-border-adj);
    }
    .day-row.today.journal-pane-row{
      box-shadow:
        inset 0 2px 0 var(--today-border-adj),
        inset 0 -2px 0 var(--today-border-adj),
        inset -2px 0 0 var(--today-border-adj),
        inset 1px 0 0 var(--today-border-adj);
    }
    .day-row.today.dow-1{
      --today-border:#8a8a8a;
    }
    .day-row.today.dow-2{
      --today-border:#c98545;
    }
    .day-row.today.dow-3{
      --today-border:#5f8fb9;
    }
    .day-row.today.dow-4{
      --today-border:#9a6f42;
    }
    .day-row.today.dow-5{
      --today-border:#b9962e;
    }
    .day-row.today.dow-6{
      --today-border:#8b6237;
    }
    .day-row.today.dow-0{
      --today-border:#c3a51f;
    }
    .day-label{
      font-size:14px;
      font-weight:700;
      color:#555;
      margin-bottom:3px;
      user-select:none;
    }
    .day-date{text-decoration:underline;text-underline-offset:3px;}
    /* Today marker (2026-11-08, Julius: "save room"): today's date text takes the day's color, no extra space. */
    #todayScroll .day-row.today .day-date{color:var(--today-border-adj,var(--accent));}
    .day-label .day-dash{margin-left:8px;font-size:.62em;font-weight:500;color:var(--muted);white-space:nowrap;letter-spacing:0;text-decoration:none;}
    .day-label .day-dash:empty{display:none;}
    /* Narrow: the count drops under the date instead of being cut off (2026-11-07). */
    #todayScroll .day-label:has(> .day-dash:not(:empty)){display:flex;flex-wrap:wrap;align-items:baseline;white-space:normal!important;row-gap:0;column-gap:8px;}
    #todayScroll .day-label > .day-dash{margin-left:0;}
    #todayScroll .day-label .day-date{white-space:nowrap;}
    .day-label .wd-icon{display:inline-block;height:.9em;vertical-align:-.1em;margin-left:9px;background:var(--note-line-adj,currentColor);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;pointer-events:none;user-select:none;-webkit-user-select:none;}
    .day-date .dd-short{display:none;}
    .pane-narrow .day-label{white-space:nowrap;}
    .pane-narrow .day-date .dd-long{display:none;}
    .pane-narrow .day-date .dd-short{display:inline;}
    .top-select{
      border:1px solid #c9c9c9;
      background:#fff;
      border-radius:6px;
      padding:4px 6px;
      cursor:pointer;
    }
    /*
     * Today and Journal always start at Paragraph size.
     */
    .day-editor,
    .journal-editor{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
      line-height:1.18;
    }
    .editor,
    .ref-cell{
      width:100%;
      min-height:16px;
      outline:0;
      border:0;
      padding:0;
      line-height:1.18;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      min-width:0;
      background:transparent;
    }
    .ref-cell{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
    }
    .editor.day-editor,
    .editor.journal-editor{
      min-height:5.9em;
    }
    .editor:empty:before,
    .ref-cell:empty:before{
      content:attr(data-placeholder);
      color:#999;
      pointer-events:none;
    }
    .editor p,
    .ref-cell p{
      margin:0 0 1px;
    }
    .editor p:last-child,
    .ref-cell p:last-child{
      margin-bottom:0;
    }
    .editor h1,
    .editor h2,
    .editor h3,
    .ref-cell h1,
    .ref-cell h2,
    .ref-cell h3{
      margin:2px 0 1px;
    }
    .editor h1,
    .ref-cell h1{
      font-family:var(--title-font);
      font-size:var(--title-size);
      line-height:1.12;
    }
    .editor h2,
    .ref-cell h2{
      font-family:var(--subtitle-font);
      font-size:var(--subtitle-size);
      line-height:1.14;
    }
    .editor h3,
    .ref-cell h3{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
      line-height:1.18;
    }
    .editor ul,
    .editor ol,
    .ref-cell ul,
    .ref-cell ol{
      margin:1px 0 1px 20px;
      padding:0;
    }
    .editor blockquote,
    .ref-cell blockquote{
      margin:1px 0;
      padding-left:10px;
      border-left:3px solid #bbb;
      color:#222;
    }
    .editor code,
    .ref-cell code{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      background:#eee;
      padding:1px 4px;
      border-radius:3px;
    }
    /* Claude's nightly plan / wrap-up box in Notes (2026-10-26) */
    .editor table[data-cnote]{width:100%;border-collapse:separate;border-spacing:0;margin:6px 0;border:1px solid var(--border);border-radius:10px;background:var(--panel);}
    /* No colored left edge (Julius, 2026-10-26). Carry-over tasks get a "→ Day" send button. */
    .editor table[data-cnote] .check-line[data-send]::after{content:"→";flex:0 0 auto;margin-left:auto;padding:0 6px;font-size:12px;line-height:1.4;font-weight:700;border:1px solid var(--border);border-radius:6px;color:var(--muted);background:var(--bg,#fff);cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;}
    .send-menu{position:fixed;z-index:9999;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border:1px solid var(--border);border-radius:10px;background:var(--panel,#fff);box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13px;max-width:calc(100vw - 32px);}
    .send-menu button{padding:4px 10px;border:1px solid var(--border);border-radius:6px;background:#fff;cursor:pointer;font-size:13px;}
    .send-menu input[type=date]{font-size:13px;padding:3px;}
    .send-menu button small{display:block;font-size:10px;line-height:1.2;color:var(--muted);}
    .send-menu .send-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;}
    .send-menu .send-row + .send-row{border-top:1px solid var(--border);padding-top:6px;}
    .send-menu select{font-size:13px;padding:3px;max-width:200px;}
    .send-menu .send-lbl{font-size:12px;color:var(--muted);}
    .editor table[data-cnote] td{padding:8px calc(10px * var(--side-k,1));vertical-align:top;border:none;}
    /* Divided cells (Julius, 2026-10-26): each section of a cells-mode block is its own row */
    /* Dividers in the day's own deeper color (Julius, 2026-10-26: Wednesday blue → deeper blue), with more room */
    /* Deeper than the today-border so they also stand out under the phone's dark mode (Monday gray was too faint) */
    .day-row.dow-1{--note-line:#4d4d4d;} .day-row.dow-2{--note-line:#b06a2c;} .day-row.dow-3{--note-line:#3f74a6;}
    .day-row.dow-4{--note-line:#7d5630;} .day-row.dow-5{--note-line:#9a7a12;} .day-row.dow-6{--note-line:#6e4a24;}
    .day-row.dow-0{--note-line:#a3870a;}
    .editor table[data-cnote]{border-color:color-mix(in srgb, var(--note-line-adj) var(--line-k,100%), transparent);}
    .editor table[data-cnote] tr + tr > td{border-top:1.5px solid var(--note-line-adj);padding-top:10px;padding-bottom:10px;}
    /* Uniform 1.5px lines (between the old 2px and 1px, Julius 2026-10-27); inside shows the day's own color (Julius, 2026-10-27) */
    .editor table[data-cnote]{border-width:1.5px;background:transparent;} /* same as the day's color (Julius, 2026-10-27) */
    /* Underlined names (Focus areas, Priority check entries) read bold, like the Suggested day */
    .editor table[data-cnote] u{font-weight:700;}
    /* Block titles (Julius, 2026-10-29: the full yellow / purple banners were too much): Suggested Day and
       Day Wrap-Up get a quiet title — colored text + thin underline, no fill, no section bars.
       Only the Schedule cell keeps the bold filled banner (he likes how obvious it is). */
    .editor table[data-cnote] tr:first-child > td > div:first-child{display:block;margin:-2px 0 6px;padding:2px 0 3px;font-size:1.05em;}
    .editor table[data-cnote] tr:first-child > td > div:first-child u{text-decoration:none;}
    .editor table[data-cnote][data-ckind="plan"] tr:first-child > td > div:first-child{color:var(--cn-acc);border-bottom:2px solid var(--cn-acc);}
    .editor table[data-cnote][data-ckind="wrap"] tr:first-child > td > div:first-child{color:var(--cn-acc);border-bottom:2px solid var(--cn-acc);}
    .editor table[data-cnote] tr:first-child > td > div:first-child i{color:inherit;opacity:.75;}
    .editor table[data-cnote][data-ckind="plan"]{--cn-acc:#a87c00;}
    .editor table[data-cnote][data-ckind="wrap"]{--cn-acc:#8a3fd1;}
    @media (prefers-color-scheme: dark){
      .editor table[data-cnote][data-ckind="plan"]{--cn-acc:#f0c94a;}
      .editor table[data-cnote][data-ckind="wrap"]{--cn-acc:#c29af0;}
    }
    /* Schedule cell (2026-10-29): time-block tasks moved out of Today's Morning block; blue banner. */
    .editor table[data-cnote][data-ckind="sched"] tr:first-child > td > div:first-child{background:#3b82f6;color:#fff;padding:4px 8px;border-radius:7px;}
    .editor table[data-cnote][data-ckind="sched"][data-ccells] tr + tr > td > div:first-child{border-left:4px solid var(--cn-acc);padding-left:7px;margin-left:-2px;}
    .editor table[data-cnote][data-ckind="sched"]{--cn-acc:#3b82f6;}
    .editor table[data-cnote][data-ckind="sched"] .check-line{padding:2px 0;}
    .check-line{
      display:flex;
      align-items:flex-start;
      gap:5px;
      min-height:16px;
    }
    .check-line input{
      margin-top:1px;
      flex:0 0 auto;
    }
    .check-text{
      flex:1;
      min-width:0;
      min-height:1.18em;
      line-height:1.18;
      display:block;
    }
    .check-line.done > .check-text,
    .check-line > input[type="checkbox"]:checked + .check-text{
      color:var(--done);
      opacity:.82;
    }
    .check-line.task-struck > .check-text{text-decoration:line-through;}
    body.urg-pressing,body.urg-pressing *{-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;}
    /* Narrow columns (Julius, 2026-10-27): the checkbox floats at the top-left and the text's
       second line onward runs underneath it, using the full width. Due date goes under the text. */
    /* .pane-narrow is set by initNarrowPanes() when a pane is under 420px wide. */
    .pane-narrow .check-line:not([data-tlon]){display:flow-root;min-height:calc(18px * var(--workspace-scale,1));}
    .pane-narrow .check-line:not([data-tlon]) > input[type=checkbox]{float:left;margin:1px 5px -12px 0;}
    /* Done text is faded (opacity → own layer), which painted it over the floated box and ate taps (Julius, 2026-10-28). Keep the box on top. */
    .check-line > input[type=checkbox]{position:relative;z-index:1;}
    .pane-narrow .check-line:not([data-tlon]) > .check-text{display:block;}
    .pane-narrow .check-line:not([data-tlon])[data-due-label]::after{display:block;white-space:normal;text-align:right;margin:1px 0 0;}
    /* Notes send lines when narrow: the → button floats top-right (as ::before so it comes first), text wraps under both. */
    .pane-narrow .editor table[data-cnote] .check-line[data-send]::after{content:none;}
    .pane-narrow .editor table[data-cnote] .check-line[data-send]::before{content:"→";float:right;margin:0 0 -10px 4px;padding:0 6px;font-size:12px;line-height:1.4;font-weight:700;border:1px solid var(--border);border-radius:6px;color:var(--muted);background:var(--bg,#fff);cursor:pointer;-webkit-user-select:none;user-select:none;}
    .check-line > .check-text{align-self:flex-start;}
    .editor pre.code-block,.ref-cell pre.code-block{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;
      font-size:.95em!important;line-height:1.4!important;
      white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;
      background:#f1f3f5;border:1px solid #d9dde2;border-radius:6px;
      padding:8px 10px;margin:5px 0;color:#20252b;min-height:1.4em;
    }
    .ref-cell pre.code-block *,.editor pre.code-block *{font-family:inherit!important;font-size:inherit!important;line-height:inherit!important;}
    .editor pre.code-block code,.ref-cell pre.code-block code{background:none;padding:0;}
    /*
     * Indentation only changes horizontal position.
     * It NEVER changes text color.
     */
    /* =========================================================
       REFERENCE
       ========================================================= */
    #referenceScroll{
      padding:6px 5px 40px;
    }
    #refTopScroll{padding:6px 5px 10px;}
    #refTopScroll:empty{display:none;}
    #refTopScroll{flex:var(--rs-a,1) 1 0;}
    #referenceScroll{flex:var(--rs-b,1) 1 0;min-height:30px;} /* never fully hidden: the bar + a strip stay reachable (Julius, 2026-10-31) */
    #refTopScroll:empty + #refSplitBar{display:none;}

    #journalPane .journal-editor > :is([data-nsec="focus"],[data-nsec="focus"] ~ :not(table,table ~ *)){display:none!important;}

    .hx-box{position:relative;}

    /* Due group in Notes (2026-10-27): its own box under the Suggested day, collapsible. */
    .due-notes{margin:6px 0;padding:4px 8px 5px;border:1.5px solid var(--note-line-adj,var(--border));border-radius:10px;-webkit-user-select:text;user-select:text;}

    #urgentPanel .urg-text[data-tcpick],#inboxPanel .urg-text[data-tcpick],.due-notes .di-text[data-tcpick]{outline:none;box-shadow:0 0 0 1px var(--urg,#8a8f98);border-radius:4px;}
    .due-notes .di-from{flex:0 0 auto;align-self:flex-start;display:flex;gap:.25em;align-items:flex-end;line-height:1.15;white-space:nowrap;}

    .urg-goto{flex:1 0 100%;margin-top:4px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;color:inherit;font-size:12px;cursor:pointer;text-align:left;}
    /* Reference options, Urgent create, Inbox, −/+ toggles (2026-10-26, Julius). */
    /* Sort-row buttons match the Sort dropdown's size, and the row wraps instead
       of running off a phone screen (2026-10-26, Julius). */
    .ref-options{max-width:100%;box-sizing:border-box;overflow-wrap:anywhere;}
    .ref-options .ts-check{flex-wrap:wrap;}
    .ref-options .ts-check select{max-width:100%;}

    .ref-options .ref-collapse-all{min-width:1.6em;padding:0 6px;font-weight:700;}
    .ref-options{margin:0 0 10px;padding:6px 10px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;}
    /* Pop-up over the content instead of pushing it down (Julius, 2026-10-26); closes on tap outside */
    .ref-options{position:fixed;z-index:3000;margin:0;width:min(300px,calc(100vw - 32px));max-height:70vh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.18);border-radius:10px;}

    .ref-opt-tip{margin-top:4px;font-size:12px;color:var(--muted);}
    .pm-box{display:inline-grid;place-content:center;box-sizing:border-box;width:.95em;height:.95em;margin-right:4px;border:1px solid currentColor;border-radius:3px;font-size:.8em;line-height:1;font-weight:700;opacity:.75;vertical-align:-.15em;}
    .urg-head{display:flex;align-items:center;}
    .urg-head-row{display:flex;align-items:center;gap:6px;}

    .urg-head-row .urg-add-btn{flex:0 0 auto;min-width:24px;height:22px;padding:0 6px;border:1px solid var(--divider,#777);border-radius:5px;background:transparent;color:inherit;font:inherit;font-weight:700;line-height:1;cursor:pointer;}
    .urg-add{flex:0 0 auto;font-size:11px;padding:1px 7px;}
    /* Empty add lines only on hover / focus / after tapping the level heading (cleanup 2026-11-09). */
    #urgentPanel .urg-group:not(:hover):not(:focus-within):not(.show-add) > .urg-row.urg-adder{display:none!important;}
    .urg-group > .urg-sub{cursor:pointer;}
    .urg-head,.urg-sub{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
    .urg-sub{cursor:context-menu;}
    .urg-empty{font-size:12px;color:var(--muted);padding:4px 0 2px;}
    #urgentPanel.wrap .urg-row{align-items:flex-start;}
    /* Narrow panel (Julius, 2026-10-27): when text + dates don't fit on one line, the
       dates drop to their own short line under the task instead of squeezing the text
       into a tall column. Lines break by full (unwrapped) widths first. */
    #urgentPanel .urg-row{gap:6px;}
    #urgentPanel.wrap .urg-row > .urg-text{flex:1 1 0;min-width:4em;}
    #urgentPanel .urg-meta{order:2;flex:0 0 auto;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:0;line-height:1.15;text-align:right;}

    /* Space savers only when the Reference column is narrow (.pane-narrow, < 420px; Julius 2026-10-27):
       weekday / date / days left stack as three short lines on the right, and the task text
       runs under its box after the first line. */
    .pane-narrow #urgentPanel .urg-meta .urg-date{flex-direction:column;align-items:flex-end;gap:0;}

    #urgentPanel .urg-row.urg-adder{display:flex!important;align-items:center;flex-wrap:nowrap;}

    /* Title lines (sections like Morning): the name keeps its width, the − / + "50 out of
       50 done" label wraps onto more lines instead of crushing the name (Julius, 2026-10-27). */
    /* 2026-11-07 (Julius: "+ 2 hidden" broke into "hidd / en"): the − / + button stays on one line; the title text wraps instead. */
    /* Too narrow for both: the button drops under the title (whole), words never break into letters. */
    [data-tlon]{flex-wrap:wrap;row-gap:2px;}

    [data-tlon] > .check-text{flex:1 1 0%;} /* stays beside the checkbox, uses the free width; wraps inside */

    #urgentPanel.wrap .urg-row .urg-box{margin-top:2px;}

    .urg-create-menu{position:fixed;z-index:3002;display:flex;flex-direction:column;min-width:170px;padding:4px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.15);}

    .ucm-item.first{font-weight:700;}

    #urgentPanel .urg-text[contenteditable="true"]{cursor:text;outline:none;border-radius:3px;}
    #urgentPanel .urg-text[contenteditable="true"]:focus{white-space:normal;overflow:visible;box-shadow:0 0 0 1px var(--urg);border-radius:4px;padding:1px 4px;margin:-1px -4px;}

    #urgentPanel .urg-text:empty::before{content:attr(data-ph);opacity:.45;font-style:italic;}

    #urgentPanel .urg-text.urg-tx-hold{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
    .urg-text-menu{padding:6px;}

    .urg-struct-row{flex:1 0 100%;display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px;}
    .urg-struct{padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:transparent;color:inherit;font-size:12px;cursor:pointer;text-align:center;}

    #urgentPanel.wrap .urg-row:has(> .urg-fold) > .urg-text{flex:0 1 auto;}

    #calPanel{margin:0 0 6px;padding:4px 7px 5px;border:1px solid var(--border);border-radius:8px;background:#fff;}

    #inboxPanel .inbox-row{display:flex;align-items:flex-start;gap:6px;padding:4px 0;cursor:default;}

    /* (Julius, 2026-10-27) Reference: Sort / − / Options sit in the REFERENCE header

    .ref-pane-header{gap:6px;min-width:0;}

    /* =========================================================
       DARK MODE (Julius, 2026-10-27): our own, so the phone doesn't auto-invert.
       Black background; the day colors stay exactly as in light mode
       (Wednesday stays blue) with dark text on them. Adjust from here.
       ========================================================= */
    @media (prefers-color-scheme: dark){
      :root{--dm-cell-l:11;--dm-tint:#ffffff;--dm-cell:color-mix(in srgb,var(--dm-tint) calc(var(--dm-cell-l) * 1%),#000);--dm-l:52;--dm-text:hsl(0 0% calc(var(--dm-l) * 1%));--dm-muted:hsl(0 0% calc(var(--dm-l) * .82%));--muted:var(--dm-muted);--done:hsl(0 0% calc(var(--dm-l) * .75%));--text:var(--dm-text);--bg:#000;--panel:#000;--border:#3a3a3a;--divider:#e5e7eb;color-scheme:dark;}
      html,body{background:#121212;color:var(--dm-text);}
      #toolbar,#focusControls,.pane-header,.pane{background:#121212;color:var(--dm-text);}
      .btn,.top-select,.send-menu button,.urg-due-clear,.uc-today{background:#1c1c1c;color:var(--dm-text);border-color:#444;}
      .btn:hover{background:#2a2a2a;}
      #urgentPanel,#calPanel,#inboxPanel,.ref-options{background:#111;color:var(--dm-text);}
      .ref-cell{color:var(--dm-text);}
      .ref-hold > .ref-cell > h2:first-child{background:#1d2738;}
      .ucm-item:hover{background:#222;}
      /* Pop-ups and menus: dark too */
      .ctx-menu,.urg-picker,.urg-cal,.urg-create-menu,.send-menu,.archive-box,.view-menu-popup,.type-settings{background:#161616;color:var(--dm-text);}
      .urg-pick{background:#1c1c1c;}
      input,select,textarea{background:#1c1c1c;color:var(--dm-text);}
      /* Day cells (Julius, 2026-10-27): back to dark day colors like the phone's
         original dark mode (light ones were too bright), light text; the lines
         (note boxes, today outline) use the day's LIGHT color. */
      .day-row{color:var(--dm-text);--day-sep:#6a6a6a;}
      .day-row .day-label{color:#969696;}
      .day-row.dow-1{background:var(--dm-cell);--note-line:#ababab;}
      .day-row.dow-2{background:var(--dm-cell);--note-line:#c29f7b;}
      .day-row.dow-3{background:var(--dm-cell);--note-line:#87a4c0;}
      .day-row.dow-4{background:var(--dm-cell);--note-line:#b09b82;}
      .day-row.dow-5{background:var(--dm-cell);--note-line:#c0ae62;}
      .day-row.dow-6{background:var(--dm-cell);--note-line:#b59d79;}
      .day-row.dow-0{background:var(--dm-cell);--note-line:#c2b562;}
      /* Day-colored dark cells (Julius, 2026-10-27): each day's cell = black → that day's color,
         same Dark cells slider. Colors per day in Options (defaults = the light day colors). */
      /* (Julius, 2026-10-27) no inversion: the cell is the picker color as-is (defaults = the LIGHT day colors),
         then the Day colors slider makes it darker / lighter, same as in light mode. */
      body.dm-daymatch .day-row.dow-1{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-1,#eeeeee), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-2{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-2,#fff0df), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-3{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-3,#e6f1fb), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-4{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-4,#ead8c2), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-5{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-5,#fff0bd), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-6{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-6,#d9b98c), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      body.dm-daymatch .day-row.dow-0{--dm-cell:color-mix(in srgb, color-mix(in srgb, var(--dmd-c-0,#fff4a8), #fff var(--dc-w,0%)), #000 var(--dc-k,0%));}
      /* Match off (Julius, 2026-10-27): plain dark cells, whatever else sets a day background. */

/* Floating Focus View: retain the live editor DOM and its autosave listeners. */
/* Held-open cell (2026-11-04, Julius): same color as the cell it came from (set when it opens), a light dim behind it, a smaller window. */
body{--fw-focus-bg:var(--dm-cell,var(--panel,#fff));}
body.fw-focus-on .fw-focus-target{--panel:var(--fw-focus-bg);}
/* Tucked strip + pull tab (2026-11-06, Julius). */
.fw-tucked{overflow:hidden!important;} .fw-tucked > *{visibility:hidden!important;}
.fw-tuck-tab{position:fixed;z-index:60;width:16px;height:46px;padding:0;border:1px solid var(--divider,#777);border-radius:6px;background:var(--panel,#fff);color:var(--text,#333);font:700 13px/1 system-ui,sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation;}
.fw-tuck-tab.y{width:46px;height:16px;font-size:11px;}
body.fw-focus-on .fw-tuck-tab{display:none;}
#fwFocusBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:9000;display:none;}
.hz-bar{position:fixed;top:calc(5dvh + 6px);right:calc(4vw + 14px);z-index:9003;display:flex;gap:3px;padding:2px;border-radius:7px;background:var(--panel,#fff);box-shadow:0 2px 8px rgba(0,0,0,.25);}
.hz-bar button{font:inherit;font-size:12px;line-height:1;padding:3px 7px;border:1px solid var(--divider,#777);border-radius:5px;background:transparent;color:inherit;cursor:pointer;}
.hz-bar button[aria-pressed="true"]{background:var(--text,#333);color:var(--bg,#fff);border-color:var(--text,#333);}
body.fw-focus-on #fwFocusBackdrop{display:block;}
/* Zoomed cell on top of everything (2026-11-05): a parent with its own z-index (the day row has z-index:2) capped it, so
   other columns drew over the zoom and its Blocks neighbour showed. While zoomed, its parents drop their z-index. */
body.fw-focus-on :has(.fw-focus-target){z-index:auto!important;}
body.fw-focus-on .fw-focus-target{position:fixed!important;inset:5dvh 4vw!important;width:92vw!important;height:90dvh!important;max-width:none!important;max-height:none!important;min-height:0!important;overflow:auto!important;z-index:9001!important;background:var(--fw-focus-bg)!important;color:var(--text,#222)!important;border:1px solid var(--border,#aaa)!important;border-radius:10px!important;padding:calc(12px * var(--pad-y,1)) calc(12px * var(--pad-x,1))!important;box-shadow:0 12px 48px rgba(0,0,0,.3)!important;flex:none!important;transform:none!important;}
body.fw-focus-on .fw-focus-target.plan-pad{padding-top:36px!important;}
body.fw-focus-on .fw-focus-target.plan-pad::before{content:'Blocks';position:sticky;top:0;display:block;font-weight:700;background:var(--panel,#fff);}
body.fw-focus-on .fw-focus-target.thought-pad{padding-top:36px!important;}
body.fw-focus-on .fw-focus-target.thought-pad::before{content:'Focus / Thinking';position:sticky;top:0;display:block;font-weight:700;background:var(--panel,#fff);}
@media(max-width:600px){body.fw-focus-on .fw-focus-target{inset:5dvh 3vw!important;width:94vw!important;height:90dvh!important;padding:calc(8px * var(--pad-y,1)) calc(8px * var(--pad-x,1))!important;}}

#centerCalendarList .ce-event{display:flex;align-items:flex-start;gap:7px;}

@container (max-width:260px){#centerDownScroll .ce-head{gap:3px;}#centerDownScroll .ce-head strong{font-size:0;}#centerDownScroll .ce-head strong::before{content:"📅";font-size:14px;} /* narrow: a 📅 instead of hiding the title (2026-11-07) */#centerDownScroll .ce-head .ce-search{min-width:36px;padding:1px 4px;}#centerDownScroll .ce-head:has(.ce-search:focus) :is([data-ce-sort],[data-ce-day]){display:none;}#centerDownScroll .ce-head .ce-search:focus{max-width:none;}}

/* History readability (2026-11-05, Julius): a line + room between Morn / After / Night, smaller count buttons,
   underlined New / Fixes / Tweaks headings with space between them. */
#todayScroll .day-editor > :is([data-tsec="afternoon"],[data-tsec="evening"]){margin-top:14px!important;border-top:1px solid var(--divider,#888)!important;padding-top:7px!important;}
#todayScroll .ts-count{font-size:.82em;line-height:1.2;padding:0 6px;min-height:20px;}
#todayScroll .ts-row + .ts-row{margin-top:7px;}
#todayScroll .ts-type{margin-top:5px;}
#todayScroll .ts-type > b{text-decoration:underline;text-underline-offset:2px;margin-bottom:1px;}
#todayScroll .day-editor > [data-tsf]{cursor:pointer;}
#todayScroll .day-editor > [data-tsec]::before{flex:0 0 auto;margin-top:.1em;}
#todayScroll .day-editor > [data-tsec]::after{flex:1 1 0;min-width:0;white-space:pre-line;overflow-wrap:anywhere;}
#todayScroll .day-editor > [data-tsec="morning"][data-tsf="o"]::after{content:"Morn 6–2 · " attr(data-tsinfo) "\00A0\00A0−";}
#todayScroll .day-editor > [data-tsec="morning"][data-tsf="c"]::after{content:"Morn 6–2 · " attr(data-tsinfo) "\00A0\00A0+";}
#todayScroll .day-editor > [data-tsec="afternoon"][data-tsf="o"]::after{content:"Aft 2–8 · " attr(data-tsinfo) "\00A0\00A0−";}
#todayScroll .day-editor > [data-tsec="afternoon"][data-tsf="c"]::after{content:"Aft 2–8 · " attr(data-tsinfo) "\00A0\00A0+";}
#todayScroll .day-editor > [data-tsec="evening"][data-tsf="o"]::after{content:"Eve 8–6 · " attr(data-tsinfo) "\00A0\00A0−";}
#todayScroll .day-editor > [data-tsec="evening"][data-tsf="c"]::after{content:"Eve 8–6 · " attr(data-tsinfo) "\00A0\00A0+";}
/* Full time windows (2026-11-05, Julius): label = render-only .ts-lab ("Morn 6–2"; was "Morn 8–2 (6a–2p)" until 2026-11-07), ::after keeps only the count. */
#todayScroll .day-editor > [data-tsec] > .ts-lab{order:1;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:calc(var(--paragraph-size,14px) * .75)!important;font-weight:600;letter-spacing:.02em;text-transform:none;white-space:nowrap;}
#todayScroll .day-editor > [data-tsec] > .ts-lab small{font-size:.8em;font-weight:500;opacity:.75;margin-left:.3em;}
#todayScroll .day-editor > [data-tsec]:has(> .ts-lab)::after{order:2;content:""!important;flex:0 0 auto!important;white-space:nowrap!important;overflow-wrap:normal!important;}
/* Too narrow for one line: the count moves under the label as one piece (2 lines, never 4). */
#todayScroll .day-editor > [data-tsec]:has(> .ts-lab){flex-wrap:wrap;row-gap:0;}
#todayScroll .day-editor > [data-tsec][data-tsf="o"]:has(> .ts-lab)::after{content:"\00A0· " attr(data-tsinfo) "\00A0\00A0−"!important;}
#todayScroll .day-editor > [data-tsec][data-tsf="c"]:has(> .ts-lab)::after{content:"\00A0· " attr(data-tsinfo) "\00A0\00A0+"!important;}

.editor [data-nsec="must"]{position:relative;}
/* Small and inside the DAILIES lines (2026-11-03, Julius): flow-root keeps the floated button within the header. */
.editor > [data-nsec="must"]{display:flex;align-items:center;justify-content:space-between;}
/* DAILIES starts right at the header line, so its text and Options sit midway between the two lines. */
.editor > [data-nsec="must"]{padding-top:2px;}
body.one-day #journalScroll .day-row.od-on{padding-top:0!important;}
body.one-day #journalScroll .day-row.od-on .journal-editor{padding-top:0!important;margin-top:0!important;}
.editor .daily-sort-btn{flex:0 0 auto;margin:0;font:inherit;font-size:9px;line-height:1;letter-spacing:0;text-transform:none;border:1px solid currentColor;border-radius:3px;background:transparent;color:inherit;padding:0 3px;min-height:0;cursor:pointer;}
.editor .daily-sort-menu{position:absolute;right:0;top:100%;z-index:20;background:var(--panel,#fff);border:1px solid var(--border,#888);border-radius:6px;padding:4px;box-shadow:0 5px 15px #0003;min-width:145px;}
.editor .daily-sort-menu[hidden]{display:none!important;}
.editor .daily-sort-menu button{display:block;width:100%;padding:7px;text-align:left;background:transparent;border:0;color:var(--text);font-size:12px;cursor:pointer;}
</style><style id="wsFrame">
  /* ===== Workspace frame (2026-11-21, Julius: "cells in one workspace"; NOTES "Workspace shell") =====
     Tokens + the frame itself. Stays in the head: updateWorkspaceLayout measures workspace.clientWidth at start-up.
     Dark first: :root holds the dark values, html[data-theme=light] the light ones. Divider color + Line strength
     (Options) still tint --ws-line through --divider. The rest of the shell is in Index_Layout #uiBatchCss (8). */
  :root{
    --ws-radius:14px;
    --ws-line:color-mix(in srgb,var(--divider,#e5e7eb) 20%,#121212);
    --ws-surface:#121212;
    --ws-head-bg:#191919;
    --ws-head-fg:var(--dm-muted,#9a9a9a);
    --ws-page:#080808;
    --ws-head-h:32px;
    --ws-head-fs:12px;
    --ws-cell-pad:16px;
    --ws-gap:8px;
  }
  html[data-theme=light]{
    --ws-line:color-mix(in srgb,var(--divider,#1f2937) 24%,#fff);
    --ws-surface:var(--panel,#fff);
    --ws-head-bg:#f6f7f9;
    --ws-head-fg:#4b5563;
    --ws-page:#eef0f3;
  }
  @media (max-width:1024px){:root{--ws-cell-pad:12px;--ws-gap:6px;}}
  @media (max-width:720px){:root{--ws-cell-pad:8px;--ws-gap:4px;--ws-head-h:30px;--ws-head-fs:11.5px;--ws-radius:12px;}}
  html,body{background:var(--ws-page)!important;}
  html body #workspace{
    width:auto;box-sizing:border-box;
    margin:0 max(var(--ws-gap),env(safe-area-inset-right)) max(var(--ws-gap),env(safe-area-inset-bottom)) max(var(--ws-gap),env(safe-area-inset-left));
    border:1px solid var(--ws-line);border-radius:var(--ws-radius);
    background:var(--ws-surface);box-shadow:none;
  }
  body.tb-hidden #workspace{margin-top:var(--ws-gap);}
  /* Reference drawer starts closed (2026-11-22, Julius: "the Reference pops up first when I open the app"). The drawer's
     full CSS sits in Index_Layout at the end of the page, so until it parsed the pane showed as a column and then slid away.
     The markup carries .rd-drawer from the start; this keeps it off screen from the first paint. */
  body:not(.rd-open) #workspace #referencePane.rd-drawer{position:fixed!important;visibility:hidden;transform:translateX(105%);}
</style>
