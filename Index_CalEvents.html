<script>

  /* ---------------------------------------------------------
     INBOX (2026-10-26, Julius): quick captures under Urgent.
     Claude adds items through inbox.js (pushed from GitHub); you can type
     them here too. Shown as **Title**: details. → Today makes it a task in
     today's cell; ✕ dismisses. Collapsed by default.
     --------------------------------------------------------- */

  /* ---------------------------------------------------------
     Calendar events (2026-10-26, Julius): between Urgent and Inbox.
     Today's events first, then the next few days, straight from Google
     Calendar (getCalendarEvents in Code.gs). Loaded after the app opens,
     refreshed with ↻ or when the app comes back to the front.
     --------------------------------------------------------- */
  // Calendar panel back (2026-10-29, Julius): every calendar event lives here as a checkbox (tick = Graphite = done).
  let centerCalendarSeq = 0, ceShownDate = '', ceDraw = null;
  /* Mini day view (2026-11-11, Julius; the 4-box view was removed the same day): a small scrollable timeline of the
     day's timed events on top of Cal Events, toggled by 🕒. View only; colors follow urgency, done is grey. */
  // 2026-11-11 (Julius): the timeline is on by default (🕒 still hides it); − / + zoom its hour height (per device).
  function ceDayOn(){ try{ return localStorage.getItem('fw.ceDay') !== '0'; }catch(e){ return true; } }
  const CE_HOUR_MIN = 18, CE_HOUR_MAX = 170; // max raised so 15-minute lines are reachable (2026-11-11)
  let CE_HOUR = 36;
  try{ const v = Number(localStorage.getItem('fw.ceHour')); if(v >= CE_HOUR_MIN && v <= CE_HOUR_MAX) CE_HOUR = v; }catch(e){}
  let ceDayTopNext = -1; // scroll position to use on the next draw (zoom keeps the middle of the view in place)
  let ceeFloorFix = false; // guards the one-shot zoom-out-floor redraw
  /* Hide from the list (2026-11-11, Julius): whole calendars (e.g. the dog walks) and title words (sleep, nap,
     cooldown…) stay off the Cal Events list but still show on the timeline. Saved in the Sheet's script properties
     (getCalEventsHide / setCalEventsHide), cached on the device so the first draw is right. */
  let ceHide = {cals: [], words: []}, ceHideLoaded = false, ceShowHidden = false;
  const ceOpt = {open: false, cals: false};
  try{ const h = JSON.parse(localStorage.getItem('fw.ceHide') || 'null'); if(h && Array.isArray(h.cals) && Array.isArray(h.words)) ceHide = h; }catch(e){}
  function ceIsHidden(ev){
    const t = String(ev.title || '').toLowerCase();
    return ceHide.words.some(w => w && t.includes(String(w).toLowerCase()));
  }
  function ceHideSave(){
    try{ localStorage.setItem('fw.ceHide', JSON.stringify(ceHide)); }catch(e){}
    if(ceDraw) ceDraw();
    google.script.run.withFailureHandler(err => { if(typeof setStatus === 'function') setStatus('Could not save the Cal Events hide list: ' + (err && err.message || err)); })
      .setCalEventsHide(ceHide);
  }
  function ceHideLoad(){
    if(ceHideLoaded) return; ceHideLoaded = true;
    google.script.run.withSuccessHandler(h => {
      if(!h || !Array.isArray(h.cals) || !Array.isArray(h.words)) return;
      if(JSON.stringify(h) === JSON.stringify(ceHide)) return;
      ceHide = h; try{ localStorage.setItem('fw.ceHide', JSON.stringify(h)); }catch(e){}
      if(ceDraw) ceDraw();
    }).withFailureHandler(() => { ceHideLoaded = false; }).getCalEventsHide();
  }
  const CE_HIDE_SUGGEST = ['Sleep','Nap','Cooldown','Wake','Walk','Work Block'];
  function ceOptHtml(full){
    const seen = []; full.events.forEach(ev => { if(ev.calId && !seen.some(c => c.id === ev.calId)) seen.push({id: ev.calId, name: ev.cal || ev.calId}); });
    ceHide.cals.forEach(c => { if(!seen.some(x => x.id === c.id)) seen.push(c); });
    const low = ceHide.words.map(w => String(w).toLowerCase());
    // 2026-11-13 (Julius): ⚙ sits by the search box; the 🕒 day-calendar switch lives in here now.
    return '<div class="ce-opt" data-ce-optbox><div class="ce-opt-h"><b>Options</b><button type="button" class="btn" data-ce-opt-done>Done</button></div>' +
      '<label class="ce-opt-c"><input type="checkbox" data-ce-day' + (ceDayOn() ? ' checked' : '') + '> 🕒 Day calendar (off = events list)</label>' +
      // 2026-11-13 (Julius): one ⚙ — the calendar's own ⚙ (which calendars show) and the Cats / Time order live here too.
      // 2026-11-13 evening (Julius): the colored calendar checkboxes live only here (moved out of the calendar).
      (window.fwCalendar && window.fwCalendar.mountCals ? '<button type="button" class="ce-opt-s ce-opt-sf" data-ce-calsfold aria-expanded="' + (ceOpt.cals ? 'true' : 'false') + '">' + (ceOpt.cals ? '▾' : '▸') + ' Calendars</button><div class="ce-opt-cals" data-ce-calslot' + (ceOpt.cals ? '' : ' hidden') + '></div>' : '') +
      (!ceDayOn() ? '<div class="ce-opt-s">List order</div><label class="ce-opt-c"><input type="radio" name="ceSort" data-ce-sortpick="cat"' + (ceSortMode() === 'cat' ? ' checked' : '') + '> By category</label><label class="ce-opt-c"><input type="radio" name="ceSort" data-ce-sortpick="time"' + (ceSortMode() !== 'cat' ? ' checked' : '') + '> By time</label>' : '') +
      // The old "Hide from the list → Calendars" checkboxes are gone (duplicate of the list above, 2026-11-13).
      // Title words only matter for the events list, so they show only when the day calendar is off.
      (ceDayOn() ? '' : '<div class="ce-opt-s">Hide titles from the list</div><div class="ce-opt-w">' + ceHide.words.map(w => '<span class="ce-chip on">' + esc(w) + '<button type="button" data-ce-hword-x="' + esc(w) + '" aria-label="Stop hiding ' + esc(w) + '">✕</button></span>').join('') +
      CE_HIDE_SUGGEST.filter(w => low.indexOf(w.toLowerCase()) < 0).map(w => '<button type="button" class="ce-chip" data-ce-hword-add="' + esc(w) + '">+ ' + esc(w) + '</button>').join('') + '</div>' +
      '<form class="ce-opt-f" data-ce-hword-form><input type="text" maxlength="40" placeholder="Word or phrase" aria-label="Hide titles containing"><button type="submit" class="btn">Add</button></form>') + '</div>';
  }
  function ceDayScroll(data){
    const t = data.events.filter(ev => !ev.allDay && !ev.done).map(ev => Number(ev.start)).sort((a,b) => a - b)[0];
    const now = new Date(), isToday = data.date === localToday();
    const h = isToday ? now.getHours() + now.getMinutes() / 60 - 1 : t ? new Date(t).getHours() - 0.5 : 8;
    return Math.max(0, h * CE_HOUR);
  }
  function ceDayHtml(data){
    const timed = data.events.filter(ev => !ev.allDay).sort((a,b) => a.start - b.start || b.end - a.end);
    const d0 = new Date(data.date + 'T00:00:00').getTime();
    // Colors (2026-11-11, Julius): each event's own color, else its calendar's color, like 📅; done = grey.
    /* Readable band (2026-11-11, Julius): a too-light fill (Cooldown) is nudged darker, a too-dark one lighter, so
       the text always has something to sit on; everything in between stays exactly as Google has it. */
    const band = hx => {
      const m = /^#?([0-9a-f]{6})$/i.exec(hx || ''); if(!m) return hx;
      const n = parseInt(m[1], 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
      // Softened like Google's chips (2026-11-11, Julius: "too vibrant"): 20% toward white, then the readable band.
      r += (255 - r) * 0.2; g += (255 - g) * 0.2; b += (255 - b) * 0.2;
      const L = (Math.max(r,g,b) + Math.min(r,g,b)) / 510;
      if(L > 0.70){ const f = 0.70 / L; r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f); } // ceiling 0.86 → 0.78 → 0.70 (2026-11-11, Julius: Chill kept reading too light)
      else if(L < 0.26){ const k = (0.34 - L) / (1 - L); r = Math.round(r + (255 - r) * k); g = Math.round(g + (255 - g) * k); b = Math.round(b + (255 - b) * k); }
      return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
    };
    const col = ev => band(ev.done ? '#bdbdbd' : ev.hex || ({1:'#e67c73', 2:'#e6ba57', 3:'#4285f4'})[ev.urg] || '#8ab4f8');
    const ink = hx => { const m = /^#?([0-9a-f]{6})$/i.exec(hx || ''); if(!m) return '#1f1f1f'; const n = parseInt(m[1], 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255 > 0.6 ? '#1f1f1f' : '#fff'; };
    // Overlaps: greedy lanes inside each cluster of touching events.
    const out = []; let cluster = [], end = 0;
    const flush = () => { const lanes = []; cluster.forEach(ev => { let l = lanes.findIndex(x => x <= ev.start); if(l < 0){ l = lanes.length; lanes.push(0); } lanes[l] = ev.end; ev._l = l; }); cluster.forEach(ev => { ev._n = lanes.length; out.push(ev); }); cluster = []; };
    timed.forEach(ev => { if(cluster.length && ev.start >= end) flush(); cluster.push(ev); end = Math.max(end, ev.end); });
    flush();
    // Color legend removed (2026-11-11, Julius): colors stay, the key took up room.
    let h = '<div class="ce-day" aria-label="Day view"><div class="ce-day-in" data-step="' + ceStep() + '" style="height:' + 24 * CE_HOUR + 'px;--ce-h:' + CE_HOUR + 'px">';
    for(let i = 0; i < 24; i++) h += '<div class="ce-day-hr" data-m="' + i * 60 + '" style="top:' + i * CE_HOUR + 'px"><span>' + (i % 12 || 12) + (i < 12 ? 'a' : 'p') + '</span></div>';
    /* Zoom guides (2026-11-11, Julius): all 15-minute lines live in the DOM; data-step on .ce-day-in shows / hides
       them by zoom level, so they appear mid-pinch (no node swaps under the fingers). Thin solid lines, not dashed. */
    for(let mnt = 15; mnt < 24 * 60; mnt += 15){
      if(mnt % 60 === 0) continue;
      const hr = Math.floor(mnt / 60);
      h += '<div class="ce-day-hr ce-day-sub' + (mnt % 30 ? ' ce-day-s15' : '') + '" data-m="' + mnt + '" style="top:' + (mnt / 60 * CE_HOUR) + 'px"><span>' + (hr % 12 || 12) + ':' + ('0' + mnt % 60).slice(-2) + '</span></div>';
    }
    if(data.date === localToday()){ const n = new Date(); h += '<div class="ce-day-now" data-m="' + (n.getHours() * 60 + n.getMinutes()) + '" style="top:' + ((n.getHours() + n.getMinutes() / 60) * CE_HOUR) + 'px"></div>'; }
    out.forEach(ev => {
      const m0 = Math.max(0, (ev.start - d0) / 60000), m1 = (Math.min(ev.end, d0 + 86400000) - d0) / 60000;
      const top = m0 / 60 * CE_HOUR, ht = Math.max(14, (m1 - m0) / 60 * CE_HOUR - 1);
      const w = 100 / ev._n;
      h += '<div class="ce-day-ev' + (ev.done ? ' done' : '') + '" data-m0="' + m0.toFixed(1) + '" data-m1="' + m1.toFixed(1) + '" style="top:' + top + 'px;height:' + ht + 'px;left:calc(22px + (100% - 23px) * ' + (ev._l * w / 100) + ');width:calc((100% - 23px) * ' + (w / 100) + ' - 1px);background:' + col(ev) + ';color:' + ink(col(ev)) + '" title="' + esc(ev.time + ' ' + ev.title) + '"><b>' + esc(ev.title) + '</b> <span>' + esc(ev.time || '') + '</span></div>';
    });
    /* − / + (2026-11-11, Julius): bottom-right corner of the timeline, mostly transparent so they stay out of the way. */
    return h + '</div></div><div class="ce-zoom"><button type="button" data-ce-now aria-label="Jump to the current time" title="Jump to now"><i></i></button><button type="button" data-ce-zoom="-1" aria-label="Zoom out the timeline" title="Zoom out">−</button><button type="button" data-ce-zoom="1" aria-label="Zoom in the timeline" title="Zoom in">+</button></div>';
  }
  /* Pinch rescale (2026-11-11, Julius: one pinch now covers the whole range): moving existing nodes keeps the
     browser's touch stream alive — rebuilding the DOM mid-pinch killed it, so a pinch only got one small step. */
  const ceStep = () => CE_HOUR >= 112 ? 15 : CE_HOUR >= 64 ? 30 : 0;
  /* Zoom-out floor (2026-11-11, Julius): fully zoomed out, the 24 hours exactly fill the visible timeline — midnight
     at the top, midnight at the bottom, no empty space under the day. */
  const ceHourMin = () => { const d = document.querySelector('#centerCalendarList .ce-day'); return Math.max(CE_HOUR_MIN, d && d.clientHeight ? d.clientHeight / 24 : CE_HOUR_MIN); };
  function ceDayRescale(){
    const d = document.querySelector('#centerCalendarList .ce-day'), din = d && d.querySelector('.ce-day-in');
    if(!din) return false;
    din.dataset.step = ceStep(); // the 30- / 15-minute lines come and go live, mid-pinch
    din.style.height = 24 * CE_HOUR + 'px'; din.style.setProperty('--ce-h', CE_HOUR + 'px');
    din.querySelectorAll('[data-m]').forEach(n => { n.style.top = (n.dataset.m / 60 * CE_HOUR) + 'px'; });
    din.querySelectorAll('.ce-day-ev').forEach(n => {
      n.style.top = (n.dataset.m0 / 60 * CE_HOUR) + 'px';
      n.style.height = Math.max(14, (n.dataset.m1 - n.dataset.m0) / 60 * CE_HOUR - 1) + 'px';
    });
    if(ceDayTopNext >= 0){ d.scrollTop = ceDayTopNext; ceDayTopNext = -1; }
    return true;
  }
  function ceListFolded(){ try{ return localStorage.getItem('fw.ceListFold') === '1'; }catch(e){ return false; } }
  function ceSortMode(){ try{ return localStorage.getItem('fw.ceSort') === 'time' ? 'time' : 'cat'; }catch(e){ return 'cat'; } }
  // + Task box: kept outside the list so a refresh mid-typing doesn't lose the text.
  const ceAdd = {open:false,text:'',busy:false};
  const ceAddForm = () => '<form class="ce-add"><input type="text" maxlength="300" placeholder="Task name" aria-label="New all-day task"' + (ceAdd.busy ? ' disabled' : '') + ' value="' + esc(ceAdd.text) + '"><button type="submit" class="btn"' + (ceAdd.busy ? ' disabled' : '') + '>Add</button><button type="button" class="btn" data-ce-add-cancel aria-label="Cancel">✕</button></form>';
  /* Calendar cache on the device (2026-11-23, speed plan step A, NOTES "H5"): each day's last list is kept in
     localStorage, so opening the app paints the day's events (and the docked calendar) at once instead of
     "Loading…"; Google is then re-read quietly and the day is redrawn only if something changed. Anything that
     drops the in-memory copy (a save, a tick, a rename) drops the device copy too, so edits are never drawn stale.
     Kept: today −7 → +14 days, at most 30 days. */
  const CE_DEV_KEY = 'fw.ceCache.v1';
  const ceDevRead = () => { try{ const c = JSON.parse(localStorage.getItem(CE_DEV_KEY) || 'null'); return c && c.v === 1 && c.days ? c.days : {}; }catch(e){ return {}; } };
  const ceDevWrite = days => {
    try{
      const t = state.today || new Date().toISOString().slice(0, 10), sh = n => { const d = new Date(t + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
      const lo = sh(-7), hi = sh(14);
      const keep = Object.keys(days).filter(d => d >= lo && d <= hi).sort((a, b) => days[b].at - days[a].at).slice(0, 30), out = {};
      keep.forEach(d => { out[d] = days[d]; });
      localStorage.setItem(CE_DEV_KEY, JSON.stringify({v: 1, days: out}));
    }catch(e){}
  };
  const ceDevGet = date => { const x = ceDevRead()[date]; return x && x.data && Array.isArray(x.data.events) ? x : null; };
  const ceDevSet = (date, data) => { const d = ceDevRead(); d[date] = {at: Date.now(), data: data}; ceDevWrite(d); };
  const ceDevDrop = date => { if(date == null){ try{ localStorage.removeItem(CE_DEV_KEY); }catch(e){} return; } const d = ceDevRead(); if(d[date]){ delete d[date]; ceDevWrite(d); } };
  class CeCache extends Map {
    delete(k){ ceDevDrop(k); return super.delete(k); }
    clear(){ ceDevDrop(null); return super.clear(); }
  }
  const centerCalendarCache = new CeCache();
  // Subject color for a calendar row: the saved subject, else the same auto guess cards use.
  function calRowCat(ev){
    if(ev.cat === 'none') return '';
    const key = ev.cat || (typeof guessCardCat === 'function' ? guessCardCat(ev.title) : '');
    return typeof CARD_CAT_BY_KEY !== 'undefined' && CARD_CAT_BY_KEY[key] ? key : '';
  }
  function calRowAttrs(ev){
    const cat = calRowCat(ev), color = cat ? CARD_CAT_BY_KEY[cat].color : '';
    return ' data-ce-id="' + esc(ev.id) + '" data-ce-cal="' + esc(ev.calId) + '" data-ce-start="' + ev.start + '" data-ce-rec="' + (ev.recurring ? 1 : 0) + '" data-ce-title="' + esc(ev.title) + '"' +
      (ev.urg ? ' data-urg="' + esc(ev.urg) + '"' : '') + (ev.due ? ' data-due="' + esc(ev.due) + '"' : '') + (ev.dur ? ' data-dur="' + esc(ev.dur) + '"' : '') +
      (ev.cat ? ' data-cat="' + esc(ev.cat) + '"' : '') + (cat ? ' data-tccat="' + esc(cat) + '" style="--ce-cat:' + esc(color) + '"' : '');
  }
  function saveCalMeta(line){
    const d = line.dataset, meta = {urg:d.urg || '',due:d.due || '',dur:d.dur || '',cat:d.cat || ''};
    // 📅 Calendar panel card (2026-11-11): the panel saves it and redraws; Cal Events re-reads on its next load.
    if(line.classList.contains('cp-ev') && window.fwCalendar && window.fwCalendar.saveMeta){ centerCalendarCache.clear(); window.fwCalendar.saveMeta(line,meta); return; }
    const label = line.querySelector('.ce-meta');
    if(label) label.textContent = lineMetaLabel(d.due,d.dur) || '';
    centerCalendarCache.forEach(entry => entry.data.events.forEach(ev => {
      if(ev.id !== d.ceId || Number(ev.start) !== Number(d.ceStart)) return;
      Object.assign(ev,meta);
      const cat = calRowCat(ev);
      if(cat){ line.dataset.tccat = cat; line.style.setProperty('--ce-cat',CARD_CAT_BY_KEY[cat].color); }
      else { delete line.dataset.tccat; line.style.removeProperty('--ce-cat'); }
    }));
    if(ceDraw) ceDraw(); // a new subject moves the row to that subject's group
    google.script.run.withFailureHandler(err => {
      setStatus('Could not save that calendar event: ' + (err && err.message || err));
    }).setCalendarEventMeta(d.ceId,Number(d.ceStart),d.ceRec === '1',meta,d.ceCal);
  }
  // Cal Events search (2026-11-06, Julius): display filter only, nothing saved; Esc clears.
  function ceSearchWords(){ const i = document.querySelector('[data-ce-search]'); return i ? i.value.toLowerCase().split(/\s+/).filter(Boolean) : []; }
  document.addEventListener('input', e => { if(e.target.closest && e.target.closest('[data-ce-search]') && ceDraw) ceDraw(); });
  document.addEventListener('keydown', e => {
    const i = e.target.closest && e.target.closest('[data-ce-search]');
    if(!i) return;
    if(e.key === 'Escape'){ i.value = ''; if(ceDraw) ceDraw(); i.blur(); }
    if(e.key === 'Enter'){ e.preventDefault(); i.blur(); }
  }, true);
  window.fwCeRedraw = () => { if(ceDraw) ceDraw(); else loadCenterCalendar(); };
  function loadCenterCalendar(date, force){
    date = date || window.odDate || state.today;
    const box = document.getElementById('centerCalendarList');
    if(!box || !date) return;
    if(box.querySelector('[data-ce-editing]')) return; // never redraw over a title being typed
    const seq = ++centerCalendarSeq;
    const draw = full => {
      if(seq !== centerCalendarSeq || box.querySelector('[data-ce-editing]')) return;
      const fwc = window.fwCalendar;
      if(fwc && fwc.park) fwc.park(); // the docked big calendar steps out before the HTML is rewritten
      ceShownDate = full.date;
      ceDraw = () => draw(full);
      ceHideLoad();
      let data = ceShowHidden ? full : Object.assign({}, full, {events: full.events.filter(ev => !ceIsHidden(ev))});
      const q = ceSearchWords();
      if(q.length) data = Object.assign({}, data, {events: data.events.filter(ev => { const t = String(ev.title || '').toLowerCase(); return q.every(w => t.includes(w)); })});
      const allDay = data.events.filter(ev => ev.allDay).sort((a,b) => Number(a.done) - Number(b.done)), scheduled = data.events.filter(ev => !ev.allDay);
      const checkbox = ev => '<input type="checkbox" class="ce-check"' + (ev.done ? ' checked' : '') + (ev.ro ? ' disabled title="View-only calendar"' : '') + ' aria-label="Mark ' + esc(ev.title) + ' complete">';
      // Row carries the event's id + its menu fields (urgency, due, length, subject), like a task line.
      const row = (ev,cls,inner) => '<div class="ce-event' + cls + (ev.done ? ' ce-done' : '') + '"' + calRowAttrs(ev) + '>' + checkbox(ev) + inner + '<span class="ce-meta">' + esc(lineMetaLabel(ev.due,ev.dur) || '') + '</span></div>';
      // Rows sorted under their subject, in Options order; no subject goes last, under Other.
      const bySubject = (list,one) => {
        // The subject list is declared in a later <script>; an early calendar reply can land before it loads.
        const cats = typeof CARD_CAT_BY_KEY !== 'undefined' ? CARD_CAT_BY_KEY : {};
        const keys = list.map(calRowCat), order = Object.keys(cats).concat('');
        const used = order.filter(k => keys.includes(k));
        const heads = used.length > 1 || used[0];
        return used.map(k => {
          const info = cats[k];
          return (heads ? '<div class="ce-cat"' + (info ? ' style="--ce-cat:' + esc(info.color) + '"' : '') + '>' + esc(info ? info.name : 'Other') + '</div>' : '') +
            list.filter((ev,i) => keys[i] === k).map(one).join('');
        }).join('');
      };
      const allDayRow = ev => row(ev,'','<span class="ce-event-text ce-title">' + esc(ev.title) + '</span>');
      /* Cats = urgency first, then subject (2026-11-06, Julius): a colored box per urgency, red → yellow → blue →
         grey (not set), done last; inside each box the rows sit under their subject. Display only. */
      const byUrgency = list => [['1','Urgent'],['2','Next'],['3','Later'],['','Not set'],['done','Done']].map(([u,name]) => {
        const rows = list.filter(ev => u === 'done' ? ev.done : !ev.done && String(ev.urg || '') === u);
        return rows.length ? '<section class="ce-urg ce-urg-' + (u || 'none') + '"><div class="ce-urg-h">' + name + ' <small>' + rows.length + '</small></div>' + bySubject(rows,allDayRow) + '</section>' : '';
      }).join('');
      const timedRow = ev => row(ev,' ce-scheduled','<span class="ce-event-text"><span class="ce-time">' + esc(ev.time) + '</span><span class="ce-title">' + esc(ev.title) + '</span></span>');
      const addHead = label => '<div class="ce-group ce-group-add"><span>' + label + '</span><button type="button" class="btn ce-add-btn" data-ce-add aria-label="Add an all-day task">+ Task</button></div>' + (ceAdd.open ? ceAddForm() : '');
      const byCategory = ceSortMode() === 'cat';
      const sortBtn = document.querySelector('[data-ce-sort]');
      if(sortBtn) sortBtn.textContent = byCategory ? 'Cats' : 'Time'; // short label (2026-11-05, Julius)
      const dayOn = ceDayOn(), dayBtn = document.querySelector('[data-ce-day]');
      if(dayBtn){ dayBtn.classList.toggle('on', dayOn); dayBtn.setAttribute('aria-pressed', dayOn ? 'true' : 'false'); }
      const oldDay = box.querySelector('.ce-day'), dayTop = oldDay ? oldDay.scrollTop : -1;
      // Completed events go in one bottom section in Time mode, regardless of all-day/scheduled type.
      // Category mode already puts the Done urgency group last; the four-box mode has its own Done box.
      const activeAllDay = allDay.filter(ev => !ev.done);
      const activeScheduled = scheduled.filter(ev => !ev.done).sort((a,b) => String(a.start).localeCompare(String(b.start)));
      const completed = data.events.filter(ev => ev.done).sort((a,b) =>
        Number(b.allDay) - Number(a.allDay) || String(a.start).localeCompare(String(b.start)));
      box.innerHTML = (byCategory
        ? addHead('All events') + byUrgency(allDay.concat(scheduled))
        : addHead('All-Day Tasks') + activeAllDay.map(allDayRow).join('') +
          (activeScheduled.length ? '<div class="ce-group">Scheduled Tasks</div>' + activeScheduled.map(timedRow).join('') : '') +
          (completed.length ? '<div class="ce-group">Completed · ' + completed.length + '</div>' +
            completed.map(ev => ev.allDay ? allDayRow(ev) : timedRow(ev)).join('') : '')) +
        (!data.events.length ? '<div class="ce-empty">' + (q.length ? 'No match for “' + esc(q.join(' ')) + '”.' : 'No events.') + '</div>' : '');
      /* Google Calendar layout (2026-11-11, Julius): a bar with ▾ Events (fold / open the list), ⚙ (hide list) and − / +
         (timeline zoom), then the list, then the day timeline filling the rest of the column. */
      const nHid = full.events.filter(ceIsHidden).length, folded = ceListFolded();
      const listHtml = box.innerHTML;
      // 2026-11-13 (Julius): no Events bar / list above the calendar — the events are on the calendar itself. The list
      // (with its bar) comes back only when the day calendar is switched off in ⚙.
      box.innerHTML = (dayOn ? '' : '<div class="ce-bar"><button type="button" class="ce-fold" data-ce-fold aria-expanded="' + !folded + '" title="Fold / open the events list"><span class="ce-farr">' + (folded ? '▸' : '▾') + '</span> Events <small>' + data.events.length + '</small></button>' +
        '<button type="button" class="ce-showcal" data-ce-showcal title="Show the day calendar again">📅 Show calendar</button><button type="button" class="ce-relist" data-ce-refresh title="Refresh the events" aria-label="Refresh calendar events">↻</button>' +
        (nHid ? '<button type="button" class="ce-hidn' + (ceShowHidden ? ' on' : '') + '" data-ce-showhid title="' + (ceShowHidden ? 'Hide them again' : 'Show them in the list for now') + '">' + nHid + ' hidden</button>' : '') +
        '</div>') +
        (ceOpt.open ? ceOptHtml(full) : '') +
        (dayOn ? '' : '<div class="ce-list"' + (folded ? ' hidden' : '') + '>' + listHtml + '</div>');
      box.classList.toggle('ce-has-day', dayOn);
      if(fwc && fwc.mountCals) fwc.mountCals(ceOpt.open ? box.querySelector('[data-ce-calslot]') : null);
      if(false){ // list/timeline splitter: no list above the calendar any more (2026-11-13)
        try{ const v = parseFloat(localStorage.getItem('fw.ceSplit')); if(v >= 10 && v <= 85){ box.style.setProperty('--ce-ls', v + '%'); box.classList.add('ce-man'); } else { box.classList.remove('ce-man'); } }catch(err){}
        box.insertAdjacentHTML('beforeend', '<div class="ce-split" title="Drag to size the list and timeline · double-tap to reset" aria-label="Resize the events list"></div>');
      }
      // 2026-11-13 (Julius): the day timeline is the big calendar itself (Day view), docked here; the old mini
      // timeline only shows until its libraries are loaded (or if they can't load).
      const dockIt = dayOn && fwc && fwc.dockReady && fwc.dockReady() && !(fwc.isOpen && fwc.isOpen());
      if(dayOn && fwc && fwc.prepareDock && !dockIt) fwc.prepareDock();
      if(dockIt){
        box.insertAdjacentHTML('beforeend', '<div class="ce-dock"></div>');
        if(!fwc.dockTo(box.querySelector('.ce-dock'), full.date)) box.querySelector('.ce-dock').textContent = 'Loading calendar…';
      } else if(dayOn && fwc && fwc.isOpen && fwc.isOpen() && fwc.dockReady && fwc.dockReady()){
        box.insertAdjacentHTML('beforeend', '<div class="ce-dock ce-dock-away">📅 Open in the big calendar</div>');
      } else if(dayOn){
        box.insertAdjacentHTML('beforeend', ceDayHtml(full));
        const d = box.querySelector('.ce-day');
        if(d){
          d.scrollTop = ceDayTopNext >= 0 ? ceDayTopNext : dayTop >= 0 ? dayTop : ceDayScroll(full);
          ceDayTopNext = -1;
          // Below the zoom-out floor (saved zoom from a bigger screen, resized column): snap up so the day fills it.
          const mn = ceHourMin();
          if(CE_HOUR < mn - 0.5 && !ceeFloorFix){ ceeFloorFix = true; CE_HOUR = Math.round(mn * 10) / 10; setTimeout(() => { ceeFloorFix = false; if(ceDraw) ceDraw(); }, 0); }
        }
      }
    };
    const cached = centerCalendarCache.get(date);
    if(!force && cached && Date.now() - cached.at < 60000){ draw(cached.data); return; }
    // Device copy (speed step A): paint it now, then re-read quietly; redraw only if Google's answer differs.
    const dev = !force && !cached ? ceDevGet(date) : null;
    const shown = dev ? JSON.stringify(dev.data) : '';
    if(dev){ window.__fwCeDevPaint = (window.__fwCeDevPaint || 0) + 1; draw(dev.data); }
    else box.textContent = 'Loading…';
    google.script.run.withSuccessHandler(data => {
      centerCalendarCache.set(date,{at:Date.now(),data:data});
      if(data && Array.isArray(data.events)) ceDevSet(date, data);
      if(!dev || JSON.stringify(data) !== shown) draw(data);
    }).withFailureHandler(() => {
      if(dev) return; // keep the device copy on screen; the next open / ↻ tries again
      if(seq === centerCalendarSeq) box.textContent = 'Could not load calendar events. Tap refresh to retry.';
    }).getMainCalendarEvents(date);
  }
  document.addEventListener('change', e => {
    const cb=e.target.closest?.('#centerCalendarList .ce-check');if(!cb)return;
    const row=cb.closest('.ce-event'),desired=cb.checked;cb.disabled=true;
    google.script.run.withSuccessHandler(()=>{
      cb.disabled=false;cb.closest('.ce-event')?.classList.toggle('ce-done',desired);
      centerCalendarCache.forEach(entry => entry.data.events.forEach(ev => { if(ev.id === row.dataset.ceId && Number(ev.start) === Number(row.dataset.ceStart)) ev.done = desired; }));
      if(ceDraw) ceDraw(); // All modes: move completed events to the bottom/Done immediately.
      centerCalendarCache.clear();
    }).withFailureHandler(err=>{
      cb.checked=!desired;cb.disabled=false;
      alert('Could not update calendar event: '+(err?.message||err));
    }).setCalendarEventDone(row.dataset.ceCal,row.dataset.ceId,Number(row.dataset.ceStart),desired);
  });
  document.addEventListener('click', e => {
    if(e.target.closest('[data-ce-refresh]')) loadCenterCalendar(null,true);
    if(e.target.closest('[data-ce-day]')){
      try{ localStorage.setItem('fw.ceDay', ceDayOn() ? '0' : '1'); }catch(err){}
      if(ceDraw) ceDraw();
    }
    if(e.target.closest('[data-ce-fold]')){
      try{ localStorage.setItem('fw.ceListFold', ceListFolded() ? '0' : '1'); }catch(err){}
      if(ceDraw) ceDraw();
    }
    if(e.target.closest('[data-ce-showhid]')){ ceShowHidden = !ceShowHidden; if(ceDraw) ceDraw(); }
    // Calendars list in ⚙ starts folded every time (2026-11-24, Julius: "I don't want to have to see them every time").
    if(e.target.closest('[data-ce-opt]')){ ceOpt.open = !ceOpt.open; ceOpt.cals = false; if(ceDraw) ceDraw(); }
    if(e.target.closest('[data-ce-calsfold]')){ ceOpt.cals = !ceOpt.cals; if(ceDraw) ceDraw(); }
    // 📅 Show calendar (list mode): never get stuck without the day calendar (2026-11-13, Julius).
    if(e.target.closest('[data-ce-showcal]')){ try{ localStorage.setItem('fw.ceDay', '1'); }catch(err){} ceOpt.open = false; if(ceDraw) ceDraw(); }
    if(e.target.closest('[data-ce-today]')){ const a = window.fwCalendar && window.fwCalendar.api && window.fwCalendar.api(); if(a) a.today(); }
    if(e.target.closest('[data-ce-bl]') && window.fwCalendar && window.fwCalendar.blToggle) window.fwCalendar.blToggle();
    const sp = e.target.closest('[data-ce-sortpick]');
    if(sp){ try{ localStorage.setItem('fw.ceSort', sp.dataset.ceSortpick); }catch(err){} if(ceDraw) ceDraw(); }
    if(e.target.closest('[data-ce-opt-done]')){ ceOpt.open = false; if(ceDraw) ceDraw(); }
    const hx = e.target.closest('[data-ce-hword-x]');
    if(hx){ ceHide.words = ceHide.words.filter(w => w !== hx.dataset.ceHwordX); ceHideSave(); }
    const ha = e.target.closest('[data-ce-hword-add]');
    if(ha && !ceHide.words.some(w => w.toLowerCase() === ha.dataset.ceHwordAdd.toLowerCase())){ ceHide.words.push(ha.dataset.ceHwordAdd); ceHideSave(); }
    /* ◉ Now (2026-11-11, Julius): floats left of − / +, scrolls the timeline to the red now line, centered. */
    if(e.target.closest('[data-ce-now]')){
      const d = document.querySelector('#centerCalendarList .ce-day');
      if(d){ const n = new Date(); d.scrollTo({top: Math.max(0, (n.getHours() + n.getMinutes() / 60) * CE_HOUR - d.clientHeight / 2), behavior: 'smooth'}); }
    }
    const z = e.target.closest('[data-ce-zoom]');
    if(z && ceePinch.pz) return; // mid-pinch taps are part of the pinch
    if(z){
      const d = document.querySelector('#centerCalendarList .ce-day'), old = CE_HOUR;
      CE_HOUR = Math.round(Math.max(ceHourMin(), Math.min(CE_HOUR_MAX, z.dataset.ceZoom === '1' ? CE_HOUR * 1.25 : CE_HOUR / 1.25)) * 10) / 10;
      try{ localStorage.setItem('fw.ceHour', String(CE_HOUR)); }catch(err){}
      if(d){ const mid = (d.scrollTop + d.clientHeight / 2) / old; ceDayTopNext = Math.max(0, mid * CE_HOUR - d.clientHeight / 2); }
      if(ceDraw) ceDraw();
    }
    if(e.target.closest('[data-ce-sort]')){
      try{ localStorage.setItem('fw.ceSort',ceSortMode() === 'cat' ? 'time' : 'cat'); }catch(err){}
      if(ceDraw) ceDraw();
    }
    const open = e.target.closest('[data-ce-add]');
    if(open){
      let form = document.querySelector('#centerCalendarList .ce-add');
      if(!form){
        ceAdd.open = true;
        open.closest('.ce-group').insertAdjacentHTML('afterend',ceAddForm());
        form = document.querySelector('#centerCalendarList .ce-add');
      }
      form.querySelector('input').focus(); // same tap, so the phone keyboard opens
    }
    if(e.target.closest('[data-ce-add-cancel]') && !ceAdd.busy){
      ceAdd.open = false; ceAdd.text = '';
      document.querySelector('#centerCalendarList .ce-add')?.remove();
    }
  });
  document.addEventListener('input', e => { if(e.target.matches?.('#centerCalendarList .ce-add input')) ceAdd.text = e.target.value; });
  /* Pinch zoom on the timeline (2026-11-11, Julius): two fingers stretch / squeeze the hours, anchored between the
     fingers, like a phone map; saved like the − / + buttons. */
  const ceePinch = {pz: null};
  (function(){
    const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    document.addEventListener('touchstart', e => {
      if(e.touches.length !== 2) return;
      const d = e.target.closest?.('#centerCalendarList .ce-day'); if(!d) return;
      ceePinch.pz = {start: dist(e.touches), h0: CE_HOUR, top0: d.scrollTop, raf: 0,
        midY: (e.touches[0].clientY + e.touches[1].clientY) / 2 - d.getBoundingClientRect().top};
    }, {passive: true, capture: true});
    document.addEventListener('touchmove', e => {
      const pz = ceePinch.pz;
      if(!pz || e.touches.length !== 2) return;
      e.preventDefault();
      const nh = Math.round(Math.max(ceHourMin(), Math.min(CE_HOUR_MAX, pz.h0 * dist(e.touches) / pz.start)) * 10) / 10;
      if(nh === CE_HOUR) return;
      CE_HOUR = nh;
      ceDayTopNext = Math.max(0, (pz.top0 + pz.midY) / pz.h0 * nh - pz.midY);
      if(!pz.raf) pz.raf = requestAnimationFrame(() => { if(ceePinch.pz) ceePinch.pz.raf = 0; if(!ceDayRescale() && ceDraw) ceDraw(); });
    }, {passive: false, capture: true});
    const end = e => {
      if(!ceePinch.pz || (e.touches && e.touches.length >= 2)) return;
      try{ localStorage.setItem('fw.ceHour', String(CE_HOUR)); }catch(err){}
      const d = document.querySelector('#centerCalendarList .ce-day');
      if(d) ceDayTopNext = d.scrollTop;
      if(ceDraw) ceDraw(); // full draw once: refreshes the 30- / 15-minute guide lines for the final zoom
      setTimeout(() => { ceePinch.pz = null; }, 250);
    };
    document.addEventListener('touchend', end, true);
    document.addEventListener('touchcancel', end, true);
  })();
  /* List / timeline drag bar (2026-11-11, Julius): drag sets the list's share (fw.ceSplit); a quick second tap resets. */
  (function(){
    let sp = null, lastTap = 0;
    document.addEventListener('pointerdown', e => {
      const b = e.target.closest?.('#centerCalendarList .ce-split'); if(!b) return;
      e.preventDefault(); e.stopPropagation();
      const box = b.closest('#centerCalendarList'), r = box.getBoundingClientRect();
      sp = {box, top: r.top, h: r.height, y0: e.clientY, moved: false};
      try{ b.setPointerCapture(e.pointerId); }catch(err){}
    }, true);
    document.addEventListener('pointermove', e => {
      if(!sp) return;
      if(!sp.moved && Math.abs(e.clientY - sp.y0) < 4) return; // a jittery tap is still a tap
      sp.moved = true;
      sp.pct = Math.max(10, Math.min(85, (e.clientY - sp.top) / sp.h * 100));
      sp.box.classList.add('ce-man'); sp.box.style.setProperty('--ce-ls', sp.pct.toFixed(1) + '%');
    }, true);
    const done = e => {
      if(!sp) return;
      if(sp.moved && sp.pct != null){ try{ localStorage.setItem('fw.ceSplit', sp.pct.toFixed(1)); }catch(err){} }
      else {
        const now = Date.now();
        if(now - lastTap < 350){ sp.box.classList.remove('ce-man'); sp.box.style.removeProperty('--ce-ls'); try{ localStorage.removeItem('fw.ceSplit'); }catch(err){} lastTap = 0; }
        else lastTap = now;
      }
      sp = null;
    };
    document.addEventListener('pointerup', done, true);
    document.addEventListener('pointercancel', done, true);
  })();
  document.addEventListener('change', e => {
    const c = e.target.closest?.('[data-ce-hcal]'); if(!c) return;
    ceHide.cals = ceHide.cals.filter(x => x.id !== c.dataset.ceHcal);
    if(c.checked) ceHide.cals.push({id: c.dataset.ceHcal, name: c.dataset.name || c.dataset.ceHcal});
    ceHideSave();
  });
  document.addEventListener('submit', e => {
    const f = e.target.closest?.('[data-ce-hword-form]'); if(!f) return;
    e.preventDefault();
    const v = (f.querySelector('input').value || '').trim().slice(0, 40);
    if(v && !ceHide.words.some(w => w.toLowerCase() === v.toLowerCase())){ ceHide.words.push(v); ceHideSave(); }
  }, true);
  /* Title editing (2026-11-04, Julius): first tap picks the row, second tap edits, like task cells.
     Leaving the title saves it to the Google Calendar event; Esc or an empty title puts it back. */
  (function initCalTitles(){
    const list = document.getElementById('centerCalendarList');
    if(!list) return;
    const clearPick = () => list.querySelectorAll('.ce-picked').forEach(n => n.classList.remove('ce-picked'));
    let undo = false;
    list.addEventListener('click',e => {
      const title = e.target.closest('.ce-title'), row = title && title.closest('.ce-event');
      if(!row){ if(!e.target.closest('[data-ce-editing]')) clearPick(); return; }
      if(title.dataset.ceEditing) return;
      if(!row.classList.contains('ce-picked')){ clearPick(); row.classList.add('ce-picked'); return; }
      title.dataset.ceEditing = '1'; title.contentEditable = 'plaintext-only'; title.spellcheck = false;
      title.focus();
      getSelection().selectAllChildren(title); getSelection().collapseToEnd();
    });
    list.addEventListener('keydown',e => {
      if(!e.target.dataset?.ceEditing) return;
      e.stopPropagation();
      if(e.key === 'Enter'){ e.preventDefault(); e.target.blur(); }
      if(e.key === 'Escape'){ e.preventDefault(); undo = true; e.target.blur(); }
    });
    list.addEventListener('focusout',e => {
      const title = e.target; if(!title.dataset?.ceEditing) return;
      const row = title.closest('.ce-event'), d = row.dataset, old = d.ceTitle;
      const name = title.textContent.replace(/\s+/g,' ').trim(), keep = undo || !name || name === old;
      undo = false;
      delete title.dataset.ceEditing; title.removeAttribute('contenteditable');
      clearPick();
      title.textContent = keep ? old : name;
      if(keep) return;
      const put = t => {
        d.ceTitle = t;
        centerCalendarCache.forEach(entry => entry.data.events.forEach(ev => { if(ev.id === d.ceId && Number(ev.start) === Number(d.ceStart)) ev.title = t; }));
        if(ceDraw) ceDraw();
      };
      put(name);
      google.script.run.withFailureHandler(err => {
        put(old);
        setStatus('Could not rename that event: ' + (err && err.message || err));
      }).setCalendarEventTitle(d.ceCal,d.ceId,Number(d.ceStart),name);
    });
  })();
  document.addEventListener('submit', e => {
    const form = e.target.closest?.('#centerCalendarList .ce-add'); if(!form) return;
    e.preventDefault();
    const title = ceAdd.text.trim(), date = ceShownDate;
    if(!title || !date || ceAdd.busy) return;
    const lock = on => { ceAdd.busy = on; document.querySelectorAll('#centerCalendarList .ce-add :is(input,button[type=submit])').forEach(n => { n.disabled = on; }); };
    lock(true);
    google.script.run.withSuccessHandler(() => {
      ceAdd.open = false; ceAdd.text = ''; ceAdd.busy = false;
      centerCalendarCache.delete(date); loadCenterCalendar(null,true);
    }).withFailureHandler(err => {
      lock(false);
      setStatus('Could not add that task: ' + (err && err.message || err));
    }).addAllDayTask(date,title);
  });
  // Back in view (calm-return queue): one job for both calendars. Panel data older than 5 min → loadCalendar
  // (it reloads the center list too); else just the center list. Was two handlers → two center loads.
  fwResume.add('calendar', () => loadCenterCalendar());
  // The old Reference-side calendar panel (off since 2026-10-31) was removed 2026-11-25; this keeps its clean-up step.
  function loadCalendar(){
    loadCenterCalendar();
    const p = document.getElementById('calPanel'); if(p) p.remove();
  }
  let inboxItems = [];
  // Inbox removed (2026-10-31, Julius): ideas go to the Backlog cell as Can be later.
  // Any open items left in the in-app inbox move there once (only when the Backlog
  // cell is loaded, so no duplicate Backlog cells), then leave the inbox.
  let inboxMigrating = false;
  function migrateInboxToBacklog(){
    if(inboxMigrating || !backlogCell()) return;
    const open = inboxItems.filter(x => x && !x.arch && !x.done && (x.title || x.details));
    if(!open.length) return;
    inboxMigrating = true;
    open.forEach(it => {
      if(addTaskToBacklog(it.title || it.details, it.title ? it.details : '', 3)){
        google.script.run.withFailureHandler(() => {}).dismissInboxItem(it.id);
      }
    });
    inboxItems = inboxItems.filter(x => open.indexOf(x) < 0);
    renderUrgent();
    setStatus(open.length + ' inbox item' + (open.length > 1 ? 's' : '') + ' moved to ' + BACKLOG_NAME);
    setTimeout(() => { inboxMigrating = false; }, 2000);
  }
  function setInbox(list){ inboxItems = Array.isArray(list) ? list : []; renderInbox(); }
  // The Inbox panel itself was removed 2026-10-31 (code deleted 2026-11-25): items left in the in-app inbox move to the Backlog.
  function renderInbox(){ const p = document.getElementById('inboxPanel'); if(p) p.remove(); migrateInboxToBacklog(); }

</script>
