  function buildSplitMirror(source,slot){
    const mirror=source.cloneNode(true);
    mirror.id='splitMirrorPane'+slot;
    mirror.dataset.splitMirror=String(slot);
    const sanitize=element=>{
      element.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
      element.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable','false'));
      element.querySelectorAll('input,button,select,textarea').forEach(el=>{el.disabled=true;el.removeAttribute('onclick');});
    };
    sanitize(mirror);
    mirror.setAttribute('aria-label','Read-only duplicate of '+source.id);
    document.getElementById('workspace').appendChild(mirror);
    // Start the duplicate at the same scroll position as the original.
    requestAnimationFrame(()=>{
      const from=[...source.querySelectorAll('.scroll')];
      [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ if(from[i]) el.scrollTop=from[i].scrollTop; });
    });
    let queued=false;
    const observer=new MutationObserver(()=>{
      if(queued || !mirror.isConnected)return;
      queued=true;
      requestAnimationFrame(()=>{
        queued=false;
        if(!mirror.isConnected)return;
        // Rebuilding the copy would otherwise reset its scroll to the first
        // (oldest) day on every keystroke made in the original.
        const keep=[...mirror.querySelectorAll('.scroll')].map(el=>el.scrollTop);
        const replacement=source.cloneNode(true);
        sanitize(replacement);
        mirror.replaceChildren(...Array.from(replacement.childNodes));
        [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ el.scrollTop=keep[i]||0; });
      });
    });
    observer.observe(source,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','checked','style']});
    splitMirrorObservers.push(observer);
    return mirror;
  }

      if(d.into){

      }else{
        d.target.parentNode.insertBefore(wrap,d.after?d.target.nextSibling:d.target);

      const parentChanged=item&&String(item.parentId||'')!==newParent;
      if(item)item.parentId=newParent;

      const ids=[...document.querySelectorAll('#referenceTree .ref-cell-wrapper')].map(n=>String(n.dataset.id));

        .withSuccessHandler(()=>setStatus('Saved'))

    inp.placeholder = 'New ' + URG_NAMES[u] + ' task — Title: details';
    inp.enterKeyHint = 'done';
    const ok = document.createElement('button'); ok.type = 'submit'; ok.className = 'btn tiny'; ok.textContent = 'Add';
    const no = document.createElement('button'); no.type = 'button'; no.className = 'btn tiny'; no.textContent = '✕';
    no.title = 'Cancel';
    no.addEventListener('click',() => { urgCreating = 0; renderUrgent(); });
    inp.addEventListener('keydown',e => { if(e.key === 'Escape'){ urgCreating = 0; renderUrgent(); } });
    row.addEventListener('submit',e => {
      e.preventDefault();
      const p = splitTitle(inp.value);
      if(!p.title && !p.details){ inp.focus(); return; }
      if(addTaskToToday(p.title,p.details,u)){
        urgCreating = 0;
        renderUrgent();
        setStatus(URG_NAMES[u] + ' task added to today');
      }
    });
    row.append(inp,ok,no);
    return row;
  }
  // "Fix calendar: find which calendar the nap block is on" → title + details.
  function splitTitle(text){
    const t = String(text || '').trim();
    const i = t.indexOf(':');
    if(i > 0 && i < 80) return {title:t.slice(0,i).trim(),details:t.slice(i + 1).trim()};
    return {title:t,details:''};
  }
  // Add a task (checkbox line) at the end of today's Today cell.
  function addTaskToToday(title,details,urg){
    const date = localToday();
    const ed = document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(date)}"]`);
    if(!ed){ setStatus('Today isn’t loaded — tap Today, then try again'); return false; }
    captureBeforeEdit(ed);
    const c = document.createElement('div');
    c.className = 'check-line';
    c.dataset.level = '0';
    if(urg) c.dataset.urg = String(urg);
    c.innerHTML = '<input type="checkbox"><span class="check-text"></span>';
    const t = c.querySelector('.check-text');
    if(title && details){
      const b = document.createElement('b'); b.textContent = title;
      t.append(b,document.createTextNode(': ' + details));
    } else if(title){
      const b = document.createElement('b'); b.textContent = title; t.append(b);
    } else t.textContent = details;
    const blank = !ed.textContent.trim() && !ed.querySelector('input,img,hr');
    if(blank) ed.replaceChildren(c); else ed.appendChild(c);
    wireCheckbox(c.querySelector('input'));
    finishEditorEdit(ed);
    saveEditorOwner(ed);
    noteUrgentDay(date,ed.innerHTML);
    return true;
  }

  /* ---------------------------------------------------------
     INBOX (2026-10-26, Julius): quick captures under Urgent.
     Claude adds items through inbox.js (pushed from GitHub); you can type
     them here too. Shown as **Title**: details. → Today makes it a task in
     today's cell; ✕ dismisses. Collapsed by default.
     --------------------------------------------------------- */
  let inboxItems = [];
  let inboxOpen = false;
  try{ inboxOpen = localStorage.getItem('fw.inboxOpen') === '1'; }catch(e){}
  function setInbox(list){ inboxItems = Array.isArray(list) ? list : []; renderInbox(); }
  function renderInbox(){
    const tree = document.getElementById('referenceTree');
    if(!tree) return;
    let panel = document.getElementById('inboxPanel');
    if(!panel){
      panel = document.createElement('div');
      panel.id = 'inboxPanel';
      tree.parentNode.insertBefore(panel,tree);
    }
    panel.innerHTML = '';
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'urg-head';
    head.append(pmBox(inboxOpen),document.createTextNode('Inbox · ' + inboxItems.length));
    head.addEventListener('click',() => {
      inboxOpen = !inboxOpen;
      try{ localStorage.setItem('fw.inboxOpen',inboxOpen ? '1' : '0'); }catch(e){}
      renderInbox();
    });
    panel.appendChild(head);
    if(!inboxOpen) return;
    inboxItems.forEach(it => {
      const row = document.createElement('div');
      row.className = 'inbox-row';
      const text = document.createElement('div');
      text.className = 'inbox-text';
      if(it.title){ const b = document.createElement('b'); b.textContent = it.title; text.append(b); }
      if(it.details) text.append(document.createTextNode((it.title ? ': ' : '') + it.details));
      if(it.from === 'claude'){ const tag = document.createElement('span'); tag.className = 'inbox-from'; tag.textContent = 'Claude'; text.append(tag); }
      const go = document.createElement('button'); go.type = 'button'; go.className = 'btn tiny'; go.textContent = '→ Today';
      go.title = 'Make it a task in today';
      go.addEventListener('click',() => { if(addTaskToToday(it.title,it.details,0)) dismissInbox(it.id,'Sent to today'); });
      const x = document.createElement('button'); x.type = 'button'; x.className = 'btn tiny'; x.textContent = '✕';
      x.title = 'Dismiss';
      x.addEventListener('click',() => dismissInbox(it.id,'Dismissed'));
      row.append(text,go,x);
      panel.appendChild(row);
    });
    const form = document.createElement('form');
    form.className = 'inbox-add';
    const inp = document.createElement('input');
    inp.type = 'text'; inp.placeholder = 'Add to inbox — Title: details'; inp.enterKeyHint = 'done';
    const ok = document.createElement('button'); ok.type = 'submit'; ok.className = 'btn tiny'; ok.textContent = 'Add';
    form.append(inp,ok);
    form.addEventListener('submit',e => {
      e.preventDefault();
      const p = splitTitle(inp.value);
      if(!p.title && !p.details) return;
      const temp = {id:'tmp' + Date.now(),title:p.title,details:p.details,from:'app'};
      inboxItems = inboxItems.concat(temp); renderInbox();
      google.script.run
        .withSuccessHandler(list => { setInbox(list); setStatus('Added to inbox'); })
        .withFailureHandler(err => { inboxItems = inboxItems.filter(x => x !== temp); renderInbox(); setStatus('Inbox error: ' + err.message); })
        .addInboxItem(p.title,p.details);
      const again = document.querySelector('#inboxPanel .inbox-add input'); if(again) again.focus();
    });
    panel.appendChild(form);
  }
  function dismissInbox(id,msg){
    const before = inboxItems;
    inboxItems = inboxItems.filter(x => x.id !== id); renderInbox();
    google.script.run
      .withSuccessHandler(list => { setInbox(list); setStatus(msg); })
      .withFailureHandler(err => { inboxItems = before; renderInbox(); setStatus('Inbox error: ' + err.message); })
      .dismissInboxItem(id);
  }

  // Reference options panel (2026-10-26): Urgent panel + Inbox settings live
  // next to Sort, separate from the main Options.
  function initRefOptions(){
    const btn = document.getElementById('refOptionsBtn');
    const box = document.getElementById('refOptions');
    if(!btn || !box) return;
    btn.addEventListener('click',() => {
      box.hidden = !box.hidden;
      btn.setAttribute('aria-expanded',box.hidden ? 'false' : 'true');
      btn.classList.toggle('on',!box.hidden);
    });
    document.addEventListener('pointerdown',e => {
      if(!box.hidden && !box.contains(e.target) && e.target !== btn){ box.hidden = true; btn.setAttribute('aria-expanded','false'); btn.classList.remove('on'); }
    },true);
    const wrapCb = document.getElementById('optUrgWrap');
    if(wrapCb){ wrapCb.checked = urgWrap(); wrapCb.addEventListener('change',() => setUrgOpt('fw.urgWrap',wrapCb.checked ? '1' : '0')); }
  }
  function urgWrap(){ return urgOpt('fw.urgWrap','1') !== '0'; }

  // Options for the Urgent panel (2026-10-26, Julius: keep it concise).
  function urgOpt(key,def){ try{ const v = localStorage.getItem(key); return v == null ? def : v; }catch(e){ return def; } }
  function setUrgOpt(key,v){ try{ localStorage.setItem(key,v); }catch(e){} renderUrgent(); }
  function showMadeDate(){ return urgOpt('fw.showMade','1') !== '0'; }
  function dueStyle(){
    const v = urgOpt('fw.dueStyle',urgOpt('fw.dueCountdown','1') === '0' ? 'date' : 'days');
    return ['date','days','left'].includes(v) ? v : 'days';
  }
  function initDueOptions(){
    const made = document.getElementById('optShowMade');
    if(made){ made.checked = showMadeDate(); made.addEventListener('change',() => setUrgOpt('fw.showMade',made.checked ? '1' : '0')); }
    const style = document.getElementById('optDueStyle');
    if(style){ style.value = dueStyle(); style.addEventListener('change',() => setUrgOpt('fw.dueStyle',style.value)); }
  }
  const md = s => (dateObj(s).getMonth() + 1) + '/' + dateObj(s).getDate();
  const wd = s => dateObj(s).toLocaleDateString(undefined,{weekday:'short'});
  // "Tue 10/27", "Tue 10/27 · 3d", or "3d"; today → "Today", tomorrow → "Tmrw".
  function dueText(due,today){
    const left = Math.round((dateObj(due) - dateObj(today)) / 86400000);
    if(left === 0) return 'Today';
    const rel = left === 1 ? 'Tmrw' : left > 0 ? left + 'd' : (-left) + 'd late';
    const style = dueStyle();
    if(style === 'left') return rel;
    return wd(due) + ' ' + md(due) + (style === 'days' ? ' · ' + rel : '');
  }
  // Every task with a due date, from every day we know about.
  function collectDue(){
    const out = [];
    [...urgentSource.keys()].sort().forEach(date => {
      const tpl = document.createElement('template');
      tpl.innerHTML = urgentSource.get(date);
      tpl.content.querySelectorAll('.check-line').forEach((line,i) => {
        const due = line.dataset.due || '';
        if(!/^\d{4}-\d{2}-\d{2}$/.test(due) || due === date) return;
        const cb = line.querySelector('input[type=checkbox]');
        out.push({date,index:i,due,urg:line.dataset.urg || '',text:lineText(line),done:!!(cb && cb.hasAttribute('checked'))});
      });
    });
    return out;
  }
  // Tasks due on a day show at the top of that day's Today cell (read-only;
  // tap one to jump to where it lives).
  function renderDueBlocks(){
    const byDay = new Map();
    collectDue().forEach(it => { if(!byDay.has(it.due)) byDay.set(it.due,[]); byDay.get(it.due).push(it); });
    document.querySelectorAll('#todayScroll .day-row').forEach(row => {
      const list = byDay.get(row.dataset.date) || [];
      let block = row.querySelector(':scope > .due-block');
      const sig = JSON.stringify(list);
      if(block && block.dataset.sig === sig) return;
      if(!list.length){ if(block){ block.remove(); syncDayHeightStable(row.dataset.date); } return; }
      if(!block){
        block = document.createElement('div');
        block.className = 'due-block';
        const label = row.querySelector(':scope > .day-label');
        if(label) label.after(block); else row.prepend(block);
      }
      block.dataset.sig = sig;
      block.innerHTML = '';
      list.forEach(it => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'due-item' + (it.done ? ' done' : '');
        if(it.urg) b.dataset.urg = it.urg;
        const tag = document.createElement('span'); tag.className = 'di-tag'; tag.textContent = 'Due';
        const tx = document.createElement('span'); tx.className = 'di-text'; tx.textContent = (it.done ? '☑ ' : '☐ ') + it.text;
        const from = document.createElement('span'); from.className = 'di-from';
        from.textContent = 'from ' + dateObj(it.date).toLocaleDateString(undefined,{weekday:'short'}) + ' ' + (dateObj(it.date).getMonth() + 1) + '/' + dateObj(it.date).getDate();
        b.append(tag,tx,from);
        b.addEventListener('click',() => goToTask(it.date,it.index));
        block.appendChild(b);
      });
      syncDayHeightStable(row.dataset.date);
    });
  }
  function goToTask(date,index){
    const ed = document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(date)}"]`);
    if(!ed){ setStatus('That day isn’t loaded — scroll to ' + shortDate(date)); return; }
    const line = ed.querySelectorAll('.check-line')[index] || ed;
    line.scrollIntoView({block:'center',behavior:'smooth'});
    line.classList.add('urg-flash');
    setTimeout(() => line.classList.remove('urg-flash'),1300);
  }
  // Picker
  let urgPicker = null, urgPress = null, urgSuppressClick = false;
  // What a picker press acts on: a real checkbox in an editor, or a box in
  // the Urgent panel (2026-10-26, Julius) — that one edits the task back in
  // its Today day, which has to be loaded.
  function urgTarget(el){
    if(el.classList && el.classList.contains('urg-box')){
      const ed = document.querySelector(`#todayScroll .day-editor[data-date="${CSS.escape(el.dataset.date || '')}"]`);
      const line = ed ? ed.querySelectorAll('.check-line')[Number(el.dataset.index)] : null;
      return line ? {line,owner:ed} : null;
    }
    const line = el.closest('.check-line');
    return line ? {line,owner:el.closest('.editor,.ref-cell')} : null;
  }
  function urgChanged(owner){
    saveEditorOwner(owner);
    if(owner && owner.dataset && owner.dataset.date) noteUrgentDay(owner.dataset.date,owner.innerHTML);
    else renderUrgent();
  }
  function showUrgencyPicker(cb,x,y){
    hideUrgencyPicker();
    if(typeof hideContextMenu === 'function') hideContextMenu();
    const t = urgTarget(cb);
    if(!t){ setStatus('Scroll Today to that day first, then change it'); return; }
    const {line,owner} = t;
    const p = document.createElement('div');
    p.className = 'urg-picker';
    [[1,'1'],[2,'2'],[3,'3'],[0,'✕']].forEach(([u,label]) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'urg-pick' + (String(u) === (line.dataset.urg || '0') ? ' on' : '');
      b.dataset.urg = u;
      b.textContent = label;
      b.title = u ? u + ' · ' + URG_NAMES[u] : 'No urgency';
      b.addEventListener('pointerdown',e => e.preventDefault());
      b.addEventListener('click',() => {
        if(u) line.dataset.urg = String(u); else delete line.dataset.urg;
        hideUrgencyPicker();
        urgChanged(owner);
      });
      p.appendChild(b);
    });
    // Due date: one small chip; tapping it opens a little calendar beside the
    // picker (no phone date sheet, no grayed-out screen).
    const dueRow = document.createElement('div');
    dueRow.className = 'urg-due-row';
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'urg-due-chip' + (line.dataset.due ? ' set' : '');
    chip.textContent = '📅 ' + (line.dataset.due ? dueLabel(line.dataset.due) : 'Due date');
    chip.addEventListener('pointerdown',e => e.preventDefault());
    chip.addEventListener('click',() => {
      if(urgCal){ hideUrgCal(); return; }
      showUrgCal(chip,line.dataset.due || '',iso => {
        setDue(line,iso);
        hideUrgencyPicker();
        urgChanged(owner);
      });
    });
    dueRow.appendChild(chip);
    if(line.dataset.due){
      const clr = document.createElement('button');
      clr.type = 'button'; clr.className = 'urg-due-clear'; clr.textContent = '×'; clr.title = 'Clear due date';
      clr.addEventListener('pointerdown',e => e.preventDefault());
      clr.addEventListener('click',() => { setDue(line,''); hideUrgencyPicker(); urgChanged(owner); });
      dueRow.appendChild(clr);
    }
    p.appendChild(dueRow);
    document.body.appendChild(p);
    const r = p.getBoundingClientRect();
    p.style.left = Math.max(6,Math.min(window.innerWidth - r.width - 6,x - 12)) + 'px';
    p.style.top = Math.max(6,Math.min(window.innerHeight - r.height - 6,y + 14)) + 'px';
    urgPicker = p;
  }
  // Mini calendar popover: placed right of the anchor if it fits, else left,
  // else below/above. Tap a day = done.
  let urgCal = null;
  function hideUrgCal(){ if(urgCal){ urgCal.remove(); urgCal = null; } }
  function showUrgCal(anchor,value,onPick){
    hideUrgCal();
    const today = localToday();
    let view = dateObj(value || today); view.setDate(1);
    const cal = document.createElement('div');
    cal.className = 'urg-cal';
    const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const btn = (text,cls,fn) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = cls; b.textContent = text;
      b.addEventListener('pointerdown',e => e.preventDefault());
      b.addEventListener('click',e => { e.stopPropagation(); fn(); });
      return b;
    };
    const draw = () => {
      cal.innerHTML = '';
      const head = document.createElement('div'); head.className = 'uc-head';
      const label = document.createElement('span');
      label.textContent = view.toLocaleDateString(undefined,{month:'short',year:'numeric'});
      head.append(btn('‹','uc-nav',() => { view.setMonth(view.getMonth() - 1); draw(); }),label,
        btn('›','uc-nav',() => { view.setMonth(view.getMonth() + 1); draw(); }));
      const grid = document.createElement('div'); grid.className = 'uc-grid';
      ['S','M','T','W','T','F','S'].forEach(w => { const h = document.createElement('span'); h.className = 'uc-wd'; h.textContent = w; grid.appendChild(h); });
      for(let i = 0; i < view.getDay(); i++) grid.appendChild(document.createElement('span'));
      const d = new Date(view);
      while(d.getMonth() === view.getMonth()){
        const k = iso(d);
        grid.appendChild(btn(String(d.getDate()),'uc-day' + (k === today ? ' today' : '') + (k === value ? ' sel' : '') + (k < today ? ' past' : ''),() => { hideUrgCal(); onPick(k); }));
        d.setDate(d.getDate() + 1);
      }
      cal.append(head,grid,btn('Today','uc-today',() => { hideUrgCal(); onPick(today); }));
    };
    draw();
    document.body.appendChild(cal);
    const a = (urgPicker || anchor).getBoundingClientRect(), c = cal.getBoundingClientRect();
    let left, top = Math.min(window.innerHeight - c.height - 6,Math.max(6,a.top));
    if(a.right + 6 + c.width <= window.innerWidth - 6) left = a.right + 6;
    else if(a.left - 6 - c.width >= 6) left = a.left - 6 - c.width;
    else {
      left = Math.max(6,Math.min(window.innerWidth - c.width - 6,a.left));
      top = a.bottom + 6 + c.height <= window.innerHeight - 6 ? a.bottom + 6 : Math.max(6,a.top - 6 - c.height);
    }
    cal.style.left = left + 'px'; cal.style.top = top + 'px';
    urgCal = cal;
  }
  function hideUrgencyPicker(){
    hideUrgCal();
    if(urgPicker){ urgPicker.remove(); urgPicker = null; }
  }
  function initUrgency(){
    document.addEventListener('pointerdown',e => {
      const inPicker = (urgPicker && urgPicker.contains(e.target)) || (urgCal && urgCal.contains(e.target));
      if(urgPicker && !inPicker) hideUrgencyPicker();
      if(!inPicker) urgSuppressClick = false;
      const cb = urgencyCheckbox(e.target);
      if(!cb) return;
      if(e.button === 2){ return; }
      const press = {cb,x:e.clientX,y:e.clientY};
      press.timer = setTimeout(() => {
        if(urgPress !== press) return;
        urgPress = null;
        urgSuppressClick = true;
        if(navigator.vibrate) try{ navigator.vibrate(15); }catch(err){}
        showUrgencyPicker(cb,press.x,press.y);
      },450);
      urgPress = press;
    },true);
    const cancel = e => {
      if(!urgPress) return;
      if(e.type === 'pointermove' && Math.abs(e.clientX - urgPress.x) < 10 && Math.abs(e.clientY - urgPress.y) < 10) return;
      clearTimeout(urgPress.timer); urgPress = null;
    };
    ['pointerup','pointercancel','pointermove'].forEach(t => document.addEventListener(t,cancel,true));
    // A long press must not also tick the box.
    document.addEventListener('click',e => {
      if(!urgSuppressClick) return;
      urgSuppressClick = false;
      if(urgencyCheckbox(e.target)){ e.preventDefault(); e.stopPropagation(); }
    },true);
    // Right-click a checkbox = the same picker.
    document.addEventListener('contextmenu',e => {
      const cb = urgencyCheckbox(e.target);
      if(!cb) return;
      e.preventDefault();
      if(urgPicker) return;
      if(urgPress){ clearTimeout(urgPress.timer); urgPress = null; urgSuppressClick = true; }
      showUrgencyPicker(cb,e.clientX,e.clientY);
    },true);
    document.addEventListener('keydown',e => { if(e.key === 'Escape') hideUrgencyPicker(); },true);
  }
  initContextMenu();
  initUrgency();
  initDueOptions();
  initRefOptions();
  /* Every open menu/panel closes when you press anywhere outside it (or press Escape).
     Runs in the capture phase so nothing else can swallow the press first. */
  function closeAllMenus(exceptTarget){
    const t = exceptTarget instanceof Element ? exceptTarget : null;
    document.querySelectorAll('[data-view-menu]').forEach(menu=>{
      if(t && menu.contains(t)) return;
      const popup = menu.querySelector('.view-menu-popup');
      if(popup && !popup.hidden){
        popup.hidden = true;
        menu.querySelector('.view-menu-trigger')?.setAttribute('aria-expanded','false');
      }
    });
    const settings = document.getElementById('typeSettings');
    if(settings && !settings.classList.contains('hidden')){
      const insidePanel = t && settings.contains(t);
      const onToggle = t && t.closest('[data-layout="scale"]');
      if(!insidePanel && !onToggle) settings.classList.add('hidden');
    }
    if(!(t && ctxMenu.contains(t))) hideContextMenu();
  }
  function initOutsideClickClose(){
    document.addEventListener('pointerdown',e=>closeAllMenus(e.target),true);
    document.addEventListener('keydown',e=>{ if(e.key === 'Escape') closeAllMenus(null); },true);
  }
  /* Scroll guards: only real user scrolling counts as "scrolling", and the
     overflow:hidden containers around the day lists can never be scrolled by
     the browser (it does that to reveal the caret, which made the whole
     view slide while typing). */
  function initScrollGuards(){
    const mark = () => { lastUserScrollAt = Date.now(); };
    ['wheel','touchstart','touchmove'].forEach(type=>document.addEventListener(type,mark,{capture:true,passive:true}));
    document.addEventListener('keydown',e=>{
      if(['PageUp','PageDown','Home','End'].includes(e.key)) mark();
    },true);
    ['app','workspace','todayPane','journalPane','referencePane'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('scroll',()=>{ if(el.scrollTop) el.scrollTop = 0; },{passive:true});
    });
    window.addEventListener('scroll',()=>{ if(window.scrollY || window.scrollX) window.scrollTo(0,0); },{passive:true});
  }
  initOutsideClickClose();
  initScrollGuards();
  initWorkspaceView();
  initMobileEditing();
  function initWorkspaceHorizontalSwipe(){
    const workspace=document.getElementById('workspace');
    // Rely on native touch panning: forced preventDefault caused sticky diagonal swipes.
    // The workspace itself owns horizontal overflow; each pane owns vertical overflow.
    /* Drag empty pane headers to pan horizontally with a mouse. */
    let drag=null;
    workspace.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch' || e.button!==0 || !e.target.closest('.pane-header') ||
         e.target.closest('button,input,select,a') || workspace.scrollWidth<=workspace.clientWidth+2 ||
         isSplitActive())return;
      drag={x:e.clientX,left:workspace.scrollLeft};
      workspace.setPointerCapture(e.pointerId);
    });
    workspace.addEventListener('pointermove',e=>{
      if(!drag)return;
      const dx=e.clientX-drag.x;
      if(Math.abs(dx)>2)workspace.scrollLeft=drag.left-dx;
    });
    ['pointerup','pointercancel','lostpointercapture'].forEach(type=>workspace.addEventListener(type,()=>{drag=null;}));
    /* Nested day/reference containers have overflow-x:hidden and consume
       macOS two-finger sideways gestures before they can reach #workspace.
       Capture from anywhere in the app and send just the horizontal motion
       to the shared workspace scroller. Vertical wheel movement remains native. */
    document.addEventListener('wheel',e=>{
      if(!document.getElementById('app').contains(e.target) ||
         isSplitActive() ||
         workspace.scrollWidth<=workspace.clientWidth+2 ||
         e.ctrlKey || e.metaKey)return;  // preserve trackpad pinch/browser zoom
      // On most trackpads a sideways swipe is deltaX. Shift+wheel is a
      // convenient alternative for ordinary mice and external keyboards.
      const shiftPan=e.shiftKey && Math.abs(e.deltaY)>Math.abs(e.deltaX);
      const amount=shiftPan ? e.deltaY : e.deltaX;
      if(Math.abs(amount)<.01)return;
      e.preventDefault();
      workspace.scrollLeft+=amount;
    },{capture:true,passive:false});
  }
  initColumnResizers();
  initWorkspaceHorizontalSwipe();
  initFocusMode();
  loadWorkspace();
</script>
