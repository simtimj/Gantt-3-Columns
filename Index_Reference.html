<script>
  /* =========================================================
     REFERENCE
     ========================================================= */
  const REF_SORT_KEY = 'focusWorkspaceReferenceSortV1';
  let referenceSortMode = localStorage.getItem(REF_SORT_KEY) || 'original';
  const referenceCollator = new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
  function stripReferenceMetadata(html){
    return String(html || '').replace(/<!--fw-modified:\d+-->/g,'');
  }
  function referenceModified(item){
    const match = String(item.content || '').match(/<!--fw-modified:(\d+)-->/);
    return match ? Number(match[1]) : 0;
  }
  function writeReferenceMetadata(html,time){
    return `<!--fw-modified:${time}-->` + stripReferenceMetadata(html);
  }
  function referenceTitle(item){
    const wrapper = document.createElement('div');
    wrapper.innerHTML = storedToHtml(stripReferenceMetadata(item.content || item.title || ''));
    const title = wrapper.querySelector('h2,h1,h3,p,div') || wrapper;
    return (title.textContent || item.title || '').trim();
  }
  // Pinned cards first in every sort mode (2026-11-04, Julius); ids come from the server (getRefPins_).
  let refPins = new Set();
  function sortedReferenceItems(){
    return [...state.reference].sort((a,b) => {
      const pa = refPins.has(String(a.id)), pb = refPins.has(String(b.id));
      if(pa !== pb) return pa ? -1 : 1;
      if(referenceSortMode === 'title'){
        const order = referenceCollator.compare(referenceTitle(a),referenceTitle(b));
        if(order) return order;
      }else if(referenceSortMode === 'modified'){
        const order = referenceModified(b) - referenceModified(a);
        if(order) return order;
      }
      return (Number(a.sort) || 0) - (Number(b.sort) || 0) || String(a.id).localeCompare(String(b.id));
    });
  }
  function applyReferenceSort(){
    if(document.activeElement?.closest?.('.ref-cell')) return;
    const tree = document.getElementById('referenceTree');
    sortedReferenceItems().forEach(item => {
      const node = tree.querySelector(`.ref-cell-wrapper[data-id="${CSS.escape(String(item.id))}"]`);
      if(node) node.parentNode.appendChild(node); // Re-orders among its siblings only.
    });
  }
  function initReferenceSort(){
    const select = document.getElementById('referenceSort');
    if(!['original','title','modified'].includes(referenceSortMode)) referenceSortMode = 'original';
    select.value = referenceSortMode;
    select.addEventListener('change',() => {
      referenceSortMode = select.value;
      localStorage.setItem(REF_SORT_KEY,referenceSortMode);
      applyReferenceSort();
    });
  }
  const MOBILE_SCALE_KEY = 'focusWorkspaceMobileScaleV1';
  function normalizeMobileScale(value){
    const number = Number(value);
    return Number.isFinite(number) && number > 0 ? Math.max(50,Math.min(200,Math.round(number/10)*10)) : 100;
  }
  function setMobileScale(value){
    const percent = normalizeMobileScale(value);
    document.documentElement.style.setProperty('--mobile-scale',String(percent / 100));
    document.documentElement.style.setProperty('--workspace-scale',String(percent / 100));
    document.getElementById('mobileScale').value = String(percent);
    document.getElementById('mobileScaleValue').textContent = percent + '%';
    localStorage.setItem(MOBILE_SCALE_KEY,String(percent));
    requestAnimationFrame(() => { updateWorkspaceLayout(); syncDayHeights(); positionTypeSettings(); });
  }
  function initMobileScale(){
    document.getElementById('mobileScale').addEventListener('input',event => setMobileScale(event.target.value));
    document.getElementById('resetMobileScale').addEventListener('click',() => setMobileScale(100));
    setMobileScale(localStorage.getItem(MOBILE_SCALE_KEY) || 100);
  }
  /* Padding: the extra space around the content of each day cell and Reference
     cell. Left/right and top/bottom are separate. 100% is the original spacing,
     0% removes it, 300% triples it. */
  const PAD_X_KEY = 'focusWorkspacePadXV1';
  const PAD_Y_KEY = 'focusWorkspacePadYV1';
  const PAD_SCALE_KEY = 'focusWorkspacePadScaleV1'; // older single slider, used only to migrate
  function normalizePadScale(value){
    const number = Number(value);
    return Number.isFinite(number) ? Math.max(0,Math.min(300,Math.round(number/10)*10)) : 100;
  }
  function setPad(axis,value,save = true){
    const percent = normalizePadScale(value);
    const upper = axis.toUpperCase();
    document.documentElement.style.setProperty('--pad-' + axis,String(percent / 100));
    const input = document.getElementById('pad' + upper);
    const output = document.getElementById('pad' + upper + 'Value');
    if(input) input.value = String(percent);
    if(output) output.textContent = percent + '%';
    if(save){ try{ localStorage.setItem(axis === 'x' ? PAD_X_KEY : PAD_Y_KEY,String(percent)); }catch(e){} }
    requestAnimationFrame(() => syncDayHeights());
  }
  function initPadScale(){
    ['x','y'].forEach(axis => {
      const upper = axis.toUpperCase();
      document.getElementById('pad' + upper).addEventListener('input',event => setPad(axis,event.target.value));
      document.getElementById('resetPad' + upper).addEventListener('click',() => setPad(axis,100));
      let saved = null;
      try{
        saved = localStorage.getItem(axis === 'x' ? PAD_X_KEY : PAD_Y_KEY);
        if(saved === null) saved = localStorage.getItem(PAD_SCALE_KEY);
      }catch(e){}
      setPad(axis,saved === null ? 100 : saved,false);
    });
    document.getElementById('closeTypeSettings').addEventListener('click',() => {
      document.getElementById('typeSettings').classList.add('hidden');
    });
  }
  /* =========================================================
     MOBILE MODE / SPLIT
     ========================================================= */
  const MOBILE_SPLIT_KEY = 'focusWorkspaceMobileSplitV1';
  const MOBILE_SPLIT_SIZE_KEY = 'focusWorkspaceMobileSplitSizeV1';
  const MOBILE_SPLIT_OPTIONS_KEY = 'focusWorkspaceMobileSplitOptionsV1';
  let splitOptions = {first:'today',second:'reference',third:'none',orientation:'vertical'};
  try{splitOptions={...splitOptions,...JSON.parse(localStorage.getItem(MOBILE_SPLIT_OPTIONS_KEY)||'{}')};}catch(e){}
  function normalizeSplitOptions(){
    if(!VIEW_PANES.includes(splitOptions.first)) splitOptions.first='today';
    if(!VIEW_PANES.includes(splitOptions.second)) splitOptions.second='reference';
    if(splitOptions.third!=='none' && !VIEW_PANES.includes(splitOptions.third)) splitOptions.third='none';
    if(!['vertical','horizontal','top','bottom'].includes(splitOptions.orientation)) splitOptions.orientation='vertical';
    // Row + 2 columns layouts always use three panes: fill an empty third with the pane not picked yet.
    if(isRowLayout() && splitOptions.third==='none') splitOptions.third=VIEW_PANES.find(n=>n!==splitOptions.first && n!==splitOptions.second) || splitOptions.first;
  }
  // Row + 2 columns (Julius, 2026-10-27): 'top' = First is a full-width row on top,
  // Second | Third side by side below; 'bottom' = First | Second on top, Third as a row below.
  function isRowLayout(){ return splitOptions.orientation==='top' || splitOptions.orientation==='bottom'; }
  const SPLIT_COLS_KEY = 'fw.splitColsRatio';
  let splitColsRatio = .5;
  try{ splitColsRatio = Math.max(.003,Math.min(.997,Number(localStorage.getItem(SPLIT_COLS_KEY)) || .5)); }catch(e){}
  function saveSplitOptions(){ try{ localStorage.setItem(MOBILE_SPLIT_OPTIONS_KEY,JSON.stringify(splitOptions)); }catch(e){} }
  let mobileSplitRatio = Math.max(.003,Math.min(.997,Number(localStorage.getItem(MOBILE_SPLIT_SIZE_KEY)) || .5));
  /* Three panes side by side (Julius, 2026-10-31): both column lines drag, like the half-split bars.
     split3 = the three widths as fractions (sum 1); double-tap a line to reset to equal. */
  /* Tuck (2026-11-06, Julius: "expand as much as I want, but never lose a line"): a column / section can shrink
     to a TUCK px strip (snaps there once it's under TUCK_SNAP px). A tucked strip shows a pull tab (initTucks) and
     the line stays on screen, so it can always be dragged back. tuckFrac clamps a line at fraction p between the
     neighbouring lines lo / hi of a box `size` px long. */
  const TUCK = 14, TUCK_SNAP = 48;
  function tuckFrac(p,lo,hi,size){
    size = Math.max(1,size); const m = TUCK / size;
    p = Math.max(lo + m,Math.min(hi - m,p));
    if((p - lo) * size < TUCK_SNAP) p = lo + m; else if((hi - p) * size < TUCK_SNAP) p = hi - m;
    return p;
  }
  window.tuckFrac = tuckFrac;
  const SPLIT3_KEY = 'fw.split3';
  let split3 = [1/3,1/3,1/3];
  try{ const v = JSON.parse(localStorage.getItem(SPLIT3_KEY)); if(Array.isArray(v) && v.length === 3 && v.every(x => x > .001)) split3 = v; }catch(e){}
  function isTriSplit(){ try{ return isSplitActive() && !isRowLayout() && splitOptions.third !== 'none'; }catch(e){ return false; } }
  function triDrag(handle,idx,event){
    event.preventDefault(); try{ handle.setPointerCapture(event.pointerId); }catch(e){}
    const now = Date.now();
    if(now - (handle._lastTap || 0) < 350){ handle._lastTap = 0; split3 = [1/3,1/3,1/3]; try{ localStorage.setItem(SPLIT3_KEY,JSON.stringify(split3)); }catch(e){} updateWorkspaceLayout(); return; }
    handle._lastTap = now;
    const workspace = document.getElementById('workspace');
    const rect = workspace.getBoundingClientRect();
    const horizontal = splitOptions.orientation === 'horizontal';
    const size = horizontal ? rect.width : rect.height;
    const move = e => {
      const p = horizontal ? (e.clientX - rect.left) / Math.max(1,rect.width) : (e.clientY - rect.top) / Math.max(1,rect.height);
      const b0 = split3[0], b1 = split3[0] + split3[1];
      if(idx === 0){ const n = tuckFrac(p,0,b1,size); split3 = [n,b1 - n,1 - b1]; }
      else { const n = tuckFrac(p,b0,1,size); split3 = [b0,n - b0,1 - n]; }
      handle._lastTap = 0;
      updateWorkspaceLayout();
    };
    const up = () => { try{ localStorage.setItem(SPLIT3_KEY,JSON.stringify(split3)); }catch(e){} handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up); };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
  }
  function isActualMobileDevice(){
    // Prefer the browser's explicit mobile hint. Fall back to mobile OS signals.
    if(navigator.userAgentData && typeof navigator.userAgentData.mobile === 'boolean') return navigator.userAgentData.mobile;
    const ua = navigator.userAgent || '';
    if(/Android|iPhone|iPod|Mobile/i.test(ua)) return true;
    // iPadOS can identify itself as Macintosh, but exposes multiple touch points.
    if(/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
    return /iPad/i.test(ua);
  }
  function isMobileLayout(){
    return document.body.classList.contains('mobile-mode');
  }
  function isSplitActive(){
    return document.body.classList.contains('mobile-split');
  }
  function setMobileMode(on){
    on=!!on;
    document.body.classList.toggle('mobile-mode',on);
    document.querySelectorAll('[data-mobile-mode]').forEach(button => button.textContent = on ? 'Exit Mobile' : 'Mobile');
    updateWorkspaceLayout();
  }
  /* Split works in regular desktop mode and in Mobile mode. */
  function setSplit(on){
    on = !!on;
    document.body.classList.toggle('mobile-split',on);
    try{ localStorage.setItem(MOBILE_SPLIT_KEY,on?'1':'0'); }catch(e){}
    document.querySelectorAll('[data-split-state]').forEach(el => el.textContent = on ? '· on' : '');
    document.querySelectorAll('[data-split-exit]').forEach(btn => btn.disabled = !on);
    updateColumnsLabel();
    updateWorkspaceLayout();
  }
  function initAppDisplay(){
    document.querySelectorAll('[data-mobile-mode]').forEach(button => button.addEventListener('click',()=>{
      releaseEditor();
      setMobileMode(!isMobileLayout());
    }));
    // Always start in regular mode. Mobile mode turns on only from the button.
    setMobileMode(false);
    normalizeSplitOptions();
    const handle=document.getElementById('mobileSplitResizer');
    handle?.addEventListener('pointerdown',event=>{
      if(isTriSplit()){ triDrag(handle,0,event); return; }
      event.preventDefault(); handle.setPointerCapture(event.pointerId);
      const workspace=document.getElementById('workspace');
      const rect=workspace.getBoundingClientRect();
      const move=e=>{ const horizontal=splitOptions.orientation==='horizontal'; mobileSplitRatio=tuckFrac((horizontal?e.clientX-rect.left:e.clientY-rect.top)/Math.max(1,horizontal?rect.width:rect.height),0,1,horizontal?rect.width:rect.height); updateWorkspaceLayout(); };
      const up=()=>{ localStorage.setItem(MOBILE_SPLIT_SIZE_KEY,String(mobileSplitRatio)); handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up); };
      handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up);
    });
  }
  function renderReference(){
    const tree =
      document.getElementById(
        'referenceTree'
      );
    tree.innerHTML = '';
    const items =
      sortedReferenceItems();
    if(!items.length){
      tree.innerHTML =
        '<div class="empty">' +
        'No reference cells yet. ' +
        'Click + Cell or press ⌘/Ctrl+Enter.' +
        '</div>';
      return;
    }
    // Nested cells (2026-10-26): parents first, children inside them.
    const ids = new Set(items.map(x => String(x.id)));
    const kids = new Map();
    items.forEach(item => {
      const pid = item.parentId && ids.has(String(item.parentId)) && String(item.parentId) !== String(item.id) ? String(item.parentId) : '';
      if(!kids.has(pid)) kids.set(pid,[]);
      kids.get(pid).push(item);
    });
    const done = new Set();
    const build = (pid,container) => (kids.get(pid) || []).forEach(item => {
      if(done.has(item.id)) return; // Guards against a loop in the sheet.
      done.add(item.id);
      const wrap = createReferenceCell(item,container);
      build(String(item.id),wrap.querySelector(':scope > .ref-children'));
    });
    build('',tree);
    items.filter(item => !done.has(item.id)).forEach(item => createReferenceCell(item,tree));
    filterReference();
  }
  function createReferenceCell(item,container){
    const wrap =
      document.createElement(
        'div'
      );
    wrap.className =
      'ref-cell-wrapper' + (item.expanded === false ? ' ref-collapsed' : '') + (refPins.has(String(item.id)) ? ' ref-pinned' : '');
    wrap.dataset.id =
      item.id;
    wrap.innerHTML =
      `<button class="ref-disclosure" type="button" data-toggle title="Expand/collapse reference cell">${item.expanded === false ? '▸' : '▾'}</button>
      <button class="ref-drag" type="button" aria-label="Drag to reorder reference cell" title="Drag to reorder">⠿</button>
      <button class="ref-pin" type="button" data-pin aria-label="Pin to top" title="Pin to top">📌</button>
      <button class="ref-b3" type="button" data-b3 aria-label="Big Three / Waiting list" title="Add this project to the Big Three (or the Waiting list when full); tap again to take it out">★</button>
      <div
        class="ref-cell"
        contenteditable="true"
        data-placeholder="Type reference material…"
      >${storedToHtml(
        stripReferenceMetadata(item.content || item.title || '')
      )}</div>
      <div class="ref-actions">
        <button
          class="btn tiny ref-del"
          data-del title="Delete (goes to the Archive)" aria-label="Delete">🗑</button>
      </div>
      <div class="ref-children"></div>`;
    (container || document.getElementById('referenceTree')).appendChild(wrap);
    const ed =
      wrap.querySelector(
        '.ref-cell'
      );
    normalizeEditorTasks(ed);
    ensureReferenceTitle(ed);
    wireCodeBlocks(ed);
    wireEditorHistory(ed);
    ed.addEventListener('blur',() => setTimeout(applyReferenceSort,0));
    // ★ (2026-11-08): this card as a project in the Big Three / Waiting list (window.fwBig, Plan tab, ref card:<id>).
    wrap.querySelector(':scope > [data-b3]').addEventListener('click',e => {
      e.preventDefault(); e.stopPropagation();
      if(window.fwBig) window.fwBig.toggle('card:' + item.id, (window.fwCardInfo && window.fwCardInfo(String(item.id)).title) || item.title || 'Project');
    });
    // 📌 pins the card to the top of Reference, synced through the server.
    wrap.querySelector(':scope > [data-pin]').addEventListener('click',e => {
      e.preventDefault(); e.stopPropagation();
      const id = String(item.id), on = !refPins.has(id);
      const apply = v => { if(v) refPins.add(id); else refPins.delete(id); wrap.classList.toggle('ref-pinned',v); applyReferenceSort(); };
      apply(on);
      setStatus(on ? 'Pinned to the top' : 'Unpinned');
      google.script.run
        .withSuccessHandler(list => { if(Array.isArray(list)){ refPins = new Set(list.map(String)); applyReferenceSort(); } })
        .withFailureHandler(err => { apply(!on); setStatus('Could not save the pin: ' + (err && err.message || err)); })
        .setReferencePin(id,on);
    });
    ed.addEventListener(
      'focus',
      () => {
        activeRefId =
          item.id;
        activeEditor =
          ed;
        rememberSelection(ed);
      }
    );
    ed.addEventListener(
      'keyup',
      () => {
        rememberSelection(ed);
      }
    );
    ed.addEventListener(
      'mouseup',
      () => {
        rememberSelection(ed);
      }
    );
    ed.addEventListener(
      'input',
      () => {
        activeEditor =
          ed;
        rememberSelection(ed);
        autoFormat(ed);
        saveRefFromDom(
          item.id
        );
      }
    );
    ed.addEventListener(
      'keydown',
      e => {
        handleEditorKey(
          e,
          ed,
          'reference'
        );
      }
    );
    ed.addEventListener('paste', e => pasteRichClipboard(e, ed));
    ed.addEventListener('cut', e => copyStructuredText(e, ed, true));
    ed.addEventListener(
      'copy',
      e => copyStructuredText(e, ed)
    );
    ed.querySelectorAll(
      'input[type=checkbox]'
    ).forEach(
      wireCheckbox
    );
    wrap.querySelector(
      ':scope > [data-toggle]'
    ).onclick = e => {
      e.preventDefault();
      e.stopPropagation();
      item.expanded = item.expanded === false;
      wrap.classList.toggle('ref-collapsed', !item.expanded);
      e.currentTarget.textContent = item.expanded ? '▾' : '▸';
      sendRefItem(item);
    };
    wrap.querySelector(
      ':scope > .ref-actions [data-del]'
    ).onclick =
      () =>
        deleteReference(
          item.id
        );
    initReferenceDragHandle(wrap);
    return wrap;
  }
  function saveRefFromDom(id){
    const wrap =
      document.querySelector(
        `#referenceTree .ref-cell-wrapper[data-id="${CSS.escape(id)}"]`
      );
    const item =
      state.reference.find(
        x => x.id === id
      );
    if(!wrap || !item){
      return;
    }
    const refCell = wrap.querySelector(':scope > .ref-cell');
    refCell?.querySelectorAll('input[data-wired]').forEach(cb=>cb.removeAttribute('data-wired'));
    item.content = writeReferenceMetadata(refCell ? cardCleanHtml(refCell) : '',Date.now());
    fwDraftCaptureRef(item);
    if(refCell && isBacklogItem(item)) noteUrgentDay('backlog',refCell.innerHTML,true,'backlog');
    clearTimeout(
      item._timer
    );
    setStatus(
      'Unsaved reference…'
    );
    item._timer =
      setTimeout(
        () => {
          item._timer = 0;
          sendRefItem(item,() => setStatus('Saved'),err => {
            setStatus('Save error: ' + err.message + ' — retrying');
            item._timer = setTimeout(() => saveRefFromDom(item.id),5000); // never drop an edit
          });
        },
        700
      );
  }
  function ensureReferenceTitle(editor){
    if(editor.firstElementChild?.tagName === 'H2') return;
    // Tasks and code blocks are content, never title wrappers.
    if(editor.firstElementChild?.matches('.check-line,pre') || editor.firstElementChild?.querySelector('input[type=checkbox]')){
      const title = document.createElement('h2'); title.innerHTML = '<br>';
      editor.prepend(title); return;
    }
    const heading = document.createElement('h2');
    const first = editor.firstChild;
    if(first?.nodeType === Node.ELEMENT_NODE){
      while(first.firstChild) heading.appendChild(first.firstChild);
      first.replaceWith(heading);
    }else if(first?.nodeType === Node.TEXT_NODE){
      heading.textContent = first.textContent;
      first.remove();
      if(editor.firstChild?.nodeName === 'BR') editor.firstChild.remove();
      editor.prepend(heading);
    }else{
      heading.appendChild(document.createElement('br'));
      editor.prepend(heading);
    }
  }
  function addReferenceCell(afterId){
    fwRefStructureStart();
    google.script.run
      .withSuccessHandler(id => {
        fwRefStructureEnd();
        const item = {
          id:id,
          parentId:'',
          type:'item',
          title:'',
          content:'<h2><br></h2>',
          expanded:true,
          sort:Date.now()
        };
        item._b = {c:item.content,h:null}; // base = what the server holds (2026-10-31)
        refBase(item);
        state.reference.push(
          item
        );
        document.querySelector('#referenceTree > .empty')?.remove();
        createReferenceCell(
          item
        );
        const ed =
          document.querySelector(
            `#referenceTree .ref-cell-wrapper[data-id="${CSS.escape(id)}"] .ref-cell`
          );
        ed.focus();
        activeRefId =
          id;
        activeEditor =
          ed;
        placeEnd(ed);
      })
      .withFailureHandler(err => { fwRefStructureEnd(); setStatus('Could not add card: ' + err.message); })
      .addReferenceItem(
        '',
        '',
        '<h2><br></h2>'
      );
  }
  /* =========================================================
     ARCHIVE — deleted Reference cells (2026-10-26)
     ========================================================= */
  function closeArchive(){
    document.getElementById('archiveOverlay')?.remove();
  }
  function openArchive(){
    closeArchive();
    const overlay = document.createElement('div');
    overlay.id = 'archiveOverlay';
    overlay.innerHTML = '<div class="archive-box"><div class="archive-head"><strong>Archive</strong>'
      + '<span class="archive-sub">deleted Reference cells</span>'
      + '<button class="btn" type="button" data-close>✕</button></div>'
      + '<div class="archive-list"><p class="archive-empty">Loading…</p></div></div>';
    overlay.addEventListener('click', e => {
      if(e.target === overlay || e.target.closest('[data-close]')) closeArchive();
    });
    document.body.appendChild(overlay);
    const list = overlay.querySelector('.archive-list');
    google.script.run
      .withSuccessHandler(items => {
        if(!items || !items.length){
          list.innerHTML = '<p class="archive-empty">Nothing here yet. Cells you delete from now on land here.</p>';
          return;
        }
        list.innerHTML = '';
        items.forEach(it => {
          const tmp = document.createElement('div');
          tmp.innerHTML = it.title || it.content || '';
          const text = (tmp.textContent || '').trim() || '(empty cell)';
          const when = it.deletedAt ? new Date(it.deletedAt).toLocaleString([], {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}) : '';
          const row = document.createElement('div');
          row.className = 'archive-row';
          row.innerHTML = '<div class="archive-text"><div class="archive-title"></div><div class="archive-meta"></div></div>'
            + '<button class="btn" type="button">Restore</button>';
          row.querySelector('.archive-title').textContent = text.slice(0, 140);
          row.querySelector('.archive-meta').textContent = 'Deleted ' + when
            + (it.children ? ' · +' + it.children + ' inside' : '');
          row.querySelector('button').addEventListener('click', ev => {
            ev.target.disabled = true;
            ev.target.textContent = 'Restoring…';
            google.script.run
              .withSuccessHandler(reference => {
                fwRefEpoch++;
                state.refManifestHash = '';
                state.reference = reference;
                state.reference.forEach(refBase);
                renderReference();
                row.remove();
                if(!list.children.length) list.innerHTML = '<p class="archive-empty">Archive is empty.</p>';
              })
              .withFailureHandler(err => {
                ev.target.disabled = false;
                ev.target.textContent = 'Restore';
                alert(err.message || err);
              })
              .restoreArchivedItem(it.id, it.deletedAt);
          });
          list.appendChild(row);
        });
      })
      .withFailureHandler(err => { list.innerHTML = '<p class="archive-empty"></p>'; list.firstChild.textContent = 'Error: ' + (err.message || err); })
      .getArchive();
  }
  function deleteReference(id, opt){
    const archive = !!(opt && opt.archive);
    // Confirm first (2026-10-26, Julius: too easy to delete by accident). Archive (2026-11-21, hold menu) skips the
    // question: it is the same move into the Archive list, restorable from Arc.

  function buildSplitMirror(source,slot){
    const mirror=source.cloneNode(true);
    mirror.id='splitMirrorPane'+slot;
    mirror.dataset.splitMirror=String(slot);
    const sanitize=element=>{
      element.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
      element.querySelectorAll('[contenteditable]').forEach(el=>el.setAttribute('contenteditable','false'));
      element.querySelectorAll('input,button,select,textarea').forEach(el=>{el.disabled=true;el.removeAttribute('onclick');});
    };
    sanitize(mirror);
    mirror.setAttribute('aria-label','Read-only duplicate of '+source.id);
    document.getElementById('workspace').appendChild(mirror);
    // Start the duplicate at the same scroll position as the original.
    requestAnimationFrame(()=>{
      const from=[...source.querySelectorAll('.scroll')];
      [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ if(from[i]) el.scrollTop=from[i].scrollTop; });
    });
    let queued=false;
    const observer=new MutationObserver(()=>{
      if(queued || !mirror.isConnected)return;
      queued=true;
      requestAnimationFrame(()=>{
        queued=false;
        if(!mirror.isConnected)return;
        // Rebuilding the copy would otherwise reset its scroll to the first
        // (oldest) day on every keystroke made in the original.
        const keep=[...mirror.querySelectorAll('.scroll')].map(el=>el.scrollTop);
        const replacement=source.cloneNode(true);
        sanitize(replacement);
        mirror.replaceChildren(...Array.from(replacement.childNodes));
        [...mirror.querySelectorAll('.scroll')].forEach((el,i)=>{ el.scrollTop=keep[i]||0; });
      });
    });

    splitMirrorObservers.push(observer);

        normalizeSplitOptions();
        popup.querySelectorAll('[data-split]').forEach(select => { select.value = splitOptions[select.dataset.split]; });
        labelSplitFields(popup);
        popup.querySelectorAll('[data-split-exit]').forEach(btn => btn.disabled = !isSplitActive());
        popup.hidden = false;
        trigger.setAttribute('aria-expanded','true');
      });
      menu.querySelectorAll('[data-pane-toggle]').forEach(input=>input.addEventListener('change',()=>{
        const next = new Set(visiblePanes);
        if(input.checked) next.add(input.dataset.paneToggle);
        else next.delete(input.dataset.paneToggle);
        if(isSplitActive()) setSplit(false);
        applyWorkspaceView([...next]);
      }));
      popup.querySelectorAll('[data-menu-layout]').forEach(b => b.addEventListener('click',()=>{
        const real = menu.parentElement.querySelector('[data-layout="' + b.dataset.menuLayout + '"]') || document.querySelector('[data-layout="' + b.dataset.menuLayout + '"]');
        closeColumnsMenus(); if(real) real.click();
      }));
      menu.querySelectorAll('[data-pane-solo]').forEach(button=>button.addEventListener('click',()=>{
        if(isSplitActive()) setSplit(false);
        applyWorkspaceView([button.dataset.paneSolo]);
        closeColumnsMenus();
      }));
      popup.querySelector('[data-split-apply]').addEventListener('click',()=>{
        popup.querySelectorAll('[data-split]').forEach(select => { splitOptions[select.dataset.split] = select.value; });
        normalizeSplitOptions();
        saveSplitOptions();
        closeColumnsMenus();
        setSplit(true);
      });
      // One-tap layouts (Julius, 2026-10-27): preset, rotate the panes, swap the two columns.
      const applySplitNow=()=>{ normalizeSplitOptions(); saveSplitOptions(); popup.querySelectorAll('[data-split]').forEach(sel => { sel.value = splitOptions[sel.dataset.split]; }); labelSplitFields(popup); setSplit(true); };
      popup.querySelector('[data-split="orientation"]').addEventListener('change',()=>labelSplitFields(popup));
      popup.querySelector('[data-split-preset]').addEventListener('click',()=>{
        splitOptions={...splitOptions,first:'reference',second:'today',third:'journal',orientation:'top'};
        applySplitNow(); closeColumnsMenus();
      });
      popup.querySelector('[data-split-rotate]').addEventListener('click',()=>{
        popup.querySelectorAll('[data-split]').forEach(sel => { splitOptions[sel.dataset.split] = sel.value; });
        normalizeSplitOptions();
        if(splitOptions.third==='none') [splitOptions.first,splitOptions.second]=[splitOptions.second,splitOptions.first];
        else [splitOptions.first,splitOptions.second,splitOptions.third]=[splitOptions.third,splitOptions.first,splitOptions.second];
        applySplitNow();
      });
      popup.querySelector('[data-split-swap]').addEventListener('click',()=>{
        popup.querySelectorAll('[data-split]').forEach(sel => { splitOptions[sel.dataset.split] = sel.value; });
        normalizeSplitOptions();
        if(splitOptions.orientation==='top') [splitOptions.second,splitOptions.third]=[splitOptions.third,splitOptions.second];
        else [splitOptions.first,splitOptions.second]=[splitOptions.second,splitOptions.first];
        applySplitNow();
      });
      popup.querySelector('[data-split-exit]').addEventListener('click',()=>{
        closeColumnsMenus();
        setSplit(false);
      });
    });
    applyWorkspaceView(saved);
    // Start with the selected columns visible; split only when explicitly chosen —
    // except a row + 2 columns layout, which comes back as you left it (Julius, 2026-10-27).
    let keepRow=false;
    try{ keepRow=localStorage.getItem(MOBILE_SPLIT_KEY)==='1' && isRowLayout(); }catch(e){}
    setSplit(keepRow);
  }
  function initMobileEditing(){
    document.addEventListener('selectionchange',() => {
      const selection = window.getSelection();
      const node = selection?.anchorNode;
      const element = node?.nodeType === 3 ? node.parentElement : node;
      const ed = element?.closest?.('.editor,.ref-cell');
      if(ed && ed.isContentEditable) rememberSelection(ed);
    });
    window.addEventListener('resize',()=>{
      // Mobile keyboard resizes the viewport. Rebuilding the grid while
      // selecting text can shift the native selection handles several lines.
      if(isActualMobileDevice() && editableFocused())return;
      updateWorkspaceLayout();
    });
  }
  /* =========================================================
     COLUMN RESIZING / FOCUS MODE
     ========================================================= */
  function applyColumnWidths(){
    const root=document.documentElement;
    root.style.setProperty('--col-today',columnWidths.today+'px');
    root.style.setProperty('--col-journal',columnWidths.journal+'px');
    root.style.setProperty('--col-reference',columnWidths.reference+'px');
    updateWorkspaceLayout();
  }
  function initColumnResizers(){
    applyColumnWidths();
    const edge=document.getElementById('referenceEdgeResize');
    edge?.addEventListener('pointerdown',e=>{
      if(isMobileLayout() || isSplitActive())return;
      e.preventDefault();e.stopPropagation();edge.setPointerCapture(e.pointerId);edge.classList.add('dragging');
      const x=e.clientX,w=columnWidths.reference;
      // The right edge never goes past the window (2026-11-06, Julius: a line out of reach = Reset).
      const maxW=Math.max(120,Math.round(window.innerWidth-8-(document.getElementById('calPane')||document.getElementById('referencePane')).getBoundingClientRect().left));
      const move=ev=>{columnWidths.reference=Math.max(120,Math.min(maxW,Math.round(w+ev.clientX-x)));applyColumnWidths();};
      const end=()=>{edge.classList.remove('dragging');edge.removeEventListener('pointermove',move);edge.removeEventListener('pointerup',end);edge.removeEventListener('pointercancel',end);localStorage.setItem(COLUMN_STORAGE_KEY,JSON.stringify(columnWidths));};
      edge.addEventListener('pointermove',move);edge.addEventListener('pointerup',end);edge.addEventListener('pointercancel',end);
    });
    document.querySelectorAll('.column-resizer').forEach(handle=>{
      handle.addEventListener('pointerdown',e=>{
        e.preventDefault();
        handle.setPointerCapture(e.pointerId);
        handle.classList.add('dragging');
        const left=handle.dataset.left,right=handle.dataset.right,startX=e.clientX;
        const startLeft=colPaneEl(left).getBoundingClientRect().width;
        const startRight=colPaneEl(right).getBoundingClientRect().width;
        const move=ev=>{
          const dx=ev.clientX-startX;
          // Down to a tucked strip, not 120px (2026-11-06, Julius); under TUCK_SNAP it snaps to the strip.
          const total=startLeft+startRight;
          let newLeft=Math.max(TUCK,Math.min(total-TUCK,startLeft+dx));
          if(newLeft<TUCK_SNAP)newLeft=TUCK;else if(total-newLeft<TUCK_SNAP)newLeft=total-TUCK;
          let newRight=total-newLeft;
          columnWidths[left]=Math.round(newLeft);columnWidths[right]=Math.round(newRight);
          applyColumnWidths();requestAnimationFrame(syncDayHeights);
        };
        const up=()=>{
          handle.classList.remove('dragging');
          handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);
          localStorage.setItem(COLUMN_STORAGE_KEY,JSON.stringify(columnWidths));
        };
        handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
      });
    });
  }
  function setFocusMode(on){
    document.body.classList.toggle('focus-mode',!!on);
    localStorage.setItem(FOCUS_STORAGE_KEY,on?'1':'0');
    requestAnimationFrame(() => { updateWorkspaceLayout(); positionTypeSettings(); });
  }
  // Focus is shelved (2026-10-26): always start with the toolbar showing.
  function initFocusMode(){setFocusMode(false);}
</script>
