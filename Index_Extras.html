<script>
  /* Task mirrors (2026-11-01, Julius; spec phase 1). One task, several places: every live copy
     carries the same data-tid. Ticking any copy ticks the others (Reference, Plan / think, Today,
     Notes; Urgent is drawn from those cells, so it follows). A ticked Plan / think copy moves into
     that day's Today ("Completed") as a history line with data-htid (not data-tid, so it never
     re-syncs). Details: docs/NOTES.md → "Task mirrors". */
  (function(){
    let syncing = false;
    const q = s => '"' + CSS.escape(String(s)) + '"';
    const ED = '.day-editor,.journal-editor,.plan-editor,.ref-cell,.thought-editor,.kim-editor';
    const ownerOf = l => l && l.closest ? l.closest(ED) : null;
    const boxOf = l => l.querySelector(':scope > input[type=checkbox]') || l.querySelector('input[type=checkbox]');
    const isOn = l => { const b = boxOf(l); return !!(b && b.checked); };
    function setOn(l,on){
      const b = boxOf(l); if(!b) return;
      b.checked = on; b.toggleAttribute('checked',on); l.classList.toggle('done',on);
    }
    function newTid(){ return 'm-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
    // The live copies of a task: the first line with this tid in each other editor.
    function copies(tid,exceptEd){
      const out = [];
      cardEditors().forEach(ed => {
        if(ed === exceptEd) return;
        const l = ed.querySelector('.check-line[data-tid=' + q(tid) + ']');
        if(l && ownerOf(l) === ed) out.push(l);
      });
      return out;
    }
    function edit(ed,fn){ captureBeforeEdit(ed); fn(); finishEditorEdit(ed); urgChanged(ed); }
    // Completed Plan / think copy → history line at the end of that day's Today cell.
    function toHistory(pl){
      const pad = ownerOf(pl), date = pad && pad.dataset.date;
      if(!date || !pl.isConnected || !isOn(pl)) return;
      const day = document.querySelector('#todayScroll .day-editor[data-date=' + q(date) + ']');
      if(!day) return;
      const tx = pl.querySelector('.check-text');
      addHistory(day, pl.dataset.tid, tx ? tx.innerHTML : '', pl.dataset.cat);
      edit(pad,() => { pl.remove(); if(!pad.textContent.trim() && !pad.querySelector('input,img,hr')) pad.replaceChildren(); });
    }
    // Checked data-htid line at the end of a Today cell — never twice per tid per day.
    function addHistory(day,tid,html,cat){
      if(!day || day.querySelector('.check-line[data-htid=' + q(tid) + ']')) return;
      const h = document.createElement('div');
      h.className = 'check-line done'; h.dataset.level = '0'; h.dataset.htid = tid;
      if(cat) h.dataset.cat = cat;
      h.innerHTML = '<input type="checkbox" checked><span class="check-text"></span>';
      h.querySelector('.check-text').innerHTML = html || '';
      edit(day,() => {
        if(!day.textContent.trim() && !day.querySelector('input,img,hr')) day.replaceChildren();
        day.appendChild(h);
        wireCheckbox(h.querySelector('input'));
      });
    }
    const todayStr = () => (typeof state !== 'undefined' && state.today) || localToday();
    function sweepPlans(tid){
      document.querySelectorAll('#todayScroll .plan-editor .check-line[data-tid' + (tid ? '=' + q(tid) : '') + ']')
        .forEach(pl => { if(isOn(pl)) toHistory(pl); });
    }
    // Called from wireCheckbox's change handler after a real tick.
    window.tidToggled = function(line,on,root){
      const tid = line && line.dataset && line.dataset.tid;
      if(syncing || !tid) return;
      syncing = true;
      try{
        copies(tid,root).forEach(l => { if(isOn(l) !== on) edit(ownerOf(l),() => setOn(l,on)); });
        if(window.focusTidToggled) try{ focusTidToggled(tid,on); }catch(e){}
      } finally { syncing = false; }
      // Short pause so the tick is seen before the line moves to Completed.
      if(on) setTimeout(() => sweepPlans(tid),350);
    };
    // Load-time catch-up: a Plan / think copy whose task was ticked elsewhere while that
    // day wasn't loaded (or a ticked copy left behind) moves to history now. Done wins.
    function reconcile(){
      document.querySelectorAll('#todayScroll .plan-editor .check-line[data-tid]').forEach(pl => {
        if(isOn(pl)){ toHistory(pl); return; }
        if(copies(pl.dataset.tid,ownerOf(pl)).some(isOn)){ edit(ownerOf(pl),() => setOn(pl,true)); toHistory(pl); }
      });
      if(window.focusReconcile) focusReconcile(window.tidAnyOn);
    }
    // Focus Tracking phase 2 (2026-11-01): focus tasks live in focusData, not in a cell, so they
    // reach their copies through these. Focus is the source of the task's title.
    window.tidAnyOn = tid => copies(tid,null).some(isOn);
    /* Daily plan bridge (Calendar panel phase 3a, 2026-11-08): the 📅 panel links plan rows to tasks by tid, never
       copies them. candidates() = open tasks in loaded lists (Urgent lines in day / Plan / Notes cells, Undated Tasks,
       Keep In Mind); ensureTid() gives a line a tid the first time it's planned (saved like a mirror); setDone() ticks
       the task the normal way (one real checkbox change → time sections, mirrors, Keep In Mind, Urgent, save). */
    const PRI = l => { const o = ownerOf(l); return !o ? 9 : o.classList.contains('day-editor') ? 0 : o.classList.contains('plan-editor') ? 1 : isBacklogCell(o) ? 2 : o.classList.contains('journal-editor') ? 3 : 4; };
    const liveLines = tid => [...document.querySelectorAll('.check-line[data-tid=' + q(tid) + ']')].filter(l => ownerOf(l) && l.closest('#todayScroll,#journalScroll,#referenceTree,#kimScroll')).sort((a,b) => PRI(a) - PRI(b));
    window.fwTasks = {
      candidates(){
        const out = [], seen = new Set(), text = l => (typeof lineText === 'function' ? lineText(l) : l.textContent).replace(/\s+/g,' ').trim();
        const add = (src,where,l) => {
          if(!l || seen.has(l) || isOn(l) || l.dataset.arch || l.dataset.htid) return;
          const t = text(l); if(!t) return;
          if(l.dataset.tid){ if(seen.has('t:' + l.dataset.tid)) return; seen.add('t:' + l.dataset.tid); }
          seen.add(l); out.push({src, where, text:t, tid:l.dataset.tid || '', line:l, urg:Number(l.dataset.urg) || 0});
        };
        const back = typeof backlogCell === 'function' ? backlogCell() : null;
        document.querySelectorAll('#todayScroll .day-editor,#todayScroll .plan-editor,#journalScroll .journal-editor').forEach(ed =>
          ed.querySelectorAll('.check-line[data-urg]').forEach(l => { if(/^[123]$/.test(l.dataset.urg) && ownerOf(l) === ed) add('urgent', ed.dataset.date ? (typeof shortDate === 'function' ? shortDate(ed.dataset.date) : ed.dataset.date) : '', l); }));
        if(back) back.querySelectorAll('.check-line').forEach(l => { if((Number(l.dataset.level) || 0) === 0 || /^[123]$/.test(l.dataset.urg || '')) add(/^[123]$/.test(l.dataset.urg || '') ? 'urgent' : 'undated', 'Undated', l); });
        document.querySelectorAll('#kimScroll .kim-editor .check-line').forEach(l => add('kim','Keep In Mind',l));
        (window.focusOpenItems ? window.focusOpenItems() : []).forEach(t => {
          if(seen.has('t:' + t.id)) return; seen.add('t:' + t.id);
          out.push({src:'kim', where:t.cat, text:t.t, tid:t.id, line:null, urg:0});
        });
        return out;
      },
      ensureTid(c){
        if(c.tid) return c.tid;
        const l = c.line, o = ownerOf(l); if(!l || !o) return '';
        const tid = newTid();
        edit(o,() => { l.dataset.tid = tid; });
        c.tid = tid;
        return tid;
      },
      // {text, done, where} from the first live copy, else from Keep In Mind; null when it isn't loaded.
      info(tid){
        const l = liveLines(tid)[0];
        if(l){ const t = l.querySelector('.check-text'); return {text:(t ? t.textContent : l.textContent).replace(/\s+/g,' ').trim(), done:isOn(l), dur:Math.round(Number(l.dataset.dur)) || 0}; }
        const f = window.focusFindItem ? window.focusFindItem(tid) : null;
        return f ? {text:f.t, done:!!f.d} : null;
      },
      setDone(tid,on){
        const l = liveLines(tid)[0];
        if(l){
          const b = boxOf(l); if(!b) return false;
          if(b.checked !== on){ b.checked = on; b.dispatchEvent(new Event('change',{bubbles:true})); }
          return true;
        }
        if(window.focusFindItem && window.focusFindItem(tid)){ window.focusTidToggled(tid,on); return true; }
        return false;
      }
    };
    window.tidSet = function(tid,on,html){
      if(syncing || !tid) return;
      syncing = true;
      try{ copies(tid,null).forEach(l => { if(isOn(l) !== on) edit(ownerOf(l),() => setOn(l,on)); }); }
      finally { syncing = false; }
      if(!on) return; // unticking keeps the history line
      const day = document.querySelector('#todayScroll .day-editor[data-date=' + q(todayStr()) + ']');
      if(day) addHistory(day,tid,html); else setStatus('Today isn’t loaded — the Completed line comes when you tick it there');
      setTimeout(() => sweepPlans(tid),350);
    };
    window.tidRetitle = function(tid,html){
      copies(tid,null).forEach(l => {
        const tx = l.querySelector(':scope > .check-text') || l.querySelector('.check-text');
        if(tx && tx.innerHTML !== html) edit(ownerOf(l),() => { tx.innerHTML = html; });
      });
    };
    // 📌 on a focus task → a copy in Plan / think of the selected day (same rules as Send to Today).
    window.tidPlace = function(tid,html,done){
      if(done){ setStatus('That task is done — untick it first'); return; }
      const date = window.odDate || todayStr();
      const pad = urgEditor(date,'plan');
      if(!pad){ setStatus('That day isn’t loaded — open it, then try again'); return; }
      const have = pad.querySelector('.check-line[data-tid=' + q(tid) + ']');
      if(have){
        setStatus('Already in Plan / think for ' + shortDate(date));
        have.classList.add('urg-flash'); setTimeout(() => have.classList.remove('urg-flash'),1300);
        return;
      }
      const n = createCheckboxLine(0);
      n.dataset.tid = tid;
      n.querySelector('.check-text').innerHTML = html || '<br>';
      edit(pad,() => {
        if(!pad.textContent.trim() && !pad.querySelector('input,img,hr')) pad.replaceChildren();
        pad.appendChild(n);
      });
      setStatus('Sent to Plan / think · ' + shortDate(date));
    };
    let rt = 0;
    const later = () => { clearTimeout(rt); rt = setTimeout(() => { try{ reconcile(); }catch(e){} },800); };
    function watch(){
      ['todayScroll','referenceTree'].forEach(id => { const el = document.getElementById(id); if(el) new MutationObserver(later).observe(el,{childList:true}); });
      later();
    }
    if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',watch); else watch();

    /* Mirror in Blocks (2026-11-04, Julius). Tasks from any section (Today, Notes, Dailies, Reference,
       Scratch Pad, Urgent, Due) land in the Blocks pad of the day shown as linked copies: same data-tid, so a
       tick on either side ticks both. The original never moves. Done lines are skipped. Cal Events have no
       cell to link to, so they come over as a plain copy of the title (calTaskLine). */
    const blocksPad = () => urgEditor(window.odDate || todayStr(),'plan');
    window.tidMirror = function(nodes,src,pad,before,shift){
      pad = pad || blocksPad();
      if(!pad){ setStatus('Blocks isn’t loaded — open that day, then try again'); return false; }
      const head = nodes && nodes[0];
      if(!head || !src) return false;
      if(isOn(head)){ setStatus('That task is done — untick it first'); return false; }
      const live = nodes.filter(n => n.classList && n.classList.contains('check-line') && !isOn(n));
      // No id yet, or a stray duplicate in the same cell → a fresh stable id, saved with the source cell.
      const need = live.filter(n => !n.dataset.tid || src.querySelectorAll('.check-line[data-tid=' + q(n.dataset.tid) + ']').length > 1);
      if(need.length) edit(src,() => need.forEach(n => { n.dataset.tid = newTid(); }));
      const have = pad.querySelector('.check-line[data-tid=' + q(head.dataset.tid) + ']');
      if(have){
        setStatus('Already in Blocks');
        have.classList.add('urg-flash'); setTimeout(() => have.classList.remove('urg-flash'),1300);
        return false;
      }
      const lvl = n => Math.max(0,Math.min(6,Math.floor(Number(n.dataset.level) || 0)));
      const made = live.filter(n => !pad.querySelector('.check-line[data-tid=' + q(n.dataset.tid) + ']')).map(n => {
        const c = createCheckboxLine(Math.max(0,Math.min(6,lvl(n) + (shift || 0))));
        c.dataset.tid = n.dataset.tid;
        if(n.dataset.cat) c.dataset.cat = n.dataset.cat;
        const tx = n.querySelector(':scope > .check-text') || n.querySelector('.check-text');
        c.querySelector('.check-text').innerHTML = tx && tx.textContent.trim() ? tx.innerHTML : '<br>';
        return c;
      });
      edit(pad,() => {
        if(!pad.textContent.trim() && !pad.querySelector('input,img,hr')) pad.replaceChildren();
        if(before && before.parentElement !== pad) before = null;
        made.forEach(c => { if(before) pad.insertBefore(c,before); else pad.appendChild(c); });
      });
      if(typeof refreshCards === 'function') refreshCards(pad);
      made[0].classList.add('urg-flash'); setTimeout(() => made[0].classList.remove('urg-flash'),1400);
      setStatus('Mirrored in Blocks' + (made.length > 1 ? ' (with ' + (made.length - 1) + ' subtask' + (made.length > 2 ? 's' : '') + ')' : ''));
      return true;
    };
    window.calTaskLine = function(row){
      const title = row && (row.dataset.ceTitle || (row.querySelector('.ce-title') || {}).textContent || '').trim();
      if(!title) return null;
      const n = createCheckboxLine(0);
      n.querySelector('.check-text').textContent = title;
      if(row.dataset.cat && row.dataset.cat !== 'none') n.dataset.cat = row.dataset.cat;
      if(row.dataset.ceId) n.dataset.ceid = row.dataset.ceId + '|' + row.dataset.ceStart; // Cal Events box 3 (Schedule) finds it by this
      return n;
    };
    function calToBlocks(row){
      const pad = blocksPad();
      if(!pad){ setStatus('Blocks isn’t loaded — open that day, then try again'); return; }
      const n = calTaskLine(row); if(!n) return;
      edit(pad,() => {
        if(!pad.textContent.trim() && !pad.querySelector('input,img,hr')) pad.replaceChildren();
        pad.appendChild(n);
      });
      if(typeof refreshCards === 'function') refreshCards(pad);
      n.classList.add('urg-flash'); setTimeout(() => n.classList.remove('urg-flash'),1400);
      setStatus('Copied to Blocks');
    }
    window.calToBlocks = calToBlocks;
    // Hold-menu button on every task outside Blocks (2026-11-04, Julius); replaces Reference's Send to Today.
    window.tidMenuRow = function(p,line,owner,isCal){
      if(!isCal && (!owner || !owner.classList || owner.classList.contains('plan-pad'))) return;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'urg-goto'; b.textContent = isCal ? '🧱 Copy to Blocks' : '🧱 Mirror in Blocks';
      b.addEventListener('pointerdown',e => e.preventDefault());
      b.addEventListener('click',() => {
        hideUrgencyPicker();
        if(isCal) calToBlocks(line);
        else window.tidMirror(urgSubtree(line),owner,null,null,-(Number(line.dataset.level) || 0));
      });
      p.appendChild(b);
    };
  })();
</script>

<script>
/* Block borders (2026-11-04, Julius): each block in Blocks (its title line plus the task cells under it, down
   to the next title or an empty line) sits inside one rounded border, so it's clear what a block contains.
   Next Block placeholders get a dashed border in the same soft color (yellow until 2026-11-05). Render-only: the border is
   an SVG background on the pad (scrolls with it) and data-blk is stripped before saving (cardCleanHtml). */
(function(){
  const isTitle = n => n.hasAttribute('data-title');
  const isBlank = n => !n.classList.contains('check-line') && !n.textContent.trim() && !n.querySelector('input,img,hr');
  function groups(pad){
    const out = []; let cur = null;
    for(const n of pad.children){
      if(isTitle(n)){ cur = [n]; out.push(cur); continue; }
      if(!cur) continue;
      if(isBlank(n)){ cur = null; continue; }
      cur.push(n);
    }
    return out;
  }
  const pending = new Set();
  // --divider resolved to a plain color an SVG data URL understands (it can be a color-mix()).
  function divInk(pad){
    const head = pad.parentElement && pad.parentElement.querySelector(':scope > .od-pad-head');
    const c = head ? getComputedStyle(head).borderTopColor : getComputedStyle(pad).color;
    try{ const x = document.createElement('canvas').getContext('2d'); x.fillStyle = '#888'; x.fillStyle = c; return x.fillStyle; }catch(e){ return '#888'; }
  }
  function draw(pad){
    if(!pad.isConnected) return;
    const gs = groups(pad);
    const W = pad.clientWidth, H = pad.scrollHeight;
    if(!gs.length || !W){ pad.style.removeProperty('background-image'); return; }
    const ink = getComputedStyle(pad).color || '#888';
    let rects = '';
    gs.forEach(g => {
      const vis = g.filter(n => n.offsetParent !== null);
      if(!vis.length) return;
      const first = vis[0], last = vis[vis.length - 1];
      const top = first.offsetTop - 5, bottom = last.offsetTop + last.offsetHeight + 4;
      const next = /^next block\b/i.test((first.textContent || '').trim());
      // A line across the pad above Next Block (2026-11-04, Julius), so it's set apart from what's above.
      // Same 2px line color as every other divider (2026-11-05); none when Next Block is first (the Blocks header line is right there).
      if(next && first.previousElementSibling) rects += '<line x1="2" x2="' + Math.max(10,W - 2) + '" y1="' + (top - 6.5) + '" y2="' + (top - 6.5) + '" stroke="' + divInk(pad) + '" stroke-width="2"/>';
      rects += '<rect x="2" y="' + (top + .75) + '" width="' + Math.max(10,W - 4) + '" height="' + Math.max(10,bottom - top - 1.5) + '" rx="8" fill="none" stroke="' +
        ink + '" stroke-opacity=".45" stroke-width="1.5"' + (next ? ' stroke-dasharray="6 4"' : '') + '/>'; // Next Block: same soft color, dashed (2026-11-05, Julius: yellow was too bright)
    });
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' + rects + '</svg>';
    Object.assign(pad.style,{backgroundImage:'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")',backgroundRepeat:'no-repeat',
      backgroundAttachment:'local',backgroundSize:W + 'px ' + H + 'px',backgroundPosition:'0 0'});
  }
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(es => es.forEach(e => schedule(e.target))) : null;
  function schedule(pad){
    if(pending.has(pad)) return;
    pending.add(pad);
    requestAnimationFrame(() => { pending.delete(pad); try{ draw(pad); }catch(e){} });
  }
  // Called from refreshCards for the Blocks pad.
  const isNext = n => /^next block\b/i.test((n.textContent || '').trim());
  window.blkPaint = function(pad){
    const want = new Map();
    groups(pad).forEach(g => g.forEach((n,i) => want.set(n,(i === 0 ? 'f' : 'm') + (i === g.length - 1 ? 'l' : ''))));
    pad.querySelectorAll(':scope > [data-blk]').forEach(n => { if(!want.has(n)) n.removeAttribute('data-blk'); });
    want.forEach((v,n) => { if(n.getAttribute('data-blk') !== v) n.setAttribute('data-blk',v); });
    pad.querySelectorAll(':scope > [data-blkn]').forEach(n => { if(!(isTitle(n) && isNext(n))) n.removeAttribute('data-blkn'); });
    [...pad.children].forEach(n => { if(isTitle(n) && isNext(n) && n.previousElementSibling && !n.hasAttribute('data-blkn')) n.setAttribute('data-blkn','1'); });
    // Hint in Next Block's first empty task (2026-11-05, Julius): says what the block is for. Render-only, stripped on save.
    let ph = null;
    groups(pad).forEach(g => { if(!ph && isNext(g[0])) ph = g.find(n => n.classList.contains('check-line') && !n.textContent.trim()) || null; });
    pad.querySelectorAll(':scope > [data-blkph]').forEach(n => { if(n !== ph) n.removeAttribute('data-blkph'); });
    if(ph && !ph.hasAttribute('data-blkph')) ph.setAttribute('data-blkph','1');
    ensureNext(pad);
    if(ro && !pad._blkRO){ pad._blkRO = true; ro.observe(pad); }
    schedule(pad);
  };
  document.addEventListener('input',e => { const pad = e.target && e.target.closest && e.target.closest('.plan-pad'); if(pad) window.blkPaint(pad); },true);
  /* There's always a Next Block (2026-11-04, Julius): today's and later days' Blocks get a "Next Block" title plus an
     empty task cell at the end whenever none is there (after Activate, after Remove, on load). Past days are left alone. */
  const todayIso = () => (typeof state !== 'undefined' && state && state.today) || (typeof localToday === 'function' ? localToday() : '');
  function ensureNext(pad){
    if(pad._blkEnsure || !pad.isConnected || !pad.isContentEditable) return;
    const d = pad.dataset.date, t = todayIso();
    if(!d || !t || d < t) return;
    if([...pad.children].some(n => isTitle(n) && isNext(n))) return;
    pad._blkEnsure = true;
    setTimeout(() => {
      pad._blkEnsure = false;
      if(!pad.isConnected || [...pad.children].some(n => isTitle(n) && isNext(n))) return;
      if(typeof captureBeforeEdit === 'function') captureBeforeEdit(pad);
      pad.querySelectorAll(':scope > br').forEach(n => n.remove());
      const title = document.createElement('div');
      title.setAttribute('data-title','1'); title.dataset.tl = '1';
      const b = document.createElement('b'); b.textContent = 'Next Block'; title.appendChild(b);
      const cell = typeof createCheckboxLine === 'function' ? createCheckboxLine(0) : null;
      // Keep it at the very end, after any trailing empty lines.
      pad.appendChild(title); if(cell) pad.appendChild(cell);
      pad.dispatchEvent(new Event('input',{bubbles:true}));
    },0);
  }
  /* Enter on a block title makes a task cell under it, checkbox included (2026-11-04, Julius). Backspace on the
     checkbox turns it back into a plain line, as anywhere else. */
  document.addEventListener('keydown',e => {
    if(e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
    const pad = e.target && e.target.closest ? e.target.closest('.plan-pad') : null;
    if(!pad) return;
    const sel = window.getSelection(); if(!sel || !sel.rangeCount || !sel.isCollapsed) return;
    let n = sel.anchorNode; if(n && n.nodeType === 3) n = n.parentElement;
    while(n && n.parentElement !== pad) n = n.parentElement;
    if(!n || !isTitle(n)) return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(typeof captureBeforeEdit === 'function') captureBeforeEdit(pad);
    const cell = createCheckboxLine(0);
    n.insertAdjacentElement('afterend',cell);
    if(typeof placeCaretInsideCheckbox === 'function') placeCaretInsideCheckbox(cell.querySelector('.check-text'));
    pad.dispatchEvent(new Event('input',{bubbles:true}));
  },true);
})();
</script>

<script>
/* Title cells (2026-11-21, Julius: "when I titleize something, I want it to be in a cell for itself"): every marked
   title (data-tl="1") and the lines it covers (titleCovered) sit inside one rounded box; a nested title's box sits
   inside its parent's. A folded title is a box around the title alone. A picked title (data-tcfocus) rings its whole
   box. Everywhere titles exist except the Blocks pad (it has its own block borders). Render-only: an SVG background on
   the editor (scrolls with it, like blkPaint) + data-tbf / data-tbl / --tbs, stripped in cardCleanHtml. */
(function(){
  const boxTitle = n => n.nodeType === 1 && n.dataset.tl === '1' && !n.dataset.sec && !n.dataset.study && !n.hasAttribute('data-tsec') && !n.hasAttribute('data-cgrp');
  const shown = n => n.offsetParent !== null && !n.hasAttribute('data-tlhid');
  const pending = new Set();
  function boxes(ed){
    const out = [];
    for(const n of ed.children){
      if(!boxTitle(n) || !shown(n)) continue;
      const cov = titleCovered(n), vis = cov.filter(shown);

      rects += '<rect x="' + (x + .75) + '" y="' + (top + .75) + '" width="' + (w - 1.5) + '" height="' + (h - 1.5) + '" rx="' + (kim ? 4 : 8) + '" fill="none" stroke="' +
        (on ? urg : tbc || ink) + '" stroke-opacity="' + (on || tbc ? '1' : kim ? '.45' : '.8') + '" stroke-width="' + (kim ? (on || tbc ? 1 : .75) : (on || tbc ? 2 : 1.5)) + '"/>'; // brighter (2026-11-21 12:44, Julius: "barely see it")
    });
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '">' + rects + '</svg>';
    Object.assign(ed.style,{backgroundImage:'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")',backgroundRepeat:'no-repeat',
      backgroundAttachment:'local',backgroundSize:W + 'px ' + H + 'px',backgroundPosition:'0 0'});

  window.tboxPaint = function(ed){

<script>
/* Block timer MVP (2026-11-05, Julius; design = Reference card "📜 Timer App", Nov 3 decisions).
   - ▶ on a block title starts that block's timer; ▶ on a task in it starts that task's timer (and the block's).
   - One block runs at a time (starting another pauses it); one task timer per block (starting another stops it).
   - Ticking the running task stops its timer, the block keeps going. Pause pauses both; ▶ resumes both.
   - ☕ Break is its own task in the block. Block time not on a task stays "unassigned", never spread out.
   - Finish stops the block; unfinished tasks stay as they are.
   - Every tap is an event with a unique op id (the timestamps are the record, not a ticking counter), so locking the
     phone or closing the page never loses time. Events are saved on the device first, then sent to the "Timer Log"
     tab (Timer.gs, skips op ids it already has). Totals are rebuilt from the events. Tap a time to correct it; the
     measured time is kept, the correction is its own event. Blocks / tasks are tied to their lines by data-tmr. */
(function(){
  const KEY = 'fw.timer.v1', BREAK = 'break', KEEP_DAYS = 14, FORGOT_MS = 2 * 3600e3;
  const run = () => (window.google && google.script && google.script.run) || null;
  const today = () => (typeof state !== 'undefined' && state && state.today) || new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0,10);
  const status = s => { try{ setStatus(s); }catch(e){} };
  const rid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  let dev = ''; try{ dev = localStorage.getItem('fw.dev') || ''; if(!dev){ dev = rid('d'); localStorage.setItem('fw.dev',dev); } }catch(e){ dev = 'nostore'; }

  /* ---- event store (device first) ---- */
  let events = [], sent = new Set();
  try{ const s = JSON.parse(localStorage.getItem(KEY) || '{}'); events = Array.isArray(s.events) ? s.events : []; sent = new Set(s.sent || []); }catch(e){}
  function persist(){
    const cut = Date.now() - KEEP_DAYS * 864e5;
    events = events.filter(e => e.at >= cut || !sent.has(e.op));
    const ops = new Set(events.map(e => e.op));
    sent = new Set([...sent].filter(o => ops.has(o)));
    try{ localStorage.setItem(KEY, JSON.stringify({events, sent:[...sent]})); }catch(e){}
  }
  function merge(list, fromServer){
    const have = new Set(events.map(e => e.op));
    let added = 0;
    (list || []).forEach(e => {
      if(!e || !e.op) return;
      if(fromServer) sent.add(e.op);
      if(have.has(e.op)) return;
      have.add(e.op); events.push({op:e.op,date:e.date,at:Number(e.at),act:e.act,blk:e.blk||'',item:e.item||'',name:e.name||'',value:e.value === undefined ? null : e.value,dev:e.dev||''});
      added++;
    });
    if(added || fromServer) persist();
    return added;
  }

  /* ---- replay: events -> state ---- */
  function replay(now){
    const B = {}, fix = {};
    let cur = null;
    const blk = id => B[id] || (B[id] = {run:false,since:0,ms:0,child:null,cs:0,items:{},paused:false,done:false,last:0,date:''});
    const stopChild = (b,t) => { if(b.child && b.run) b.items[b.child] = (b.items[b.child] || 0) + Math.max(0,t - b.cs); };
    const pause = (id,t) => { const b = B[id]; if(!b || !b.run) return; stopChild(b,t); b.ms += Math.max(0,t - b.since); b.run = false; b.paused = true; if(cur === id) cur = null; };
    const start = (id,t) => { if(cur && cur !== id) pause(cur,t); const b = blk(id); if(b.run) return b; b.run = true; b.since = t; b.paused = false; b.done = false; if(b.child) b.cs = t; cur = id; return b; };
    [...events].sort((a,b) => a.at - b.at || (a.op < b.op ? -1 : 1)).forEach(e => {
      const t = e.at;
      if(e.blk){ const b = blk(e.blk); b.last = t; b.date = b.date || e.date; }
      if(e.act === 'start') start(e.blk,t);
      else if(e.act === 'pause') pause(e.blk,t);
      else if(e.act === 'finish'){ const b = B[e.blk]; if(b){ pause(e.blk,t); b.child = null; b.paused = false; b.done = true; } }
      else if(e.act === 'istart'){ const b = start(e.blk,t); if(b.child === e.item) return; stopChild(b,t); b.child = e.item; b.cs = t; }
      else if(e.act === 'istop'){ const b = B[e.blk]; if(b && b.child === e.item){ stopChild(b,t); b.child = null; } }
      else if(e.act === 'fix') fix[e.blk + '|' + (e.item || '')] = e.value === null || e.value === '' ? null : Number(e.value);

      const raw = b.ms + (b.run ? Math.max(0, now - b.since) : 0);

      const f = fix[id + '|'];

  }

  let flushing = false, flushTimer = 0, backoff = 2000, lastSync = '';

    r.withSuccessHandler(res => {
      flushing = false; backoff = 2000;
      ((res && res.saved) || todo.map(e => e.op)).forEach(o => sent.add(o));

      flushing = false; lastSync = 'offline · kept on this device';

  }

  function pull(){
    const r = run(); if(!r || pulling) return;

    r.withSuccessHandler(list => { pulling = false; merge(Array.isArray(list) ? list : [], true); paintAll(); checkForgot(); flush(); })
     .withFailureHandler(() => { pulling = false; }).getTimerEvents(since);
  }

  /* ---- lines <-> ids ---- */
  const isTitle = n => n.hasAttribute('data-title');
  const isBlank = n => !n.classList.contains('check-line') && !n.textContent.trim() && !n.querySelector('input,img,hr');

    const out = []; let cur = null;
    for(const n of pad.children){
      if(isTitle(n)){ cur = {title:n, items:[]}; out.push(cur); continue; }
      if(!cur) continue;
      if(isBlank(n)){ cur = null; continue; }

    }
    return out;
  }
  const lineName = n => ((n.querySelector('.check-text') || n).textContent || '').replace(/\s+/g,' ').trim().slice(0,120);
  const isDone = n => n.classList.contains('done') || !!(n.querySelector(':scope > input[type=checkbox]') || {}).checked;
  function idFor(line, prefix, pad){
    if(line.dataset.tmr) return line.dataset.tmr;
    if(typeof captureBeforeEdit === 'function') captureBeforeEdit(pad);
    line.dataset.tmr = rid(prefix);
    pad.dispatchEvent(new Event('input',{bubbles:true}));
    return line.dataset.tmr;
  }
  // Enter in a line copies its attributes to the new line: the first line keeps the id, copies lose it.
  function dedupe(pad){
    const seen = new Set(); let changed = false;
    pad.querySelectorAll('[data-tmr]').forEach(n => { if(seen.has(n.dataset.tmr)){ n.removeAttribute('data-tmr'); changed = true; } else seen.add(n.dataset.tmr); });
    if(changed && pad.isContentEditable) pad.dispatchEvent(new Event('input',{bubbles:true}));
  }
  function findLine(id){
    if(!id) return null;
    for(const pad of document.querySelectorAll('#todayScroll .plan-pad, #blocksScroll > .plan-pad')){ const n = pad.querySelector('[data-tmr="' + CSS.escape(id) + '"]'); if(n) return {pad, line:n}; }
    return null;
  }
  const PLACEHOLDER = /^(?:Next Block(?:\s+\d+)?|Block name)$/i;

  /* ---- actions ---- */
  let lastTap = {k:'', el:null, t:0};
  function record(act, blk, item, name, date, value){
    const e = {op:rid('t'), date: date || today(), at: Date.now(), act, blk: blk || '', item: item || '', name: name || '', value: value === undefined ? null : value, dev};
    events.push(e); persist();
    return e;
  }
  function act(kind, pad, title, line){
    const el = line || title; // same line + same button within 600 ms = one tap (names can change on start)
    if(lastTap.k === kind && lastTap.el === el && Date.now() - lastTap.t < 600) return;
    lastTap = {k:kind, el, t:Date.now()};
    const date = pad.dataset.date || today();
    const s = replay(Date.now());
    if(kind === 'block' || kind === 'item' || kind === 'break'){
      // Starting a Next Block placeholder names it after the start time; Blocks then adds a fresh Next Block.
      const strong = title.querySelector(':scope > b,:scope > strong');
      if(strong && PLACEHOLDER.test(strong.textContent.trim()) && pad.isContentEditable){
        if(typeof captureBeforeEdit === 'function') captureBeforeEdit(pad);
        strong.textContent = 'Block ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
        pad.dispatchEvent(new Event('input',{bubbles:true}));

      else record('start', bid, '', lineName(title), date);
    } else if(kind === 'item'){
      const iid = idFor(line,'i-',pad);
      if(b && b.run && b.child === iid) record('istop', bid, iid, lineName(line), date);
      else record('istart', bid, iid, lineName(line), date);
    } else if(kind === 'break'){
      if(b && b.run && b.child === BREAK) record('istop', bid, BREAK, 'Break', date);
      else record('istart', bid, BREAK, 'Break', date);
    } else if(kind === 'finish'){
      record('finish', bid, '', lineName(title), date);
    }

  }
  function parseDur(v){
    v = String(v || '').trim().toLowerCase();
    if(!v) return null;
    let m = v.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
    if(m) return m[3] !== undefined ? ((+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])) * 1e3 : ((+m[1]) * 3600 + (+m[2]) * 60) * 1e3;
    m = v.match(/^(?:(\d+(?:\.\d+)?)\s*h)?\s*(?:(\d+)\s*m(?:in)?)?$/);

    if(v === null) return;

    status(ms === null ? 'Timer: back to the measured time' : 'Timer: corrected to ' + fmt(ms, true));

  }

  /* ---- drawing ---- */
  function fmt(ms, words){
    const s = Math.max(0, Math.floor((ms || 0) / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    if(words) return h ? h + 'h ' + m + 'm' : m ? m + 'm' : x + 's';

  }
  function attach(pad){

    const layer = document.createElement('div'); layer.className = 'tmr-layer'; layer.setAttribute('contenteditable','false');

      const btn = e.target.closest('[data-tact]'); if(!btn) return;

      else act(a, hit.pad, hit.line, null);

      const el = e.target.closest('[data-tact]'); if(!el) return;

      if(!line || !line.isConnected) return;

    });

    ['pointerdown','mousedown','touchstart'].forEach(t => layer.addEventListener(t, e => { if(e.target.closest('.tmr-chip')) e.stopPropagation(); }, {passive:true}));

        const iid = n.dataset.tmr, on = !!(b && b.run && iid && b.child === iid), ms = b && iid ? (b.shown[iid] || 0) : 0;
        if(isDone(n) && !ms) return; // finished and never timed: nothing to show

      });

      c._line = w.line; c._title = w.title;
      c.className = 'tmr-chip' + (w.blk ? ' blk' : '') + (w.on ? ' on' : '') + (w.pz ? ' pz' : '');
      const t = c.firstChild, btn = c.lastChild;
      const txt = w.has ? fmt(w.ms) : '';

      if(btn.textContent !== sym) btn.textContent = sym;
      btn.title = w.blk ? (w.on ? 'Pause this block (and its task)' : 'Start this block') : (w.on ? 'Stop this task’s timer' : 'Time this task');

      c.style.right = Math.max(4, padR - w.line.getBoundingClientRect().right + 6) + 'px';
      c.style.visibility = w.line.offsetParent === null ? 'hidden' : '';
    });

    const ids = new Set(gs.map(g => g.title.dataset.tmr).filter(Boolean));
    let bid = s.cur && ids.has(s.cur) ? s.cur : null;
