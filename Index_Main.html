  const esc = s =>

  function formatDate(s,yy){

  const WD_RATIO = [187/187,186/195,169/202,157/207,174/234,225/126,245/152]; // width / height per PNG

  // Speed timing (2026-11-04): sent after drawing, so it can't slow the load. See logSpeed in Code.gs.
  let fwSaveSamples=[],fwSaveSampleSeq=0,fwSpeedReportSeq=0;

  /* Reload diagnosis (2026-11-21, Julius: "I put it away 5 min, come back, the whole thing refreshes"). Remember when

  const fwStartInfo = (() => { let hid = 0, res = 0;

  } catch (e) {} });

  /* ONE CALM RETURN (2026-11-21, speed item M). Coming back to the page used to fire ~12 refreshers at the same moment.
     Each module now registers fwResume.add(name, run, last) and this one queue runs them in ORDER, one every GAP ms,
     skipping any refreshed < 60 s ago (last() = the module's own last-refresh time; without it, or while it is 0, when
     the queue last ran it, starting at page load). Stops when the page is hidden again. Saves on hide stay in each module (never queued).
     Speed Log kind 'resume' (only when something ran): ran, skipped, awaySec, stopped, ms. Details: docs/NOTES.md → "One calm return". */
  /* Batched calls (speed plan E, 2026-11-23). fwBatchStart() swaps google.script.run for a recorder; calls to the
     read-only getters in FW_BATCH_OK (same list as Code.gs BATCH_OK_) are held, anything else goes straight out.
     fwBatchFlush() puts the real runner back and sends the held calls as one batchCalls request (one call alone
     goes as itself); each answer goes to its own success / failure handler. */
  const FW_BATCH_OK = {getSyncState:1,getFocus:1,getFun:1,getNewThings:1,getInbox:1,getCalendarEvents:1,getMainCalendarEvents:1,getTimerEvents:1,getPlan:1};
  function fwBatchStart(){
    const b = {calls: [], real: null, sent: 0};
    if(!(window.google && google.script && google.script.run) || typeof Proxy !== 'function') return b;
    const real = b.real = google.script.run;
    const rec = (ok, bad, user) => new Proxy({}, {get: (_, name) => {
      if(name === 'withSuccessHandler') return f => rec(f, bad, user);
      if(name === 'withFailureHandler') return f => rec(ok, f, user);
      if(name === 'withUserObject') return u => rec(ok, bad, u);
      if(typeof name !== 'string') return undefined;
      return (...args) => {
        if(FW_BATCH_OK[name]) { b.calls.push({name, args, ok, bad, user}); return; }
        let r = real; if(ok) r = r.withSuccessHandler(ok); if(bad) r = r.withFailureHandler(bad); if(user !== undefined) r = r.withUserObject(user);
        r[name](...args);
      };
    }});
    try{ google.script.run = rec(null, null, undefined); }catch(e){ b.real = null; }
    if(google.script.run === real) b.real = null; // read-only in this host: nothing recorded
    return b;
  }
  function fwBatchFlush(b){
    if(!b.real) return;
    google.script.run = b.real;
    const calls = b.calls; b.sent = calls.length;
    const hand = (c, r) => { if(c.ok) try{ c.ok(r, c.user); }catch(e){ console.error(e); } };
    const fail = (c, e) => { if(c.bad) try{ c.bad(e, c.user); }catch(_){} else console.error(c.name + ': ' + (e && e.message || e)); };
    const one = c => { let r = b.real; if(c.ok) r = r.withSuccessHandler(c.ok); if(c.bad) r = r.withFailureHandler(c.bad); if(c.user !== undefined) r = r.withUserObject(c.user); r[c.name](...c.args); };
    if(calls.length === 1) return one(calls[0]);
    if(!calls.length) return;
    b.real.withSuccessHandler(out => {
      calls.forEach((c, i) => { const o = Array.isArray(out) && out[i]; if(o && o.ok) hand(c, o.r); else if(o) fail(c, new Error(o.e)); else one(c); });
    }).withFailureHandler(() => calls.forEach(one)) // batch failed (e.g. old server): send them one by one
      .batchCalls(calls.map(c => [c.name, c.args]));
  }
  window.fwResume = (() => {
    const ORDER = ['sync','calendar','timer','blocks','nextSteps','kim','reference','newThings','fun','weather'];
    const GAP = 350, FRESH = 60000, jobs = {};
    let timer = 0, running = false, hiddenAt = 0, finish = null, r_batch = 0;
    const pos = n => { const i = ORDER.indexOf(n); return i < 0 ? ORDER.length : i; };
    function add(name, run, last){ jobs[name] = {run, last, ranAt: Date.now()}; }
    function stop(){ clearTimeout(timer); if(running && finish) finish(true); running = false; }
    function start(){
      if(running) return;
      running = true; r_batch = 0;
      const list = Object.keys(jobs).sort((a,b) => pos(a) - pos(b)), ran = [], skipped = [], t0 = performance.now();
      const awaySec = hiddenAt ? Math.round((Date.now() - hiddenAt) / 1000) : null;
      const done = finish = stopped => {
        running = false; finish = null;
        const r = {ran, skipped, awaySec, stopped, batched: r_batch, ms: Math.round(performance.now() - t0), at: Date.now()};
        window.__FW_RESUME_LAST = r;
        if(ran.length && typeof fwSendSpeed === 'function' && window.google && google.script) try{ fwSendSpeed('resume', {total: r.ms, steps: {}}, fwSpeedContext(r)); }catch(e){}

        const j = jobs[n];
        let at = j.ranAt; if(j.last) try{ at = Number(j.last()) || j.ranAt; }catch(e){} // 0 = never loaded → queue time

      });

      due.forEach(n => { jobs[n].ranAt = Date.now(); ran.push(n); try{ jobs[n].run(); }catch(e){ try{ console.error('fwResume ' + n, e); }catch(_){} } });

      r_batch = batch.sent;
      done(false);

  /* Instant screen numbers for the Speed Log (2026-11-21), all ms since the page started opening:
     screen = when something useful was on screen (the saved picture, else the live draw); snap = shown / none /
     old / width / late / nostore / embedded; snapMs, reqMs (data asked), dataMs (data arrived), liveMs, snapAgeSec, snapKb. */
  function fwSnapInfo(liveMs){
    const S = window.__FW_SNAP || {};

      dataMs: S.dataAt != null ? S.dataAt : null, liveMs: liveMs, screen: S.snapAt != null ? Math.min(S.snapAt, liveMs) : liveMs,
      snapAgeSec: S.ageSec != null ? S.ageSec : null, snapKb: S.kb != null ? S.kb : null };
  }
  function fwSpeedLog(kind,timing,t0){
    if(!timing) return;

      const nav = (performance.getEntriesByType && performance.getEntriesByType('navigation')[0]) || {};

        dom: Math.round(nav.domContentLoadedEventEnd || 0), ready: Math.round(performance.now()),
        navType: nav.type || '', ...(kind === 'load' ? fwStartInfo : {}), ...(kind === 'load' ? fwSnapInfo(Math.round(t0 + render)) : {}) });

  function loadWorkspace(){

      const blockGroup = line => {
        const nodes=[line];
        for(let next=line.nextElementSibling;next;next=next.nextElementSibling){
          if(blockIsTitle(line) ? (blockIsTitle(next)||blockBlank(next)) : (blockIsTitle(next)||blockLevel(next)<=blockLevel(line)))break;
          nodes.push(next);
        }
        return nodes;
      };
      const blockOwner = line => {
        for(let n=line;n;n=n.previousElementSibling){ if(blockIsTitle(n))return n; if(blockBlank(n))break; }
        return line;
      };
      let selectedBlockLine = null;
      // + Block / + Task / Activate removed 2026-11-05 (Julius): Next Block is always there, Enter adds tasks, ▶ starts and names a block.
      // Explicit mobile-friendly hierarchy/order controls. A selection is captured
      // before toolbar focus changes; all mutations use the existing Plan save path.
      pad.addEventListener('pointerup', e => {
        const line = e.target.closest('div, p');
        if(line && line.parentElement === pad) selectedBlockLine = line;
      });
      pad.addEventListener('keyup', () => {
        const sel = window.getSelection();
        let node = sel && sel.anchorNode;
        if(node && node.nodeType === 3) node = node.parentElement;
        while(node && node.parentElement !== pad) node = node.parentElement;
        if(node && node.parentElement === pad) selectedBlockLine = node;
      });
      // Remove moved into the block title menu (2026-11-05, Julius): tap a block's title → Remove block.
      pad._blkRemove=(line)=>{
        if(!line || line.parentElement!==pad){setStatus('Tap a block title first');return;}
        const group=blockGroup(line), name=(line.textContent||'').trim().slice(0,40)||'this line';
        if(!window.confirm('Remove "'+name+'"'+(group.length>1?' and '+(group.length-1)+' nested line'+(group.length>2?'s':''):'')+'?'))return;
        captureBeforeEdit(pad);
        group.forEach(n=>n.remove());
        selectedBlockLine=null;
        pad.dispatchEvent(new Event('input',{bubbles:true}));
        setStatus('Removed from Blocks');
      };
      // A block's title/time-range line is its handle: long-press then move.
      // No grip icons or extra markup are inserted into saved editor content.
      let blockHold=null, blockDrag=null;
      const topLine=node=>{
        let n=node && (node.nodeType===3?node.parentElement:node);
        while(n && n.parentElement!==pad)n=n.parentElement;
        return n && n.parentElement===pad ? n : null;
      };
      const isBlockTitle=line=>line && line.hasAttribute('data-title');
      pad.addEventListener('pointerdown',e=>{
        if(e.button!==0 || e.target.closest('input,button,a'))return;
        const line=topLine(e.target);
        if(!isBlockTitle(line))return;
        const hold={line,x:e.clientX,y:e.clientY,id:e.pointerId,timer:null};
        blockHold=hold;
        hold.timer=setTimeout(()=>{
          if(blockHold!==hold)return;
          blockDrag=hold;
          selectedBlockLine=line;
          line.style.opacity='.65';
          try{pad.setPointerCapture(e.pointerId);}catch(err){}
        },500);
      });
      pad.addEventListener('pointermove',e=>{
        if(blockHold && !blockDrag && Math.hypot(e.clientX-blockHold.x,e.clientY-blockHold.y)>9){
          clearTimeout(blockHold.timer);blockHold=null;
        }
        if(!blockDrag || e.pointerId!==blockDrag.id)return;
        e.preventDefault();
        const hovered=document.elementFromPoint(e.clientX,e.clientY);
        const over=topLine(hovered);
        const group=blockGroup(blockDrag.line);
        if(!over || group.includes(over))return;
        const target=blockOwner(over); // blocks move around whole blocks, never into the middle of one
        const dest=blockGroup(target);
        const after=e.clientY>target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
        const anchor=after?dest[dest.length-1].nextElementSibling:target;
        group.forEach(n=>pad.insertBefore(n,anchor));
      });
      const endBlockDrag=()=>{
        if(blockHold){clearTimeout(blockHold.timer);blockHold=null;}
        if(!blockDrag)return;
        blockDrag.line.style.opacity='';
        blockDrag=null;
        pad.dispatchEvent(new Event('input',{bubbles:true}));
      };
      pad.addEventListener('pointerup',endBlockDrag);
      pad.addEventListener('pointercancel',endBlockDrag);
      pad.querySelectorAll(':scope > [data-block-depth]').forEach(line=>{
        line.style.marginLeft = ((parseInt(line.dataset.blockDepth,10)||0)*18)+'px';
      });


    }
    container.appendChild(row);
    const ed =
      row.querySelector('.editor');
    ed.style.fontSize = 'var(--paragraph-size)';
    ed.style.fontFamily = 'var(--paragraph-font)';
    ed.style.lineHeight = '1.18';
    wireEditor(
      ed,
      type
    );
    if(type === 'day') requestAnimationFrame(() => { if(typeof tsecArrange === 'function') tsecArrange(ed); });
    // Plan pad = a full editor too (checkboxes, cards, menus, urgency, drag) — Julius 2026-10-29.
    const padEd = row.querySelector('.plan-editor');
    if(padEd){ padEd.style.fontSize = 'var(--paragraph-size)'; padEd.style.fontFamily = 'var(--paragraph-font)'; wireEditor(padEd,'plan'); }
    // Focus / Thinking = a full editor too (cards, checkboxes, [] + Space, menus, drag) — Julius 2026-11-13.
    const thoEd = row.querySelector('.thought-editor');
    if(thoEd){ thoEd.style.fontSize = 'var(--paragraph-size)'; thoEd.style.fontFamily = 'var(--paragraph-font)'; wireEditor(thoEd,'thought'); }    // New days (incl. lazily loaded weeks) pick up tasks due on them.
    if(type === 'day'){
      clearTimeout(appendDayRow._due);
      appendDayRow._due = setTimeout(() => { try{ renderDueBlocks(); }catch(e){} },0);
    }
  }
  /* =========================================================
     SELECTION
     ========================================================= */
  function rememberSelection(ed){
    if(!ed){
      return;
    }
    const sel =
      window.getSelection();
    if(
      sel &&
      sel.rangeCount &&
      ed.contains(sel.anchorNode)
    ){
      activeEditor = ed;
      savedRange =
        sel
          .getRangeAt(0)
          .cloneRange();
    }
  }
  function restoreSelection(){
    if(!savedRange){
      return false;
    }
    const sel =
      window.getSelection();
    try{
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return true;
    }catch(err){
      return false;
    }
  }
</script>
