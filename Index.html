<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#f6f7f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Focus Workspace">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <style>
    :root{
      --border:#d9d9d9;
      --muted:#777;
      --bg:#f6f7f8;
      --panel:#fff;
      --accent:#1a73e8;
      --done:#666;
      --paragraph-size:14px;
      --subtitle-size:18px;
      --title-size:28px;
      --paragraph-font:Arial,Helvetica,sans-serif;
      --subtitle-font:Arial,Helvetica,sans-serif;
      --title-font:Arial,Helvetica,sans-serif;
      --col-today:420px;
      --col-journal:420px;
      --col-reference:399px;
      --pad-x:1;
      --pad-y:1;
    }
    *{
      box-sizing:border-box;
    }
    html,
    body{
      margin:0;
      height:100%;
      overflow:hidden;
      font-family:Arial,Helvetica,sans-serif;
      color:#222;
      background:var(--bg);
    }
    button,
    input,
    select{
      font:inherit;
    }
    #app{
      height:100%;
      display:flex;
      flex-direction:column;
    }
    #toolbar{
      min-height:36px;
      flex:0 0 auto;
      display:flex;
      align-items:center;
      gap:5px;
      padding:2px 6px;
      background:#fff;
      border-bottom:1px solid var(--border);
    }
    #title{
      font-weight:700;
      margin-right:8px;
      white-space:nowrap;
    }
    .btn{
      border:1px solid #c9c9c9;
      background:#fff;
      border-radius:6px;
      padding:4px 8px;
      cursor:pointer;
    }
    .btn:hover{
      background:#f0f0f0;
    }
    .btn:disabled{
      opacity:.45;
      cursor:default;
    }
    #dateLabel{
      color:#666;
      font-size:12px;
    }
    .status{
      margin-left:auto;
      color:var(--muted);
      font-size:12px;
    }
    #workspace{
      flex:1;
      min-height:0;
      display:grid;
      /* Keep all three columns at usable widths. On narrow screens,
         the whole workspace pans horizontally instead of compressing
         or stacking the columns. */
      grid-template-columns:var(--col-today) 1px var(--col-journal) 1px var(--col-reference);
      overflow-x:auto;
      overflow-y:hidden;
      width:100%;
      min-width:0;
      overscroll-behavior-x:contain;
      scrollbar-width:none;
      overflow-anchor:none;
      touch-action:pan-x pan-y;
      -webkit-overflow-scrolling:touch;
    }
    /* Single-pane focus views. Hidden panes are removed from the grid and
       the selected pane fills the visible workspace width. */
    #workspace.view-single{
      grid-template-columns:minmax(0,1fr);
      overflow-x:hidden;
    }
    #workspace .pane.view-hidden{
      display:none!important;
    }
    #workspace.view-single .pane:not(.view-hidden){
      width:100%;
      min-width:0;
      border-right:0;
    }

    .column-resizer{
      width:1px;
      min-width:1px;
      position:relative;
      cursor:col-resize;
      background:var(--border);
      touch-action:none;
      z-index:20;
    }
    /* Keep a comfortable invisible grab target without creating a visible gap. */
    .column-resizer::before{
      content:"";
      position:absolute;
      top:0;
      bottom:0;
      left:-4px;
      right:-4px;
      cursor:col-resize;
    }
    .column-resizer:hover,.column-resizer.dragging{background:#9dbcf0;}
    #workspace.view-single .column-resizer{display:none;}
    #focusControls{
      display:none;position:fixed;top:3px;right:8px;z-index:2000;
      align-items:center;gap:5px;
    }
    #focusControls .btn,#focusControls .top-select{
      padding:4px 7px;font-size:11px;font-weight:700;box-shadow:0 1px 5px rgba(0,0,0,.10);
    }
    #focusStatus{
      display:none;
      margin-left:auto;
      color:var(--muted);
      font-size:11px;
      font-weight:400;
      white-space:nowrap;
    }
    body.focus-mode #focusStatus{display:inline-flex;}
    .view-menu{position:relative;}
    .view-menu-popup{
      position:absolute;
      top:calc(100% + 4px);
      left:0;
      z-index:2100;
      min-width:220px;
      padding:5px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:6px;
      box-shadow:0 4px 14px rgba(0,0,0,.16);
    }
    #focusControls .view-menu-popup{left:auto;right:0;}
    .view-menu-row{display:flex;align-items:center;gap:8px;padding:4px 5px;}
    .view-menu-row label{display:flex;align-items:center;gap:7px;flex:1;cursor:pointer;}
    .view-menu-row input{margin:0;}
    .view-menu-row .btn{padding:3px 7px;font-size:11px;}
    .view-menu-popup[hidden]{display:none;}
    body.focus-mode #toolbar{display:none;}
    body.focus-mode #focusControls{display:flex;}
    #todayScroll{scrollbar-width:none!important;}
    #todayScroll::-webkit-scrollbar{width:0!important;height:0!important;}
    .pane{
      min-width:0;
      min-height:0;
      overflow:hidden;
      display:flex;
      flex-direction:column;
      background:var(--panel);
      border-right:1px solid var(--border);
    }
    .pane:last-child{
      border-right:0;
    }
    .pane-header{
      flex:0 0 34px;
      display:flex;
      align-items:center;
      padding:0 12px;
      font-size:14px;
      font-weight:700;
      background:#fafafa;
      border-bottom:1px solid var(--border);
    }
    #todayPane .pane-header{gap:8px;}
    .scroll{
      flex:1 1 0;
      height:0;
      min-height:0;
      overflow-y:auto;
      overflow-x:hidden;
      overflow-anchor:none;
      scrollbar-width:none;
    }
    /* =========================================================
       DAY ROWS
       ========================================================= */
    .day-row{
      border-bottom:1px solid var(--border);
      padding:calc(5px * var(--pad-y,1)) calc(8px * var(--pad-x,1)) calc(6px * var(--pad-y,1));
      position:relative;
      display:flex;
      flex-direction:column;
      overflow:visible;
      min-height:0;
    }
    .day-row.dow-1{
      background:#eeeeee;
    }
    .day-row.dow-2{
      background:#fff0df;
    }
    .day-row.dow-3{
      background:#e6f1fb;
    }
    .day-row.dow-4{
      background:#ead8c2;
    }
    .day-row.dow-5{
      background:#fff0bd;
    }
    .day-row.dow-6{
      background:#d9b98c;
    }
    .day-row.dow-0{
      background:#fff4a8;
    }
    /*
     * Current-day border.
     *
     * Both Today and Journal keep their visible outer borders.
     * The shared middle edge is drawn ONLY by the Today cell,
     * so the divider between the two cells is one line instead
     * of two overlapping borders.
     */
    .day-row.today{
      z-index:2;
    }
    .day-row.today.day-pane-row{
      box-shadow:
        inset 0 2px 0 var(--today-border),
        inset 0 -2px 0 var(--today-border),
        inset 2px 0 0 var(--today-border),
        inset -1px 0 0 var(--today-border);
    }
    .day-row.today.journal-pane-row{
      box-shadow:
        inset 0 2px 0 var(--today-border),
        inset 0 -2px 0 var(--today-border),
        inset -2px 0 0 var(--today-border),
        inset 1px 0 0 var(--today-border);
    }
    .day-row.today.dow-1{
      --today-border:#8a8a8a;
    }
    .day-row.today.dow-2{
      --today-border:#c98545;
    }
    .day-row.today.dow-3{
      --today-border:#5f8fb9;
    }
    .day-row.today.dow-4{
      --today-border:#9a6f42;
    }
    .day-row.today.dow-5{
      --today-border:#b9962e;
    }
    .day-row.today.dow-6{
      --today-border:#8b6237;
    }
    .day-row.today.dow-0{
      --today-border:#c3a51f;
    }
    .day-label{
      font-size:14px;
      font-weight:700;
      color:#555;
      margin-bottom:3px;
      user-select:none;
    }
    .today-pill{
      color:var(--accent);
      margin-left:6px;
    }
    .top-select{
      border:1px solid #c9c9c9;
      background:#fff;
      border-radius:6px;
      padding:4px 6px;
      cursor:pointer;
    }
    /*
     * Today and Journal always start at Paragraph size.
     */
    .day-editor,
    .journal-editor{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
      line-height:1.18;
    }
    .editor,
    .ref-cell{
      width:100%;
      min-height:16px;
      outline:0;
      border:0;
      padding:0;
      line-height:1.18;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      min-width:0;
      background:transparent;
    }
    .ref-cell{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
    }
    .editor.day-editor,
    .editor.journal-editor{
      min-height:5.9em;
    }
    .editor:empty:before,
    .ref-cell:empty:before{
      content:attr(data-placeholder);
      color:#999;
      pointer-events:none;
    }
    .editor p,
    .ref-cell p{
      margin:0 0 1px;
    }
    .editor p:last-child,
    .ref-cell p:last-child{
      margin-bottom:0;
    }
    .editor h1,
    .editor h2,
    .editor h3,
    .ref-cell h1,
    .ref-cell h2,
    .ref-cell h3{
      margin:2px 0 1px;
    }
    .editor h1,
    .ref-cell h1{
      font-family:var(--title-font);
      font-size:var(--title-size);
      line-height:1.12;
    }
    .editor h2,
    .ref-cell h2{
      font-family:var(--subtitle-font);
      font-size:var(--subtitle-size);
      line-height:1.14;
    }
    .editor h3,
    .ref-cell h3{
      font-family:var(--paragraph-font);
      font-size:var(--paragraph-size);
      line-height:1.18;
    }
    .editor ul,
    .editor ol,
    .ref-cell ul,
    .ref-cell ol{
      margin:1px 0 1px 20px;
      padding:0;
    }
    .editor blockquote,
    .ref-cell blockquote{
      margin:1px 0;
      padding-left:10px;
      border-left:3px solid #bbb;
      color:#222;
    }
    .editor code,
    .ref-cell code{
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
      background:#eee;
      padding:1px 4px;
      border-radius:3px;
    }
    .check-line{
      display:flex;
      align-items:flex-start;
      gap:5px;
      min-height:16px;
    }
    .check-line input{
      margin-top:1px;
      flex:0 0 auto;
    }
    .check-text{
      flex:1;
      min-width:0;
      min-height:1.18em;
      line-height:1.18;
      display:block;
    }
    .check-line.done > .check-text,
    .check-line > input[type="checkbox"]:checked + .check-text{
      color:var(--done);
      opacity:.82;
    }
    .check-line.task-struck > .check-text{text-decoration:line-through;}
    .check-line > .check-text{align-self:flex-start;}
    .editor pre.code-block,.ref-cell pre.code-block{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace!important;
      font-size:.95em!important;line-height:1.4!important;
      white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;
      background:#f1f3f5;border:1px solid #d9dde2;border-radius:6px;
      padding:8px 10px;margin:5px 0;color:#20252b;min-height:1.4em;
    }
    .ref-cell pre.code-block *,.editor pre.code-block *{font-family:inherit!important;font-size:inherit!important;line-height:inherit!important;}
    .editor pre.code-block code,.ref-cell pre.code-block code{background:none;padding:0;}
    /*
     * Indentation only changes horizontal position.
     * It NEVER changes text color.
     */
    .indent-1{margin-left:24px}
    .indent-2{margin-left:48px}
    .indent-3{margin-left:72px}
    .indent-4{margin-left:96px}
    .indent-5{margin-left:120px}
    .indent-6{margin-left:144px}
    /* =========================================================
       REFERENCE
       ========================================================= */
    #referenceScroll{
      padding:6px 5px 40px;
    }
    /* Phone (2026-10-26, Julius): Delete sits at the right end of the title
       line instead of on its own row below, so tapping a cell doesn't make
       it taller. The title makes room for it while the cell is active. */
    @media(max-width:900px){
      #referenceTree .ref-actions{
        position:absolute;right:4px;margin:0;
        top:calc(8px * var(--pad-y,1) - 3px);
      }
      #referenceTree .ref-actions .btn{
        min-height:0;height:calc(var(--ref-line) + 6px);
        padding:0 10px;display:inline-flex;align-items:center;
      }
      #referenceTree .ref-cell-wrapper:has(> .ref-cell:focus){padding-right:calc(72px * var(--mobile-scale,1))!important;}
    }
    #archiveOverlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:8vh 12px;}
    .archive-box{background:#fff;border:1px solid var(--border);border-radius:10px;width:min(520px,100%);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.2);}
    .archive-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);}
    .archive-sub{color:var(--muted);font-size:12px;margin-right:auto;}
    .archive-list{overflow:auto;padding:4px 12px 10px;}
    .archive-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .archive-text{flex:1;min-width:0;}
    .archive-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;}
    .archive-meta,.archive-empty{color:var(--muted);font-size:12px;}
    .ref-toolbar{
      display:flex;
      gap:6px;
      margin-bottom:5px;
      position:sticky;
      top:0;
      background:#fff;
      padding-bottom:8px;
      z-index:10;
    }
    .ref-search{
      flex:1;
      min-width:0;
      border:1px solid #ccc;
      border-radius:6px;
      padding:7px 8px;
    }
    #referenceTree{
      display:flex;
      flex-direction:column;
    }
    .ref-cell-wrapper{
      position:relative;
      border-bottom:1px solid #eee;
      padding:calc(8px * var(--pad-y,1)) 4px calc(10px * var(--pad-y,1));
      min-height:38px;
    }
    .ref-cell-wrapper:hover{
      background:#fafafa;
    }
    .ref-cell-wrapper:focus-within{
      box-shadow:inset 2px 0 0 var(--accent);
    }
    .ref-drag{position:absolute;left:18px;top:8px;width:18px;height:27px;border:0;background:transparent;color:#777;cursor:grab;touch-action:none;z-index:4;font-size:18px;}
    .ref-drag:active{cursor:grabbing;}
    .ref-drop-before{box-shadow:inset 0 3px #1a73e8!important;}
    .ref-drop-after{box-shadow:inset 0 -3px #1a73e8!important;}
    .ref-dragging{opacity:.5;}
    #referenceEdgeResize{width:9px;position:absolute;right:0;top:0;bottom:0;cursor:col-resize;touch-action:none;z-index:35;background:transparent;}
    #referenceEdgeResize:hover,#referenceEdgeResize.dragging{background:#1a73e833;}
    body.mobile-mode #referenceEdgeResize,body.mobile-split #referenceEdgeResize{display:none;}
    #workspace{position:relative;}
    .editor hr,.ref-cell hr{border:0;border-top:1px solid #aaa;margin:7px 0;}
    .ref-disclosure{
      position:absolute;
      left:2px;
      top:9px;
      width:20px;
      height:24px;
      padding:0;
      border:0;
      background:transparent;
      cursor:pointer;
      font-size:14px;
      line-height:24px;
      color:#666;
      z-index:2;
    }
    .ref-actions{
      display:none;
      position:absolute;
      right:4px;
      top:4px;
      gap:3px;
    }
    /* Own Delete only (nested cells, 2026-10-26): a parent's button stays
       hidden while you're in one of its children. */
    .ref-cell-wrapper:hover:not(:has(.ref-children .ref-cell-wrapper:hover)) > .ref-actions,
    .ref-cell-wrapper:has(> .ref-cell:focus) > .ref-actions{
      display:flex;
    }
    .tiny{
      font-size:11px;
      padding:3px 6px;
    }
    .format-hint{
      color:#888;
      font-size:11px;
      padding:3px 2px 10px;
    }
    .hidden{
      display:none!important;
    }
    .empty{
      padding:14px;
      color:#777;
      font-size:13px;
    }
    .type-settings{
      position:fixed;
      top:48px;
      left:8px;
      z-index:1000;
      width:330px;
      max-width:calc(100vw - 16px);
      max-height:calc(100vh - 64px);
      max-height:calc(100dvh - 64px);
      overflow:auto;
      padding:8px;
      background:#fff;
      border:1px solid #cfcfcf;
      border-radius:7px;
      box-shadow:0 4px 18px rgba(0,0,0,.16);
      font-size:11px;
    }
    .type-settings label{
      display:grid;
      grid-template-columns:62px 1fr 48px 18px;
      align-items:center;
      gap:5px;
      margin:4px 0;
    }
    .font-size-input{
      width:48px;
      padding:4px;
      border:1px solid #c9c9c9;
      border-radius:5px;
    }
    /* =========================================================
       MOBILE / NARROW SCREENS
       ========================================================= */
    @media(max-width:900px){
      /* Keep the desktop three-column geometry on small screens.
         #workspace itself becomes the horizontal viewport. */
      #workspace{
        grid-template-columns:var(--col-today) 1px var(--col-journal) 1px var(--col-reference);
      }
      #workspace.view-single{
        grid-template-columns:minmax(0,1fr);
      }
      .scroll{
        overflow-y:auto;
        overflow-x:hidden;
      }
    }
    .day-row.today.day-pane-row{box-shadow:inset 0 1px 0 var(--today-border),inset 0 -1px 0 var(--today-border),inset 1px 0 0 var(--today-border),inset -1px 0 0 var(--today-border);}
    .day-row.today.journal-pane-row{box-shadow:inset 0 1px 0 var(--today-border),inset 0 -1px 0 var(--today-border),inset -1px 0 0 var(--today-border);}
    #todayPane,#journalPane{border-right:0;}
    .day-row.today .day-label{color:#444;}
    .day-row.today .today-pill{color:var(--today-border);font-weight:700;}
    .editor.day-editor,.editor.journal-editor{min-height:5.9em;flex-shrink:0;}
    .pane,.scroll{overscroll-behavior:contain;}
    @media(max-width:900px){
      html,body{height:100%;height:100dvh;}
      #app{height:100%;}
      #toolbar{flex-wrap:wrap;gap:calc(6px * var(--mobile-scale,1));padding:calc(6px * var(--mobile-scale,1)) calc(8px * var(--mobile-scale,1));font-size:calc(14px * var(--mobile-scale,1));}
      #title{font-size:calc(14px * var(--mobile-scale,1));}
      #toolbar .btn,#toolbar .top-select{min-height:calc(40px * var(--mobile-scale,1));}
      #dateLabel{display:none;}
      .status{font-size:calc(12px * var(--mobile-scale,1));}
      .pane-header{flex:0 0 calc(42px * var(--mobile-scale,1));padding:0 calc(12px * var(--mobile-scale,1));font-size:calc(15px * var(--mobile-scale,1));}
      .day-row{padding:calc(8px * var(--mobile-scale,1) * var(--pad-y,1)) calc(12px * var(--mobile-scale,1) * var(--pad-x,1)) calc(10px * var(--mobile-scale,1) * var(--pad-y,1));}
      .day-label{font-size:calc(15px * var(--mobile-scale,1));line-height:1.35;margin-bottom:calc(6px * var(--mobile-scale,1));}
      .editor.day-editor,.editor.journal-editor{min-height:6.75em;}
      .check-line{gap:calc(8px * var(--mobile-scale,1));min-height:calc(28px * var(--mobile-scale,1));}
      .check-line input[type=checkbox]{width:calc(22px * var(--mobile-scale,1));height:calc(22px * var(--mobile-scale,1));margin-top:calc(1px * var(--mobile-scale,1));}
      .check-text{line-height:1.35;}
      #workspace{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
      #workspace .pane{scroll-snap-align:start;}
      .column-resizer{display:none!important;}
      #focusControls{position:static;flex:0 0 auto;padding:calc(6px * var(--mobile-scale,1)) calc(8px * var(--mobile-scale,1));flex-wrap:wrap;background:#fff;}
      #focusControls .btn{min-height:calc(40px * var(--mobile-scale,1));font-size:calc(13px * var(--mobile-scale,1));}
      #focusStatus{margin-right:auto;}
      .view-menu-popup{position:fixed;top:calc(54px * var(--mobile-scale,1));left:calc(8px * var(--mobile-scale,1))!important;right:calc(8px * var(--mobile-scale,1))!important;width:auto;z-index:2500;}
      .view-menu-row .btn{min-height:calc(40px * var(--mobile-scale,1));font-size:calc(14px * var(--mobile-scale,1));}
      .type-settings{position:fixed;top:calc(54px * var(--mobile-scale,1));left:calc(8px * var(--mobile-scale,1));right:calc(8px * var(--mobile-scale,1));width:auto;z-index:2600;}
      .type-settings label{grid-template-columns:calc(70px * var(--mobile-scale,1)) 1fr calc(54px * var(--mobile-scale,1)) calc(18px * var(--mobile-scale,1));font-size:calc(13px * var(--mobile-scale,1));}
      .type-settings input,.type-settings select{min-height:calc(40px * var(--mobile-scale,1));font-size:calc(16px * var(--mobile-scale,1));}
      .ref-search{font-size:calc(16px * var(--mobile-scale,1));min-height:calc(44px * var(--mobile-scale,1));}
      .ref-toolbar .btn{min-height:calc(44px * var(--mobile-scale,1));}
      .ref-actions{position:static;justify-content:flex-end;margin-top:calc(5px * var(--mobile-scale,1));}
      .ref-actions .btn{min-height:calc(36px * var(--mobile-scale,1));}

    .pm-box{display:inline-grid;place-content:center;box-sizing:border-box;width:1.15em;height:1.15em;margin-right:6px;border:1.5px solid currentColor;border-radius:4px;font-size:.95em;line-height:1;font-weight:700;opacity:.75;vertical-align:-.15em;}

    .ucm-item{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:13px;cursor:pointer;color:inherit;}

    .ucm-item[data-urg="1"]{--urg:#e5484d;}.ucm-item[data-urg="2"]{--urg:#f0b000;}.ucm-item[data-urg="3"]{--urg:#3b82f6;}

    /* Reference cell toggles: boxed − / + instead of ▾ / ▸. Done in CSS so every
       code path that sets the arrow text still works. */

    #referenceTree .ref-disclosure::before{content:"−";display:inline-grid;place-content:center;box-sizing:border-box;width:1.05em;height:1.05em;border:1.5px solid currentColor;border-radius:4px;font-size:calc(var(--paragraph-size) * var(--workspace-scale,1) * .95);line-height:1;font-weight:700;vertical-align:middle;}
    #referenceTree .ref-cell-wrapper.ref-collapsed > .ref-disclosure::before{content:"+";}
  </style>
</head>

<script>
  /* =========================================================
     STATE
     ========================================================= */
  let state = {
    days: [],
    reference: [],
    today: ''
  };
  let syncing = false;
  let loadingPrev = false;
  let loadingNext = false;
  let saveTimers = {};
  const daySaveState = new Map();
  let activeRefId = null;
  /*
   * Scroll bookkeeping. Lazy week-loading only reacts to scrolling the person
   * actually did (wheel / touch / page keys). Scroll events caused by typing,
   * layout changes or code never load more days, so typing can no longer
   * trigger a prepend that shifts the view.
   */
  let lastUserScrollAt = 0;
  let lastDayTop = 0;
  let prevBlockedUntil = 0;
  let nextBlockedUntil = 0;
  /*
   * The editor that formatting actions currently control.
   */
  let activeEditor = null;
  /*
   * The last known text selection inside activeEditor, so a menu or button
   * can restore it after it receives the press.
   */
  let savedRange = null;
  const TYPOGRAPHY_STORAGE_KEY = 'focusWorkspaceTypographyV1';
  const VIEW_STORAGE_KEY = 'focusWorkspaceViewV1';
  const VIEW_PANES = ['today','journal','reference'];
  const PANE_LABELS = {today:'Today / Tasks',journal:'Notes',reference:'Reference'};
  let visiblePanes = [...VIEW_PANES];
  const COLUMN_STORAGE_KEY = 'focusWorkspaceColumnsV1';
  const FOCUS_STORAGE_KEY = 'focusWorkspaceFocusV1';
  const REF_COLLAPSE_STORAGE_KEY = 'focusWorkspaceRefCollapsedV1';
  let columnWidths = loadColumnWidths();
  let referenceCollapsed = localStorage.getItem(REF_COLLAPSE_STORAGE_KEY) === '1';
  const FONT_OPTIONS = [
    ['Arial','Arial,Helvetica,sans-serif'],
    ['Roboto','Roboto,Arial,sans-serif'],
    ['Verdana','Verdana,Geneva,sans-serif'],
    ['Tahoma','Tahoma,Geneva,sans-serif'],
    ['Trebuchet','"Trebuchet MS",Arial,sans-serif'],
    ['Georgia','Georgia,"Times New Roman",serif'],
    ['Times New Roman','"Times New Roman",Times,serif'],
    ['Monospace','ui-monospace,SFMono-Regular,Menlo,monospace']
  ];
  const DEFAULT_TYPOGRAPHY = {
    paragraphFont:'Arial,Helvetica,sans-serif', paragraphSize:14,
    subtitleFont:'Arial,Helvetica,sans-serif', subtitleSize:18,
    titleFont:'Arial,Helvetica,sans-serif', titleSize:28
  };
  function loadTypographySettings(){
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem(TYPOGRAPHY_STORAGE_KEY) || '{}'); }catch(e){}
    if(saved.paragraphSize === 10) saved.paragraphSize = 14;
    if(saved.subtitleSize === 14) saved.subtitleSize = 18;
    if(saved.titleSize === 20) saved.titleSize = 28;
    return {...DEFAULT_TYPOGRAPHY,...saved};
  }
  let typographySettings = loadTypographySettings();
  function applyTypographySettings(){
    const root = document.documentElement;
    root.style.setProperty('--paragraph-font', typographySettings.paragraphFont);
    root.style.setProperty('--paragraph-size', typographySettings.paragraphSize + 'px');
    root.style.setProperty('--subtitle-font', typographySettings.subtitleFont);
    root.style.setProperty('--subtitle-size', typographySettings.paragraphSize + 'px');
    root.style.setProperty('--title-font', typographySettings.titleFont);
    root.style.setProperty('--title-size', typographySettings.paragraphSize + 'px');
    document.querySelectorAll('.day-editor,.journal-editor,.ref-cell').forEach(el => {
      if(!el.style.fontFamily || el.style.fontFamily.includes('var(')) el.style.fontFamily = 'var(--paragraph-font)';
      if(!el.style.fontSize || el.style.fontSize.includes('var(')) el.style.fontSize = 'var(--paragraph-size)';
      el.style.lineHeight = '1.18';
    });
    requestAnimationFrame(syncDayHeights);
  }
  function populateFontSelect(select, value){
    select.innerHTML = '';
    FONT_OPTIONS.forEach(([label,css]) => {
      const o=document.createElement('option'); o.textContent=label; o.value=css; o.selected=css===value; select.appendChild(o);
    });
  }
  function initTypographyControls(){
    ['paragraph'].forEach(kind => {
      const font=document.getElementById(kind+'Font');
      const size=document.getElementById(kind+'Size');
      populateFontSelect(font, typographySettings[kind+'Font']);
      size.value=typographySettings[kind+'Size'];
      font.onchange=()=>{ typographySettings[kind+'Font']=font.value; saveTypographySettings(); };
      size.onchange=()=>{ typographySettings[kind+'Size']=Math.max(8,Number(size.value)||DEFAULT_TYPOGRAPHY[kind+'Size']); saveTypographySettings(); };
    });
    applyTypographySettings();
  }
  function saveTypographySettings(){
    localStorage.setItem(TYPOGRAPHY_STORAGE_KEY, JSON.stringify(typographySettings));
    applyTypographySettings();
  }
  function resetTypographySettings(){
    typographySettings={...DEFAULT_TYPOGRAPHY};
    localStorage.removeItem(TYPOGRAPHY_STORAGE_KEY);
    initTypographyControls();
  }
  function toggleTypeSettings(){
    document.getElementById('typeSettings').classList.toggle('hidden');
    positionTypeSettings();
  }
  /* Place the panel just under whichever top bar is showing and cap its height to
     the visible app, so nothing is cut off at any scale or on a small screen. */
  function positionTypeSettings(){
    const panel = document.getElementById('typeSettings');
    if(!panel || panel.classList.contains('hidden')) return;
    const bar = document.body.classList.contains('focus-mode')
      ? document.getElementById('focusControls') : document.getElementById('toolbar');
    const barBottom = bar && bar.getClientRects().length ? bar.getBoundingClientRect().bottom : 0;
    const top = Math.max(8, Math.round(barBottom + 6));
    const appBox = document.getElementById('app').getBoundingClientRect();
    const bottom = (appBox.height ? appBox.bottom : window.innerHeight) - 8;
    panel.style.top = top + 'px';
    panel.style.maxHeight = Math.max(160, Math.round(bottom - top)) + 'px';
  }
  /* =========================================================
     BASIC HELPERS
     ========================================================= */
  const esc = s =>
    String(s ?? '').replace(
      /[&<>"']/g,
      c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );
  function formatDate(s){
    const d = new Date(s + 'T00:00:00');
    return d.toLocaleDateString(
      undefined,
      {
        weekday:'long',
        month:'long',
        day:'numeric',
        year:'numeric'
      }
    );
  }
  function setStatus(s){
    const status=document.getElementById('status');
    const focusStatus=document.getElementById('focusStatus');
    if(status) status.textContent=s;
    if(focusStatus) focusStatus.textContent=s;
  }
  function storedToHtml(v){
    if(!v){
      return '';
    }
    if(/<([a-z][\s\S]*?)>/i.test(v)){
      return v;
    }
    return esc(v).replace(/\n/g,'<br>');
  }
  function dateObj(s){
    return new Date(s + 'T00:00:00');
  }
  function addDays(s,n){
    const d = dateObj(s);
    d.setDate(
      d.getDate() + n
    );
    return d.toISOString().slice(0,10);
  }
  function mergeDays(newDays){
    const map = new Map(
      state.days.map(d => [d.date,d])
    );
    newDays.forEach(
      d => { map.set(d.date,d); noteUrgentDay(d.date,d.tasks,false); }
    );
    renderUrgent();
    state.days = [
      ...map.values()
    ].sort(
      (a,b) => a.date.localeCompare(b.date)
    );
  }
  function editableFocused(){
    const el = document.activeElement;
    return !!(el && el.isContentEditable);
  }
  /* Take focus off the cell being edited, so a button that does not need
     typing never keeps (or brings back) the on-screen keyboard. */
  function releaseEditor(){
    const el = document.activeElement;
    if(el && el.isContentEditable){
      rememberSelection(el);
      el.blur();
    }
  }
  /* =========================================================
     LOAD
     ========================================================= */
  function applyWorkspaceData(data){
    state = data;
    if(state.today && Array.isArray(state.days)){
      const from=addDays(state.today,-7),to=addDays(state.today,3);
      state.days=state.days.filter(d=>d.date>=from && d.date<=to);
    }
    renderDays();
    renderReference();
    applyReferenceCollapseState();
    initUrgentSource(data.urgent);
    setInbox(data.inbox);
    setStatus('Ready');
    requestAnimationFrame(()=>requestAnimationFrame(()=>{jumpToday(false);setTimeout(()=>jumpToday(false),120);}));
  }
  function loadWorkspace(){
    const initial = window.__FW_INITIAL__;
    window.__FW_INITIAL__ = null;
    if(initial && Array.isArray(initial.days) && initial.today){
      applyWorkspaceData(initial);
      return;
    }
    google.script.run
      .withSuccessHandler(applyWorkspaceData)
      .withFailureHandler(e => {
        setStatus(
          'Load error: ' +
          e.message
        );
      })
      .getWorkspaceData();
  }
  /* =========================================================
     DAYS
     ========================================================= */
  function renderDays(){
    const left =
      document.getElementById('todayScroll');
    const right =
      document.getElementById('journalScroll');
    left.innerHTML = '';
    right.innerHTML = '';
    if(!state.days.length){
      left.innerHTML =
        '<div class="empty">No days available.</div>';
      right.innerHTML =
        left.innerHTML;
      return;
    }
    state.days.sort(
      (a,b) =>
        a.date.localeCompare(b.date)
    );
    state.days.forEach(day => {
      appendDayRow(
        day,
        left,
        'day'
      );
      appendDayRow(
        day,
        right,
        'journal'
      );
    });
    requestAnimationFrame(() => {
      syncDayHeights();
      syncDailyScroll();
      updateVisibleDate();
    });
  }
  function appendDayRow(
    day,
    container,
    type
  ){
    const today =
      day.date === state.today;
    const dow =
      dateObj(day.date).getDay();
    const row =
      document.createElement('div');
    row.className =
      'day-row dow-' +
      dow +
      (today ? ' today' : '') +
      (
        type === 'day'
          ? ' day-pane-row'
          : ' journal-pane-row'
      );
    row.dataset.date =
      day.date;
    const label =
      `<div class="day-label">
        ${esc(formatDate(day.date))}
        ${
          today
            ? '<span class="today-pill">• TODAY</span>'
            : ''
        }
      </div>`;
    const content =
      type === 'day'

      label +

        class="editor ${
          type === 'day'

      type

    }
  }
  /* =========================================================
     SELECTION
     ========================================================= */
  function rememberSelection(ed){
    if(!ed){
      return;
    }
    const sel =
      window.getSelection();
    if(
      sel &&
      sel.rangeCount &&
      ed.contains(sel.anchorNode)
    ){
      activeEditor = ed;
      savedRange =
        sel
          .getRangeAt(0)
          .cloneRange();
    }
  }
  function restoreSelection(){
    if(!savedRange){
      return false;
    }
    const sel =
      window.getSelection();
    try{
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return true;
    }catch(err){
      return false;
    }

  /* =========================================================
     EDITORS

  const editorHistories = new WeakMap();

  const wiredCheckboxes = new WeakSet();
  function ensureEditorHistory(el){
    if(!editorHistories.has(el)){
      editorHistories.set(el,{undo:[],redo:[],last:el.innerHTML,restoring:false});
    }
    return editorHistories.get(el);
  }
  function captureBeforeEdit(el){
    const h=ensureEditorHistory(el);
    if(h.restoring) return;
    const current=el.innerHTML;
    if(!h.undo.length || h.undo[h.undo.length-1]!==current){
      h.undo.push(current);
      if(h.undo.length>100) h.undo.shift();
    }
    h.redo.length=0;
  }
  function finishEditorEdit(el){
    const h=ensureEditorHistory(el);
    h.last=el.innerHTML;
  }
  function restoreEditorSnapshot(el,html){
    const h=ensureEditorHistory(el);
    h.restoring=true;
    el.innerHTML=html;
    normalizeEditorTasks(el);
    h.last=el.innerHTML;
    h.restoring=false;
    el.focus({preventScroll:true});
    placeEnd(el);
    saveEditorOwner(el);
  }
  function undoEditor(el){
    const h=ensureEditorHistory(el);
    if(!h.undo.length) return;
    h.redo.push(el.innerHTML);
    restoreEditorSnapshot(el,h.undo.pop());
  }
  function redoEditor(el){
    const h=ensureEditorHistory(el);

  function wireEditor(
    el,
    type
  ){

    wireCodeBlocks(el);
    wireEditorHistory(el);
    el.addEventListener(
      'input',
      () => {
        autoFormat(el);
        if(el.dataset.date){
          requestAnimationFrame(() => syncDayHeightStable(el.dataset.date));
        }
        scheduleDaySave(
          el.dataset.date

      }
    );
    el.addEventListener('blur', () => {

    });

      'keydown',
      e => {

          e,
          el,

      }
    );

      'focus',
      () => {
        activeRefId = null;

      }

      'keyup',
      () => {

      }
    );
    el.addEventListener(
      'mouseup',

      'input',

  // Canonical task markup is shared by loaded content, copy/cut and paste.
  // Browser clipboards can omit a row wrapper or introduce nested block tags.
  function normalizeEditorTasks(root, wire = true){
    root.querySelectorAll('input[type=checkbox]').forEach(cb => {
      if(cb.closest('pre')) return;
      if(cb.closest('.check-line')) return;
      let container = cb.parentElement;
      if(container === root || container.tagName === 'SPAN' && !container.classList.contains('check-text')){
        const row = root.ownerDocument.createElement('div');
        cb.before(row); row.appendChild(cb);
        const sibling = row.nextSibling;
        if(sibling?.nodeType === 1 && sibling.classList.contains('check-text')) row.appendChild(sibling);
        else while(row.nextSibling && (row.nextSibling.nodeType === 3 || row.nextSibling.nodeType === 1 && /^(SPAN|B|STRONG|I|EM|U|S|DEL|CODE)$/.test(row.nextSibling.tagName))) row.appendChild(row.nextSibling);
        container = row;
      }
      if(container.tagName !== 'DIV'){
        const row = root.ownerDocument.createElement('div');
        while(container.firstChild) row.appendChild(container.firstChild);
        container.replaceWith(row); container = row;
      }
      container.classList.remove('check-text');
      container.classList.add('check-line');
    });
    // Undo old pastes that nested a task inside another task's text.
    [...root.querySelectorAll('.check-text .check-line')].reverse().forEach(line => {
      const parent = line.parentElement.closest('.check-line');
      if(parent) parent.after(line);
    });
    root.querySelectorAll('.check-line').forEach(line => {
      line.classList.remove('check-text');
      const cb = line.querySelector('input[type=checkbox]');
      if(!cb){ line.classList.remove('check-line','done','task-struck'); return; }
      let text = [...line.children].find(n => n.classList.contains('check-text'));
      if(!text){ text = root.ownerDocument.createElement('span'); text.className = 'check-text'; }
      // Keep all selected text and inline formatting in a single flex item.
      const nodes = [...line.childNodes];
      for(const node of nodes){
        if(node === cb || node === text) continue;
        if(node.nodeType === 1 && node.classList.contains('check-text')){
          while(node.firstChild) text.appendChild(node.firstChild); node.remove();
        }else text.appendChild(node);
      }
      line.prepend(cb); line.appendChild(text);
      const level = Math.min(6,Math.max(0,Math.floor(Number(line.dataset.level) || 0)));
      line.dataset.level = String(level);
      // Clipboard presentation must not override the editor's task geometry.
      for(const node of [line,text,cb]){
        for(const name of ['display','width','height','max-width','padding','padding-left','text-indent','white-space','vertical-align','margin-left']) node.style.removeProperty(name);
      }
      line.style.marginLeft = level ? `${level * 24}px` : '';
      cb.toggleAttribute('checked',cb.checked);
      line.classList.toggle('done',cb.checked);
      if(!text.firstChild) text.appendChild(root.ownerDocument.createElement('br'));
      if(wire) wireCheckbox(cb);
    });
    syncCompletionAppearance(root);
  }

  function syncCompletionAppearance(root){
    root.querySelectorAll('.done').forEach(node => {
      const cb = node.classList.contains('check-line') ? node.querySelector('input[type=checkbox]') : null;
      node.classList.toggle('done',!!cb?.checked);
    });
    root.querySelectorAll('[style],.check-text').forEach(node => {
      // Strip only the app's generated completion paint; bold, underline,
      // highlights and independent strike formatting remain intact.
      const color = node.style.color.replace(/\s/g,'').toLowerCase();
      if(['#666','#666666','rgb(102,102,102)','var(--done)'].includes(color)) node.style.removeProperty('color');
      if(node.style.opacity === '0.82' || node.style.opacity === '.82') node.style.removeProperty('opacity');
      if(node.classList.contains('check-text') && !node.closest('.check-line')) node.classList.remove('check-text');
    });
  }

  function toggleTaskStrike(el){
    const sel = window.getSelection();
    if(!sel?.rangeCount || !el.contains(sel.anchorNode) || !el.contains(sel.focusNode)) return;
    const range = sel.getRangeAt(0);
    const tasks = [...el.querySelectorAll('.check-line')].filter(line => {
      if(sel.isCollapsed) return line.contains(sel.anchorNode);
      return range.intersectsNode(line);
    });
    captureBeforeEdit(el);
    if(tasks.length){
      const strike = !tasks.every(line => line.classList.contains('task-struck'));
      tasks.forEach(line => line.classList.toggle('task-struck',strike));
    }else{
      document.execCommand('strikeThrough');
    }
    finishEditorEdit(el); rememberSelection(el); saveEditorOwner(el);
  }

  function currentCodeBlock(el){
    const node = window.getSelection()?.anchorNode;
    const element = node?.nodeType === 3 ? node.parentElement : node;
    const pre = element?.closest?.('pre');
    return pre && el.contains(pre) ? pre : null;
  }

  function insertCodeText(el,text){
    const selection = window.getSelection();
    if(!selection?.rangeCount) return;
    const range = selection.getRangeAt(0);
    if(!el.contains(range.startContainer) || !el.contains(range.endContainer)) return;
    captureBeforeEdit(el);
    range.deleteContents();
    const node = document.createTextNode(text);
    range.insertNode(node);
    const pre = node.parentElement?.closest('pre');
    if(pre && (pre.textContent.endsWith('\n') || !pre.textContent) && pre.lastChild?.nodeName !== 'BR') pre.appendChild(document.createElement('br'));
    range.setStart(node,node.length); range.collapse(true);
    selection.removeAllRanges(); selection.addRange(range);
    finishEditorEdit(el); rememberSelection(el); saveEditorOwner(el);
  }

  function handleCodeEnter(el){
    const pre = currentCodeBlock(el);
    const sel = window.getSelection();
    if(!sel?.rangeCount || !sel.isCollapsed) return false;
    const range = sel.getRangeAt(0);
    if(pre){
      const prefix = document.createRange(); prefix.selectNodeContents(pre);
      prefix.setEnd(range.startContainer,range.startOffset);
      const before = prefix.toString();
      const after = pre.textContent.slice(before.length);
      const last = before.split('\n').pop();
      if(/^\s*```\s*$/.test(last) && !after.trim()){
        captureBeforeEdit(el);
        pre.textContent = before.slice(0,before.length-last.length).replace(/\n$/,'');
        const paragraph = document.createElement('p'); paragraph.innerHTML = '<br>';
        pre.after(paragraph); placeEnd(paragraph);

    let line = getCurrentLine(el);
    if(!line || line.closest('.check-line')) return false;
    // A fresh editor may contain only a text node, with no paragraph yet.
    const text = line.textContent || '';

    if(!fence) return false;
    captureBeforeEdit(el);
    const block = document.createElement('pre'); block.className = 'code-block';
    if(fence[1]) block.dataset.language = fence[1];
    block.appendChild(document.createElement('br'));
    if(line === el) el.replaceChildren(block); else line.replaceWith(block);
    const caret = document.createRange(); caret.setStart(block,0); caret.collapse(true);
    sel.removeAllRanges(); sel.addRange(caret);
    el.focus({preventScroll:true}); rememberSelection(el);
    finishEditorEdit(el); saveEditorOwner(el);
    return true;
  }

  function handleCodeKey(e,el){
    if(e.isComposing || e.metaKey || e.ctrlKey || e.altKey) return false;
    const pre=currentCodeBlock(el);
    if((e.key === 'Backspace' || e.key === 'Delete') && pre && !pre.textContent.trim()){
      e.preventDefault(); captureBeforeEdit(el);
      const paragraph=document.createElement('p'); paragraph.innerHTML='<br>';
      pre.replaceWith(paragraph); placeEnd(paragraph);
      finishEditorEdit(el); saveEditorOwner(el);
      return true;

    if(e.key === 'Enter' && handleCodeEnter(el)){e.preventDefault();return true;}
    if(e.key === 'Tab' && currentCodeBlock(el)){
      e.preventDefault();

    }
    return false;

  function wireCodeBlocks(el){
    el.querySelectorAll('pre').forEach(pre => pre.classList.add('code-block'));

  function escapeHtml(text){

  function structuredClipboardTextFromRange(range){
    const fragment = range.cloneContents();
    const wrapper = document.createElement('div');
    wrapper.appendChild(fragment);
    const codeTokens = new Map();
    wrapper.querySelectorAll('pre').forEach((pre,index) => {
      const token = '\uE000FWCODE' + index + '\uE001';
      codeTokens.set(token,'```' + (pre.dataset.language || '') + '\n' + pre.textContent + '\n```');
      const row = document.createElement('div'); row.textContent = token; pre.replaceWith(row);
    });

    /* Convert visual checkbox rows into portable text before reading textContent.
       Native <input type=checkbox> elements contribute no [ ]/[x] text by themselves. */
    wrapper.querySelectorAll('.check-line').forEach(line => {
      const level = Math.max(0, Math.min(6, Number(line.dataset.level || 0)));
      const checkbox = line.querySelector('input[type=checkbox]');
      const text = line.querySelector('.check-text');
      const prefix = '    '.repeat(level) + (checkbox?.checked ? '[x] ' : '[ ] ');
      /* Keep the replacement as a block-level row so copied tasks keep their own lines. */
      const replacement = document.createElement('div');
      replacement.textContent = prefix + (text?.textContent || '');
      line.replaceWith(replacement);
    });

    /* Preserve line boundaries for the block-level elements used by the editor. */
    wrapper.querySelectorAll('br').forEach(br => br.replaceWith('\n'));
    wrapper.querySelectorAll('p,h1,h2,h3,blockquote,li,div').forEach(node => {
      if(node !== wrapper && node.parentNode){
        node.appendChild(document.createTextNode('\n'));
      }
    });

    let result = (wrapper.textContent || '')
      .replace(/\r\n?/g, '\n')
      .replace(/[ \t]+\n/g, '\n')
      .replace(/\n{2,}/g, '\n')
      .replace(/^\n+|\n+$/g, '');

  function copyStructuredText(e, el, cutting = false){
    const sel = window.getSelection();
    if(!sel || !sel.rangeCount || !el.contains(sel.anchorNode) || !el.contains(sel.focusNode) || sel.isCollapsed){
      return;
    }

    const range = sel.getRangeAt(0);
    let text = structuredClipboardTextFromRange(range);
    if(!text){

    if(!e.clipboardData) return;
    const wrapper = document.createElement('div');
    wrapper.appendChild(range.cloneContents());
    const ancestor = range.commonAncestorContainer.nodeType === 3
      ? range.commonAncestorContainer.parentElement : range.commonAncestorContainer;
    const task = ancestor.closest?.('.check-line');
    // A Range inside a task omits its outer row. Restore that row if the
    // checkbox was selected, so it cannot become a separate pasted line.
    if(task && wrapper.querySelector('input[type=checkbox]') && !wrapper.querySelector('.check-line')){
      const row = task.cloneNode(false);
      while(wrapper.firstChild) row.appendChild(wrapper.firstChild);
      wrapper.appendChild(row);

    normalizeEditorTasks(wrapper, false);
    const textRange = document.createRange();
    textRange.selectNodeContents(wrapper);
    text = structuredClipboardTextFromRange(textRange);
    // A partial selection can omit its surrounding <b>, <u>, or styled span.
    // Carry those inherited text styles in a wrapper as well as the selected HTML.
    const source = range.commonAncestorContainer.nodeType === 3
      ? range.commonAncestorContainer.parentElement : range.commonAncestorContainer;

      const styles = getComputedStyle(source);
      ['font-family','font-size','font-weight','font-style','color',
       'text-decoration-line','text-decoration-color','text-decoration-style',
       'letter-spacing','white-space'].forEach(name => {
        if(name === 'color' && source.closest('.check-line.done,.check-text')) return;
        wrapper.style.setProperty(name, styles.getPropertyValue(name));

      const decorations = new Set();
      for(let node=source; node && el.contains(node); node=node.parentElement){
        getComputedStyle(node).textDecorationLine.split(/\s+/).forEach(value => {

        });

    }
    wrapper.querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.toggleAttribute('checked', cb.checked);
      cb.removeAttribute('data-wired');
    });
    // Use an inline wrapper so copying part of a sentence does not create a row.
    const span = document.createElement('span');
    span.style.cssText = wrapper.style.cssText;
    while(wrapper.firstChild) span.appendChild(wrapper.firstChild);
    removeClipboardCellBackgrounds(span);
    const html = sanitizeClipboardHtml(span.outerHTML);
    e.clipboardData.setData('text/plain', text);
    e.clipboardData.setData('text/html', html);
    e.preventDefault();
    if(cutting){
      captureBeforeEdit(el);
      range.deleteContents();
      range.collapse(true);
      sel.removeAllRanges(); sel.addRange(range);
      normalizeEditorTasks(el);
      finishEditorEdit(el);
      rememberSelection(el);
      saveEditorOwner(el);
    }
  }

  function removeClipboardCellBackgrounds(wrapper){
    [wrapper,...wrapper.querySelectorAll('*')].forEach(node => {
      const color = node.style.backgroundColor.replace(/\s/g,'').toLowerCase();
      const block = /^(DIV|P|H[1-6]|BLOCKQUOTE|UL|OL|LI|TABLE|TR|TD|TH)$/.test(node.tagName);
      if(block || color === 'white' || color === '#fff' || color === '#ffffff' || color === 'rgb(255,255,255)' || color === 'rgba(255,255,255,1)'){
        node.style.removeProperty('background');
        node.style.removeProperty('background-color');
      }
      if(block || (node.getAttribute('bgcolor') || '').toLowerCase() === 'white' || /^#?fff(?:fff)?$/i.test(node.getAttribute('bgcolor') || '')) node.removeAttribute('bgcolor');
    });
  }
  function sanitizeClipboardHtml(html){
    // Parse in an inert document; retain text formatting, never scripts or handlers.
    const doc = new DOMParser().parseFromString(String(html), 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta,base,svg,math,template').forEach(n => n.remove());
    const tags = new Set('span div p br b strong i em u s strike del sub sup mark small big font h1 h2 h3 h4 h5 h6 ul ol li blockquote pre code a hr table thead tbody tfoot tr th td caption colgroup col img input'.split(' '));
    const styles = new Set('font-family font-size font-weight font-style font-variant color background-color text-decoration text-decoration-line text-decoration-color text-decoration-style text-align text-indent line-height letter-spacing word-spacing white-space vertical-align margin-left padding-left list-style-type border-collapse border border-color border-style border-width padding width height max-width'.split(' '));
    const safeUrl = (value, image=false) => {
      try{
        const url = new URL(value); // Do not resolve relative URLs against the app.
        return image ? ['https:','http:'].includes(url.protocol) || /^data:image\/(png|jpeg|gif|webp);base64,/i.test(value)
          : ['https:','http:','mailto:','tel:'].includes(url.protocol);
      }catch(_){ return false; }
    };
    Array.from(doc.body.querySelectorAll('*')).forEach(node => {
      const tag = node.localName;
      if(!tags.has(tag)){
        node.replaceWith(...node.childNodes);
        return;
      }
      if(tag === 'input' && node.getAttribute('type')?.toLowerCase() !== 'checkbox'){
        node.remove(); return;
      }
      const keep = {};
      const cleanStyle = document.createElement('span').style;
      for(const name of Array.from(node.style)){
        const value = node.style.getPropertyValue(name);
        if(styles.has(name) && !/url\s*\(|expression\s*\(|@import|[<>]/i.test(value)) cleanStyle.setProperty(name, value);
      }
      if(cleanStyle.cssText) keep.style = cleanStyle.cssText;
      const classes = ['check-line','check-text','done','task-struck','code-block'].filter(c => node.classList.contains(c));
      if(classes.length) keep.class = classes.join(' ');
      if(node.classList.contains('check-line')){
        const level = Math.max(0, Math.min(6, Math.floor(Number(node.dataset.level) || 0)));
        keep['data-level'] = String(level);
        if(/^[123]$/.test(node.dataset.urg || '')) keep['data-urg'] = node.dataset.urg;
        if(/^\d{4}-\d{2}-\d{2}$/.test(node.dataset.due || '')){
          keep['data-due'] = node.dataset.due;
          keep['data-due-label'] = dueLabel(node.dataset.due);
        }
        cleanStyle.marginLeft = level ? `${level * 24}px` : '';
        keep.style = cleanStyle.cssText;
      }
      if(tag === 'pre'){
        keep.class = 'code-block';
        if(/^[\w+-]{1,30}$/.test(node.dataset.language || '')) keep['data-language'] = node.dataset.language;
      }
      if(tag === 'input'){
        keep.type = 'checkbox';
        if(node.hasAttribute('checked')) keep.checked = '';
      }
      if(tag === 'a' && safeUrl(node.getAttribute('href') || '')){
        keep.href = node.getAttribute('href'); keep.target = '_blank'; keep.rel = 'noopener noreferrer';
      }
      if(tag === 'img'){
        const src = node.getAttribute('src') || '';
        if(!safeUrl(src,true)){ node.replaceWith(doc.createTextNode(node.getAttribute('alt') || '')); return; }
        keep.src = src; keep.alt = node.getAttribute('alt') || '';
        cleanStyle.maxWidth = '100%'; keep.style = cleanStyle.cssText;
      }
      if(tag === 'font') for(const attr of ['color','face','size']){
        if(node.hasAttribute(attr)) keep[attr] = node.getAttribute(attr);
      }
      for(const attr of ['colspan','rowspan','start','value']){
        if(/^-?\d{1,4}$/.test(node.getAttribute(attr) || '')) keep[attr] = node.getAttribute(attr);
      }
      if(node.getAttribute('dir') === 'rtl' || node.getAttribute('dir') === 'ltr') keep.dir = node.getAttribute('dir');
      for(const attr of Array.from(node.attributes)) node.removeAttribute(attr.name);
      for(const [name,value] of Object.entries(keep)) node.setAttribute(name,value);
    });
    removeClipboardCellBackgrounds(doc.body);
    normalizeEditorTasks(doc.body, false);
    return doc.body.innerHTML;
  }

  function pasteRichClipboard(e, el){
    const clipboard = e.clipboardData || window.clipboardData;
    if(!clipboard) return; // Allow native paste if clipboard access is unavailable.
    let html = '', text = '';
    try{ html = clipboard.getData('text/html'); }catch(_){}
    try{ text = clipboard.getData('text/plain'); }catch(_){}
    if(!text) try{ text = clipboard.getData('Text'); }catch(_){}
    if(!html && !text) return;
    activeEditor = el;
    if(currentCodeBlock(el)){
      e.preventDefault();
      insertCodeText(el,text || new DOMParser().parseFromString(html,'text/html').body.textContent || '');
      return;
    }
    if(!html && /(?:^|\n)\s*```/.test(text)){
      e.preventDefault(); pasteStructuredText(el,text); return;
    }
    if(html){
      const clean = sanitizeClipboardHtml(html);
      if(clean && insertClipboardHtml(el, clean)){
        e.preventDefault();
        return;
      }
    }
    if(text){
      e.preventDefault();
      pasteStructuredText(el, text);
    }
  }

  function insertClipboardHtml(el, html){
    const selection = window.getSelection();
    let range = selection?.rangeCount ? selection.getRangeAt(0) : null;
    const inside = r => r && el.contains(r.startContainer) && el.contains(r.endContainer);
    if(!inside(range)) range = inside(savedRange) ? savedRange.cloneRange() : null;
    if(!range) return false;
    captureBeforeEdit(el);
    el.focus({preventScroll:true});
    const fragment = range.createContextualFragment(html);
    const hasBlocks = !!fragment.querySelector('div,p,h1,h2,h3,ul,ol,pre,blockquote,.check-line');
    range.deleteContents();
    const anchor = range.startContainer.nodeType === 3 ? range.startContainer.parentElement : range.startContainer;
    // Block tasks must be siblings of the destination task, never children of
    // its flex text span. Split the surrounding line and preserve both halves.
    let block = anchor.closest?.('.check-line,p,h1,h2,h3,blockquote,li');
    if(!block){
      let candidate = anchor;
      while(candidate && candidate.parentElement !== el) candidate = candidate.parentElement;
      if(candidate && candidate !== el && candidate.tagName === 'DIV') block = candidate;
    }
    if(hasBlocks && block && block !== el && el.contains(block)){
      const tailRange = document.createRange();
      tailRange.selectNodeContents(block);
      tailRange.setStart(range.startContainer,range.startOffset);
      const tail = block.cloneNode(false);
      tail.appendChild(tailRange.extractContents());
      const task = block.classList.contains('check-line');
      const originalCheckbox = block.querySelector('input[type=checkbox]') || tail.querySelector('input[type=checkbox]');
      if(task && originalCheckbox){
        const text = tail.querySelector('.check-text') || document.createElement('span');
        text.className = 'check-text';
        if(!tail.contains(text)) tail.appendChild(text);
        if(!tail.querySelector('input[type=checkbox]')) tail.prepend(originalCheckbox.cloneNode(true));
      }
      const meaningful = node => !!node.textContent.trim() || !!node.querySelector('img,pre');
      let insertion = block;
      const keepHead = meaningful(block);
      const keepTail = meaningful(tail);
      if(keepTail) block.after(tail);
      const lastNode = fragment.lastChild;
      insertion.after(fragment);
      if(!keepHead) block.remove();
      if(lastNode){ range.setStartAfter(lastNode); range.collapse(true); }
    }else{
      const lastNode = fragment.lastChild;
      if(!lastNode) return false;
      range.insertNode(fragment);
      range.setStartAfter(lastNode); range.collapse(true);
    }
    selection.removeAllRanges(); selection.addRange(range);
    normalizeEditorTasks(el);
    finishEditorEdit(el);
    rememberSelection(el);
    saveEditorOwner(el);
    return true;
  }

  function pasteStructuredText(el, text){
    const normalized = String(text || '').replace(/\r\n?/g,'\n');
    if(!/^[ \t]*(?:\[\]|\[ \]|\[[xX]\]|```)(?:\s|$|[\w+-])/m.test(normalized)){
      document.execCommand('insertText',false,normalized);
      return;
    }
    const lines = normalized.split('\n');
    let html = '', code = null, language = '';
    const flushCode = () => {
      html += '<pre class="code-block"' + (language ? ' data-language="' + escapeHtml(language) + '"' : '') + '>' + escapeHtml(code.join('\n')) + '</pre>';
      code = null;
    };
    for(const line of lines){
      if(code !== null){
        if(/^\s*```\s*$/.test(line)) flushCode(); else code.push(line);
        continue;
      }
      const fence = line.match(/^\s*```([\w+-]*)\s*$/);
      if(fence){ code = []; language = fence[1]; continue; }
      const match = line.match(/^([ \t]*)(\[\]|\[ \]|\[[xX]\])(?:[ \t]+)?(.*)$/);
      if(match){
        const columns = [...match[1]].reduce((n,ch) => n + (ch === '\t' ? 4 : 1),0);
        const level = Math.min(6,Math.floor(columns / 4));
        const checked = /^\[[xX]\]$/.test(match[2]);
        html += `<div class="check-line${checked ? ' done' : ''}" data-level="${level}" style="margin-left:${level * 24}px"><input type="checkbox"${checked ? ' checked' : ''}><span class="check-text">${escapeHtml(match[3])}</span></div>`;
      }else html += '<div>' + (line ? escapeHtml(line) : '<br>') + '</div>';
    }
    if(code !== null) flushCode();
    insertClipboardHtml(el,html);
  }
  function handleEditorKey(
    e,
    el,
    type
  ){
    const key=e.key.toLowerCase();
    if((e.metaKey || e.ctrlKey) && e.shiftKey && key === 'x'){
      e.preventDefault(); toggleTaskStrike(el); return;
    }
    if(handleCodeKey(e,el)) return;
    if((e.metaKey || e.ctrlKey) && key === 'z'){
      e.preventDefault();
      if(e.shiftKey) redoEditor(el); else undoEditor(el);
      return;
    }
    if(e.ctrlKey && !e.metaKey && key === 'y'){
      e.preventDefault();
      redoEditor(el);
      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      key === 'b'
    ){
      e.preventDefault();
      document.execCommand(
        'bold'
      );
      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      key === 'u'
    ){
      e.preventDefault();
      document.execCommand(
        'underline'
      );
      return;
    }
    if(e.key === 'Tab'){
      e.preventDefault();
      rememberSelection(el);
      const line =
        getCurrentLine(el);
      if(line){
        changeIndent(
          line,
          e.shiftKey ? -1 : 1
        );
      }
      return;
    }
    if(
      (e.metaKey || e.ctrlKey) &&
      e.key === 'Enter' &&
      type === 'reference'
    ){
      e.preventDefault();
      addReferenceCell(
        activeRefId
      );
      return;
    }
    /*
     * Enter on a checkbox creates another checkbox.
     *
     * Normal Enter:
     *   same indentation level.
     *
     * Shift+Enter:
     *   one level deeper, acting like a subtask.
     */
    if(e.key === 'Enter'){
      const currentLine = getCurrentLine(el);
      if(type === 'reference' && !e.shiftKey && currentLine && currentLine.tagName === 'H2'){
        e.preventDefault();
        captureBeforeEdit(el);
        const paragraph = document.createElement('p');
        paragraph.innerHTML = '<br>';
        currentLine.insertAdjacentElement('afterend', paragraph);
        placeEnd(paragraph);
        finishEditorEdit(el);
        saveEditorOwner(el);
        return;
      }
      const line =
        getCurrentLine(el);
      if(
        line &&
        line.classList.contains('check-line')
      ){
        e.preventDefault();
        const checkText =
          line.querySelector(
            '.check-text'
          );
        /*
         * Google-Docs-style list exit:
         * pressing Enter on an EMPTY checkbox removes
         * the checkbox and leaves a normal blank line.
         *
         * Shift+Enter still creates an indented checkbox,
         * even if the current checkbox is empty.
         */
        if(
          !e.shiftKey &&
          !(checkText?.textContent || '').trim()
        ){
          exitEmptyCheckbox(
            line
          );
          return;
        }
        captureBeforeEdit(el);
        const currentLevel =
          Number(
            line.dataset.level || 0
          );
        if(!e.shiftKey && selectionAtStartOfCheckboxText(line)){
          const previous = createCheckboxLine(currentLevel);
          line.insertAdjacentElement('beforebegin',previous);
          placeCaretInsideCheckbox(previous.querySelector('.check-text'));
          finishEditorEdit(el);
          saveEditorOwner(el);
          return;
        }
        const nextLevel =
          e.shiftKey
            ? Math.min(
                6,
                currentLevel + 1
              )
            : currentLevel;
        insertCheckboxAfter(
          line,
          nextLevel
        );
        return;
      }
      /*
       * Normal Enter in other content
       * keeps the existing auto-format behavior.
       */
      setTimeout(
        () => autoFormat(el),
        0
      );
    }
  }
  function getCurrentLine(root){
    const sel =
      window.getSelection();
    let n =
      sel?.anchorNode;
    if(
      !n ||
      !root.contains(n)
    ){
      return null;
    }
    if(n.nodeType === 3){
      n = n.parentElement;
    }
    const task = n.closest('.check-line');
    return task && root.contains(task) ? task : n.closest('pre,p,h1,h2,h3,div,blockquote,li') || null;
  }
  function selectionAtStartOfCheckboxText(line){
    const text = line.querySelector('.check-text');
    const selection = window.getSelection();
    if(!text || !selection?.isCollapsed || !text.contains(selection.anchorNode)){
      return false;
    }
    const prefix = document.createRange();
    prefix.selectNodeContents(text);
    prefix.setEnd(selection.anchorNode,selection.anchorOffset);
    return prefix.toString().length === 0;
  }
  function changeIndent(
    line,
    delta
  ){
    let level =
      Math.max(
        0,
        Math.min(
          6,
          Number(line.dataset.level || 0) +
          delta
        )
      );
    line.dataset.level =
      String(level);
    line.style.marginLeft =
      level
        ? `${level * 24}px`
        : '';
    /*
     * No color manipulation happens here.
     */
    saveEditorOwner(
      line.closest(
        '.editor,.ref-cell'
      )

  }
  /* Save whichever cell an edit happened in, and (for day cells) grow or shrink
     the row to fit, so programmatic inserts never spill into the next day. */
  function saveEditorOwner(el){
    if(!el){
      return;
    }
    if(
      el.closest('.day-row')
    ){
      const date = el.dataset.date;
      scheduleDaySave(date);
      requestAnimationFrame(() => syncDayHeightStable(date));
    }else{
      const id =
        el.closest(
          '.ref-cell-wrapper'
        )?.dataset.id;
      if(id){
        saveRefFromDom(
          id
        );
      }
    }
  }
  /* =========================================================
     AUTO FORMATTING
     ========================================================= */
  function autoFormat(el){
    if(currentCodeBlock(el)) return;
    const sel =
      window.getSelection();
    if(
      !sel ||
      !sel.rangeCount ||
      !el.contains(sel.anchorNode)
    ){
      return;
    }
    let node =
      sel.anchorNode;
    let line =
      node.nodeType === 3
        ? node.parentElement
        : node;
    line =
      line?.closest(
        'p,div,li,h1,h2,h3,blockquote'
      );
    if(
      !line ||
      !el.contains(line) ||
      line.closest('.check-line,pre')
    ){
      return;
    }
    const text =
      line.textContent || '';
    /*
     * Checkbox. Accept both the compact form `[] task` and the
     * spaced clipboard form `[ ] task`, plus completed `[x] task`.
     */
    const checkboxMatch = text.match(/^([ \t]*)(\[\]|\[ \]|\[[xX]\])(?:[ \t]+)?(.*)$/);
    if(checkboxMatch){
      const indent = checkboxMatch[1] || '';
      let columns = 0;
      for(const ch of indent){
        columns += ch === '\t' ? 4 : 1;
      }
      const level = Math.max(0, Math.min(6, Math.floor(columns / 4)));
      const checked = /^\[[xX]\]$/.test(checkboxMatch[2]);
      const c = document.createElement('div');
      c.className = 'check-line' + (checked ? ' done' : '');
      c.dataset.level = String(level);
      c.style.marginLeft = level ? `${level * 24}px` : '';
      c.innerHTML =
        `<input type="checkbox"${checked ? ' checked' : ''}>` +
        '<span class="check-text"></span>';
      c.querySelector('.check-text').textContent = checkboxMatch[3] || '';
      if(line === el) el.replaceChildren(c); else line.replaceWith(c);
      wireCheckbox(c.querySelector('input'));
      placeEnd(c.querySelector('.check-text'));
      saveEditorOwner(el);
      return;
    }
    /*
     * Headings
     */
    if(
      /^#{1,3}\s/.test(text) &&
      !line.querySelector('input')
    ){
      if(el.classList.contains('ref-cell')){
        const paragraph = document.createElement('p');
        paragraph.textContent = text.replace(/^#{1,3}\s/,'');
        line.replaceWith(paragraph);
        placeEnd(paragraph);
        saveEditorOwner(el);
        return;
      }
      const n =
        (
          text.match(/^#+/)[0]
        ).length;
      const h =
        document.createElement(
          'h' + n
        );
      h.textContent =
        text.replace(
          /^#{1,3}\s/,
          ''
        );
      line.replaceWith(h);
      placeEnd(h);
      saveEditorOwner(el);
      return;
    }
    /*
     * Bullet
     */
    if(
      /^(?:[-*])\s/.test(text) &&
      !line.querySelector('input')
    ){
      const ul =
        document.createElement('ul');
      const li =
        document.createElement('li');
      li.textContent =
        text.replace(
          /^[-*]\s/,
          ''
        );
      ul.appendChild(li);
      line.replaceWith(ul);
      placeEnd(li);
      saveEditorOwner(el);
      return;
    }
    /*
     * Blockquote
     */
    if(
      /^>\s/.test(text) &&
      !line.querySelector('input')
    ){
      const q =
        document.createElement(
          'blockquote'
        );
      q.textContent =
        text.replace(
          /^>\s/,
          ''
        );
      line.replaceWith(q);
      placeEnd(q);
      saveEditorOwner(el);
    }
  }
  function createCheckboxLine(level = 0){
    const c =
      document.createElement('div');
    c.className =
      'check-line';
    c.dataset.level =
      String(
        Math.max(
          0,
          Math.min(
            6,
            Number(level) || 0
          )
        )
      );
    c.style.marginLeft =
      c.dataset.level !== '0'
        ? `${Number(c.dataset.level) * 24}px`
        : '';
    c.innerHTML =
      '<input type="checkbox">' +
      '<span class="check-text"></span>';
    wireCheckbox(
      c.querySelector('input')
    );
    return c;
  }
  function exitEmptyCheckbox(line){
    const editor =
      line.closest(
        '.editor,.ref-cell'
      );
    if(!editor){
      return;
    }
    captureBeforeEdit(editor);
    /*
     * Replace the empty checkbox row with an ordinary
     * blank paragraph. A <br> gives contenteditable a
     * stable caret target without displaying any text.
     */
    const paragraph =
      document.createElement('p');
    paragraph.appendChild(
      document.createElement('br')
    );
    line.replaceWith(
      paragraph
    );
    editor.focus({
      preventScroll:true
    });
    const range =
      document.createRange();
    range.setStart(
      paragraph,
      0
    );
    range.collapse(true);
    const sel =
      window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    activeEditor =
      editor;
    savedRange =
      range.cloneRange();
    finishEditorEdit(editor);
    saveEditorOwner(editor);
  }
  function insertCheckboxAfter(
    line,
    level
  ){
    const editor =
      line.closest(
        '.editor,.ref-cell'
      );
    if(!editor){
      return;
    }
    captureBeforeEdit(editor);
    const next =
      createCheckboxLine(level);
    /* Split at the caret rather than dropping the rest of the sentence.
       Moving DOM nodes (instead of plain text) retains inline formatting. */
    const oldText=line.querySelector('.check-text');
    const selection=window.getSelection();
    if(oldText && selection?.rangeCount){
      const selected=selection.getRangeAt(0);
      if((selected.startContainer===oldText || oldText.contains(selected.startContainer)) &&
         (selected.endContainer===oldText || oldText.contains(selected.endContainer))){
        const caret=selected.cloneRange();
        if(!caret.collapsed) caret.deleteContents();
        caret.collapse(true);
        const tail=document.createRange();
        tail.selectNodeContents(oldText);
        tail.setStart(caret.startContainer,caret.startOffset);
        next.querySelector('.check-text').appendChild(tail.extractContents());
      }
    }
    line.insertAdjacentElement(
      'afterend',
      next
    );
    const text =
      next.querySelector(
        '.check-text'
      );
    editor.focus({preventScroll:true});
    placeCaretInsideCheckbox(text);
    finishEditorEdit(editor);
    saveEditorOwner(editor);
  }
  function placeCaretInsideCheckbox(text){
    const editor=text.closest('.editor,.ref-cell');
    if(!editor) return;
    const setCaret=()=>{
      editor.focus({preventScroll:true});
      const range=document.createRange();
      range.setStart(text,0);
      range.collapse(true);
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      activeEditor=editor;
      savedRange=range.cloneRange();
    };
    setCaret();
    requestAnimationFrame(setCaret);
  }
  function placeEnd(el){
    const editor =
      el.closest(
        '.editor,.ref-cell'
      );
    if(editor){
      editor.focus({
        preventScroll:true
      });
    }
    const r =
      document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const s =
      window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
    if(editor){
      activeEditor =
        editor;
      savedRange =
        r.cloneRange();
    }
  }
  function wireCheckbox(cb){
    if(!cb || wiredCheckboxes.has(cb)){
      return;
    }
    wiredCheckboxes.add(cb);
    /* Remove the old persisted listener marker from previously saved content. */
    cb.removeAttribute('data-wired');
    /* Keep restored/saved checkbox markup and its visual state aligned. */
    const initialLine =
      cb.closest('.check-line');
    if(initialLine){
      initialLine.classList.toggle('done', cb.checked);
    }
    cb.addEventListener(
      'change',
      () => {
        const line =
          cb.closest(
            '.check-line'
          );
        if(!line){
          return;
        }
        line.classList.toggle(
          'done',
          cb.checked
        );
        /*
         * checked is normally a live DOM property. Mirror it to the
         * HTML attribute so innerHTML saves/undo snapshots retain it.
         */
        if(cb.checked){
          cb.setAttribute('checked', '');
        }else{
          cb.removeAttribute('checked');
        }
        const root =
          cb.closest(
            '.editor,.ref-cell'
          );
        saveEditorOwner(root);
      }
    );
  }
  /* =========================================================
     FORMATTING ACTIONS (used by the right-click / long-press menu)
     ========================================================= */
  function runEditAction(action, ed){
    if(!ed || !ed.isConnected){
      setStatus('Select text or a task first');
      return;
    }
    activeEditor = ed;
    ed.focus({preventScroll:true});
    if(!savedRange || !ed.contains(savedRange.startContainer) || !ed.contains(savedRange.endContainer)){
      setStatus('Tap where you want to edit first');
      return;
    }
    restoreSelection();
    if(action === 'strike'){
      toggleTaskStrike(ed);
      return;
    }
    if(action === 'bold' || action === 'underline'){
      captureBeforeEdit(ed);
      document.execCommand(action,false,null);
      finishEditorEdit(ed);
      rememberSelection(ed);
      saveEditorOwner(ed);
      return;
    }
    if(action === 'rule'){
      captureBeforeEdit(ed);
      document.execCommand('insertHTML',false,'<hr><p><br></p>');
      finishEditorEdit(ed);
      rememberSelection(ed);
      saveEditorOwner(ed);
      return;
    }
    const line = getCurrentLine(ed);
    if(action === 'indent' || action === 'outdent'){
      if(!line || line === ed){
        setStatus('Place the cursor on a text or task line');
        return;
      }
      captureBeforeEdit(ed);
      changeIndent(line,action === 'indent' ? 1 : -1);
      finishEditorEdit(ed);
      rememberSelection(ed);
      return;
    }
    // Turn the current line into a task (2026-10-26, Julius): same result as
    // typing [] + Space at its start; the line's text and formatting stay.
    if(action === 'checkbox'){
      if(line && line.classList.contains('check-line')){ setStatus('That line is already a task'); return; }
      if(line && line.closest('pre')){ setStatus('Not inside a code block'); return; }
      if(ed.classList.contains('ref-cell') && line && line === ed.firstElementChild && line.tagName === 'H2'){ setStatus('The title line can’t be a task'); return; }
      captureBeforeEdit(ed);
      const level = line && line !== ed ? Math.max(0,Math.min(6,Number(line.dataset.level) || Math.round((parseFloat(line.style.marginLeft) || 0) / 24))) : 0;
      const task = createCheckboxLine(level);
      const text = task.querySelector('.check-text');
      if(line && line !== ed && line.parentNode){
        while(line.firstChild) text.appendChild(line.firstChild);
        if(text.childNodes.length === 1 && text.firstChild.nodeName === 'BR') text.innerHTML = '';
        if(line.tagName === 'LI'){
          const list = line.parentElement;
          list.after(task); line.remove();
          if(list && !list.children.length) list.remove();
        }else line.replaceWith(task);
      }else{
        ed.appendChild(task);
      }
      wireCheckbox(task.querySelector('input'));
      placeEnd(text);
      finishEditorEdit(ed);
      rememberSelection(ed);
      saveEditorOwner(ed);
      return;
    }
    if(action === 'subtask'){
      if(line && line.classList.contains('check-line')){
        insertCheckboxAfter(line,Math.min(6,Number(line.dataset.level || 0) + 1));
        return;
      }
      const task = createCheckboxLine(1);
      captureBeforeEdit(ed);
      if(line && line !== ed) line.insertAdjacentElement('afterend',task);
      else ed.appendChild(task);
      placeCaretInsideCheckbox(task.querySelector('.check-text'));
      finishEditorEdit(ed);
      saveEditorOwner(ed);
    }
  }
  /* =========================================================
     RIGHT-CLICK / LONG-PRESS MENU
     ========================================================= */
  const ctxMenu = document.getElementById('contextMenu');
  let ctxEditor = null;
  let ctxAnchor = null;
  let lastPointerType = 'mouse';
  let longPress = null;
  function editorFromTarget(target){
    const el = target instanceof Element ? target : target?.parentElement;
    const ed = el?.closest?.('.editor,.ref-cell');
    // Read-only split copies are not editable and get the normal browser menu.
    return ed && ed.isContentEditable ? ed : null;

  function visibleBox(){
    const vv = window.visualViewport;

      width:Math.min(window.innerWidth, vv ? vv.width : Infinity),

    const box = visibleBox();

    // On touch, sit below the finger so Chrome's own Copy / Paste bar
    // (which appears above the selection) stays visible.
    let left = touch ? x - r.width / 2 : x;
    let top = touch ? y + 36 : y;
    if(top + r.height > box.height - 8) top = touch ? y - r.height - 72 : y - r.height;
    left = Math.max(8, Math.min(left, box.width - r.width - 8));
    top = Math.max(8, Math.min(top, box.height - r.height - 8));
    ctxMenu.style.left = Math.round(left) + 'px';
    ctxMenu.style.top = Math.round(top) + 'px';

  function showContextMenu(ed,x,y,touch){
    ctxEditor = ed;

  function hideContextMenu(){
    if(ctxMenu.hidden) return;
    ctxMenu.hidden = true;

  function cancelLongPress(){

  function initContextMenu(){

  function ensureReferenceTitle(editor){
    if(editor.firstElementChild?.tagName === 'H2') return;
    // Tasks and code blocks are content, never title wrappers.
    if(editor.firstElementChild?.matches('.check-line,pre') || editor.firstElementChild?.querySelector('input[type=checkbox]')){
      const title = document.createElement('h2'); title.innerHTML = '<br>';
      editor.prepend(title); return;
    }
    const heading = document.createElement('h2');
    const first = editor.firstChild;
    if(first?.nodeType === Node.ELEMENT_NODE){
      while(first.firstChild) heading.appendChild(first.firstChild);
      first.replaceWith(heading);
    }else if(first?.nodeType === Node.TEXT_NODE){
      heading.textContent = first.textContent;
      first.remove();
      if(editor.firstChild?.nodeName === 'BR') editor.firstChild.remove();
      editor.prepend(heading);
    }else{
      heading.appendChild(document.createElement('br'));
      editor.prepend(heading);
    }
  }

  // Split slots may repeat a source. Mirrors are read-only and never save data.
  let splitMirrorObservers=[];
  function clearSplitMirror(){
    splitMirrorObservers.forEach(observer=>observer.disconnect());
